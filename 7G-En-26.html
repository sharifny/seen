 ["J", "K", "L", "M"], "correctIndex": 3, "explanations": ["No such broad claim about French inventions is made.", "The naming is shown to be deliberate and meaningful, combining relevant descriptive words.", "The passage doesn't criticize this naming choice.", "Correct \u2014 this detail explains where the widely recognized brand name 'Velcro' actually comes from."], "skill": "R.author_purpose"}, {"id": "RD-E3-35", "number": 35, "tier": 2, "passageTitle": "The Unlikely Story of Velcro", "question": "How is this passage mainly organized?", "choices": ["By presenting arguments for and against using Velcro in fashion", "By describing several unrelated inventions from the same time period", "In chronological order, from the initial inspiration to Velcro's eventual widespread success", "By comparing Velcro to buttons and zippers in a detailed technical chart"], "letters": ["A", "B", "C", "D"], "correctIndex": 2, "explanations": ["The passage doesn't debate fashion opinions as its structure.", "The passage focuses entirely on Velcro, not other unrelated inventions.", "Correct \u2014 the passage follows events in order: the hunting trip, the microscope investigation, years of development, the patent, and eventual widespread adoption.", "No technical chart or detailed comparison is presented."], "skill": "R.text_structure"}, {"id": "RD-E3-36", "number": 36, "tier": 2, "passageTitle": "The Unlikely Story of Velcro", "question": "Which idea is best supported by the passage as a whole?", "choices": ["All major inventions require expensive laboratory equipment from the very beginning.", "Useful inventions can sometimes come from unexpected sources, like curiosity about a natural annoyance.", "NASA's scientists originally designed Velcro for military use.", "Velcro was an instant commercial success from the day it was patented."], "letters": ["J", "K", "L", "M"], "correctIndex": 1, "explanations": ["The passage shows the invention starting with simple microscope observation, not expensive lab equipment from the start.", "Correct \u2014 the passage shows how ordinary curiosity about burrs led, through years of effort, to a widely used invention.", "De Mestral, a civilian engineer, designed Velcro; NASA adopted it decades later.", "The passage explicitly states it 'struggled to find widespread appeal' for years."], "skill": "R.synthesis"}, {"id": "RD-E3-37", "number": 37, "tier": 2, "passageTitle": "The Migration of the Monarch Butterfly", "question": "What is the central idea of this passage?", "choices": ["Monarch butterflies apparently no longer migrate to Mexico due to habitat loss.", "Milkweed is actually harmful to monarch butterflies and should be removed from their habitat.", "Monarch migration is a remarkable, multigenerational journey scientists still don't fully understand.", "Monarch butterflies live for many years, allowing the same individuals to complete round-trip migrations repeatedly."], "letters": ["A", "B", "C", "D"], "correctIndex": 2, "explanations": ["The passage doesn't state migration has stopped; it discusses ongoing threats and conservation efforts.", "The passage states milkweed is essential, since it's 'the only plant on which monarch caterpillars can feed.'", "Correct \u2014 the passage covers the multigenerational nature of the migration, the mystery of navigation, and the modern conservation threats it faces.", "The passage explicitly states individual butterflies typically live only weeks, except for the special super generation living up to eight months \u2014 still not multiple years."], "skill": "R.central_idea"}, {"id": "RD-E3-38", "number": 38, "tier": 2, "passageTitle": "The Migration of the Monarch Butterfly", "question": "According to the passage, what is unique about the \"super generation\" of monarchs?", "choices": ["It lives much longer than other generations and delays reproduction to migrate south.", "It reportedly only exists in Canada, not in the United States or Mexico.", "It is supposedly the only monarch generation that is able to fly at all.", "It is apparently the only generation of monarchs capable of eating milkweed."], "letters": ["J", "K", "L", "M"], "correctIndex": 0, "explanations": ["Correct \u2014 the passage states this generation 'can live for up to eight months' and 'delays reproduction entirely' to migrate south.", "The passage doesn't restrict this generation to Canada.", "All monarch generations can fly; this isn't unique to the super generation.", "All monarch caterpillars rely on milkweed, not just this generation."], "skill": "R.detail"}, {"id": "RD-E3-39", "number": 39, "tier": 2, "passageTitle": "The Migration of the Monarch Butterfly", "question": "What does the word \"vulnerable\" most likely mean as used in the passage's final paragraph?", "choices": ["completely safe from any threats", "extremely common and abundant", "easily harmed or at risk", "impossible to study scientifically"], "letters": ["A", "B", "C", "D"], "correctIndex": 2, "explanations": ["This is the opposite of the intended meaning.", "The context describes increasing risk, not abundance.", "Correct \u2014 the passage describes multiple specific threats (habitat loss, deforestation, pesticides) that put the migration at risk, matching 'easily harmed.'", "Scientific study isn't discussed in this context."], "skill": "R.vocab_context"}, {"id": "RD-E3-40", "number": 40, "tier": 2, "passageTitle": "The Migration of the Monarch Butterfly", "question": "Based on the passage, why is the monarch migration considered especially remarkable?", "choices": ["Each butterfly completing the migration has made the trip multiple times before.", "The entire migration reportedly only takes a few days to complete each year.", "All monarchs are said to travel the exact same short distance every single year.", "No individual butterfly has ever made the journey before, yet they reach the same location."], "letters": ["J", "K", "L", "M"], "correctIndex": 3, "explanations": ["The passage states the opposite \u2014 'no single butterfly making the journey has ever completed it before.'", "The passage describes distances up to 'three thousand miles,' not a journey of just days.", "The passage states distances up to three thousand miles, which is not short, and doesn't claim every monarch travels an identical distance.", "Correct \u2014 the passage emphasizes that despite this being new to each butterfly, they still reach 'the same specific wintering grounds' as previous generations."], "skill": "R.inference"}, {"id": "RD-E3-41", "number": 41, "tier": 2, "passageTitle": "The Migration of the Monarch Butterfly", "question": "Which sentence from the passage best supports the idea that scientists do not fully understand monarch navigation?", "choices": ["\"Conservation organizations across three countries...have coordinated efforts...\"", "\"A monarch butterfly's lifespan is typically only a few weeks...\"", "\"Once they arrive in Mexico, the monarchs cluster together so densely...\"", "\"Scientists still do not fully understand how this super generation manages to navigate...\""], "letters": ["A", "B", "C", "D"], "correctIndex": 3, "explanations": ["This describes conservation efforts, not the mystery of navigation.", "This describes lifespan, not navigation understanding.", "This describes clustering behavior in Mexico, not navigation itself.", "Correct \u2014 this sentence directly states scientists 'do not fully understand' the navigation process."], "skill": "R.text_evidence"}, {"id": "RD-E3-42", "number": 42, "tier": 2, "passageTitle": "The Migration of the Monarch Butterfly", "question": "What is one likely benefit of monarchs clustering densely on oyamel fir branches, according to the passage?", "choices": ["It helps them find food more easily.", "It likely helps them conserve warmth and stay protected from wind.", "It allows them to reproduce more quickly.", "It prevents predators from being able to see them at all."], "letters": ["J", "K", "L", "M"], "correctIndex": 1, "explanations": ["Food-finding isn't mentioned as a reason for clustering.", "Correct \u2014 the passage states this 'likely helps the butterflies conserve warmth and stay protected from wind during the cooler mountain winter.'", "Reproduction is delayed during this period, not accelerated by clustering.", "Predator visibility isn't discussed in relation to clustering."], "skill": "R.detail"}, {"id": "RD-E3-43", "number": 43, "tier": 2, "passageTitle": "The Migration of the Monarch Butterfly", "question": "Why does the author mention three specific threats facing monarch migration (habitat loss, deforestation, and pesticides)?", "choices": ["To argue, incorrectly, that monarch butterflies are already fully extinct", "To prove that pesticides alone are the only serious threat monarchs ever face", "To suggest that only one single country is responsible for protecting monarchs", "To provide specific evidence that the migration has become increasingly vulnerable overall."], "letters": ["A", "B", "C", "D"], "correctIndex": 3, "explanations": ["The passage doesn't claim monarchs are extinct; it discusses ongoing conservation efforts.", "The passage lists multiple threats, not just pesticides, as significant.", "The passage explicitly mentions cooperation across three countries, not just one.", "Correct \u2014 listing these specific threats provides concrete support for the broader claim that the migration 'has become increasingly vulnerable.'"], "skill": "R.author_purpose"}, {"id": "RD-E3-44", "number": 44, "tier": 2, "passageTitle": "The Migration of the Monarch Butterfly", "question": "How is this passage mainly organized?", "choices": ["By presenting a step-by-step guide to raising monarch caterpillars at home", "By comparing monarch butterflies to other butterfly species in detail", "By describing the migration process, its scientific mystery, and the modern threats it faces", "By arguing that monarch conservation efforts have completely failed"], "letters": ["J", "K", "L", "M"], "correctIndex": 2, "explanations": ["The passage doesn't provide instructions for raising caterpillars.", "No other butterfly species are discussed for comparison.", "Correct \u2014 the passage moves from describing the migration and the super generation, to the mystery of navigation, to modern conservation threats and responses.", "The passage describes ongoing, coordinated conservation efforts, not failure."], "skill": "R.text_structure"}, {"id": "RD-E3-45", "number": 45, "tier": 2, "passageTitle": "The Migration of the Monarch Butterfly", "question": "Which idea is best supported by the passage as a whole?", "choices": ["The mystery of monarch navigation has apparently been completely solved by scientists.", "Monarch butterflies apparently no longer need milkweed at all to survive.", "Protecting the monarch migration requires cooperation across the entire route the species depends on.", "Monarch migration threats exist only in Mexico, not in the United States or Canada."], "letters": ["A", "B", "C", "D"], "correctIndex": 2, "explanations": ["The passage states scientists 'still do not fully understand' the navigation process.", "The passage states milkweed remains essential for monarch caterpillars.", "Correct \u2014 the final paragraph explicitly states that saving the migration 'requires cooperation across the entire route,' not just one location.", "The passage describes threats like habitat loss and pesticide use occurring broadly, not only in Mexico."], "skill": "R.synthesis"}], "readingPassages": [{"title": "The Group Project", "genre": "literary", "text": "When Ms. Okafor announced that the history project would be done in randomly assigned groups of four, Priya's stomach sank the moment she heard her group included Tyler, a boy best known for turning in assignments the morning they were due, if he remembered at all.\n\n\"We're doomed,\" she whispered to her friend Naomi, who'd been placed in a different group entirely.\n\nThe first meeting confirmed her fears. Tyler showed up ten minutes late, hadn't read the assigned chapter, and spent most of the discussion doodling in the margin of his notebook instead of contributing ideas. Priya, along with the other two group members, Felix and Deja, ended up dividing the research topics without him, silently agreeing to give Tyler the smallest, simplest section and hope for the best.\n\nA week later, hope wasn't looking promising. Felix and Deja had both finished solid drafts of their sections. Priya had finished hers early, mostly out of anxiety about the whole project falling apart. Tyler's section, on trade routes during the medieval period, remained untouched.\n\n\"I'll just do his part too,\" Priya said during their check-in meeting, already reaching for her laptop.\n\n\"Have you actually asked him why he hasn't done it?\" Deja asked. \"Or did you just decide he wouldn't?\"\n\nPriya paused. She hadn't asked, exactly. She'd assumed.\n\nReluctantly, she caught Tyler after class the next day. His answer surprised her: he'd tried to write the section three times and kept getting stuck, unsure how to organize the information into anything that made sense. He wasn't avoiding the work; he didn't know how to start it.\n\n\"Why didn't you just say that in the meeting?\" Priya asked.\n\nTyler shrugged, looking uncomfortable. \"Didn't want everyone to think I was making excuses.\"\n\nPriya thought about how she'd already assumed the worst about him without asking a single question. She spent twenty minutes that afternoon walking him through how she'd organized her own section, not doing the work for him, just showing him one way to break a big, messy topic into smaller pieces.\n\nTwo days later, Tyler's section was finished. It wasn't the strongest part of the project, but it was complete, organized, and clearly his own effort. When the group presented, Tyler spoke about trade routes with more confidence than Priya expected, glancing at her once during his section, as if to check that he'd gotten it right.\n\nTheir project didn't get the highest grade in the class, but Priya realized, walking out of class that day, that she'd been wrong to sort Tyler into a category before actually finding out where the problem really was.", "itemNumbers": [1, 2, 3, 4, 5, 6, 7, 8, 9]}, {"title": "The Science of Skyscrapers", "genre": "informational", "text": "Standing at the base of a modern skyscraper and looking straight up can be dizzying, not just because of the building's height, but because of how impossible it can seem that something so tall and comparatively thin could remain standing, especially in high winds or during an earthquake. The engineering that makes such buildings possible relies on a combination of clever structural design, advanced materials, and, in many cases, systems specifically built to help the building move rather than resist movement entirely.\n\nFor most of human history, buildings were limited in height by the strength of their materials. Traditional stone or brick construction relies on the material's own weight and compressive strength to stay upright, which becomes increasingly difficult and impractical as a structure gets taller; the walls at the bottom would eventually need to be unreasonably thick to support the weight above them. The development of steel-frame construction in the late 1800s changed this equation entirely. Instead of thick, load-bearing walls, a steel skeleton could support a building's weight through a framework of vertical and horizontal beams, allowing walls to become much thinner, sometimes serving mainly to keep out weather rather than to support any real structural load.\n\nHeight alone, however, creates a new problem: wind. Tall, slender buildings sway constantly in response to wind pressure, and if a building were built to be perfectly rigid, that same wind pressure could eventually cause serious structural damage or make the building dangerously uncomfortable for the people inside, who would feel every gust as noticeable, unsettling movement. Engineers have developed several ingenious solutions to this problem. Some skyscrapers incorporate a tuned mass damper, an enormous weight, sometimes hundreds of tons, suspended near the top of the building on springs or cables. As the building sways in one direction, the damper swings in the opposite direction, canceling out much of the motion, much like how a counterweight can stabilize a rocking boat.\n\nEarthquakes present an even more demanding challenge, since the shaking involves rapid, unpredictable movement in multiple directions at once. Many skyscrapers in earthquake-prone regions are built with flexible foundations called base isolators, essentially large rubber and steel pads placed between the building and the ground. During an earthquake, these isolators allow the ground beneath the building to shift and shake while the building itself moves much more slowly and gently, absorbing and dissipating much of the earthquake's destructive energy before it ever reaches the structure above.\n\nModern skyscraper design, in other words, does not attempt to defeat the forces of wind and shifting ground through pure strength and rigidity. Instead, engineers work with those forces, designing buildings flexible enough to sway, shift, and absorb energy, precisely so that they can remain standing through conditions that would have made such heights unthinkable in earlier eras of construction.", "itemNumbers": [10, 11, 12, 13, 14, 15, 16, 17, 18]}, {"title": "The Long Way Home", "genre": "literary", "text": "The bus broke down four blocks from Elena's usual stop, which meant she'd have to walk the rest of the way through a neighborhood she barely knew, since her family had only moved to the area two months earlier. She checked her phone. Twenty percent battery, no data plan active yet, and a map she'd have to load before losing signal in the older part of downtown.\n\nShe picked a direction that seemed roughly right and started walking, trying to look more confident than she felt. A few blocks in, she passed a small shop with hand-painted lettering on the window advertising fresh bread, and the smell pulled her attention long enough that she almost missed the intersection sign confirming she was, at least, heading the correct general direction.\n\nAn older man sweeping the sidewalk outside a laundromat glanced up as she passed, slowing her steps to check her phone again. \"Looking for something, or just lost?\" he asked, not unkindly.\n\n\"Honestly? A little of both,\" Elena admitted. \"I'm trying to get to Fairview Street.\"\n\n\"You're actually closer than you think. Two more blocks that way,\" he pointed, \"then take a left at the mural with the big blue whale painted on it. You can't miss it.\"\n\nShe thanked him and kept walking, and sure enough, the mural appeared exactly where he'd said, an enormous blue whale stretched across the side of a brick building, surrounded by smaller painted fish and coral. She paused just long enough to actually look at it properly, something she never would have done if she'd taken her normal bus route straight home.\n\nPast the mural, the neighborhood shifted again: a small park with a chess table built into the pavement, two elderly women playing a slow, serious game while a handful of pigeons waited nearby for someone to drop a crumb. A block after that, a bookstore with a hand-lettered sign reading \"Free Book, Take One\" propped beside a wooden crate on the sidewalk.\n\nBy the time Elena reached Fairview Street, her phone battery had dropped to twelve percent, but she found she wasn't particularly bothered by the inconvenience of the whole afternoon. She'd lived in the area for two months and had somehow never noticed the mural, the chess players, or the bookstore, all because she usually kept her head down, earbuds in, waiting for her usual stop like the rest of the ride didn't exist.\n\nShe still preferred taking the bus, she decided, turning onto her own street at last. But she made a private note to occasionally get off early on purpose, just to see what else she might be missing.", "itemNumbers": [19, 20, 21, 22, 23, 24, 25, 26, 27]}, {"title": "The Unlikely Story of Velcro", "genre": "informational", "text": "Some of history's most useful inventions came from careful, deliberate research conducted over years in a laboratory. Velcro was not one of them. Its origin story begins not with a scientist searching for a solution, but with a Swiss engineer named George de Mestral returning from a hunting trip in the Alps in 1941, annoyed at how stubbornly a certain type of plant seed clung to his clothes and to his dog's fur.\n\nRather than simply pulling the seeds off and moving on, as most people would, de Mestral's curiosity got the better of him. He decided to examine the seeds, called burrs, under a microscope to understand exactly why they gripped fabric so persistently. What he found were hundreds of tiny, flexible hooks covering the surface of each burr, hooks that caught easily onto the small loops naturally present in fabric, fur, or hair. Once caught, the connection was surprisingly strong, yet the burr could still be pulled free without tearing the material it clung to or, in most cases, damaging the hook itself.\n\nDe Mestral became convinced that this simple natural mechanism, hooks catching on loops, could be recreated artificially to create a new type of fastener, one that could be attached and pulled apart repeatedly, unlike a button or a zipper. Turning this idea into a workable product, however, took years of frustrating trial and error. Early attempts to weave the necessary hooks and loops out of cotton failed, since cotton wasn't durable or springy enough to function as a reliable hook shape after repeated use.\n\nThe eventual breakthrough came when de Mestral began experimenting with nylon, a relatively new synthetic fabric at the time. He discovered that nylon threads, when sewn under infrared light, formed durable, tough hooks that held their shape reliably even after being fastened and unfastened thousands of times. Manufacturing the material still required specialized looms that had to be custom designed, since no existing textile machinery was built to weave a fabric with the specific hook-and-loop structure de Mestral needed. He patented his invention in 1955, combining the French words \"velours\" (velvet) and \"crochet\" (hook) to create its now-famous name: Velcro.\n\nFor years, Velcro struggled to find widespread appeal, often dismissed by the fashion industry as cheap-looking or unsophisticated compared to traditional buttons and zippers. Its fortunes changed dramatically when NASA began using Velcro extensively during the Space Race, relying on it to secure objects and equipment in the zero-gravity environment of spacecraft, where dropped items could otherwise float away and become a serious hazard. The publicity surrounding NASA's use of the material sparked broader public interest, and Velcro gradually expanded into clothing, shoes, medical equipment, and countless other everyday products, all beginning with one engineer's curiosity about seeds stuck to his socks.", "itemNumbers": [28, 29, 30, 31, 32, 33, 34, 35, 36]}, {"title": "The Migration of the Monarch Butterfly", "genre": "informational", "text": "Each autumn, millions of monarch butterflies across the eastern half of North America begin an extraordinary journey, traveling as far as three thousand miles to reach a handful of specific forested mountains in central Mexico, where they will spend the winter clustered together by the millions on the branches of oyamel fir trees. What makes this migration especially remarkable is that no single butterfly making the journey has ever completed it before.\n\nA monarch butterfly's lifespan is typically only a few weeks, meaning several generations are born, live, reproduce, and die over the course of a single summer as monarchs gradually move northward from Mexico into the United States and Canada, following the availability of milkweed, the only plant on which monarch caterpillars can feed. However, the generation of monarchs born in late summer is biologically different from the generations before it. Rather than living for only a few weeks and reproducing quickly, this special generation, sometimes called the \"super generation,\" can live for up to eight months, and it delays reproduction entirely, directing its energy instead toward an extraordinarily long flight south.\n\nScientists still do not fully understand how this super generation manages to navigate to the same specific wintering grounds in Mexico each year, especially given that the butterflies making the journey have never been there before; their great-great-grandparents were the last monarchs to make the return trip north the previous spring. Research suggests migrating monarchs rely on a combination of the position of the sun and an internal magnetic compass, sensitive to the Earth's magnetic field, to maintain a consistent southward direction over thousands of miles.\n\nOnce they arrive in Mexico, the monarchs cluster together so densely on oyamel fir branches that entire trees can appear to be covered in orange and black, sometimes bending branches under the sheer number of butterflies gathered on them. This clustering behavior likely helps the butterflies conserve warmth and stay protected from wind during the cooler mountain winter. In early spring, these same butterflies begin the journey back north, though they typically only travel partway before mating, laying eggs on emerging milkweed plants, and dying, leaving the next generation to continue the journey their parents and grandparents began.\n\nThe monarch's remarkable migration has become increasingly vulnerable in recent decades due to a combination of threats, including the loss of milkweed habitat from land development and agriculture, deforestation at the Mexican wintering sites, and the use of certain pesticides. Conservation organizations across three countries, the United States, Mexico, and Canada, have coordinated efforts to plant milkweed corridors and protect wintering forests, recognizing that saving the monarch's migration requires cooperation across the entire route the species depends on, not just protection at any single location.", "itemNumbers": [37, 38, 39, 40, 41, 42, 43, 44, 45]}]}};

 "unbiased", "meager": "very small in amount", "brisk": "quick and energetic", "novice": "beginner", "jubilant": "joyfully triumphant", "banter": "lighthearted teasing talk", "vacant": "empty", "fortitude": "courage and strength of mind", "optimistic": "hopeful", "exuberant": "full of energy and excitement", "grueling": "extremely tiring", "immense": "huge", "hindrance": "an obstacle", "peculiar": "strange", "deft": "skillful", "robust": "strong and healthy", "wrath": "intense anger", "quandary": "a difficult situation", "negligent": "careless", "reticent": "reserved and quiet", "mediocre": "average", "malice": "ill will", "dismal": "gloomy", "opulent": "lavishly rich", "thrive": "grow successfully", "concise": "brief and clear", "quaint": "charmingly old-fashioned", "resilient": "able to recover quickly", "recoil": "pull back suddenly", "undermine": "weaken", "wistful": "longing and nostalgic", "murky": "cloudy and dark", "zenith": "highest point", "jovial": "cheerful and friendly", "conjecture": "a guess", "unwavering": "steady and firm", "haphazard": "disorganized", "jeopardize": "put at risk", "diligent": "hardworking", "benevolent": "kind and generous", "circumvent": "go around", "jostle": "push and bump", "cordial": "polite and friendly", "yearn": "long for", "scrutinize": "examine closely", "futile": "useless", "abrupt": "sudden", "brittle": "easily broken", "obstinate": "stubborn"};
var LEARN_CONTENT = {"vocabulary": {"title": "Vocabulary", "intro": "Iowa's Vocabulary subtest gives you a word inside a full sentence and asks what it means **in that sentence** \u2014 not just the dictionary definition you might have memorized. The sentence itself almost always contains a clue.", "sections": [{"heading": "Use the sentence, not just the word", "type": "key", "body": "Every vocabulary item on the real test is built around **context clues** \u2014 hints hidden in the surrounding words. There are four common types:\n\n- **Definition clue**: the sentence basically defines the word right there. *\"Her candid opinion surprised the committee\" \u2014 if the rest of the sentence explains she said exactly what she thought, 'candid' means honest.*\n- **Contrast clue**: a word like *but*, *however*, or *although* signals the meaning is the opposite of something nearby.\n- **Example clue**: specific examples listed after the word narrow down its meaning.\n- **Inference clue**: you have to reason it out from the overall situation \u2014 the hardest type, and the one worth practicing most."}, {"heading": "Watch for near-meaning traps", "type": "watch", "body": "Wrong choices are almost never random. They're usually **related in tone or category** to the real answer, which is exactly what makes them tempting. If a word describes something negative, expect at least one wrong choice that's also negative but means something different. Re-read the sentence with your chosen answer substituted in \u2014 does it still make complete sense?"}, {"heading": "Common Greek and Latin roots worth knowing", "type": "key", "body": "A huge share of challenging words at this level are built from a small set of roots. Recognizing the root often gets you 80% of the way to the meaning:\n\n- **bene-** (good): *benevolent, benefit*\n- **mal-** (bad): *malice, malfunction*\n- **-tion/-sion** (state of): *conjecture, adversity*\n- **circum-** (around): *circumvent, circumference*\n- **tele-** (far): *telephone*\n- **photo-** (light): *photograph*\n- **-ology** (study of): *biology*\n- **chron-** (time): *chronological*"}], "ayah": {"surah": 33, "ayah": 70, "reflection": "This ayah instructs believers to speak *qawlan sadidan* \u2014 words that are correct, direct, and true. Building a strong vocabulary isn't just about test scores; it's also a tool for saying exactly what you mean, clearly and honestly."}}, "reading": {"title": "Reading", "intro": "You already read strongly \u2014 your practice results show it. The Reading subtest rewards a few specific habits more than raw speed, so this section is about sharpening the exact skills the real test checks for.", "sections": [{"heading": "Central idea vs. supporting detail", "type": "key", "body": "The **central idea** is what the *whole* passage is mostly about \u2014 not just what one paragraph says. A common trap: an answer choice restates a true detail from paragraph 2, but it's too narrow to be the *central* idea of the entire passage. Ask yourself: *does this cover the whole passage, or just one piece of it?*"}, {"heading": "Inference = text evidence + your own reasoning", "type": "key", "body": "An inference question never has its answer written word-for-word in the passage \u2014 if it did, it would be a detail question instead. You're combining a specific detail with logical reasoning. The right answer still has to be **directly supportable** by something in the text; it can't rely on outside knowledge or a guess that goes beyond what's written."}, {"heading": "Vocabulary-in-context", "type": "key", "body": "These questions ask what a word means **as used in this passage** specifically, since many words have multiple meanings. Cover the answer choices, reread the sentence and the one before it, and predict a meaning in your own words *before* looking at the choices \u2014 this stops you from getting pulled toward a choice that's a real dictionary meaning of the word, just not the one that fits nouns** (me, him, her, us, them, whom) when it's receiving the action.\n\n*Quick trick for compound subjects:* for \"my friend and (I/me) went to the store,\" drop the other person \u2014 \"I went to the store\" sounds right, so \"I\" is correct.\n\n*Who vs. whom:* if you could answer the question with *he/she* (subject), use **who**. If you'd answer with *him/her* (object), use **whom**."}, {"heading": "Verb tense consistency", "type": "watch", "body": "Once a passage establishes it's telling a story in the past tense, every verb should generally stay in the past tense unless there's a real reason to shift (like a general fact that's still true). A sudden shift to present tense in the middle of a past-tense story is one of the most common errors on this subtest."}, {"heading": "Commas with compound sentences", "type": "key", "body": "When two **complete sentences** (independent clauses) are joined by *and, but, or, so, yet*, put a comma **before** the conjunction: *\"The bell rang, but the students kept working.\"* If the second part isn't a complete sentence on its own, skip the comma: *\"The bell rang but kept ringing.\"*"}, {"heading": "Comma splices, run-ons, and fragments", "type": "watch", "body": "A **comma splice** joins two complete sentences with only a comma and no conjunction \u2014 *\"I finished my homework, I watched TV\"* is wrong; it needs a conjunction, a semicolon, or a period instead. A **run-on** joins them with nothing at all. A **fragment** is missing a subject or a verb and can't stand alone. All three are frequently tested."}, {"heading": "Parallel structure", "type": "key", "body": "Items in a list or comparison should use matching grammatical forms: *\"She likes hiking, swimming, and to bike\"* is unparallel; *\"hiking, swimming, and biking\"* fixes it by making all three items match (all -ing forms)."}], "ayah": {"surah": 68, "ayah": 1, "reflection": "This surah opens with an oath \"by the pen and what they inscribe\" \u2014 writing itself is treated as significant enough to swear by. Taking care with written words, making sure they're accurate and well put together, is a small way of honoring that same idea."}}, "spelling": {"title": "Spelling", "intro": "Spelling is worth extra focus right now, and the good news is that most misspellings on this test follow a small number of predictable patterns. Learning the *pattern* behind a word is far more useful than memorizing that one word alone, since it transfers to dozens of other words.", "sections": [{"heading": "The doubling rule (1-1-1 rule)", "type": "key", "body": "When a short word ends in **one vowel + one consonant**, and the stress falls on that last syllable, **double the final consonant** before adding an ending that starts with a vowel (like *-ed, -ing, -er*):\n\n- **begin \u2192 beginning** (stress on the last syllable: be-GIN)\n- **occur \u2192 occurred**\n- **refer \u2192 referred**\n- **plan \u2192 planning**\n\nIf the stress is on an *earlier* syllable, don't double it: *VIS-it \u2192 visited*, not *visitted*."}, {"heading": "Silent letters", "type": "watch", "body": "These words keep letters from their origins that are no longer pronounced. There's no shortcut except familiarity \u2014 but knowing *why* helps them stick:\n\n- **kn-** words come from Old English (*knowledge, knight*) \u2014 the k used to be pronounced.\n- **-mn** endings (*autumn, condemn*) keep a silent n.\n- **Wednesday** keeps the *d* from \"Woden's day.\"\n- **subtle, receipt** keep silent letters from their Latin roots (*subtilis, receptum*)."}, {"heading": "\"I before E, except after C\" \u2014 and its exceptions", "type": "key", "body": "The classic rule: **i before e** (*believe, field, niece*) \u2014 **except after c** (*receive, ceiling, deceive*), where it flips to *ei*.\n\nThe rule also flips when the letters sound like a long **A**, as in *neighbor* and *eight*.\n\n**Well-known exceptions that break the rule anyway**: *weird, seize, height, science, foreign*. These simply need to be memorized as exceptions."}, {"heading": "-ible vs. -able", "type": "watch", "body": "There's no perfect rule, but a useful pattern: if you can remove the ending and still have a complete word, it's usually **-able** (*comfort \u2192 comfortable, depend \u2192 dependable*). If removing the ending leaves an incomplete root, it's more often **-ible** (*poss- \u2192 possible, vis- \u2192 visible, incred- \u2192 incredible*). This isn't foolproof, but it's right more often than a guess."}, {"heading": "-ance vs. -ence", "type": "watch", "body": "Another pattern-based one: words related to a root ending in **-ant** usually take **-ance** (*important \u2192 importance, resistant \u2192 resistance*), while words related to a root ending in **-ent** usually take **-ence** (*existent \u2192 existence, different \u2192 difference*)."}, {"heading": "Words worth extra review", "type": "key", "body": "These are commonly misspelled at this level and worth specific attention: *definitely, separate, government, environment, business, embarrass, privilege, license, schedule, occasion, parallel, exaggerate, maintenance, questionnaire, mischievous, pronunciation*. Notice that several of these are simply about **not adding or dropping a letter** compared to a related word you already know (e.g., *government* keeps every letter of *govern*)."}]}, "capitalization": {"title": "Capitalization", "intro": "Capitalization rules are mostly about proper nouns \u2014 specific, one-of-a-kind names \u2014 versus general, common nouns. The test likes to hide errors in categories that feel like they should be common nouns but are actually specific names.", "sections": [{"heading": "Proper nouns: the core rule", "type": "key", "body": "Capitalize the name of a **specific** person, place, or thing \u2014 but not a general category. *\"We visited a park\"* stays lowercase, but *\"We visited Yellowstone National Park\"* is capitalized, because it names one specific place."}, {"heading": "Categories that trip people up", "type": "watch", "body": "- **Days, months, and holidays** are capitalized (*Monday, September, Thanksgiving*) \u2014 but **seasons are not** (*spring, winter*).\n- **Titles directly before a name** are capitalized (*President Lopez, Dr. Chen*) \u2014 but the same word used generally is not (*the president spoke*).\n- **Historical periods and events** are capitalized when they name something specific (*the Industrial Revolution, World War II*).\n- **Nationalities and languages** are always capitalized (*Spanish, Japan*), even mid-sentence.\n- **The pronoun \"I\"** is always capitalized, no matter where it falls in a sentence."}, {"heading": "Titles of works", "type": "key", "body": "In the title of a book, movie, or article, capitalize the main words \u2014 but typically not short articles (*a, the*) or short prepositions (*of, in*) unless they're the first word: *The Giver*, *A Midsummer Night's Dream*."}]}, "punctuation": {"title": "Punctuation", "intro": "Punctuation questions test whether you can spot exactly where a mark is missing, extra, or wrong. Since this is a priority area, here's a complete run-through of every pattern the test uses.", "sections": [{"heading": "Commas: the big four", "type": "key", "body": "1. **Series**: commas between three or more items, including before *and* \u2014 *\"flour, sugar, and eggs.\"*\n2. **Introductory elements**: a comma after a phrase or clause that opens a sentence \u2014 *\"After the storm passed, we went outside.\"*\n3. **Compound sentences**: a comma before *and/but/or/so/yet* when joining two complete sentences.\n4. **Nonessential clauses**: commas around extra information that could be removed without changing the sentence's basic meaning \u2014 *\"My neighbor, who just moved here, invited us over.\"*"}, {"heading": "Commas with dates, addresses, and direct address", "type": "watch", "body": "- Dates: comma between the day and year \u2014 *\"March 3, 2024.\"*\n- Addresses: comma after each part \u2014 *\"455 Oak Avenue, Denver, Colorado.\"*\n- Direct address: commas around a name when directly speaking to someone \u2014 *\"Thank you, Mr. Rodriguez, for your help.\"*"}, {"heading": "Apostrophes: possessives", "type": "key", "body": "- **Singular possessive**: add **'s** \u2014 *the dog's collar* (one dog).\n- **Plural possessive (already ends in s)**: add just an apostrophe \u2014 *the students' projects* (multiple students).\n- **Irregular plural (doesn't end in s)**: add **'s** \u2014 *the children's toys*.\n\nA very common error: writing a plain plural (*dogs*) when a possessive (*dog's*) is meant, or the reverse."}, {"heading": "Apostrophes: contractions", "type": "watch", "body": "The apostrophe replaces missing letters: *do not \u2192 don't, it is \u2192 it's, was not \u2192 wasn't*. The most frequent trap on this test is **it's vs. its** \u2014 *it's* always means \"it is\" or \"it has\"; *its* (no apostrophe) is the possessive form."}, {"heading": "Quotation marks", "type": "key", "body": "Direct quotations \u2014 someone's exact spoken or written words \u2014 need quotation marks: *My teacher said, \"Please turn in your essays.\"* Titles of short works (like a poem or article) also use quotation marks, while longer works (books, movies) are italicized or underlined instead."}, {"heading": "Semicolons and colons", "type": "key", "body": "- **Semicolon**: joins two complete sentences that are closely related, with no conjunction \u2014 *\"I finished my homework early; I still had time to relax.\"*\n- **Colon**: introduces a list, but only after a complete sentence \u2014 *\"Please bring the following items: a pencil, a notebook, and a calculator.\"* Don't use a colon directly after a verb like \"include\" or \"are\" if there's no complete sentence before it."}, {"heading": "Hyphens in compound modifiers", "type": "watch", "body": "When two or more words work together as a single adjective **before** a noun, hyphenate them: *well-known author, five-year-old boy, fast-paced practice*. If the same words come *after* the noun they describe, they usually don't need a hyphen: *the author is well known*."}]}};
