ted to see Renata as Lady Beatrice, not the queen.", "The passage states her mother looked 'clearly confused,' suggesting they did not know in advance.", "There's no indication they were upset; confusion is described, not anger.", "The passage shows them watching until the final bow."], "skill": "R.inference"}, {"id": "RD-E2-07", "number": 7, "tier": 2, "passageTitle": "The Understudy", "question": "What is the most likely reason the author includes Diego's comment during intermission?", "choices": ["To suggest that Diego secretly wants to take over the queen's role himself", "To confirm, through another character, that Renata's choices were genuinely good", "To show that most of the cast quietly disapproved of Renata's performance", "To create tension and rivalry between Diego and Renata backstage"], "letters": ["A", "B", "C", "D"], "correctIndex": 1, "explanations": ["Diego shows no interest in taking the role himself.", "Correct \u2014 Diego's outside perspective validates that Renata's spontaneous choice was noticeably good, reinforcing her growth.", "Diego's comment is a compliment, not disapproval.", "There is no tension shown between the two characters."], "skill": "R.author_purpose"}, {"id": "RD-E2-08", "number": 8, "tier": 2, "passageTitle": "The Understudy", "question": "Which theme is best supported by the events of this passage?", "choices": ["Family support is the most important factor in stage performance.", "Understudies should never be trusted with important roles.", "Success in performance always requires extensive rehearsal.", "Sometimes unexpected challenges can reveal abilities a person didn't know they had."], "letters": ["J", "K", "L", "M"], "correctIndex": 3, "explanations": ["Family support isn't the focus; personal growth under pressure is.", "The passage shows the opposite \u2014 Renata proves an understudy can perform well.", "Renata succeeds despite having almost no rehearsal for this specific role.", "Correct \u2014 the passage shows Renata discovering an unexpected ability under sudden pressure, finding something 'entirely her own.'"], "skill": "R.theme"}, {"id": "RD-E2-09", "number": 9, "tier": 2, "passageTitle": "The Understudy", "question": "How is the passage mainly structured?", "choices": ["It presents the story from multiple characters' points of view equally.", "It focuses entirely on a single moment without any time progression.", "It compares Renata's performance to another actress's performance in detail.", "It moves chronologically from the crisis before the show to its resolution afterward."], "letters": ["A", "B", "C", "D"], "correctIndex": 3, "explanations": ["The passage is told from Renata's perspective, not equally from multiple viewpoints.", "The passage clearly progresses through time, not just one frozen moment.", "While Ava is mentioned, there isn't a detailed side-by-side comparison of performances.", "Correct \u2014 the passage follows events in order: the crisis, preparation, the performance itself, and the aftermath."], "skill": "R.text_structure"}, {"id": "RD-E2-10", "number": 10, "tier": 2, "passageTitle": "The Journey of a Raindrop", "question": "What is the central idea of this passage?", "choices": ["Scientists recently discovered how the water cycle works.", "Most of Earth's water vapor comes from plant transpiration rather than the ocean.", "Rain is the only form of precipitation that matters to the water cycle.", "Water moves through a continuous, repeating cycle that has existed for billions of years."], "letters": ["J", "K", "L", "M"], "correctIndex": 3, "explanations": ["The passage doesn't frame this as a recent discovery.", "The passage states most water vapor comes from oceans, since they 'cover roughly seventy percent of the planet's surface.'", "The passage explicitly discusses snow, sleet, and hail as forms of precipitation as well.", "Correct \u2014 the passage explains evaporation, condensation, precipitation, and collection as one continuous, ancient cycle."], "skill": "R.central_idea"}, {"id": "RD-E2-11", "number": 11, "tier": 2, "passageTitle": "The Journey of a Raindrop", "question": "According to the passage, what causes water vapor to rise into the atmosphere in the first place?", "choices": ["Wind currents pushing water upward", "Plants releasing oxygen into the air", "Cold air pulling moisture from the ground", "The sun's heat energy causing evaporation"], "letters": ["A", "B", "C", "D"], "correctIndex": 3, "explanations": ["Wind is not described as the cause of the initial rise.", "Oxygen release is unrelated to the water cycle process described here.", "Cold air causes condensation, not the initial evaporation.", "Correct \u2014 the passage states 'the sun's heat energy is what powers this stage,' referring to evaporation."], "skill": "R.detail"}, {"id": "RD-E2-12", "number": 12, "tier": 2, "passageTitle": "The Journey of a Raindrop", "question": "What does the word \"condense\" most likely mean as used in the passage?", "choices": ["to freeze solid immediately", "to evaporate completely", "to change from a gas into a liquid", "to expand into a larger gas"], "letters": ["J", "K", "L", "M"], "correctIndex": 2, "explanations": ["The passage describes droplet formation, not freezing.", "This is the reverse process from what 'condense' means here.", "Correct \u2014 the passage explains that vapor 'begins to condense, transforming back into tiny liquid droplets,' meaning gas turning to liquid.", "This is the opposite of what's being described."], "skill": "R.vocab_context"}, {"id": "RD-E2-13", "number": 13, "tier": 2, "passageTitle": "The Journey of a Raindrop", "question": "Based on the passage, why do individual water droplets in a cloud not immediately fall as rain?", "choices": ["They evaporate again before they can combine.", "They are too small and light to overcome the air currents holding them up.", "They are chemically bonded to the dust particles around them.", "Clouds only form in areas with very little wind."], "letters": ["A", "B", "C", "D"], "correctIndex": 1, "explanations": ["The passage doesn't say droplets evaporate again before combining.", "Correct \u2014 the passage states individual droplets 'are far too small and light to fall' and 'remain suspended' until enough combine.", "The passage doesn't describe a chemical bond; droplets simply cling to particles physically.", "Wind conditions in cloud formation areas aren't discussed."], "skill": "R.inference"}, {"id": "RD-E2-14", "number": 14, "tier": 2, "passageTitle": "The Journey of a Raindrop", "question": "Which sentence from the passage best supports the idea that water is reused rather than newly created?", "choices": ["\"Depending on the temperature of the air the droplets pass through...\"", "\"Cooler air cannot hold as much water vapor as warmer air...\"", "\"The water cycle doesn't create or destroy water; it simply moves the same finite supply...\"", "\"A single raindrop falling on a rooftop seems like a simple, unremarkable event.\""], "letters": ["J", "K", "L", "M"], "correctIndex": 2, "explanations": ["This sentence explains different forms of precipitation, not reuse of water.", "This sentence explains condensation, not the reuse of water overall.", "Correct \u2014 this sentence directly states water is neither created nor destroyed, only moved and reused.", "This sentence is a general introductory statement."], "skill": "R.text_evidence"}, {"id": "RD-E2-15", "number": 15, "tier": 2, "passageTitle": "The Journey of a Raindrop", "question": "What is transpiration, according to the passage?", "choices": ["A process similar to evaporation that occurs through plants", "The process by which clouds form from dust particles", "The underground storage of water in aquifers", "The freezing of water droplets into hail or snow"], "letters": ["A", "B", "C", "D"], "correctIndex": 0, "explanations": ["Correct \u2014 the passage describes transpiration as functioning 'much like evaporation but occurs through a living organism.'", "Cloud formation from dust particles is a separate part of the process, unrelated to transpiration.", "Aquifers store water underground, which is a different process from transpiration.", "Freezing into hail or snow is a separate part of precipitation, not transpiration."], "skill": "R.detail"}, {"id": "RD-E2-16", "number": 16, "tier": 2, "passageTitle": "The Journey of a Raindrop", "question": "Why does the author mention that a raindrop's water might have once been part of an ancient sea or a dinosaur's drink?", "choices": ["To help readers grasp how long and far the same water has been recycled through history", "To prove that ancient dinosaurs directly caused today's modern weather patterns", "To explain why rainwater sometimes appears slightly discolored after storms", "To argue that today's drinking water is contaminated by ancient organisms"], "letters": ["J", "K", "L", "M"], "correctIndex": 0, "explanations": ["Correct \u2014 this vivid detail helps illustrate the immense timescale and constant reuse described by the water cycle.", "The passage doesn't claim dinosaurs caused modern weather.", "Rain discoloration is not mentioned.", "Contamination isn't discussed in the passage."], "skill": "R.author_purpose"}, {"id": "RD-E2-17", "number": 17, "tier": 2, "passageTitle": "The Journey of a Raindrop", "question": "How is this passage mainly organized?", "choices": ["As a step-by-step explanation of a repeating natural process", "As a historical account of how the water cycle was first discovered", "As an argument comparing two scientific theories about rainfall", "As a series of unrelated facts about rain and clouds"], "letters": ["A", "B", "C", "D"], "correctIndex": 0, "explanations": ["Correct \u2014 the passage moves through evaporation, condensation, precipitation, and collection in a clear, connected sequence.", "The passage doesn't describe the history of the cycle's discovery.", "No competing theories are presented.", "The facts are connected in a clear sequential process, not scattered randomly."], "skill": "R.text_structure"}, {"id": "RD-E2-18", "number": 18, "tier": 2, "passageTitle": "The Journey of a Raindrop", "question": "Which idea is best supported by the passage as a whole?", "choices": ["The water cycle is a recent phenomenon caused by human activity.", "Plants play no meaningful role in the water cycle.", "The same water has been cycling through Earth's systems for an extremely long time.", "Rain only falls in regions near large oceans."], "letters": ["J", "K", "L", "M"], "correctIndex": 2, "explanations": ["The passage describes an ancient, natural process, not a recent human-caused one.", "The passage explicitly describes plants' role through transpiration.", "Correct \u2014 the passage emphasizes that Earth's total water supply 'has remained essentially constant for billions of years.'", "The passage doesn't limit rainfall to areas near oceans."], "skill": "R.synthesis"}, {"id": "RD-E2-19", "number": 19, "tier": 2, "passageTitle": "The Invention of the Printing Press", "question": "What is the central idea of this passage?", "choices": ["Gutenberg's invention of movable type dramatically changed how information spread across Europe.", "Books were already widely available and quite affordable before Gutenberg's invention.", "The Gutenberg Bible was the very first book ever printed anywhere in human history.", "Woodblock printing was more effective than movable type in every possible situation."], "letters": ["A", "B", "C", "D"], "correctIndex": 0, "explanations": ["Correct \u2014 the passage traces how movable type made books cheaper and more widespread, enabling ideas to spread faster.", "The passage states books were 'rare, expensive' before Gutenberg's invention.", "The passage clarifies printing itself already existed in Asia; the Gutenberg Bible was an early European book using movable type, not the first book ever.", "The passage presents movable type as an improvement over woodblock printing, not the reverse."], "skill": "R.central_idea"}, {"id": "RD-E2-20", "number": 20, "tier": 2, "passageTitle": "The Invention of the Printing Press", "question": "According to the passage, what was the main limitation of woodblock printing?", "choices": ["It required expensive metal alloys that were hard to produce.", "It was invented too recently to be widely adopted.", "It could not be used to print religious texts.", "Each carved block could only be used to print one specific page."], "letters": ["J", "K", "L", "M"], "correctIndex": 3, "explanations": ["Metal alloys are associated with Gutenberg's movable type, not woodblock printing.", "The passage says woodblock printing 'had existed in Asia for centuries,' so recency isn't the issue.", "Nothing suggests woodblock printing couldn't be used for religious texts.", "Correct \u2014 the passage states 'a block could only be used for that one page,' making it inflexible."], "skill": "R.detail"}, {"id": "RD-E2-21", "number": 21, "tier": 2, "passageTitle": "The Invention of the Printing Press", "question": "What does the word \"alloy\" most likely mean as used in the passage?", "choices": ["a type of thin, decorative paper used for old books", "a specific kind of religious text used in old churches", "a mixture of metals combined for specific properties", "a specific design used for early printing presses"], "letters": ["A", "B", "C", "D"], "correctIndex": 2, "explanations": ["Paper is not what's being described here.", "This isn't related to religious texts.", "Correct \u2014 the passage describes 'a special metal alloy that would melt easily...but would also cool quickly and hold a precise shape,' indicating a mixture of metals.", "The press design is a separate invention mentioned afterward."], "skill": "R.vocab_context"}, {"id": "RD-E2-22", "number": 22, "tier": 2, "passageTitle": "The Invention of the Printing Press", "question": "Based on the passage, why did Gutenberg need to invent a new type of ink?", "choices": ["Existing inks were too expensive to produce.", "Existing inks caused the paper to catch fire.", "Ink color needed to match specific religious requirements.", "Water-based inks did not stick properly to metal type."], "letters": ["J", "K", "L", "M"], "correctIndex": 3, "explanations": ["Cost of ink is not discussed in the passage.", "Fire risk is not mentioned in the passage.", "Religious color requirements are not mentioned.", "Correct \u2014 the passage explains that water-based ink was 'commonly used for woodblock printing' but didn't work well with metal type, requiring a new oil-based ink."], "skill": "R.inference"}, {"id": "RD-E2-23", "number": 23, "tier": 2, "passageTitle": "The Invention of the Printing Press", "question": "Which sentence from the passage best supports the idea that Gutenberg's invention allowed for much greater printing efficiency?", "choices": ["\"He also personally created and refined a brand-new, oil-based printing ink for this exact purpose...\"", "\"The effects of Gutenberg's invention rippled outward far beyond just religious texts.\"", "\"Gutenberg did not invent the basic idea of printing itself.\"", "\"Roughly 180 copies were printed, an almost unimaginable number compared to what a team of scribes could have produced...\""], "letters": ["A", "B", "C", "D"], "correctIndex": 3, "explanations": ["This describes the ink itself, not the resulting efficiency.", "This describes broader effects, not printing efficiency specifically.", "This sentence clarifies what Gutenberg did not invent, not efficiency.", "Correct \u2014 this sentence directly compares the large number of printed copies to what hand-copying could achieve, emphasizing efficiency."], "skill": "R.text_evidence"}, {"id": "RD-E2-24", "number": 24, "tier": 2, "passageTitle": "The Invention of the Printing Press", "question": "What is the author's purpose in explaining the three engineering problems Gutenberg solved?", "choices": ["To compare Gutenberg's press to modern digital printers", "To argue that Gutenberg's success was mostly a matter of luck", "To criticize Gutenberg for taking too long to finish his invention", "To show the complexity and ingenuity involved in creating a functional printing system"], "letters": ["J", "K", "L", "M"], "correctIndex": 3, "explanations": ["No comparison to modern digital printers is made.", "The passage emphasizes deliberate problem-solving, not luck.", "The passage doesn't criticize Gutenberg's timeline.", "Correct \u2014 detailing the metal alloy, press design, and ink shows how many distinct challenges Gutenberg had to solve to make his invention work."], "skill": "R.author_purpose"}, {"id": "RD-E2-25", "number": 25, "tier": 2, "passageTitle": "The Invention of the Printing Press", "question": "Which idea is best supported by the final paragraph of the passage?", "choices": ["Gutenberg's invention contributed to major historical movements like the Renaissance and the Reformation.", "Gutenberg's invention ultimately had very little lasting historical impact at all.", "The cost of books increased significantly after the printing press was introduced.", "The printing press was quickly banned across most of Europe shortly after its invention."], "letters": ["A", "B", "C", "D"], "correctIndex": 0, "explanations": ["Correct \u2014 the passage states historians consider it 'a key factor that helped enable the Renaissance, the Reformation, and...widespread literacy.'", "The passage states the opposite \u2014 the impact was significant and long-lasting.", "The passage states 'the cost of producing a book dropped dramatically,' not increased.", "No ban on the printing press is mentioned."], "skill": "R.synthesis"}, {"id": "RD-E2-26", "number": 26, "tier": 2, "passageTitle": "The Invention of the Printing Press", "question": "How is this passage mainly organized?", "choices": ["By comparing modern printing to ancient printing methods in equal detail", "By arguing for one interpretation of a disputed historical event", "By listing unrelated facts about European history", "By explaining a problem, the inventor's solution, and its lasting historical effects"], "letters": ["J", "K", "L", "M"], "correctIndex": 3, "explanations": ["Modern printing is not discussed at all.", "The passage doesn't present a disputed historical controversy.", "The facts are connected in a clear cause-and-effect structure, not scattered randomly.", "Correct \u2014 the passage moves from the problem (slow, expensive hand-copying), to Gutenberg's solution (movable type), to its historical effects."], "skill": "R.text_structure"}, {"id": "RD-E2-27", "number": 27, "tier": 2, "passageTitle": "The Invention of the Printing Press", "question": "Based on the passage, what can be inferred about the relationship between access to information and major historical change?", "choices": ["Historical change happens independently of how information spreads.", "Access to information has little effect on historical events.", "Only religious texts have ever influenced historical change.", "Wider access to information can help drive major cultural and historical shifts."], "letters": ["A", "B", "C", "D"], "correctIndex": 3, "explanations": ["The passage directly ties the printing press to enabling these historical shifts, contradicting this choice.", "The passage suggests the opposite \u2014 access to information mattered a great deal.", "The passage discusses pamphlets and scientific papers spreading too, not just religious texts.", "Correct \u2014 the passage links the spread of cheaply printed materials to major shifts like the Renaissance and Reformation, implying information access drives change."], "skill": "R.inference"}, {"id": "RD-E2-28", "number": 28, "tier": 2, "passageTitle": "The Spare Key", "question": "What is the main change that occurs in Amir's Thursday visits over the course of the passage?", "choices": ["He eventually stops visiting his grandfather altogether after a disagreement.", "The visits shift from quiet and dull to meaningful through playing chess together.", "Amir begins bringing several of his friends along to the weekly visits.", "His grandfather unexpectedly moves away to a completely different apartment."], "letters": ["J", "K", "L", "M"], "correctIndex": 1, "explanations": ["Amir continues visiting throughout the passage.", "Correct \u2014 the visits start as quiet and long-feeling but become meaningful once chess becomes part of their time together.", "Friends are mentioned only as people Amir hides the key from, not as visitors.", "There is no mention of a move."], "skill": "R.central_idea"}, {"id": "RD-E2-29", "number": 29, "tier": 2, "passageTitle": "The Spare Key", "question": "Why does Amir keep his grandfather's spare key hidden under his shirt?", "choices": ["His grandfather told him to keep it secret.", "He doesn't want his friends to see it and ask questions.", "He is embarrassed about visiting his grandfather at all.", "He is afraid of losing it."], "letters": ["A", "B", "C", "D"], "correctIndex": 1, "explanations": ["There's no indication his grandfather asked him to hide it.", "Correct \u2014 the passage states he tucks it 'where his friends wouldn't see it and ask questions.'", "The passage doesn't suggest Amir is embarrassed about the visits themselves.", "Fear of losing the key isn't mentioned as his reason."], "skill": "R.detail"}, {"id": "RD-E2-30", "number": 30, "tier": 2, "passageTitle": "The Spare Key", "question": "What does the word \"punished\" most likely mean as used in the phrase \"a habit his grandfather had gently but repeatedly punished\"?", "choices": ["quietly encouraged to continue doing it more often", "ignored completely by everyone at the table", "corrected through repeated consequences in the game", "immediately rewarded with praise and encouragement"], "letters": ["J", "K", "L", "M"], "correctIndex": 2, "explanations": ["This is the opposite of what 'punished' suggests in this context.", "The passage indicates the opposite \u2014 the habit was addressed directly and repeatedly.", "Correct \u2014 in a chess context, 'punished' means the grandfather repeatedly took advantage of Amir's mistake (moving his queen out early) to teach him not to repeat it.", "This contradicts the idea of correcting a mistake."], "skill": "R.vocab_context"}, {"id": "RD-E2-31", "number": 31, "tier": 2, "passageTitle": "The Spare Key", "question": "Why did Amir's grandfather stop playing chess for a long period of time?", "choices": ["He didn't feel like playing after his wife passed away.", "He physically could not move the chess pieces.", "He was waiting for Amir to be old enough to learn.", "He lost interest in the game entirely."], "letters": ["A", "B", "C", "D"], "correctIndex": 0, "explanations": ["Correct \u2014 he says, 'Didn't feel much like playing, if I'm honest, after she was gone,' referring to his late wife.", "His hip issue affects walking, not his ability to move small chess pieces, as he notes himself.", "There's no indication he was specifically waiting for Amir.", "The passage doesn't suggest a general loss of interest, but a specific emotional reason."], "skill": "R.inference"}, {"id": "RD-E2-32", "number": 32, "tier": 2, "passageTitle": "The Spare Key", "question": "Which sentence best supports the idea that the chessboard holds emotional significance for the grandfather?", "choices": ["\"Amir did his homework, said little, and left once his mother came to pick him up.\"", "\"Barely is enough to start.\"", "\"That first game lasted almost forty minutes and ended with Amir losing badly.\"", "\"This was her board.\""], "letters": ["J", "K", "L", "M"], "correctIndex": 3, "explanations": ["This describes Amir's early, quiet visits before chess became part of them.", "This is an encouraging comment about starting to play, not about emotional significance.", "This describes gameplay, not emotional significance.", "Correct \u2014 this brief, meaningful statement reveals the board belonged to Amir's late grandmother, adding emotional depth."], "skill": "R.text_evidence"}, {"id": "RD-E2-33", "number": 33, "tier": 2, "passageTitle": "The Spare Key", "question": "What is the most likely reason the author includes the detail about Amir's grandmother liking gardening?", "choices": ["To show how little Amir actually knows about his grandmother before this conversation", "To gently criticize Amir for never asking about his own family history", "To explain why the grandfather's apartment has so many houseplants", "To suggest that gardening mattered more to her than chess ever did"], "letters": ["A", "B", "C", "D"], "correctIndex": 0, "explanations": ["Correct \u2014 this detail, along with knowing only her name, emphasizes how limited Amir's knowledge of his grandmother was before learning about her chess skill.", "The passage doesn't criticize Amir; it simply shows his limited prior knowledge.", "The passage doesn't focus on the apartment's plants.", "The passage doesn't compare the relative importance of gardening and chess to her."], "skill": "R.author_purpose"}, {"id": "RD-E2-34", "number": 34, "tier": 2, "passageTitle": "The Spare Key", "question": "How does Amir's understanding of the chessboard change by the end of the passage?", "choices": ["He realizes the old chessboard is probably worth a lot of money.", "He learns, surprisingly, that his grandfather never actually liked chess.", "He decides afterward that he no longer wants to play chess at all.", "He sees it as carrying a meaningful family history rather than just being a game."], "letters": ["J", "K", "L", "M"], "correctIndex": 3, "explanations": ["Monetary value is never discussed.", "The passage shows his grandfather cared about chess deeply, especially given its connection to his late wife.", "Amir continues to value the chess games, not reject them.", "Correct \u2014 the passage states 'the same pieces suddenly carrying a history he hadn't known was there,' showing his shift in perspective."], "skill": "R.character_development"}, {"id": "RD-E2-35", "number": 35, "tier": 2, "passageTitle": "The Spare Key", "question": "Which theme is best supported by the events of this passage?", "choices": ["Winning games is more important than spending time with family.", "Chess is a more valuable skill than any other hobby.", "Shared activities can help build meaningful connections between generations.", "Grandparents should avoid discussing painful memories with grandchildren."], "letters": ["A", "B", "C", "D"], "correctIndex": 2, "explanations": ["The passage emphasizes connection and shared history over competition.", "The passage doesn't compare chess's value to other hobbies generally.", "Correct \u2014 the shared chess games transform Amir's visits from dutiful obligation into meaningful connection with his grandfather.", "The passage shows the opposite \u2014 sharing the memory of the grandmother brings them closer."], "skill": "R.theme"}, {"id": "RD-E2-36", "number": 36, "tier": 2, "passageTitle": "The Spare Key", "question": "How is the passage mainly structured?", "choices": ["It compares Amir's relationship with his grandfather to his relationship with his parents.", "It focuses only on a single afternoon without describing any change over time.", "It presents the events entirely out of order, from present to past.", "It moves chronologically through several weeks of Thursday visits."], "letters": ["J", "K", "L", "M"], "correctIndex": 3, "explanations": ["His relationship with his parents is barely mentioned.", "The passage explicitly describes change across 'the first few weeks,' 'the third Thursday,' and 'the sixth Thursday.'", "Events are presented in straightforward chronological order, not reversed.", "Correct \u2014 the passage follows several Thursdays in sequence, showing the visits and Amir's chess skills develop over time."], "skill": "R.text_structure"}, {"id": "RD-E2-37", "number": 37, "tier": 2, "passageTitle": "How Coral Reefs Build Themselves", "question": "What is the central idea of this passage?", "choices": ["Coral reefs are complex structures built gradually by tiny animals working in massive colonies, aided by a partnership with algae.", "Coral bleaching, according to some, has no real effect at all on the long-term survival or health of reefs.", "Coral reefs are built by large, powerful sea creatures over a short period of time.", "Coral reefs are entirely made of dead rock, with no living organisms present at all."], "letters": ["A", "B", "C", "D"], "correctIndex": 0, "explanations": ["Correct \u2014 the passage explains how tiny coral polyps build massive structures over long timescales, aided by their partnership with zooxanthellae algae.", "The passage explicitly states bleaching 'drastically reduces its ability to gather food' and can lead to death.", "The passage describes tiny, soft-bodied polyps, not large or powerful creatures.", "The passage describes living coral polyps forming the reef's structure, not just dead rock."], "skill": "R.central_idea"}, {"id": "RD-E2-38", "number": 38, "tier": 2, "passageTitle": "How Coral Reefs Build Themselves", "question": "According to the passage, what material do coral polyps use to build their skeletons?", "choices": ["Sand collected from the ocean floor", "Salt crystals formed by evaporation", "Calcium carbonate extracted from seawater", "Dead algae cells compressed over time"], "letters": ["J", "K", "L", "M"], "correctIndex": 2, "explanations": ["Sand collection is not described as the building method.", "Salt crystal formation is not part of the process described.", "Correct \u2014 the passage states polyps 'extract calcium and carbonate ions from seawater and combine them to produce calcium carbonate.'", "Algae provide food and color, not the skeleton material itself."], "skill": "R.detail"}, {"id": "RD-E2-39", "number": 39, "tier": 2, "passageTitle": "How Coral Reefs Build Themselves", "question": "What does the word \"vulnerable\" most likely mean as used in the passage?", "choices": ["impossible to observe", "extremely powerful", "easily harmed or damaged", "completely safe from harm"], "letters": ["A", "B", "C", "D"], "correctIndex": 2, "explanations": ["The passage doesn't discuss difficulty of observation.", "This contradicts the fragile nature described.", "Correct \u2014 the passage explains that the coral-algae partnership makes reefs 'especially vulnerable to environmental change,' meaning easily harmed.", "This is the opposite of the intended meaning."], "skill": "R.vocab_context"}, {"id": "RD-E2-40", "number": 40, "tier": 2, "passageTitle": "How Coral Reefs Build Themselves", "question": "Based on the passage, why do most reef-building corals depend on zooxanthellae algae?", "choices": ["The algae protect the coral from predators.", "The algae produce food through photosynthesis that the coral relies on.", "The algae help the coral reproduce more quickly.", "The algae absorb excess calcium carbonate from the coral's skeleton."], "letters": ["J", "K", "L", "M"], "correctIndex": 1, "explanations": ["Predator protection is not mentioned as the algae's role.", "Correct \u2014 the passage states the algae 'use sunlight to produce sugars through photosynthesis, sharing much of this food directly with their coral host.'", "Reproduction speed is not discussed in relation to the algae.", "The passage doesn't describe the algae removing calcium carbonate."], "skill": "R.inference"}, {"id": "RD-E2-41", "number": 41, "tier": 2, "passageTitle": "How Coral Reefs Build Themselves", "question": "Which sentence from the passage best supports the idea that coral reef growth happens over an extremely long period of time?", "choices": ["\"The algae use sunlight to produce sugars through photosynthesis...\"", "\"Each polyp has a simple, tube-shaped body with a mouth surrounded by stinging tentacles.\"", "\"When ocean water becomes too warm, stressed coral polyps expel their colorful algae...\"", "\"Some of the largest coral reef structures...have been growing continuously for over twenty thousand years.\""], "letters": ["A", "B", "C", "D"], "correctIndex": 3, "explanations": ["This describes the algae's function, not the reef's age.", "This describes a polyp's physical structure, not growth timescale.", "This describes coral bleaching, not the reef's long-term growth.", "Correct \u2014 this sentence directly states some reefs have grown for 'over twenty thousand years.'"], "skill": "R.text_evidence"}, {"id": "RD-E2-42", "number": 42, "tier": 2, "passageTitle": "How Coral Reefs Build Themselves", "question": "What is coral bleaching, according to the passage?", "choices": ["The exact process by which brand-new coral polyps are eventually born", "The expulsion of algae by stressed coral due to warm water, causing the coral to turn pale", "A special method scientists use to gently clean damaged reef structures", "A completely natural process that strengthens the coral's inner skeleton"], "letters": ["J", "K", "L", "M"], "correctIndex": 1, "explanations": ["Polyp reproduction is a separate topic from bleaching.", "Correct \u2014 the passage defines bleaching as when 'stressed coral polyps expel their colorful algae...leaves the coral looking pale white.'", "Bleaching is a harmful natural process, not a cleaning method used by scientists.", "Bleaching weakens coral rather than strengthening it."], "skill": "R.detail"}, {"id": "RD-E2-43", "number": 43, "tier": 2, "passageTitle": "How Coral Reefs Build Themselves", "question": "Why does the author mention that coral reefs cover \"less than one percent of the ocean floor\" but support twenty-five percent of marine species?", "choices": ["To suggest that most ocean species live far away from coral reefs", "To compare coral reefs to rainforests in terms of geographic size only", "To argue that coral reefs are not actually important to ocean ecosystems", "To emphasize how disproportionately valuable and biodiverse reef ecosystems are"], "letters": ["A", "B", "C", "D"], "correctIndex": 3, "explanations": ["This statistic shows the opposite \u2014 a huge portion of marine species depend on this small area.", "The comparison to rainforests is about biodiversity richness, not simply geographic size.", "This statistic actually emphasizes the opposite \u2014 how important reefs are despite their small size.", "Correct \u2014 this striking contrast highlights how much biodiversity is packed into a relatively tiny portion of the ocean."], "skill": "R.author_purpose"}, {"id": "RD-E2-44", "number": 44, "tier": 2, "passageTitle": "How Coral Reefs Build Themselves", "question": "How is this passage mainly organized?", "choices": ["By presenting a full chronological history of human coral reef exploration efforts", "By comparing coral reefs unfavorably to several other kinds of ocean ecosystems", "By explaining how coral reefs form, then discussing a key partnership and a threat to their survival", "By simply listing a series of unrelated facts about various ocean animals"], "letters": ["J", "K", "L", "M"], "correctIndex": 2, "explanations": ["Human exploration history is not discussed.", "No unfavorable comparison to other ecosystems is made.", "Correct \u2014 the passage explains polyp biology and reef-building, then the algae partnership, and finally the threat of bleaching.", "The facts are tightly connected around coral biology, not scattered across unrelated animals."], "skill": "R.text_structure"}, {"id": "RD-E2-45", "number": 45, "tier": 2, "passageTitle": "How Coral Reefs Build Themselves", "question": "Which idea is best supported by the passage as a whole?", "choices": ["Coral reefs are simple, unchanging structures that reportedly face no real environmental threats of any kind.", "Coral polyps can survive indefinitely even without the algae living inside their tissue.", "Coral reefs form within just a few short years and require no special conditions.", "Coral reefs are complex, ancient ecosystems that depend on a delicate biological partnership and are vulnerable to environmental change."], "letters": ["A", "B", "C", "D"], "correctIndex": 3, "explanations": ["The passage clearly describes bleaching as a real, serious threat.", "The passage states 'most reef-building coral cannot survive without' the algae partnership.", "The passage describes reef formation over 'decades, centuries, and sometimes thousands of years,' not a few years.", "Correct \u2014 the passage ties together the reef's biological complexity, ancient timescale, and vulnerability due to the coral-algae partnership."], "skill": "R.synthesis"}], "readingPassages": [{"title": "The Understudy", "genre": "literary", "text": "Renata had memorized every line in the school play twice over: her own part, Lady Beatrice, and the part of the queen, which she'd learned purely out of habit after weeks of sitting beside Ava during rehearsal. She never expected to actually need it.\n\nThen, forty minutes before opening night, Ava's stomach flu changed everything.\n\n\"You know her lines,\" the director said, not quite a question. \"I've seen you mouthing them backstage for a month.\"\n\nRenata's own costume, half-laced, suddenly felt too tight. \"I know them. That doesn't mean I can perform them in front of three hundred people with zero rehearsal.\"\n\n\"You have forty minutes and a script if you need it. That's more than most understudies get.\" The director was already walking away, calling for someone to alter the queen's costume to fit Renata instead.\n\nShe spent the next thirty-five minutes running lines with the stage manager in a hallway that smelled like sawdust and hairspray, her own Lady Beatrice costume abandoned on a hook. Every time she stumbled on a line, she pictured the audience filling the seats outside, including her parents, who thought they were about to watch her play a minor supporting role, not the queen.\n\nWhen the curtain rose, her first line came out steadier than she expected, mostly because she'd said it under her breath so many times while helping Ava practice that it no longer felt like her own voice speaking. By the second scene, something shifted. She wasn't just remembering Ava's performance and copying it \u2014 she was making small choices of her own, a pause here, a sharper tone there, that felt like they belonged to her.\n\nBackstage during intermission, another cast member, Diego, caught her arm. \"That thing you did with the crown line, where you paused before saying 'my kingdom'? Ava never did that. That was good.\"\n\nRenata hadn't even realized she'd changed it. \"I guess I just heard it differently.\"\n\n\"Well, keep hearing it that way.\"\n\nBy the final act, the nervous tightness in her chest had unwound into something closer to focus. When the curtain finally fell and the audience applauded, she caught her mother's face in the crowd, clearly confused about why her daughter, cast as Lady Beatrice, had just taken her final bow as the queen. Renata would have plenty of explaining to do once she got home. For now, though, she let herself enjoy the fact that when the moment demanded something unplanned, she hadn't just survived it \u2014 she'd found something in the role that was entirely her own.", "itemNumbers": [1, 2, 3, 4, 5, 6, 7, 8, 9]}, {"title": "The Journey of a Raindrop", "genre": "informational", "text": "A single raindrop falling on a rooftop seems like a simple, unremarkable event. In reality, that drop of water may have completed a journey lasting thousands of years and spanning much of the planet before it ever reached the ground, as part of an endless cycle scientists call the water cycle.\n\nMost rain begins as water vapor, an invisible gas that rises from oceans, lakes, rivers, and even the leaves of plants through a process called evaporation. The sun's heat energy is what powers this stage, causing liquid water molecules to gain enough energy to escape into the air as gas. Because oceans cover roughly seventy percent of the planet's surface, the vast majority of the water vapor entering the atmosphere at any given moment comes from the sea.\n\nAs water vapor rises higher into the atmosphere, it encounters progressively colder air. Cooler air cannot hold as much water vapor as warmer air, so the vapor begins to condense, transforming back into tiny liquid droplets that cling to microscopic particles of dust, salt, or pollen floating in the air. Billions of these droplets clustered together are what we see as clouds. On their own, individual droplets are far too small and light to fall; they remain suspended, bumping into each other and occasionally merging into slightly larger droplets.\n\nEventually, if enough droplets combine, they become heavy enough for gravity to overcome the air currents holding them aloft, and precipitation begins. Depending on the temperature of the air the droplets pass through on their way down, this precipitation might reach the ground as rain, snow, sleet, or hail. Once it lands, water can take several different paths. Some soaks into the soil, eventually joining underground reservoirs called aquifers. Some flows across the surface as runoff, gathering into streams and rivers that eventually lead back to the ocean. Some is absorbed directly by plant roots, later released back into the air through a process called transpiration, which functions much like evaporation but occurs through a living organism rather than an open body of water.\n\nRemarkably, scientists estimate that the total amount of water on Earth has remained essentially constant for billions of years. The water molecules currently falling as rain outside your window may well include molecules that once floated as vapor over an ancient sea, drank by a dinosaur, or frozen inside a glacier during the last ice age. The water cycle doesn't create or destroy water; it simply moves the same finite supply through an endless, repeating journey.", "itemNumbers": [10, 11, 12, 13, 14, 15, 16, 17, 18]}, {"title": "The Invention of the Printing Press", "genre": "informational", "text": "Before the mid-1400s, if someone wanted a copy of a book in Europe, there was really only one option: find a scribe willing to copy it out by hand, letter by letter, a process that could take months for a single volume. Books were rare, expensive, and owned almost exclusively by wealthy institutions like churches, universities, and royal courts. Then a German goldsmith named Johannes Gutenberg changed the course of history with a machine that could reproduce text far faster than any human hand.\n\nGutenberg did not invent printing itself. Woodblock printing, in which an entire page was carved into a single block of wood, inked, and pressed onto paper, had existed in Asia for centuries. The problem with woodblock printing was that carving a new block for every single page was still slow and labor-intensive, and a block could only be used for that one page. Gutenberg's breakthrough was a system of movable type: individual metal letters that could be arranged, used to print a page, then rearranged into entirely different combinations to print something else entirely.\n\nTo make this system work, Gutenberg had to solve several difficult engineering problems at once. He developed a special metal alloy that would melt easily enough to be cast into thousands of identical, durable letters, but would also cool quickly and hold a precise shape. He designed a mechanical press, adapted from devices used for pressing grapes and olives, that could apply firm, even pressure to transfer ink from the type onto paper without smudging. He also created a new, oil-based ink that would stick properly to metal type, unlike the water-based inks commonly used for woodblock printing.\n\nAround 1455, Gutenberg used his invention to print a complete edition of the Bible, now known as the Gutenberg Bible, one of the earliest major books produced using movable type in Europe. Roughly 180 copies were printed, an almost unimaginable number compared to what a team of scribes could have produced by hand in the same amount of time.\n\nThe effects of Gutenberg's invention rippled far beyond religious texts. Within just a few decades, printing presses had spread to cities across Europe, and the cost of producing a book dropped dramatically. Ideas that once traveled slowly, carried by a small number of hand-copied manuscripts, could now spread rapidly across the continent in the form of pamphlets, scientific papers, and translated texts. Many historians consider the printing press a key factor that helped enable the Renaissance, the Reformation, and the eventual rise of widespread literacy, arguing that few inventions in human history have changed the flow of information so dramatically.", "itemNumbers": [19, 20, 21, 22, 23, 24, 25, 26, 27]}, {"title": "The Spare Key", "genre": "literary", "text": "Every Thursday after school, Amir let himself into his grandfather's apartment with the spare key that hung on a piece of yarn around his neck, tucked under his shirt where his friends wouldn't see it and ask questions. His grandfather was recovering from a hip surgery that made stairs difficult, so Amir's job, as his mother put it, was \"just to keep him company and make sure he eats something besides crackers.\"\n\nFor the first few weeks, \"keeping him company\" mostly meant sitting across from his grandfather while the older man watched game shows and occasionally muttered answers at the television. Amir did his homework, said little, and left once his mother came to pick him up. It wasn't unpleasant, exactly. It was just quiet in a way that made the hour feel much longer than sixty minutes.\n\nThen one Thursday, Amir noticed a chessboard tucked on a high shelf, dusty and clearly untouched in a long time.\n\n\"You play?\" his grandfather asked, following his gaze.\n\n\"Barely. I know how the pieces move. That's about it.\"\n\n\"Barely is enough to start.\" His grandfather nodded toward the shelf. \"Get it down. My hip's the problem, not my hands.\"\n\nThat first game lasted almost forty minutes and ended with Amir losing badly, but by the third Thursday, he'd learned to stop moving his queen out too early, a habit his grandfather had gently but repeatedly punished. By the sixth Thursday, he won a game for the first time, and his grandfather, rather than looking disappointed, laughed so hard he had to set down his water glass.\n\n\"Your grandmother used to do that exact same trap to me,\" he said, still smiling. \"Took her about a year to teach me not to fall for it. Took you six weeks.\"\n\nAmir didn't know much about his grandmother, who had passed away before he was born. He knew her name, knew she'd liked gardening, and little else. \"She played chess?\"\n\n\"She played chess better than anyone I ever met. This was her board.\" His grandfather ran a thumb along the edge of one worn square. \"I hadn't taken it down in years. Didn't feel much like playing, if I'm honest, after she was gone.\"\n\nAmir looked at the board differently after that, the same pieces suddenly carrying a history he hadn't known was there. He still let himself in with the spare key every Thursday, but it no longer felt like an hour to get through. It felt like an hour that belonged, quietly, to both of them.", "itemNumbers": [28, 29, 30, 31, 32, 33, 34, 35, 36]}, {"title": "How Coral Reefs Build Themselves", "genre": "informational", "text": "Coral reefs are sometimes called the rainforests of the sea, home to an estimated twenty-five percent of all known marine species despite covering less than one percent of the ocean floor. What makes this especially remarkable is that the massive, rock-like structures forming these reefs are built entirely by tiny animals, most no larger than a pinhead, working together across countless generations.\n\nA coral reef begins with a single coral polyp, a small, soft-bodied animal related to jellyfish and sea anemones. Each polyp has a simple, tube-shaped body with a mouth surrounded by stinging tentacles it uses to capture tiny drifting organisms for food. On its own, a single polyp is fragile and nearly invisible. However, coral polyps rarely live alone. Most reef-building coral species form massive colonies of thousands or even millions of genetically identical polyps, all connected and functioning almost like a single organism.\n\nThe key to a reef's rock-like structure lies in what each polyp does at its base. Reef-building polyps extract calcium and carbonate ions from seawater and combine them to produce calcium carbonate, the same mineral found in limestone, which they use to construct a hard, protective skeleton beneath their soft bodies. As old polyps die, new ones grow on top of the skeletons left behind, slowly building up layer after layer of calcium carbonate over decades, centuries, and sometimes thousands of years. Some of the largest coral reef structures, including sections of Australia's Great Barrier Reef, have been growing continuously for over twenty thousand years.\n\nMost reef-building coral also relies on a remarkable partnership with microscopic algae called zooxanthellae, which live directly inside the coral polyp's tissue. The algae use sunlight to produce sugars through photosynthesis, sharing much of this food directly with their coral host. In exchange, the coral provides the algae with a protected home and access to sunlight near the ocean's surface. This partnership is so essential that most reef-building coral cannot survive without it, and it's also responsible for giving many corals their vivid, varied colors, since the pigments largely come from the algae living within them.\n\nThis delicate partnership, however, makes coral reefs especially vulnerable to environmental change. When ocean water becomes too warm, stressed coral polyps expel their colorful algae, a process known as coral bleaching that leaves the coral looking pale white and drastically reduces its ability to gather food. If warm conditions persist for too long, the coral can eventually starve and die, a growing concern for marine scientists monitoring the health of reefs worldwide.", "itemNumbers": [37, 38, 39, 40, 41, 42, 43, 44, 45]}]}, "3": {"vocabulary": [{"id": "VOC-E3-01", "examSet": 3, "number": 1, "tier": 2, "word": "optimistic", "sentence": "Even after the setback, she stayed optimistic about the team's chances.", "choices": ["hopeful", "hopeless", "confused", "indifferent"], "letters": ["A", "B", "C", "D"], "correctIndex": 0, "explanations": ["Correct \u2014 as used in this sentence, 'optimistic' means 'hopeful.'", "Not quite \u2014 'hopeless' isn't the meaning of 'optimistic' in this context.", "Not quite \u2014 'confused' isn't the meaning of 'optimistic' in this context.", "Not quite \u2014 'indifferent' isn't the meaning of 'optimistic' in this context."]}, {"id": "VOC-E3-02", "examSet": 3, "number": 2, "tier": 2, "word": "exuberant", "sentence": "The exuberant puppy bounced around the yard, greeting everyone.", "choices": ["full of energy and excitement", "calm and tired", "shy and withdrawn", "angry and aggressive"], "letters": ["J", "K", "L", "M"], "correctIndex": 0, "explanations": ["Correct \u2014 as used in this sentence, 'exuberant' means 'full of energy and excitement.'", "Not quite \u2014 'calm and tired' isn't the meaning of 'exuberant' in this context.", "Not quite \u2014 'shy and withdrawn' isn't the meaning of 'exuberant' in this context.", "Not quite \u2014 'angry and aggressive' isn't the meaning of 'exuberant' in this context."]}, {"id": "VOC-E3-03", "examSet": 3, "number": 3, "tier": 2, "word": "grueling", "sentence": "The grueling hike up the mountain left everyone exhausted.", "choices": ["surprisingly short", "unexpectedly easy", "extremely tiring", "extremely relaxing"], "letters": ["A", "B", "C", "D"], "correctIndex": 2, "explanations": ["Not quite \u2014 'surprisin lace.", "An extra comma right after 'which' would be incorrect here.", "'that' is used for essential clauses, not nonessential ones set off by a comma."]}], "writtenExpressionEssays": [{"title": "The Talent Show", "segments": [{"type": "text", "content": "Every year, our school "}, {"type": "blank", "itemNumber": 1}, {"type": "text", "content": " a talent show in the spring. "}, {"type": "blank", "itemNumber": 2}, {"type": "text", "content": " This year, I finally worked up the courage "}, {"type": "blank", "itemNumber": 3}, {"type": "text", "content": " sign up to play the violin. "}, {"type": "blank", "itemNumber": 4}, {"type": "text", "content": " My best friend, "}, {"type": "blank", "itemNumber": 5}, {"type": "text", "content": " plays the piano, agreed to perform with me. "}, {"type": "blank", "itemNumber": 6}, {"type": "text", "content": " We practiced almost "}, {"type": "blank", "itemNumber": 7}, {"type": "text", "content": " day after school for a month. "}, {"type": "blank", "itemNumber": 8}, {"type": "text", "content": " On the night of the show, my hands "}, {"type": "blank", "itemNumber": 9}, {"type": "text", "content": " shaking as we waited backstage. "}, {"type": "blank", "itemNumber": 10}, {"type": "text", "content": " Once the music started, though, all "}, {"type": "blank", "itemNumber": 11}, {"type": "text", "content": " nervousness disappeared. "}, {"type": "blank", "itemNumber": 12}, {"type": "text", "content": " The audience clapped "}, {"type": "blank", "itemNumber": 13}, {"type": "text", "content": " loudly when we finished. "}, {"type": "blank", "itemNumber": 14}, {"type": "text", "content": " We didn't win first place, but performing "}, {"type": "blank", "itemNumber": 15}, {"type": "text", "content": " taught me not to be afraid of trying something new."}]}, {"title": "Moving to a New House", "segments": [{"type": "text", "content": "Last month, my family "}, {"type": "blank", "itemNumber": 16}, {"type": "text", "content": " into a new house across town. "}, {"type": "blank", "itemNumber": 17}, {"type": "text", "content": " Packing up my entire room "}, {"type": "blank", "itemNumber": 18}, {"type": "text", "content": " harder than I expected. "}, {"type": "blank", "itemNumber": 19}, {"type": "text", "content": " I found old toys, photographs, "}, {"type": "blank", "itemNumber": 20}, {"type": "text", "content": " notes from friends I had forgotten about. "}, {"type": "blank", "itemNumber": 21}, {"type": "text", "content": " On moving day, the truck "}, {"type": "blank", "itemNumber": 22}, {"type": "text", "content": " arrived early in the morning. "}, {"type": "blank", "itemNumber": 23}, {"type": "text", "content": " Everyone in my family "}, {"type": "blank", "itemNumber": 24}, {"type": "text", "content": " carried boxes back and forth all day. "}, {"type": "blank", "itemNumber": 25}, {"type": "text", "content": " By evening, we "}, {"type": "blank", "itemNumber": 26}, {"type": "text", "content": " exhausted but excited to explore our new home. "}, {"type": "blank", "itemNumber": 27}, {"type": "text", "content": " My new room "}, {"type": "blank", "itemNumber": 28}, {"type": "text", "content": " bigger than my old one, with a window that looks out over the backyard. "}, {"type": "blank", "itemNumber": 29}, {"type": "text", "content": " I still miss my old neighborhood sometimes, "}, {"type": "blank", "itemNumber": 30}, {"type": "text", "content": " but this new house is starting to feel like home."}]}, {"title": "The Robotics Competition", "segments": [{"type": "text", "content": "Our robotics team "}, {"type": "blank", "itemNumber": 31}, {"type": "text", "content": " for the regional competition for three months. "}, {"type": "blank", "itemNumber": 32}, {"type": "text", "content": " Each week, we "}, {"type": "blank", "itemNumber": 33}, {"type": "text", "content": " together after school to test and improve our robot. "}, {"type": "blank", "itemNumber": 34}, {"type": "text", "content": " Two teammates, "}, {"type": "blank", "itemNumber": 35}, {"type": "text", "content": " handled most of the programming, spent hours debugging code. "}, {"type": "blank", "itemNumber": 36}, {"type": "text", "content": " The rest of us "}, {"type": "blank", "itemNumber": 37}, {"type": "text", "content": " responsible for building and testing the robot's arm. "}, {"type": "blank", "itemNumber": 38}, {"type": "text", "content": " A week before the competition, the arm "}, {"type": "blank", "itemNumber": 39}, {"type": "text", "content": " completely during a practice run. "}, {"type": "blank", "itemNumber": 40}, {"type": "text", "content": " We stayed late every night that week "}, {"type": "blank", "itemNumber": 41}, {"type": "text", "content": " rebuild it from scratch. "}, {"type": "blank", "itemNumber": 42}, {"type": "text", "content": " On competition day, our robot "}, {"type": "blank", "itemNumber": 43}, {"type": "text", "content": " every task in the first round. "}, {"type": "blank", "itemNumber": 44}, {"type": "text", "content": " We ended up placing third overall, "}, {"type": "blank", "itemNumber": 45}, {"type": "text", "content": " which felt incredible after everything we had overcome."}]}], "reading": [{"id": "RD-E3-01", "number": 1, "tier": 2, "passageTitle": "The Group Project", "question": "What is the central conflict Priya faces in this passage?", "choices": ["She argues with Ms. Okafor about the group assignments.", "She must decide how to handle a group member who initially seems unreliable.", "She competes with Naomi's group for the highest grade.", "She struggles to understand the history content of the project herself."], "letters": ["A", "B", "C", "D"], "correctIndex": 1, "explanations": ["There's no argument with Ms. Okafor in the passage.", "Correct \u2014 the passage centers on Priya navigating her assumptions about and interactions with Tyler.", "Competing with Naomi's group is never mentioned as a goal.", "Priya's struggle isn't with the content itse
