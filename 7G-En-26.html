<style id="app-styles">
/* ===== Quill & Parchment design tokens ===== */
:root {
  --bg: #F5EFE0;
  --bg-secondary: #EAE0C4;
  --ink: #2C2416;
  --ink-soft: #6B5F49;
  --gold: #A87B12;
  --gold-bg: #F3E6C0;
  --burgundy: #8B3A3A;
  --burgundy-bg: #F3E0DC;
  --teal: #2F5C5C;
  --teal-bg: #DDEBEA;
  --sage: #3F6B3F;
  --sage-bg: #E1EEDD;
  --card-bg: #FFFCF4;
  --border: #D8CBA0;
  --shadow: rgba(60, 45, 20, 0.12);
  --focus-ring: #2F5C5C;
  --font-display: 'Playfair Display', Georgia, serif;
  --font-body: 'Lora', Georgia, serif;
  --font-mono: 'JetBrains Mono', 'Courier New', monospace;
}
[data-theme="dark"] {
  --bg: #1D1A13;
  --bg-secondary: #272115;
  --ink: #EDE3C8;
  --ink-soft: #B8AC8C;
  --gold: #D9AE49;
  --gold-bg: #3A2F17;
  --burgundy: #D68A8A;
  --burgundy-bg: #3A2020;
  --teal: #7FB8B8;
  --teal-bg: #16302E;
  --sage: #8FCB8F;
  --sage-bg: #1C2E1C;
  --card-bg: #242016;
  --border: #453B28;
  --shadow: rgba(0, 0, 0, 0.35);
  --focus-ring: #7FB8B8;
}

* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 16px;
  line-height: 1.55;
  min-height: 100vh;
  transition: background 0.3s ease, color 0.3s ease;
}
#root { min-height: 100vh; position: relative; }

h1, h2, h3, h4 { font-family: var(--font-display); font-weight: 700; margin: 0 0 0.5em; color: var(--ink); }
h1 { font-size: 1.9rem; } h2 { font-size: 1.5rem; } h3 { font-size: 1.2rem; } h4 { font-size: 1.05rem; }
p { margin: 0 0 0.8em; }
button { font-family: var(--font-body); }
:focus-visible { outline: 3px solid var(--focus-ring); outline-offset: 2px; }

.app-shell { position: relative; min-height: 100vh; overflow-x: hidden; }
.app-main { position: relative; z-index: 2; max-width: 900px; margin: 0 auto; padding: 1rem 1rem 5rem; }

/* ===== Ambient background ===== */
.ambient-bg { position: fixed; inset: 0; z-index: 0; overflow: hidden; pointer-events: none; }
.ambient-bg svg { position: absolute; }
@media (prefers-reduced-motion: reduce) {
  .drift { animation: none !important; }
}
.drift { animation: driftFloat linear infinite; }
@keyframes driftFloat {
  0% { transform: translateY(0) rotate(0deg); }
  50% { transform: translateY(-18px) rotate(4deg); }
  100% { transform: translateY(0) rotate(0deg); }
}

/* ===== Buttons ===== */
.btn {
  font-family: var(--font-body);
  font-weight: 600;
  border-radius: 10px;
  border: 2px solid var(--border);
  background: var(--card-bg);
  color: var(--ink);
  padding: 0.65rem 1.1rem;
  min-height: 44px;
  min-width: 44px;
  cursor: pointer;
  font-size: 0.95rem;
  transition: transform 0.12s ease, box-shadow 0.12s ease, background 0.15s ease;
  display: inline-flex; align-items: center; justify-content: center; gap: 0.4em;
}
.btn:hover { transform: translateY(-1px); box-shadow: 0 3px 10px var(--shadow); }
.btn:active { transform: translateY(0); }
.btn-primary { background: var(--teal); border-color: var(--teal); color: #FFFDF6; }
.btn-gold { background: var(--gold); border-color: var(--gold); color: #2C2416; }
.btn-ghost { background: transparent; }
.btn-icon { padding: 0.5rem; }
.btn:disabled { opacity: 0.45; cursor: not-allowed; transform: none; box-shadow: none; }
.btn-block { width: 100%; justify-content: space-between; }

/* ===== Cards & tiles ===== */
.card {
  background: var(--card-bg);
  border: 2px solid var(--border);
  border-radius: 16px;
  padding: 1.1rem;
  box-shadow: 0 2px 8px var(--shadow);
  margin-bottom: 1rem;
}
.tile-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 0.7rem; }
.tile {
  background: var(--card-bg);
  border: 2px solid var(--border);
  border-radius: 14px;
  padding: 0.9rem;
  cursor: pointer;
  text-align: left;
  min-height: 44px;
  transition: transform 0.12s ease, box-shadow 0.12s ease;
  color: var(--ink);
  font-family: var(--font-body);
}
.tile:hover { transform: translateY(-2px); box-shadow: 0 4px 12px var(--shadow); }
.tile-title { font-family: var(--font-display); font-weight: 700; font-size: 1rem; margin-bottom: 0.3rem; }
.progress-bar-track { background: var(--bg-secondary); border-radius: 20px; height: 10px; overflow: hidden; margin-top: 0.4rem; }
.progress-bar-fill { height: 100%; background: var(--teal); border-radius: 20px; transition: width 0.5s ease; }
.progress-bar-fill.gold { background: var(--gold); }

/* ===== Header / nav ===== */
.top-bar { display: flex; align-items: center; justify-content: space-between; padding: 0.8rem 1rem; position: relative; z-index: 3; }
.top-bar-title { font-family: var(--font-display); font-weight: 700; font-size: 1.15rem; display: flex; align-items: center; gap: 0.5rem; }
.icon-btn { background: var(--card-bg); border: 2px solid var(--border); border-radius: 50%; width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; cursor: pointer; font-size: 1.1rem; }

/* ===== Mascot ===== */
.mascot-wrap { display: flex; align-items: center; gap: 0.8rem; }
.mascot-svg { width: 84px; height: 84px; flex-shrink: 0; }
.mascot-bounce { animation: mascotBob 3.5s ease-in-out infinite; }
@keyframes mascotBob { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }
.mascot-happy { animation: mascotPop 0.6s ease; }
@keyframes mascotPop { 0% { transform: scale(1) rotate(0); } 40% { transform: scale(1.15) rotate(-6deg); } 100% { transform: scale(1) rotate(0); } }
.mascot-concerned { animation: mascotTilt 0.5s ease; }
@keyframes mascotTilt { 0%,100% { transform: rotate(0); } 50% { transform: rotate(-8deg); } }
.mascot-celebrate { animation: mascotCelebrate 0.9s ease; }
@keyframes mascotCelebrate { 0% { transform: scale(1); } 30% { transform: scale(1.3) rotate(8deg); } 60% { transform: scale(1.1) rotate(-8deg); } 100% { transform: scale(1) rotate(0); } }
@media (prefers-reduced-motion: reduce) {
  .mascot-bounce, .mascot-happy, .mascot-concerned, .mascot-celebrate { animation: none !important; }
}

/* ===== Quiz / question UI ===== */
.question-card { background: var(--card-bg); border: 2px solid var(--border); border-radius: 16px; padding: 1.2rem; }
.choice-btn {
  display: block; width: 100%; text-align: left; padding: 0.8rem 1rem; margin-bottom: 0.6rem;
  border-radius: 12px; border: 2px solid var(--border); background: var(--bg); color: var(--ink);
  font-family: var(--font-body); font-size: 0.98rem; cursor: pointer; min-height: 44px;
  transition: border-color 0.15s ease, background 0.15s ease;
}
.choice-btn:hover { border-color: var(--teal); }
.choice-btn.selected { border-color: var(--teal); background: var(--teal-bg); }
.choice-btn.correct { border-color: var(--sage); background: var(--sage-bg); }
.choice-btn.incorrect { border-color: var(--burgundy); background: var(--burgundy-bg); }
.choice-letter { font-family: var(--font-mono); font-weight: 700; margin-right: 0.6rem; color: var(--teal); }
.confidence-row { display: flex; gap: 0.6rem; margin: 0.8rem 0; }
.negation { color: var(--burgundy); font-weight: 700; text-decoration: underline; }
.explanation-box { border-radius: 12px; padding: 0.8rem 1rem; margin-top: 0.7rem; font-size: 0.93rem; }
.explanation-box.correct { background: var(--sage-bg); border: 2px solid var(--sage); }
.explanation-box.incorrect { background: var(--burgundy-bg); border: 2px solid var(--burgundy); }

/* ===== Callouts (Learn mode) ===== */
.callout { border-radius: 14px; padding: 1rem 1.1rem; margin: 0.9rem 0; }
.callout-key { background: var(--gold-bg); border: 2px solid var(--gold); }
.callout-key strong { color: var(--gold); }
.callout-watch { background: var(--burgundy-bg); border: 2px solid var(--burgundy); }
.callout-watch strong { color: var(--burgundy); }
.callout h4 { margin-bottom: 0.4rem; }
.callout em { color: var(--teal); }

/* ===== Ayah embed ===== */
.ayah-card { border: 2px dashed var(--gold); border-radius: 14px; padding: 1rem; margin: 1rem 0; background: var(--card-bg); }
.ayah-frame-wrap iframe { width: 100%; min-height: 180px; border: none; border-radius: 10px; }

/* ===== Exam / timer ===== */
.timer-badge { font-family: var(--font-mono); font-weight: 700; background: var(--ink); color: var(--bg); padding: 0.4rem 0.8rem; border-radius: 10px; }
.timer-badge.low { background: var(--burgundy); }
.locked-overlay { opacity: 0.6; filter: grayscale(0.4); position: relative; }
.lock-badge { position: absolute; top: 8px; right: 8px; font-size: 1.2rem; }

/* ===== Heartbeat strip ===== */
.heartbeat-strip { display: flex; gap: 3px; align-items: flex-end; height: 24px; }
.heartbeat-dot { width: 8px; border-radius: 3px; }
.heartbeat-dot.hit { background: var(--sage); height: 100%; }
.heartbeat-dot.miss { background: var(--burgundy); height: 60%; }

/* ===== Glossary popup ===== */
.modal-backdrop { position: fixed; inset: 0; background: rgba(20,15,5,0.45); z-index: 50; display: flex; align-items: center; justify-content: center; padding: 1rem; }
.modal-box { background: var(--card-bg); border-radius: 18px; border: 2px solid var(--border); padding: 1.4rem; max-width: 420px; width: 100%; max-height: 85vh; overflow-y: auto; }

/* ===== Utility ===== */
.flex-row { display: flex; align-items: center; gap: 0.6rem; }
.flex-between { display: flex; align-items: center; justify-content: space-between; }
.muted { color: var(--ink-soft); font-size: 0.88rem; }
.mono-tag { font-family: var(--font-mono); font-size: 0.75rem; background: var(--bg-secondary); padding: 0.15rem 0.5rem; border-radius: 6px; color: var(--ink-soft); }
.badge { font-family: var(--font-mono); font-size: 0.72rem; padding: 0.2rem 0.55rem; border-radius: 20px; font-weight: 600; }
.badge-cleared { background: var(--bg-secondary); color: var(--ink-soft); }
.badge-durable { background: var(--sage-bg); color: var(--sage); }
a { color: var(--teal); }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0,0,0,0); }

@media print {
  .no-print { display: none !important; }
  body { background: white; color: black; }
  .ambient-bg { display: none; }
}

@media (max-width: 480px) {
  .app-main { padding: 0.7rem 0.7rem 5rem; }
  h1 { font-size: 1.5rem; }
  .mascot-svg { width: 64px; height: 64px; }
}

</style>

l": "R.author_purpose"}, {"id": "RD-E1-26", "number": 26, "tier": 2, "passageTitle": "Building the Brooklyn Bridge", "question": "How is the passage mainly organized?", "choices": ["By listing statistics about bridges without any narrative", "By comparing the bridge to other famous bridges around the world", "In a roughly chronological order, following the project from start to completion", "By presenting two opposing arguments about the bridge's design"], "letters": ["J", "K", "L", "M"], "correctIndex": 2, "explanations": ["The passage tells a narrative, not just a list of statistics.", "Other bridges are not discussed for comparison.", "Correct \u2014 the passage moves from the project's start in 1869 through Roebling's death, his son's illness, Emily's leadership, and the 1883 opening.", "There is no opposing-argument structure here."], "skill": "R.text_structure"}, {"id": "RD-E1-27", "number": 27, "tier": 2, "passageTitle": "Building the Brooklyn Bridge", "question": "Which idea is best supported by details across the entire passage?", "choices": ["Government officials fully supported the project from its very beginning.", "The Brooklyn Bridge was the first suspension bridge ever built.", "Large engineering projects can succeed even after unexpected setbacks and tragedy.", "Suspension bridges are always more dangerous to build than other types of bridges."], "letters": ["A", "B", "C", "D"], "correctIndex": 2, "explanations": ["The passage mentions 'skeptical members of the public' and officials Emily had to convince, showing support was not automatic.", "The passage says Roebling had 'already built several smaller suspension bridges,' so it wasn't the first ever.", "Correct \u2014 the passage shows the project overcoming multiple deaths, an illness, and public doubt to ultimately succeed.", "The passage doesn't compare suspension bridges to other bridge types in terms of danger generally."], "skill": "R.synthesis"}, {"id": "RD-E1-28", "number": 28, "tier": 2, "passageTitle": "Second Chair", "question": "What is the main conflict Marcus faces in the passage?", "choices": ["He is upset about being moved to a different seat in the clarinet section.", "He is competing directly against his sister for a spot on a team.", "He cannot decide which instrument to play next year.", "He is unsure whether to quit band altogether."], "letters": ["J", "K", "L", "M"], "correctIndex": 0, "explanations": ["Correct \u2014 the passage centers on Marcus's reaction to being moved from second row to third row in the seating chart.", "His sister's soccer story is a separate example, not direct competition with Marcus.", "There is no mention of choosing a different instrument.", "Quitting band is never mentioned as an option Marcus considers."], "skill": "R.central_idea"}, {"id": "RD-E1-29", "number": 29, "tier": 2, "passageTitle": "Second Chair", "question": "Why does Marcus feel especially frustrated about the new seating chart?", "choices": ["He believes Jenna cheated during her audition.", "He was told he would never be allowed to move up again.", "He dislikes the third row because it is farther from his friends.", "He had held the same seat for years and can't identify a mistake in his own audition."], "letters": ["A", "B", "C", "D"], "correctIndex": 3, "explanations": ["There is no suggestion of cheating in the passage.", "No one tells him this is permanent.", "Distance from friends is not mentioned as a reason for his frustration.", "Correct \u2014 the passage notes he'd sat in the same chair for three years and 'couldn't remember missing a single note,' adding to his confusion and frustration."], "skill": "R.inference"}, {"id": "RD-E1-30", "number": 30, "tier": 2, "passageTitle": "Second Chair", "question": "What does the word \"strangled\" most likely mean as used in the phrase \"each attempt sounding more strangled than the last\"?", "choices": ["tense and choked-sounding", "surprisingly quiet", "unusually loud", "confident and smooth"], islikes Marcus personally and simply wants to upset him on purpose.", "She secretly disagrees with Mr. Delgado's seating decision but won't say so.", "She is being honest and fair, even though it's not what Marcus wants to hear.", "She is secretly jealous of how much Jenna's playing has improved this year."], "letters": ["A", "B", "C", "D"], "correctIndex": 2, "explanations": ["There's no indication Priya dislikes Marcus or wants to upset him.", "The passage gives no hint that Priya disagrees with the decision.", "Correct \u2014 she calmly states a fact ('Jenna's audition was really good this year') that Marcus doesn't want to hear, showing honesty rather than unkindness.", "Nothing suggests jealousy from Priya."], "skill": "R.character_inference"}, {"id": "RD-E1-36", "number": 36, "tier": 2, "passageTitle": "Second Chair", "question": "Which theme is best supported by the events of this passage?", "choices": ["How a person responds to disappointment matters more than the disappointment itself.", "Family members should never give each other advice about personal struggles.", "Music competitions are usually unfair to younger, less experienced students overall.", "Success in music always comes from natural talent rather than practice or effort."], "letters": ["J", "K", "L", "M"], "correctIndex": 0, "explanations": ["Correct \u2014 the sister's advice and Marcus's shift by the end both emphasize that his response to the setback matters more than the setback itself.", "The passage shows the opposite \u2014 his sister's advice helps him.", "Fairness of competitions in general isn't the focus of the passage.", "The passage actually emphasizes effort and improvement over natural talent."], "skill": "R.theme"}, {"id": "RD-E1-37", "number": 37, "tier": 2, "passageTitle": "Why Leaves Change Color", "question": "What is the central idea of this passage?", "choices": ["Leaf color change is purely decorative and apparently serves absolutely no real biological purpose at all.", "Autumn leaf color changes are caused by specific biological and chemical processes tied to a tree's preparation for winter.", "All trees are believed to produce the exact same autumn pigments regardless of species.", "Scientists reportedly do not yet understand at all why leaves change color in autumn."], "letters": ["A", "B", "C", "D"], "correctIndex": 1, "explanations": ["The final paragraph explicitly states the process serves a 'practical strategy for surviving winter,' not just decoration.", "Correct \u2014 the passage explains chlorophyll loss, carotenoids, and anthocyanin production as biological processes connected to winter survival.", "The passage explicitly distinguishes between pigments unmasked (carotenoids) and pigments actively produced (anthocyanin) depending on species.", "The passage explains the process in detail, showing scientists do understand much of it, aside from some specifics about anthocyanin's exact purpose."], "skill": "R.central_idea"}, {"id": "RD-E1-38", "number": 38, "tier": 2, "passageTitle": "Why Leaves Change Color", "question": "According to the passage, why do leaves appear green during spring and summer?", "choices": ["Because trees receive less daylight during those seasons", "Because carotenoids are the dominant pigment during those seasons", "Because chlorophyll is abundant and masks other pigments", "Because anthocyanin production increases in warm weather"], "letters": ["J", "K", "L", "M"], "correctIndex": 2, "explanations": ["Trees receive more daylight, not less, during spring and summer.", "Carotenoids are present but hidden by chlorophyll during these seasons, according to the passage.", "Correct \u2014 the passage states chlorophyll 'is so abundant...that it masks other pigments.'", "Anthocyanin is produced in autumn, not during spring and summer."], "skill": "R.detail"}, {"id": "RD-E1-39", "number": 39, "tier": 2, "passageTitle": "Why Leaves Change Color", "question": "What does the word \"abundant\" most likely mean as used in the passage?", "choices": ["rare and hard to find", "chemically unstable", "recently discovered", "present in large amounts"], "letters": ["A", "B", "C", "D"], "correctIndex": 3, "explanations": ["This is the opposite of the intended meaning.", "Chemical stability isn't discussed in this context.", "The passage isn't describing a recent discovery here.", "Correct \u2014 the context describes chlorophyll as so abundant that it 'masks other pigments,' meaning it's present in large amounts."], "skill": "R.vocab_context"}, {"id": "RD-E1-40", "number": 40, "tier": 2, "passageTitle": "Why Leaves Change Color", "question": "Based on the passage, how are carotenoids different from anthocyanin?", "choices": ["Carotenoids directly cause leaves to fall off, while anthocyanin actually prevents leaves from ever falling.", "Carotenoids are already present in the leaf and simply become visible, while anthocyanin is newly produced in autumn.", "Carotenoids only appear in maple trees, while anthocyanin appears in every other tree species.", "Carotenoids are newly produced in autumn, while anthocyanin is present all year."], "letters": ["J", "K", "L", "M"], "correctIndex": 1, "explanations": ["Neither pigment is described as directly causing or preventing leaf fall; that's a separate process called abscission.", "Correct \u2014 the passage states carotenoids 'don't need to be created in autumn; they're simply unmasked,' while anthocyanin is 'a new pigment' produced in autumn.", "The passage attributes anthocyanin mainly to maples, not carotenoids.", "This reverses the actual relationship described in the passage."], "skill": "R.compare"}, {"id": "RD-E1-41", "number": 41, "tier": 2, "passageTitle": "Why Leaves Change Color", "question": "Which sentence from the passage best supports the idea that scientists are still uncertain about some aspects of leaf color change?", "choices": ["\"This process, called abscission, protects the tree...\"", "\"Every autumn, forests across much of North America transform...\"", "\"Scientists believe anthocyanin may help protect the leaf...\"", "\"Chlorophyll is so abundant in a healthy summer leaf...\""], "letters": ["A", "B", "C", "D"], "correctIndex": 2, "explanations": ["This describes a clearly explained function, not an area of uncertainty.", "This is a general, factual opening statement.", "Correct \u2014 the word 'believe' and phrase 'may help' signal that this explanation is still a hypothesis, not a confirmed fact.", "This sentence states a settled fact about chlorophyll, not an uncertainty."], "skill": "R.text_evidence"}, {"id": "RD-E1-42", "number": 42, "tier": 2, "passageTitle": "Why Leaves Change Color", "question": "What is the purpose of abscission, according to the passage?", "choices": ["To change the color of the leaves before they fall", "To attract insects that help pollinate the tree", "To prevent snow and ice from damaging branches", "To help the tree produce more chlorophyll in spring"], "letters": ["J", "K", "L", "M"], "correctIndex": 2, "explanations": ["Abscission causes leaves to fall; it doesn't change their color.", "Pollination is not discussed anywhere in the passage.", "Correct \u2014 the passage states this process 'protects the tree by preventing snow and ice from accumulating on leaves and snapping branches.'", "Abscission is about leaf release, not chlorophyll production."], "skill": "R.detail"}, {"id": "RD-E1-43", "number": 43, "tier": 2, "passageTitle": "Why Leaves Change Color", "question": "Why does the author mention that anthocyanin levels can vary from year to year?", "choices": ["To argue that the timing of autumn is unpredictable", "To prove that anthocyanin has no real biological purpose", "To show that weather conditions can influence the intensity of red coloring", "To suggest that some trees never produce anthocyanin at all"], "letters": ["A", "B", "C", "D"], "correctIndex": 2, "explanations": ["Timing of autumn itself isn't the focus of this detail.", "The passage suggests possible purposes for anthocyanin, not that it lacks one.", "Correct \u2014 the passage directly links variation in weather conditions (sunlight, temperature, rainfall) to variation in red color intensity.", "The passage says 'many maples' produce it, not that some trees never do."], "skill": "R.author_purpose"}, {"id": "RD-E1-44", "number": 44, "tier": 2, "passageTitle": "Why Leaves Change Color", "question": "How is this passage mainly structured?", "choices": ["As a set of instructions for how to press and preserve leaves", "As a step-by-step explanation of a natural process, from summer through leaf fall", "As a comparison between American and European forests", "As an argument for why one theory about leaf color is better than another"], "letters": ["J", "K", "L", "M"], "correctIndex": 1, "explanations": ["The passage is explanatory, not instructional.", "Correct \u2014 the passage moves chronologically from summer chlorophyll, through the autumn changes, to the final process of abscission.", "No comparison between regions is made.", "The passage doesn't pit competing theories against each other as its main structure."], "skill": "R.text_structure"}, {"id": "RD-E1-45", "number": 45, "tier": 2, "passageTitle": "Why Leaves Change Color", "question": "Which idea is best supported by the passage as a whole?", "choices": ["Leaf color change causes trees to grow taller the following year.", "Leaf color change is a random, unpredictable event with no clear cause.", "Leaf color change reflects a tree's practical adaptation for surviving winter.", "Leaf color change only happens in trees planted by humans."], "letters": ["A", "B", "C", "D"], "correctIndex": 2, "explanations": ["Tree height the following year is never mentioned.", "The passage describes a clear, explainable biological process, not randomness.", "Correct \u2014 the final sentence ties the entire explanation together: 'a tree's practical strategy for surviving winter.'", "The passage discusses wild forests, not only human-planted trees."], "skill": "R.synthesis"}], "readingPassages": [{"title": "The Last Piece", "genre": "literary", "text": "Dana had been staring at the same corner of the puzzle for twenty minutes. It was supposed to be a picture of a lighthouse at sunset, but right now it was just eleven hundred pieces of cardboard scattered across her grandmother's dining room table, and one piece was missing.\n\n\"You're sure it's not on the floor?\" her grandmother asked, not looking up from her knitting.\n\n\"I checked three times.\" Dana pushed her chair back and crawled under the table anyway, running her hand along the carpet. Nothing but a stray sock and a dusty marble.\n\nHer grandmother had given her the puzzle on the first day of summer vacation, back when two months alone at Grandma's house had felt like a punishment. Dana's parents were renovating their apartment, and there was, according to them, \"no place for a twelve-year-old in a house full of exposed wiring.\" So she'd been shipped off to a small town where the loudest sound was the wind chime on the porch and the closest thing to entertainment was a thousand-piece puzzle of a lighthouse.\n\nAt first, she'd worked on it out of boredom. Then, somewhere around piece four hundred, she'd started to enjoy the quiet, methodical search for a single shape among hundreds of others that looked almost the same. Her grandmother worked beside her most afternoons, not saying much, just knitting and occasionally pointing out a piece Dana had overlooked.\n\n\"Maybe it fell into your bag,\" her grandmother suggested now.\n\nDana doubted it, but she checked anyway, unzipping the backpack she'd brought from home. Deep in the bottom pocket, tangled in a phone charger she'd forgotten she owned, was a single puzzle piece. She held it up. It showed a sliver of orange sky and the very top of the lighthouse's black roof.\n\n\"Found it,\" she said, surprised at how relieved she felt.\n\nHer grandmother finally looked up. \"Well, don't just admire it. Put it in.\"\n\nDana fit the piece into the gap, and the picture was whole. The lighthouse stood tall against a fiery sky, its beam cutting through a painted dusk. She sat back and looked at it for a long moment.\n\n\"It doesn't look as good as I thought it would,\" she admitted. \"I mean, it's nice. But I thought finishing it would feel like a bigger deal.\"\n\nHer grandmother set down her knitting. \"That's because the best part wasn't finishing it. It was all the afternoons you spent looking.\" She nodded toward the window, where the real sun was beginning to set behind the hills. \"This town's the same way. It doesn't look like much from a car window. You have to sit still in it a while before you see what's actually here.\"\n\nDana thought about the last eight weeks \u2014 the wind chime, the walks to the market with her grandmother, the puzzle taking shape one afternoon at a time. She had arrived counting the days until she could go home. Now, with only a week left, she wasn't sure she wanted to.\n\n\"Can we start a new one tomorrow?\" she asked.\n\nHer grandmother smiled and picked her knitting back up. \"I was hoping you'd ask.\"", "itemNumbers": [1, 2, 3, 4, 5, 6, 7, 8, 9]}, {"title": "The Octopus's Clever Disguise", "genre": "informational", "text": "Few animals on Earth can change their appearance as quickly or as dramatically as the octopus. Within a fraction of a second, an octopus can shift its skin from smooth and pale to bumpy and deep red, blending almost perfectly into a rock, a bed of coral, or a patch of sand. Scientists have spent decades studying exactly how this remarkable transformation happens, and the answer involves a surprising combination of biology and light.\n\nThe secret lies in specialized cells called chromatophores, which are packed just beneath the surface of the octopus's skin by the millions. Each chromatophore contains a small sac of pigment surrounded by tiny muscles. When the octopus's brain sends a signal, those muscles contract, stretching the sac wide and revealing more color, or relax, shrinking the sac and hiding the color again. Because an octopus can control thousands of these cells independently and almost instantly, it can produce intricate patterns of color across its entire body in less time than it takes to blink.\n\nColor alone isn't the whole story, though. Octopuses also have a second set of cells, called iridophores and leucophores, that reflect and scatter light rather than producing pigment directly. These cells allow an octopus to add shimmering, iridescent highlights or a bright white base to its disguise, which helps it match not just the color of its surroundings but the way light bounces off them. A rock covered in algae doesn't just look green \u2014 it also reflects light in a particular way, and the octopus's skin can mimic that too.\n\nPerhaps most impressively, octopuses can also change the texture of their skin, not just its color. Small muscles beneath the skin can push it into bumps, ridges, or spikes within seconds, allowing the octopus to imitate the rough surface of coral or the knobby texture of a rock. Combined with color and light-reflecting cells, this three-part disguise system makes many octopuses nearly invisible to predators \u2014 and to the very prey they are trying to sneak up on.\n\nWhat makes this ability even more puzzling is that octopuses are colorblind. Research suggests their eyes cannot distinguish between different colors the way human eyes can. Scientists still debate exactly how a colorblind animal manages to match colors so precisely, though some researchers believe that specialized cells in the octopus's skin itself may be able to sense light, effectively allowing the octopus to \"see\" color through its skin rather than its eyes.\n\nUnderstanding this disguise system isn't just a curiosity for marine biologists. Engineers have studied octopus skin while designing new types of adaptive camouflage material, hoping to replicate, even in a small way, one of the most sophisticated disguises found anywhere in the animal kingdom.", "itemNumbers": [10, 11, 12, 13, 14, 15, 16, 17, 18]}, {"title": "Building the Brooklyn Bridge", "genre": "informational", "text": "When construction began on the Brooklyn Bridge in 1869, many engineers doubted it could be built at all. At the time, it was designed to be the longest suspension bridge in the world, stretching nearly 1,600 feet across the East River to connect the cities of Brooklyn and New York. No bridge of that size had ever been attempted using the technology and materials available in the nineteenth century, and the project would take fourteen years, cost millions of dollars, and claim the lives of more than twenty workers before its completion.\n\nThe bridge was the vision of engineer John A. Roebling, who had already built several smaller suspension bridges and believed the same basic design, cables strung between two towers to hold up a roadway, could be scaled up dramatically. Tragically, Roebling never saw his bridge completed. While surveying the location for one of the towers in 1869, his foot was crushed by a ferry, and he died of tetanus a few weeks later. Leadership of the project passed to his son, Washington Roebling, who had trained as an engineer specifically to help his father with the bridge.\n\nWashington Roebling faced his own devastating setback just a few years into construction. To build the underwater foundations for the bridge's towers, workers had to labor inside massive sealed chambers called caissons, pressurized boxes sunk to the riverbed that allowed workers to dig out mud and rock while keeping water from flooding in. The high pressure inside the caissons caused a painful and poorly understood illness that came to be called \"caisson disease,\" now known as decompression sickness. Washington Roebling himself was severely affected, leaving him partially paralyzed and largely confined to his home for the rest of the project.\n\nRemarkably, the bridge was still completed on schedule, largely due to the work of Emily Warren Roebling, Washington's wife. With no formal engineering training, Emily learned the necessary mathematics, materials science, and construction techniques so that she could relay her husband's instructions to the workers and engineers at the site. For over a decade, she effectively managed daily operations, communicated with the assistant engineers, and even represented the project before government officials and skeptical members of the public, many of whom refused to believe a woman could understand the technical details well enough to be trusted.\n\nWhen the Brooklyn Bridge finally opened on May 24, 1883, an estimated 150,300 people crossed it on the first day alone. It remains standing and in daily use more than a century later, a testament to a project that survived the death of its original designer, the disabling injury of its chief engineer, and the doubts of a public who did not expect a woman to help finish what two men had started.", "itemNumbers": [19, 20, 21, 22, 23, 24, 25, 26, 27]}, {"title": "Second Chair", "genre": "literary", "text": "Marcus had played clarinet for four years, and for three of those years, he had sat in the same chair: second from the front, right side, first clarinet section. He knew every crack in that music stand, every squeak the chair made when he shifted his weight. So when Mr. Delgado posted the new seating chart before winter concert auditions, Marcus scanned it twice before he found his name \u2014 third row, second clarinet section.\n\n\"That's got to be a mistake,\" he muttered.\n\nPriya, standing next to him, didn't look nearly as troubled. \"It's not a mistake. Jenna's audition was really good this year.\"\n\nMarcus knew Jenna had improved. Everyone in the band knew it. But knowing it and seeing his own name moved back three rows were very different things. He spent the rest of the day replaying his audition in his head, searching for the exact moment he must have messed up, though he couldn't remember missing a single note.\n\nAt home, he didn't mention the seating chart to his parents. Instead, he shut his door and ran through his audition piece twice, then a third time, each attempt sounding more strangled than the last. Frustrated, he set the clarinet down and flopped onto his bed.\n\nIt was his older sister, home from college for the weekend, who eventually knocked on his door. \"You've been in here for two hours playing the same sixteen bars. What's going on?\"\n\nHe told her, expecting sympathy. Instead, she just raised an eyebrow. \"So you got moved back a few seats. Is your part different now?\"\n\n\"No,\" he admitted. \"Same part. Same notes.\"\n\n\"So the music you're actually playing hasn't changed at all. Just where you're sitting while you play it.\"\n\nMarcus opened his mouth to argue, then closed it again. She had a point, even if he didn't love hearing it.\n\n\"Look,\" she said, sitting down on the edge of his desk, \"I got cut from varsity soccer my freshman year. Sat on JV for a whole season, and I was furious about it. But here's the thing \u2014 I spent that whole season either sulking about being on JV or actually getting better. I couldn't do both at the same time. I picked getting better a little too late, and I regretted the months I wasted being mad instead.\"\n\nMarcus picked his clarinet back up, turning it over in his hands. \"So you think I should just be fine with third row?\"\n\n\"I think you should decide what you actually want. If you want to move back up, being annoyed at Mr. Delgado for a month isn't going to do that. Playing better will.\" She shrugged. \"Or you could decide third row is genuinely fine, and just enjoy playing. Either one's a real choice. Sulking in between isn't.\"\n\nAfter she left, Marcus sat with his clarinet for a long moment before raising it to his lips. He started the audition piece again, but this time he wasn't imagining the seating chart. He was just listening to the sound.", "itemNumbers": [28, 29, 30, 31, 32, 33, 34, 35, 36]}, {"title": "Why Leaves Change Color", "genre": "informational", "text": "Every autumn, forests across much of North America transform from a uniform green into a patchwork of red, orange, yellow, and brown. For centuries, people have admired this seasonal display without necessarily understanding what causes it. The explanation turns out to involve chemistry, daylight, and a plant's yearly preparation for winter.\n\nDuring spring and summer, leaves appear green because of a pigment called chlorophyll, which plants use to absorb sunlight and convert it, along with water and carbon dioxide, into sugar through the process of photosynthesis. Chlorophyll is so abundant in a healthy summer leaf that it masks other pigments that are present in the leaf the entire time, simply hidden beneath the dominant green.\n\nAs autumn approaches and days grow shorter, trees receive a signal, primarily reduced daylight, that winter is coming. In colder regions, most trees cannot photosynthesize efficiently once temperatures drop and water in the ground begins to freeze, so many species begin to shut down leaf production for the year. As part of this process, a tree gradually stops producing chlorophyll in its leaves and begins to break down and reabsorb what remains, pulling many of the nutrients back into its branches and trunk to be stored for next spring.\n\nAs the green chlorophyll fades, other pigments that were present all along finally become visible. Carotenoids, the same class of pigment that gives carrots their orange color, produce the yellow and orange tones seen in leaves like birch and hickory. These pigments don't need to be created in autumn; they're simply unmasked once the chlorophyll disappears.\n\nRed and purple leaves involve a different, more active process. Certain trees, including many maples, actually produce a new pigment called anthocyanin in autumn, rather than simply revealing something that was already there. Scientists believe anthocyanin may help protect the leaf during the final weeks before it falls, possibly by acting like a kind of sunscreen or by helping the tree recover valuable nutrients more efficiently before winter. Interestingly, the exact shade and intensity of red can vary significantly from year to year, and even from tree to tree, depending on weather conditions such as sunlight, temperature, and rainfall in the weeks leading up to the color change.\n\nEventually, regardless of a leaf's final color, a layer of cells at the base of its stem weakens until the leaf can no longer hold on, and it falls to the ground. This process, called abscission, protects the tree by preventing snow and ice from accumulating on leaves and snapping branches under the extra weight. What looks like a purely decorative autumn display is, at its core, a tree's practical strategy for surviving winter.", "itemNumbers": [37, 38, 39, 40, 41, 42, 43, 44, 45]}]}, "2": {"vocabulary": [{"id": "VOC-E2-01", "examSet": 2, "number": 1, "tier": 2, "word": "eloquent", "sentence": "Her eloquent speech moved the entire audience to tears.", "choices": ["poorly organized", "difficult to hear", "extremely short", "well-spoken"], "letters": ["A", "B", "C", "D"], "correctIndex": 3, "explanations": ["Not quite \u2014 'poorly organized' isn't the meaning of 'eloquent' in this context.", "Not quite \u2014 'difficult to hear' isn't the meaning of 'eloquent' in this context.", "Not quite \u2014 'extremely short' isn't the meaning of 'eloquent' in this context.", "Correct \u2014 as used in this sentence, 'eloquent' means 'well-spoken.'"]}, {"id": "VOC-E2-02", "examSet": 2, "number": 2, "tier": 2, "word": "somber", "sentence": "A somber mood filled the room after the disappointing news.", "choices": ["confused", "gloomy", "excited", "cheerful"], "letters": ["J", "K", "L", "M"], "correctIndex ere.", "Present tense breaks past-tense narration.", "Correct \u2014 'seemed' (implied past tense) matches the story's past-tense narration."]}, {"id": "WE-E2-42", "number": 42, "tier": 2, "choices": ["It broke, our hearts a little.", "(leave this part exactly as written)", "It broke our hearts a little.", "it broke our hearts a little."], "letters": ["J", "K", "L", "M"], "correctIndex": 1, "explanations": ["Same missing-capital issue.", "Correct \u2014 capitalized, with no unnecessary comma.", "Missing capital letter to start sentence.", "Unnecessary comma right after 'broke.'"]}, {"id": "WE-E2-43", "number": 43, "tier": 2, "choices": ["and", "or", "but", "and"], "letters": ["A", "B", "C", "D"], "correctIndex": 3, "explanations": ["'but' would suggest a contrast that doesn't fit here.", "'NO CHANGE' already gives the correct connector.", "'or' suggests alternatives, not both actions together.", "Correct \u2014 'and' correctly connects the two things they did (gave space, let him come)."]}, {"id": "WE-E2-44", "number": 44, "tier": 2, "choices": ["hers", "it's", "his", "his"], "letters": ["J", "K", "L", "M"], "correctIndex": 2, "explanations": ["'NO CHANGE' already gives the correct possessive pronoun.", "'hers' doesn't match Biscuit, who is referred to as 'He.'", "Correct \u2014 'his' correctly matches Biscuit (referred to as 'He' earlier).", "'it's' means 'it is' and doesn't fit as a possessive here."]}, {"id": "WE-E2-45", "number": 45, "tier": 2, "choices": ["its", "his", "his", "their"], "letters": ["A", "B", "C", "D"], "correctIndex": 1, "explanations": ["'NO CHANGE' already gives the fitting pronoun.", "Correct \u2014 'his' matches Biscuit, referred to as 'He' throughout.", "'their' doesn't agree in number or match the singular 'Biscuit.'", "'its' is typically used for objects, and 'his' fits better since Biscuit has been referred to as 'He.'"]}], "writtenExpressionEssays": [{"title": "Our Class Garden Project", "segments": [{"type": "text", "content": "This year, our class "}, {"type": "blank", "itemNumber": 1}, {"type": "text", "content": " a small vegetable garden behind the school. "}, {"type": "blank", "itemNumber": 2}, {"type": "text", "content": " Everyone in the class "}, {"type": "blank", "itemNumber": 3}, {"type": "text", "content": " a job, from watering to weeding. I "}, {"type": "blank", "itemNumber": 4}, {"type": "text", "content": " in charge of the tomato plants, which turned out to be harder "}, {"type": "blank", "itemNumber": 5}, {"type": "text", "content": " I expected. "}, {"type": "blank", "itemNumber": 6}, {"type": "text", "content": " Some weeks it rained too much, and other weeks it "}, {"type": "blank", "itemNumber": 7}, {"type": "text", "content": " barely rained at all. "}, {"type": "blank", "itemNumber": 8}, {"type": "text", "content": " Our teacher, "}, {"type": "blank", "itemNumber": 9}, {"type": "text", "content": " taught us about soil, showed us how to test its pH. "}, {"type": "blank", "itemNumber": 10}, {"type": "text", "content": " By early autumn, the garden "}, {"type": "blank", "itemNumber": 11}, {"type": "text", "content": " full of ripe vegetables. "}, {"type": "blank", "itemNumber": 12}, {"type": "text", "content": " We donated most of the harvest "}, {"type": "blank", "itemNumber": 13}, {"type": "text", "content": " a local food pantry. "}, {"type": "blank", "itemNumber": 14}, {"type": "text", "content": " Working together on something real taught the whole class more "}, {"type": "blank", "itemNumber": 15}, {"type": "text", "content": " any textbook could."}]}, {"title": "A Rainy Camping Trip", "segments": [{"type": "text", "content": "My family "}, {"type": "blank", "itemNumber": 16}, {"type": "text", "content": " camping every summer, but last year's trip was different. "}, {"type": "blank", "itemNumber": 17}, {"type": "text", "content": " On our first night, dark clouds "}, {"type": "blank", "itemNumber": 18}, {"type": "text", "content": " over the mountains, and soon it started to pour. "}, {"type": "blank", "itemNumber": 19}, {"type": "text", "content": " My dad and my brother "}, {"type": "blank", "itemNumber": 20}, {"type": "text", "content": " scrambled to secure the tent stakes. "}, {"type": "blank", "itemNumber": 21}, {"type": "text", "content": " Meanwhile, my mom "}, {"type": "blank", "itemNumber": 22}, {"type": "text", "content": " everything valuable into waterproof bags. "}, {"type": "blank", "itemNumber": 23}, {"type": "text", "content": " We huddled inside the tent, listening to the rain "}, {"type": "blank", "itemNumber": 24}, {"type": "text", "content": " against the fabric. "}, {"type": "blank", "itemNumber": 25}, {"type": "text", "content": " By morning, the storm "}, {"type": "blank", "itemNumber": 26}, {"type": "text", "content": " passed, leaving everything soaked but the campsite intact. "}, {"type": "blank", "itemNumber": 27}, {"type": "text", "content": " We spent the whole next day "}, {"type": "blank", "itemNumber": 28}, {"type": "text", "content": " our gear out to dry in the sun. "}, {"type": "blank", "itemNumber": 29}, {"type": "text", "content": " Even though the trip didn't go as planned, "}, {"type": "blank", "itemNumber": 30}, {"type": "text", "content": " it became one of our favorite family stories."}]}, {"title": "Adopting Our Dog, Biscuit", "segments": [{"type": "text", "content": "Two years ago, my family "}, {"type": "blank", "itemNumber": 31}, {"type": "text", "content": " to the animal shelter to adopt a dog. "}, {"type": "blank", "itemNumber": 32}, {"type": "text", "content": " We had looked at pictures online for weeks "}, {"type": "blank", "itemNumber": 33}, {"type": "text", "content": " we finally decided to go in person. "}, {"type": "blank", "itemNumber": 34}, {"type": "text", "content": " At the shelter, dozens of dogs "}, {"type": "blank", "itemNumber": 35}, {"type": "text", "content": " barking, but one small, quiet dog in the back caught my eye. "}, {"type": "blank", "itemNumber": 36}, {"type": "text", "content": " He "}, {"type": "blank", "itemNumber": 37}, {"type": "text", "content": " gently at the front of his kennel, tail wagging. "}, {"type": "blank", "itemNumber": 38}, {"type": "text", "content": " We named him Biscuit "}, {"type": "blank", "itemNumber": 39}, {"type": "text", "content": " because of the color of his fur. "}, {"type": "blank", "itemNumber": 40}, {"type": "text", "content": " The first week at home, Biscuit "}, {"type": "blank", "itemNumber": 41}, {"type": "text", "content": " nervous and hid under the couch a lot. "}, {"type": "blank", "itemNumber": 42}, {"type": "text", "content": " We gave him space "}, {"type": "blank", "itemNumber": 43}, {"type": "text", "content": " let him come to us on his own time. "}, {"type": "blank", "itemNumber": 44}, {"type": "text", "content": " Now, Biscuit greets us at the door every single day, "}, {"type": "blank", "itemNumber": 45}, {"type": "text", "content": " tail wagging just like it did that very first day."}]}], "reading": [{"id": "RD-E2-01", "number": 1, "tier": 2, "passageTitle": "The Understudy", "question": "What is the main problem Renata faces at the beginning of the passage?", "choices": ["She refuses to help a sick castmate learn her lines.", "She must perform an unfamiliar role with almost no preparation time.", "She is removed from the play entirely due to illness.", "She forgets her own lines minutes before the show."], "letters": ["A", "B", "C", "D"], "correctIndex": 1, "explanations": ["Renata does not refuse \u2014 she has already learned the lines out of habit.", "Correct \u2014 Ava's illness forces Renata to play the queen with only forty minutes' notice.", "Renata is not removed from the play; she's asked to take on an additional role.", "She knows her own lines fine; the issue is stepping into a new role."], "skill": "R.central_idea"}, {"id": "RD-E2-02", "number": 2, "tier": 2, "passageTitle": "The Understudy", "question": "Why does Renata already know the queen's l
