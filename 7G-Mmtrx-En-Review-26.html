function buildMixedReviewSet(state) {
  // Pull items from completed modules first; if fewer than 15, top up from all modules.
  const completedItems = [];
  const otherItems = [];
  MODULES.forEach((m) => {
    const p = getModuleProgress(state, m.id);
    m.practiceItems.forEach((it) => {
      if (p.status === "complete") completedItems.push({ ...it, moduleTitle: m.title });
      else otherItems.push({ ...it, moduleTitle: m.title });
    });
  });
  const pool = completedItems.length >= 15 ? completedItems : completedItems.concat(otherItems);
  // shuffle
  const arr = [...pool];
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr.slice(0, 20);
}

        React.createElement("button", { className: "btn-primary", onClick: onExit }, "Back to plan")

  const item = items[index];
  const letters = ["A", "B", "C", "D", "E"];
  const answered = chosenIndex !== null && chosenIndex !== undefined;
  return React.createElement(
    "div", { style: { maxWidth: 780, margin: "0 auto", padding: "24px 20px 60px" } },
    React.createElement(
      "div", { className: "no-print", style: { display: "flex", justifyContent: "space-between", marginBottom: 14 } },
      React.createElement("button", { className: "btn-secondary", onClick: onExit }, "\u2190 End drill"),
      React.createElement("span", { className: "ui-font", style: { color: "var(--ink-soft)", fontSize: 13, alignSelf: "center" } }, `Question ${index + 1} of ${items.length} \u2022 ${item.moduleTitle}`)
    ),
    item.passage && React.createElement("div", { className: "card", style: { padding: "16px 18px", marginBottom: 16 } },
      React.createElement("div", { style: { whiteSpace: "pre-wrap", lineHeight: 1.7, fontSize: 14 } }, item.passage)),
    React.createElement(
      "div", { className: "card fade-in", style: { padding: "22px 24px", marginBottom: 16 } },
      React.createElement("h3", { style: { fontSize: 17, lineHeight: 1.5, whiteSpace: "pre-wrap", marginBottom: 16 } }, item.stem),
      React.createElement("div", { style: { display: "grid", gap: 10 } },
        item.choices.map((c, i) => {
          let state = "unanswered";
          if (answered) {
            if (i === chosenIndex && c.correct) state = "selected-correct";
            else if (i === chosenIndex && !c.correct) state = "selected-incorrect";
            else if (c.correct) state = "correct-reveal";
          }
          return React.createElement(PracticeChoiceButton, { key: i, text: c.text, letter: letters[i], state, disabled: answered, onClick: () => onChoose(i, c.correct) });
        })),
      answered && React.createElement(
        "div", { className: "fade-in", style: { marginTop: 16, display: "grid", gap: 8 } },
        item.choices.map((c, i) => React.createElement(
          "div", { key: i, className: "ui-font", style: { fontSize: 13, padding: "8px 12px", borderRadius: 6, background: c.correct ? "rgba(110,127,88,0.12)" : "var(--parchment-dark)", color: "var(--ink-soft)" } },
          React.createElement("strong", { style: { color: "var(--ink)" } }, letters[i] + ". "), c.explanation
        ))
      )
    ),
    answered && React.createElement(
      "div", { className: "no-print", style: { textAlign: "center" } },
      React.createElement("button", { className: "btn-primary", onClick: onNext }, index === items.length - 1 ? "See my score" : "Next question")
    )
  );
}


function App() {
  const [state, setState] = useState(makeDefaultState());
  const [loaded, setLoaded] = useState(false);
  const [saving, setSaving] = useState(false);
  const [storageWarning, setStorageWarning] = useState(false);
  const [showReminder, setShowReminder] = useState(false);
  const [lastSavedAt, setLastSavedAt] = useState(null);
  const [view, setView] = useState("dashboard");
  const [currentModuleId, setCurrentModuleId] = useState(null);
  const [currentItemIndex, setCurrentItemIndex] = useState(0);
  const [redoQueue, setRedoQueue] = useState(null); // array of item ids to redo, or null

  const [mixedItems, setMixedItems] = useState([]);
  const [mixedIndex, setMixedIndex] = useState(0);
  const [mixedChosen, setMixedChosen] = useState(null);
  const [mixedCorrect, setMixedCorrect] = useState(0);

  const stateRef = useRef(state);
  stateRef.current = state;

  useEffect(() => {
    (async () => {
      const loadedState = await loadState();
      if (loadedState) setState({ ...makeDefaultState(), ...loadedState });
      setLoaded(true);
    })();
  }, []);

  useEffect(() => {
    document.documentElement.setAttribute("data-theme", state.theme === "dark" ? "dark" : "light");
  }, [state.theme]);

  const persist = useCallback(async (nextState) => {
    setSaving(true);
    const ok = await saveState(nextState);
    setSaving(false);
    setStorageWarning(!ok);
    if (ok) setLastSavedAt(nowIso());
    return ok;
  }, []);

  const updateAndSave = useCallback((updater) => {
    setState((prev) => {
      const next = typeof updater === "function" ? updater(prev) : updater;
      persist(next);
      return next;
    });
  }, [persist]);

  // save on hide/pagehide, extra safety net
  useEffect(() => {
    const handler = () => { if (document.visibilityState === "hidden") persist(stateRef.current); };
    document.addEventListener("visibilitychange", handler);
    window.addEventListener("pagehide", handler);
    return () => {
      document.removeEventListener("visibilitychange", handler);
      window.removeEventListener("pagehide", handler);
    };
  }, [persist]);

  // frequent save reminder while actively practicing
  useEffect(() => {
    if (view !== "practice") return;
    const t = setInterval(() => setShowReminder(true), SAVE_REMINDER_INTERVAL_MS);
    return () => clearInterval(t);
  }, [view]);

  const handleToggleTheme = () => updateAndSave((prev) => ({ ...prev, theme: prev.theme === "dark" ? "light" : "dark" }));
  const handleSaveNow = () => persist(stateRef.current);

  const handleOpenModule = (moduleId) => {
    setCurrentModuleId(moduleId);
    setRedoQueue(null);
    const progress = getModuleProgress(state, moduleId);
    setView(progress.status === "not_started" ? "lesson" : "practice");
    if (progress.status !== "not_started") {
      const mod = moduleById(moduleId);
      const firstUnanswered = mod.practiceItems.findIndex((it) => !progress.answers[it.id]);
      setCurrentItemIndex(firstUnanswered === -1 ? 0 : firstUnanswered);
    } else {
      setCurrentItemIndex(0);
    }
  };

  const handleStartPractice = () => {
    updateAndSave((prev) => ({
      ...prev,
      moduleProgress: { ...prev.moduleProgress, [currentModuleId]: { ...getModuleProgress(prev, currentModuleId), status: "practicing" } },
    }));
    setCurrentItemIndex(0);
    setView("practice");
  };

  const activeModule = currentModuleId ? moduleById(currentModuleId) : null;
  const activeItems = redoQueue ? activeModule.practiceItems.filter((it) => redoQueue.includes(it.id)) : (activeModule ? activeModule.practiceItems : []);
  const activeProgress = currentModuleId ? getModuleProgress(state, currentModuleId) : null;

  const handleChoosePractice = (choiceIndex, isCorrect) => {
    const item = activeItems[currentItemIndex];
    updateAndSave((prev) => {
      const prog = getModuleProgress(prev, currentModuleId);
      return {
        ...prev,
        moduleProgress: {
          ...prev.moduleProgress,
          [currentModuleId]: { ...prog, status: "practicing", answers: { ...prog.answers, [item.id]: { chosenIndex: choiceIndex, isCorrect } } },
        },
      };
    });
  };

  const handleNextPractice = () => {
    if (currentItemIndex < activeItems.length - 1) {
      setCurrentItemIndex((i) => i + 1);
    } else {
      // finished this pass
      updateAndSave((prev) => {
        const prog = getModuleProgress(prev, currentModuleId);
        const pct = computeModulePct(activeModule, prog);
        return {
          ...prev,
          moduleProgress: { ...prev.moduleProgress, [currentModuleId]: { ...prog, status: "complete", attempts: (prog.attempts || 0) + 1, bestPct: Math.max(prog.bestPct || 0, pct) } },
        };
      });
      setView("module_complete");
    }
  };

  const handleRedoMissed = () => {
    const missed = activeModule.practiceItems.filter((it) => activeProgress.answers[it.id] && !activeProgress.answers[it.id].isCorrect).map((it) => it.id);
    // Clear the old wrong answers for just these items so the redo pass starts fresh --
    // otherwise the practice screen would show the previous wrong choice as already
    // selected (buttons disabled) and there'd be no way to actually try again.
    updateAndSave((prev) => {
      const prog = getModuleProgress(prev, currentModuleId);
      const clearedAnswers = { ...prog.answers };
      missed.forEach((id) => { delete clearedAnswers[id]; });
      return { ...prev, moduleProgress: { ...prev.moduleProgress, [currentModuleId]: { ...prog, answers: clearedAnswers } } };
    });
    setRedoQueue(missed);
    setCurrentItemIndex(0);
    setView("practice");
  };

  const handleBackToDashboard = () => {
    setCurrentModuleId(null);
    setRedoQueue(null);
    setView("dashboard");
  };

  const handleNextModuleFromComplete = () => {
    const allInOrder = MODULES;
    const idx = allInOrder.findIndex((m) => m.id === currentModuleId);
    const next = allInOrder[idx + 1];
    if (next) handleOpenModule(next.id);
    else handleBackToDashboard();
  };

  const handleOpenRulesReference = () => setView("rules_reference");
  const handlePrintRules = () => window.print();

  const handleOpenMixedReview = () => {
    const items = buildMixedReviewSet(state);
    setMixedItems(items);
    setMixedIndex(0);
    setMixedChosen(null);
    setMixedCorrect(0);
    setView("mixed_review");
  };
  const handleMixedChoose = (i, isCorrect) => {
    setMixedChosen(i);
    if (isCorrect) setMixedCorrect((c) => c + 1);
  };
  const handleMixedNext = () => {
    setMixedIndex((i) => i + 1);
    setMixedChosen(null);
  };
  const handleMixedExit = () => setView("dashboard");

  if (!loaded) {
    return React.createElement("div", { style: { display: "flex", alignItems: "center", justifyContent: "center", height: "100vh", fontFamily: "'Inter', sans-serif", color: "var(--ink-soft)" } }, "Loading\u2026");
  }

  return React.createElement(
    React.Fragment, null,
    storageWarning && React.createElement("div", { style: { position: "sticky", top: 0, zIndex: 40, padding: "10px 20px 0" } }, React.createElement(StorageWarningBanner)),
    showReminder && React.createElement(SaveReminderBanner, { onSaveNow: () => { handleSaveNow(); setShowReminder(false); }, onDismiss: () => setShowReminder(false) }),
    (() => {
      if (view === "dashboard") {
        return React.createElement(Dashboard, {
          state, saving, lastSavedAt,
          onOpenModule: handleOpenModule,
          onToggleTheme: handleToggleTheme,
          onOpenRulesReference: handleOpenRulesReference,
          onOpenMixedReview: handleOpenMixedReview,
          onSaveNow: handleSaveNow,
        });
      }
      if (view === "lesson" && activeModule) {
        return React.createElement(LessonScreen, { mod: activeModule, onStartPractice: handleStartPractice, onBackToDashboard: handleBackToDashboard });
      }
      if (view === "practice" && activeModule && activeItems.length > 0) {
        const item = activeItems[currentItemIndex];
        const existing = activeProgress.answers[item.id];
        return React.createElement(PracticeScreen, {
          mod: activeModule, item, itemIndex: currentItemIndex, totalItems: activeItems.length,
          chosenIndex: existing ? existing.chosenIndex : null,
          onChoose: handleChoosePractice, onNext: handleNextPractice,
          onSaveNow: handleSaveNow, saving, lastSavedAt, storageWarning,
          onBackToDashboard: handleBackToDashboard,
        });
      }
      if (view === "module_complete" && activeModule) {
        const idx = MODULES.findIndex((m) => m.id === currentModuleId);
        return React.createElement(ModuleCompleteScreen, {
          mod: activeModule, progress: activeProgress,
          onRedoMissed: handleRedoMissed, onBackToDashboard: handleBackToDashboard,
          onNextModule: handleNextModuleFromComplete, hasNextModule: idx < MODULES.length - 1,
        });
      }
      if (view === "rules_reference") {
        return React.createElement(RulesReferenceScreen, { onBackToDashboard: handleBackToDashboard, onPrint: handlePrintRules });
      }
      if (view === "mixed_review") {
        return React.createElement(MixedReviewScreen, {
          items: mixedItems, index: mixedIndex, chosenIndex: mixedChosen,
          onChoose: handleMixedChoose, onNext: handleMixedNext, onExit: handleMixedExit, correctCount: mixedCorrect,
        });
      }
      return React.createElement(Dashboard, {
        state, saving, lastSavedAt, onOpenModule: handleOpenModule, onToggleTheme: handleToggleTheme,
        onOpenRulesReference: handleOpenRulesReference, onOpenMixedReview: handleOpenMixedReview, onSaveNow: handleSaveNow,
      });
    })()
  );
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(React.createElement(ErrorBoundary, null, React.createElement(App)));

</script>
