    "adventure_land": {
     "title": "Adventure Land Chase",
     "text": "(1) I had been waiting for Saturday afternoon for what seemed forever. I had the date circled on the calendar in the kitchen, and my mom even let me cross off the days leading up to it. Every day when I would walk into the kitchen, I would see the date circled in a bright green marker and get even more excited.\n\n(2) Saturday was the day that Adventure Land was opening. It is the largest theme park in three states, has massive rollercoaster's that travel at super speed and loop three times, and has a full water park. But it wasn't just the grand opening of Adventure Land about which I was excited. Saturday was also my best friend Riley's birthday, and to celebrate, she was having her birthday party at Adventure Land.\n\n(3) I woke up very early Saturday morning because I could not sleep. I kept thinking about all the rides that we would go on, the games we were going to play, but more than anything, spending time with all of my friends. While I was eating my cereal, my mom packed us a large bag filled with things she said we were going to need at the theme park all day. She packed sunscreen, sunglasses, and water bottles. I didn't pay attention, because I was still too excited about the biggest rollercoaster, the Slithering Cobra. It was the one that shot up really high and had three loops. It was going to be so much fun!\n\n(4) When we first got to the park, my first thought was that it was a lot bigger than I thought it was going to be. It was huge! I could see the tops of the rollercoasters from the car in the parking lot. Inside, everything was made to look like a jungle. There were lots of different kinds of trees, both real and fake, there were long green vines draped across the park like telephone lines, and the workers were dressed up as if they were going on safari. The park was so big, and there was so much to do, but then I noticed one huge problem. There were so many people in the park. Everywhere I looked, there were more people. I was even bumped a few times while we stood at the entrance.\n\n(5) Riley's mom gave all of us wristbands and said that we had to stay with one of our friends at all times.\n\n(6) \"Have a buddy,\" she said. \"If anyone gets lost, come to the food court. We will meet at Lickin' Fried Chicken at one o'clock.\"\n\n(7) Riley was my buddy, and we immediately ran off to go ride the Slithering Cobra.\n\n(8) \"Wait up,\" Charlotte and Ryan called. \"We want to come too!\"\n\n(9) We stood in line for the ride for over half an hour. There were so many people, and more people kept coming.\n\n(10) \"I'm hot,\" Riley said.\n\n(11) \"This is boring,\" Ryan complained.\n\n(12) When we finally were at the front of the line, the gates opened, and we were allowed to take our seats. Since it was Riley's birthday, they let us ride in the front seats. The rollercoaster took off really fast and went straight into the air. It stopped at the top of the tracks, and it felt as if we were going to fall out of our seats! The rollercoaster tipped over the edge, and soon we were rushing toward the ground. Riley put her arms up, and we both started screaming. The coaster then went straight up and into the three loops. Before we knew it, we were back at the platform, and the ride was over.\n\n(13) \"That was awesome!\" Charlotte yelled.\n\n(14) \"I want to go again!\" Ryan added.\n\n(15) We looked at the line, and it had doubled since we had gotten there.\n\n(16) \"Maybe later,\" I said.\n\n(17) When we got off the ride and were walking toward the arcade, our friend Natalie came running up to us. She looked really worried.\n\n(18) \"I've lost him,\" she said. \"I lost George! I wasn't supposed to leave him, but I went to the bathroom and now I can't find him!\"\n\n(19) \"Did you go to the food court?\" Ryan asked.\n\n(20) \"Yes, and we wasn't there!\" she said.\n\n(21) I didn't know what to do. The park was so big, and there were so many people.\n\n(22) \"We will have to retrace your steps,\" Charlotte said. \"Where were you the last time you saw him?\"\n\n(23) \"In the arcade. Playing Skee Ball.\"\n\n(24) We all started running toward the arcade, which was shaped like a giant tiger.\n\n(25) \"Make sure we all stay together!\" Ryan called.\n\n(26) It was really hot, and the sun was beating down right on our faces. I probably should have thought about putting on my sunglasses, but all I could think of was George.\n\n(27) \"Who is George?\" Riley asked me while we were running.\n\n(28) \"I thought you knew!\" I said. \"I have no idea. Maybe her brother?\"\n\n(29) It felt really nice to be inside of the arcade. It looked just like a jungle, too. I kept thinking there was no way we were going to find him, but we had to try. We ran up a flight of stairs and across the room to the Skee Ball games.\n\n(30) \"There he is!\" Natalie pointed forward. We didn't see anything. She ran to one of the alleys and picked up a large stuffed monkey. It was George, the stuffed animal from our homeroom that one student has to take home every weekend and write a story about their adventures. We were bewildered.\n\n(31) \"That's the George you were talking about?\" Riley whined.\n\n(32) \"Of course. Mrs. Miller would have killed me if I lost him! But now I have a great adventure to write about!\" she said.\n\n(33) We looked at Natalie and laughed.\n\n(34) \"Let's go on another ride,\" I said, and we all started walking back into the jungle."

    "happily_never_after": {
     "title": "Happily Never After",
     "text": "(1) The tragic story of two star-crossed lovers was first brought to attention in William Shakespeare's play, Romeo and Juliet.\n\n(2) The entire plot of the play is explained in the prologue. It is stated that there are two households of equal status in Verona, Italy. There is an ancient feud between the two families that has progressed into the younger generations, meaning the fight between the parents has now become the fight between the parents' children. The narrator continues, saying, \"A pair of star-crossed lovers take their life\" and in doing so, end their parents' feud. Romeo and Juliet, a child of each household, fall in love, but cannot live happily together because of the feud. The feud is ended, but it is an act that only the death of these children could make happen.\n\n(3) The majority of stories that audiences enjoy have a happy ending. From childhood, people have grown up with the expectation of an ending that comes with the phrase, \"And they lived happily ever after.\" It is interesting that the story of Romeo and Juliet, a famous tragedy, has extreme popularity and interest among both storytellers and audiences. This raises the question of fascination with tragedy.\n\n(4) In the last act of the play, Juliet has faked her death to escape marriage to another man. A message is supposed to be sent to Romeo explaining that she is alive with a plan for their escape. The message, however, does not reach Romeo. In his despair that he has lost his love, he comes to Juliet's side, drinks poison, and dies. Moments later, Juliet wakes up to find Romeo dead. In her grief, she takes his dagger and kills herself.\n\n(5) Within the prologue, the first moments of the play, the audience is told that the main characters die. It is an interesting way of storytelling. The plot has been ruined, and there is no suspense. The audience is told that Romeo and Juliet die, and in doing so, end their parents' feud. The audience, however, remains, and watches the events take place, even though they know the ending and that it will not be happy.\n\n(6) It is therefore logical to assume that audiences want to believe that a story will end happily, even though they are given evidence that it will not. Audiences will watch the entire play, hoping that something will be done so that the lovers can be saved. And yet, as the prologue stated, the message is not delivered, and the only way that Romeo and Juliet can be together is in death. Their deaths had to take place before the ancient feud would end.\n\n(7) The theme of tragic love has been repeated throughout literary history, although perhaps not brought to the extreme of Romeo and Juliet. Although audiences enjoy stories with a happy ending, the popularity of tragic themes proves that audiences also enjoy stories that do not end happily. It is the hope for happiness that gives tragedies strength, and the hope that things will end differently."
    },

     "title": "The Window",
     "text": "Rain spilled like rivers\u2014\nthe wind whispered\nagainst the window.\nSteam rose from the cup\nin swirls;\nwhite against the darkness.\nNestled in the warmth\nof blankets and tea,\nMother listened to the sounds\nknocking outside the window."

    "musically_inclined": {
     "title": "Musically Inclined",
     "text": "(1) Gibson thought, at least, that it could have been worse. His parents could have named him Fender, given him the middle name Les Paul, or worse yet, Stratocaster. This was a small comfort to him as he reminded himself that he really never had a chance. It was not he who chose the music. He was born into it, and even named after one of the most famous guitars. It was like the music had found him.\n\n(2) Gibson could not remember a time when he did not know how to play music. His mother was a singer when she was younger, and his father played the lead guitar in the band Mookie Harper. Growing up, he learned to read music at the same time he learned to read words. Music felt as natural to him as walking and was a big part of his life.\n\n(3) There were many instruments in Gibson's house, and over the years, he had learned how to play most of them. He started with a piano when he was very young, moved to the harmonica and drums when he was a bit older, and had just begun learning how to play the violin. But Gibson's favorite instrument was the one he had been playing the longest: his father's Gibson Les Paul guitar.\n\n(4) At school, Gibson felt lonely most days. His family had just moved from Seattle, and the other kids at school thought it was weird that he carried a violin case to school for his fourth period music class. At his old school, he was in the school band, and had a lot of friends who enjoyed playing music with him.\n\n(5) \"Why would you play the violin?\" Joe asked as he snickered in his chair. \"Only girls play that. I bet it was the only thing you could learn,\" he laughed. The rest of the class laughed behind him.\n\n(6) Gibson sat in his chair and rolled his eyes. He thought that this kid obviously didn't know anything about music, because the violin was one of the most challenging instruments to learn. He left the case on the floor by his chair and waited for his second period history class to begin.\n\n(7) The teacher walked into the classroom pushing a cart. Gibson immediately sat up in his chair. He knew exactly what was in the cases and smiled.\n\n(8) \"I was able to borrow these from the music section of the museum to show you today,\" Ms. Conway said. \"Can anyone tell me what these are?\" she asked.\n\n(9) \"They are guitars, Ms. Conway. Duh,\" Joe, a boy in the back of the room, said. The class laughed.\n\n(10) Ms. Conway squinted her eyes at Joe. \"He is half right,\" she said. \"These are in fact guitars. But can anyone tell me what kind of guitars they are?\" She looked around the room. Everyone sat still.\n\n(11) \"The one on the right is a 1958 Gibson Les Paul,\" Gibson said out of the silence. \"And the one of the left is a vintage Fender Stratocaster from 1954. Oh, and they are electric guitars,\" he said.\n\n(12) The class looked at Gibson and stared in silence. Ms. Conway clapped her hands together. \"Wow! You're right, Gibson. Great job!\"\n\n(13) \"How'd you know that?\" a girl asked behind him.\n\n(14) \"My dad has both of them,\" he said. \"And I've been playing them since I was little.\"\n\n(15) \"You can play the guitar?\" Joe laughed. \"Yeah right! You play the violin!\" He looked around, but no one else was laughing.\n\n(16) \"Would you like to play something?\" Ms. Conway asked. Gibson looked down at his feet. He didn't know what to say. He just wanted to stay in his seat and have no one look at him.\n\n(17) But then he thought of his dad and smiled. \"I'll play the Les Paul,\" he said. \"It's my favorite.\"\n\n(18) He walked toward the front of the class and picked up the guitar. He played the opening notes of \"Gone into the Sun.\" It was his favorite Mookie Harper song. All of the children sat in awe as they watched him play, and when he was done, they all started clapping and cheering.\n\n(19) \"Maybe I'll start playing the violin,\" the boy next to him said. \"If it will get me to play a guitar like that!\""
    },
    "inventions_of_technology": {
     "title": "The Inventions of Technology",
     "subtitle": "An essay Timmy has written on why he feels books will soon be a thing of the past",
     "text": "(1) Stories have been a part of the world since the beginning of recorded time. For centuries before the invention of the printing press, stories of the world were passed down to generations through oral tradition. With the invention of the printing press, which made written material available to wide ranges of audiences, books were mass-produced and introduced into greater society.\n\n(2) For the last several centuries, books have been at the forefront of education and entertainment. With the invention of the Internet, reliance on books for information quickly changed. Soon, almost everything that anyone needed to know could be accessed through the Internet. Large, printed volumes of encyclopedias became unnecessary as all of the information was easily available on the Internet.\n\n(3) Despite the progression of the Internet, printed media was still very popular in the forms of both fiction and non-fiction books. While waiting for an appointment, enduring a several-hour flight, or relaxing before sleep, books have been a reliable and convenient source of entertainment, and one that society has not been willing to give up.\n\n(4) With the progression and extreme convenience of technology, printed books are going to soon become a thing of the past. Inventions such as the iPad from Macintosh and the Kindle have made the need for any kind of printed media unnecessary. With a rechargeable battery, a large screen, and the ability to have several books saved on file, electronic options will soon take over and society will no longer see printed books.\n\n(5) Although some people may say that the act of reading is not complete without turning a page, sliding a finger across the screen or pressing a button to read more onto the next page is just as satisfying to the reader. The iPad and Kindle are devices that have qualities similar to a computer and can be used for so much more than just reading. These devices are therefore better than books because they have multiple uses.\n\n(6) In a cultural society that is part of the world and due to a longstanding tradition, stories will always be an important way to communicate ideas and provide information and entertainment. Centuries ago, stories could only be remembered and retold through speech. Printed media changed the way the world communicated and was connected, and now, as we move forward with technology, it is only a matter of time before we must say goodbye to the printed past and welcome the digital and electronic future."
    }

// SectionTimer ticks entirely on its own local state, once per second. It does
// NOT touch the parent app's state on every tick -- it only calls onTick (a cheap
// ref update, no re-render) each second, and onExpire once when time runs out.
// This means the heavy stuff around it (passage text, answer choices) never has
// to re-render just because the clock moved -- which is what makes the whole
// screen stay responsive to taps for the full length of a section.
function SectionTimer({ sectionId, initialSeconds, onTick, onExpire }) {
  const [displaySeconds, setDisplaySeconds] = useState(initialSeconds);
  const secondsRef = useRef(initialSeconds);
  const expiredRef = useRef(false);
  const onTickRef = useRef(onTick);
  const onExpireRef = useRef(onExpire);
  onTickRef.current = onTick;
  onExpireRef.current = onExpire;

  useEffect(() => {
    secondsRef.current = initialSeconds;
    expiredRef.current = false;
    setDisplaySeconds(initialSeconds);
    const interval = setInterval(() => {
      if (expiredRef.current) return;
      const next = Math.max(0, secondsRef.current - 1);
      secondsRef.current = next;
      setDisplaySeconds(next);
      onTickRef.current(sectionId, next);
      if (next <= 0 && !expiredRef.current) {
        expiredRef.current = true;
        onExpireRef.current();
      }
    }, 1000);
    return () => clearInterval(interval);
    // Intentionally only re-run when moving to a NEW section, not on every
    // parent re-render -- that's what keeps this isolated.
  }, [sectionId]);

  const low = displaySeconds <= 60;
  return React.createElement(
    "span",
    { style: { display: "flex", alignItems: "center", gap: 6, fontWeight: 700, color: low ? "var(--error-soft)" : "var(--ink)", fontVariantNumeric: "tabular-nums" }, "aria-live": "polite" },
    React.createElement(Icon, { name: "clock", size: 16 }),
    formatTime(displaySeconds)
  );
}

function computeResults(inProgress) {
  const sectionResults = SECTIONS.map((section) => {
    let correct = 0;
    const items = section.questions.map((q) => {
      const a = inProgress.answers[q.id];
      const isCorrect = a ? a.isCorrect : false;
      if (isCorrect) correct++;
      const passage = q.passageId ? section.passages[q.passageId] : null;
      const correctChoice = q.choices.find((c) => c.correct);
      const studentChoice = a ? q.choices[a.chosenOriginalIndex] : null;
      return {
        id: q.id,
        stem: q.stem,
        passageTitle: passage ? passage.title : null,
        tier: "Tier 3 \u2014 textbook/curriculum-sourced item",
        answered: !!a,
        studentAnswerText: studentChoice ? studentChoice.text : null,
        correctAnswerText: correctChoice ? correctChoice.text : null,
        isCorrect,
        flagged: !!(inProgress.flags && inProgress.flags[q.id]),
        choices: q.choices.map((c, idx) => ({
          text: c.text,
          correct: c.correct,
          chosenByStudent: !!a && a.chosenOriginalIndex === idx,
          explanation: c.explanation,
        })),
      };
    });
    return {
      id: section.id,
      title: section.title,
      correct,
      total: section.questions.length,
      pct: Math.round((correct / section.questions.length) * 100),
      items,
    };
  });
  const totalCorrect = sectionResults.reduce((s, r) => s + r.correct, 0);
  const totalItems = sectionResults.reduce((s, r) => s + r.total, 0);
  return {
    sectionResults,
    totalCorrect,
    totalItems,
    actualScorePct: Math.round((totalCorrect / totalItems) * 100),
  };
}

function downloadJson(obj, filename) {
  const blob = new Blob([JSON.stringify(obj, null, 2)], { type: "application/json" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

  );
}


function App() {
  const [state, setState] = useState(makeDefaultState());
  const [loaded, setLoaded] = useState(false);
  const [saving, setSaving] = useState(false);
  const [storageWarning, setStorageWarning] = useState(false);
  const [showReminder, setShowReminder] = useState(false);
  const [lastSavedAt, setLastSavedAt] = useState(null);
  const [view, setView] = useState("home"); // home | section_intro | in_section | section_complete | results
  const stateRef = useRef(state);
  stateRef.current = state;
  // Always-fresh, per-section seconds-remaining, updated every tick by the isolated
  // SectionTimer component WITHOUT triggering a re-render of the whole app. This is
  // what makes the countdown cheap: only a tiny clock component re-renders every
  // second, not the passage text or the answer buttons.
  const timerRef = useRef({});

  const withLatestTimer = useCallback((s) => {
    if (!s.inProgress) return s;
    return {
      ...s,
      inProgress: { ...s.inProgress, sectionTimeRemainingSec: { ...s.inProgress.sectionTimeRemainingSec, ...timerRef.current } },
    };
  }, []);

  // ---- initial load ----
  useEffect(() => {
    (async () => {
      const loadedState = await loadState();
      if (loadedState) {
        setState({ ...makeDefaultState(), ...loadedState });
      }
      setLoaded(true);
    })();
  }, []);

  // ---- theme application ----
  useEffect(() => {
    document.documentElement.setAttribute("data-theme", state.theme === "dark" ? "dark" : "light");
  }, [state.theme]);

  const persist = useCallback(async (nextState) => {
    const toSave = withLatestTimer(nextState);
    setSaving(true);
    const ok = await saveState(toSave);
    setSaving(false);
    setStorageWarning(!ok);
    if (ok) setLastSavedAt(nowIso());
    return ok;
  }, [withLatestTimer]);

  const updateAndSave = useCallback((updater) => {
    setState((prev) => {
      const merged = withLatestTimer(prev);
      const next = typeof updater === "function" ? updater(merged) : updater;
      persist(next);
      return next;
    });
  }, [persist, withLatestTimer]);

  // safeHandler: any interaction handler that throws should never leave the app
  // stuck with no working buttons. It logs, shows a small recoverable warning, and
  // lets the person keep interacting rather than silently eating the click.
  const safeHandler = useCallback((fn) => {
    return (...args) => {
      try {
        return fn(...args);
      } catch (err) {
        console.error("Action failed:", err);
        setStorageWarning(true);
        setTimeout(() => setStorageWarning(false), 4000);
      }
    };
  }, []);

  // Guards against a double-tap (common on a slightly laggy screen) firing a
  // navigation action twice and skipping a question. Only one navigation action
  // is allowed through per short window, app-wide.
  const navLockRef = useRef(false);
  const withNavLock = useCallback((fn) => {
    return (...args) => {
      if (navLockRef.current) return;
      navLockRef.current = true;
      try {
        fn(...args);
      } finally {
        setTimeout(() => { navLockRef.current = false; }, 300);
      }
    };
  }, []);

  // ---- save when tab is hidden or the page is about to unload (extra safety net beyond per-answer autosave) ----
  useEffect(() => {
    const handler = () => {
      if (document.visibilityState === "hidden") persist(withLatestTimer(stateRef.current));
    };
    document.addEventListener("visibilitychange", handler);
    window.addEventListener("pagehide", handler);
    return () => {
      document.removeEventListener("visibilitychange", handler);
      window.removeEventListener("pagehide", handler);
    };
  }, [persist, withLatestTimer]);

  // ---- 15-minute save reminder (skips during final minute of a section) ----
  useEffect(() => {
    if (view !== "in_section") return;
    const t = setInterval(() => {
      const s = stateRef.current;
      const sec = SECTIONS[s.inProgress ? s.inProgress.currentSectionIndex : 0];
      const remaining = timerRef.current[sec.id] ?? (s.inProgress ? s.inProgress.sectionTimeRemainingSec[sec.id] : 999);
      if (remaining > 60) setShowReminder(true);
    }, SAVE_REMINDER_INTERVAL_MS);
    return () => clearInterval(t);
  }, [view]);

  // ================= Handlers =================
  const handleStart = () => {
    const inProgress = makeNewInProgress();
    updateAndSave((prev) => ({ ...prev, inProgress }));
    setView("section_intro");
  };
  const handleResume = () => {
    const sec = SECTIONS[state.inProgress.currentSectionIndex];
    if (state.inProgress.sectionStatus[sec.id] === "not_started") setView("section_intro");
    else setView("in_section");
  };
  const handleStartOver = () => {
    if (!window.confirm("This clears your current progress on this attempt. Start over?")) return;
    const inProgress = makeNewInProgress();
    updateAndSave((prev) => ({ ...prev, inProgress, predictedScorePct: null }));
    setView("home");
  };
  const handleSetPrediction = (v) => {
    updateAndSave((prev) => ({ ...prev, predictedScorePct: v }));
  };
  const handleToggleTheme = () => updateAndSave((prev) => ({ ...prev, theme: prev.theme === "dark" ? "light" : "dark" }));
  const handleToggleMute = () => updateAndSave((prev) => ({ ...prev, muted: !prev.muted }));
  const handleSaveNow = () => persist(stateRef.current);

  const beginSection = () => {
    const sec = SECTIONS[state.inProgress.currentSectionIndex];
    timerRef.current[sec.id] = state.inProgress.sectionTimeRemainingSec[sec.id];
    updateAndSave((prev) => ({
      ...prev,
      inProgress: { ...prev.inProgress, sectionStatus: { ...prev.inProgress.sectionStatus, [sec.id]: "active" }, currentQuestionIndex: 0 },
    }));
    setView("in_section");
  };

  const chooseAnswer = (shuffledIdx, originalIdx) => {
    const sec = SECTIONS[state.inProgress.currentSectionIndex];
    const q = sec.questions[state.inProgress.currentQuestionIndex];
    const isCorrect = q.choices[originalIdx].correct;
    updateAndSave((prev) => ({
      ...prev,
      inProgress: {
        ...prev.inProgress,
        answers: { ...prev.inProgress.answers, [q.id]: { chosenOriginalIndex: originalIdx, isCorrect, timestamp: nowIso() } },
      },
    }));
  };

  const goNext = () => {
    const sec = SECTIONS[state.inProgress.currentSectionIndex];
    const isLastQ = state.inProgress.currentQuestionIndex === sec.questions.length - 1;
    if (isLastQ) {
      finishSection();
    } else {
      updateAndSave((prev) => ({ ...prev, inProgress: { ...prev.inProgress, currentQuestionIndex: prev.inProgress.currentQuestionIndex + 1 } }));
    }
  };
  const goPrev = () => {
    updateAndSave((prev) => ({ ...prev, inProgress: { ...prev.inProgress, currentQuestionIndex: Math.max(0, prev.inProgress.currentQuestionIndex - 1) } }));
  };
  const toggleFlag = () => {
    const sec = SECTIONS[state.inProgress.currentSectionIndex];
    const q = sec.questions[state.inProgress.currentQuestionIndex];
    updateAndSave((prev) => ({
      ...prev,
      inProgress: { ...prev.inProgress, flags: { ...prev.inProgress.flags, [q.id]: !prev.inProgress.flags[q.id] } },
    }));
  };

  const finishSection = () => {
    const sec = SECTIONS[stateRef.current.inProgress.currentSectionIndex];
    updateAndSave((prev) => ({
      ...prev,
      inProgress: { ...prev.inProgress, sectionStatus: { ...prev.inProgress.sectionStatus, [sec.id]: "complete" } },
    }));
    setView("section_complete");
  };

  // Called by the isolated SectionTimer every second. This ONLY updates a ref --
  // it deliberately does not call setState, so the passage text and answer
  // buttons never re-render just because a second ticked by.
  const handleTimerTick = useCallback((sectionId, seconds) => {
    timerRef.current[sectionId] = seconds;
  }, []);

  const handleTimerExpire = useCallback(() => {
    finishSection();
  }, []);

  const handleFinishSectionEarlyClick = () => {
    const sec = SECTIONS[stateRef.current.inProgress.currentSectionIndex];
    const answeredCount = sec.questions.filter((q) => stateRef.current.inProgress.answers[q.id]).length;
    const remaining = sec.questions.length - answeredCount;
    if (remaining > 0 && !window.confirm(`You still have ${remaining} unanswered question${remaining === 1 ? "" : "s"} in this section. Finish anyway?`)) {
      return;
    }
    finishSection();
  };

  const continueAfterSection = () => {
    const isLast = state.inProgress.currentSectionIndex === SECTIONS.length - 1;
    if (isLast) {
      const results = computeResults(state.inProgress);
      updateAndSave((prev) => ({ ...prev, lastResult: { ...results, completedAt: nowIso(), predictedScorePct: prev.predictedScorePct }, inProgress: { ...prev.inProgress, finishedAt: nowIso() } }));
      setView("results");
    } else {
      const nextSec = SECTIONS[state.inProgress.currentSectionIndex + 1];
      timerRef.current[nextSec.id] = state.inProgress.sectionTimeRemainingSec[nextSec.id];
      updateAndSave((prev) => ({ ...prev, inProgress: { ...prev.inProgress, currentSectionIndex: prev.inProgress.currentSectionIndex + 1, currentQuestionIndex: 0 } }));
      setView("section_intro");
    }
  };

  const handleExport = () => {
    const results = computeResults(state.inProgress || { answers: {}, flags: {} });
    const payload = buildExportPayload(state, results);
    downloadJson(payload, `saarah_ela_language_practice_results_${new Date().toISOString().slice(0, 10)}.json`);
  };
  const handlePrint = () => window.print();
  const handleRestartAfterResults = () => {
    updateAndSave((prev) => ({ ...prev, inProgress: null, predictedScorePct: null }));
    setView("home");
  };

  if (!loaded) {
    return React.createElement("div", { style: { display: "flex", alignItems: "center", justifyContent: "center", height: "100vh", fontFamily: "'Inter', sans-serif", color: "var(--ink-soft)" } }, "Loading\u2026");
  }

  return React.createElement(
    React.Fragment,
    null,
    storageWarning && React.createElement(
      "div",
      { style: { position: "sticky", top: 0, zIndex: 40, padding: "10px 20px 0" } },
      React.createElement(StorageWarningBanner)
    ),
    renderView()
  );

  // ---- routing ----
  function renderView() {
  if (view === "home" || !state.inProgress) {
    return React.createElement(HomeScreen, {
      state, saving, storageWarning,
      onStart: handleStart,
      onResume: handleResume,
      onStartOver: handleStartOver,
      onSetPrediction: handleSetPrediction,
      onToggleTheme: handleToggleTheme,
      onToggleMute: handleToggleMute,
      onSaveNow: handleSaveNow,
    });
  }

  if (view === "results" && state.lastResult) {
    return React.createElement(ResultsScreen, {
      state, results: state.lastResult,
      onExport: handleExport, onPrint: handlePrint, onRestart: handleRestartAfterResults,
    });
  }

  const currentSection = SECTIONS[state.inProgress.currentSectionIndex];

  if (view === "section_intro") {
    return React.createElement(SectionIntroScreen, { section: currentSection, isFirst: state.inProgress.currentSectionIndex === 0, onBegin: safeHandler(withNavLock(beginSection)) });
  }

  if (view === "section_complete") {
    const answeredCount = currentSection.questions.filter((q) => state.inProgress.answers[q.id]).length;
    return React.createElement(SectionCompleteScreen, {
      section: currentSection, answeredCount, totalCount: currentSection.questions.length,
      isLastSection: state.inProgress.currentSectionIndex === SECTIONS.length - 1,
      onContinue: safeHandler(withNavLock(continueAfterSection)),
    });
  }

  // in_section
  const qIdx = state.inProgress.currentQuestionIndex;
  const question = currentSection.questions[qIdx];
  const existingAnswer = state.inProgress.answers[question.id];
  const shuffleOrder = seededShuffleIndices(question.choices.length, question.id);
  const chosenShuffledIndex = existingAnswer ? shuffleOrder.indexOf(existingAnswer.chosenOriginalIndex) : null;

  return React.createElement(
    React.Fragment,
    null,
    showReminder && React.createElement(SaveReminderBanner, { onSaveNow: () => { handleSaveNow(); setShowReminder(false); }, onDismiss: () => setShowReminder(false) }),
    React.createElement(QuestionScreen, {
      section: currentSection,
      question,
      questionIndexInSection: qIdx,
      totalInSection: currentSection.questions.length,
      chosenShuffledIndex,
      onChoose: safeHandler(chooseAnswer),
      onNext: safeHandler(withNavLock(goNext)),
      onPrev: safeHandler(withNavLock(goPrev)),
      onFlag: safeHandler(toggleFlag),
      flagged: !!state.inProgress.flags[question.id],
      initialTimeRemainingSec: state.inProgress.sectionTimeRemainingSec[currentSection.id],
      onTimerTick: handleTimerTick,
      onTimerExpire: safeHandler(handleTimerExpire),
      onSaveNow: handleSaveNow,
      saving,
      lastSavedAt,
      storageWarning,
      onFinishSectionEarly: safeHandler(withNavLock(handleFinishSectionEarlyClick)),
    })
  );
  } // end renderView
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(React.createElement(ErrorBoundary, null, React.createElement(App)));

</script>
</body>
</html>
