<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Saarah's US History I Power-Up — Grade 7 Social Studies</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bungee&family=Rubik:ital,wght@0,500;0,700;0,900;1,700;1,900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ===================== THEME TOKENS ===================== */
:root{
  --bg:#0b0f21; --bg2:#141b38; --panel:#1b2447; --panel2:#222c54;
  --ink:#f4f6ff; --muted:#a4addd; --line:#324086;
  --accent:#3d5bff; --accent2:#ffcf3a; --danger:#ff4d6a; --success:#33e0a6; --trap:#ff9f43;
  --shadow: 0 10px 30px rgba(5,8,25,.45);
}
[data-theme="light"]{
  --bg:#fbf7ec; --bg2:#f3ecda; --panel:#ffffff; --panel2:#fff7e6;
  --ink:#1c2036; --muted:#5c5f7c; --line:#e4d9b8;
  --accent:#2542e8; --accent2:#e0a400; --danger:#e0334f; --success:#12a97e; --trap:#d9720a;
  --shadow: 0 8px 22px rgba(120,100,40,.12);
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:
    radial-gradient(1200px 600px at 15% -10%, color-mix(in srgb, var(--accent) 20%, transparent), transparent),
    radial-gradient(900px 500px at 110% 10%, color-mix(in srgb, var(--accent2) 16%, transparent), transparent),
    var(--bg);
  color:var(--ink);
  font-family:'Inter',system-ui,sans-serif;
  min-height:100vh;
  transition:background .3s,color .3s;
}
#app{max-width:1000px;margin:0 auto;padding:18px 16px 60px;}
h1,h2,h3{font-family:'Rubik',sans-serif;margin:0;}
.display{font-family:'Bungee',cursive;letter-spacing:.5px;}
.italic-slant{font-style:italic;transform:skewX(-3deg);display:inline-block;}
button{font-family:'Inter',sans-serif;cursor:pointer;}
a{color:var(--accent2);}
::selection{background:var(--accent2);color:#161616;}

/* speed lines signature element */
.speedwrap{position:relative;overflow:hidden;border-radius:18px;}
.speedlines{
  position:absolute;inset:0;z-index:0;opacity:.5;
  background:repeating-linear-gradient(100deg,
    color-mix(in srgb, var(--accent2) 55%, transparent) 0px,
    color-mix(in srgb, var(--accent2) 55%, transparent) 3px,
    transparent 3px, transparent 34px);
  mask-image:linear-gradient(120deg, black, transparent 60%);
  pointer-events:none;
}

/* panels — angular manga-panel corners, not rounded-default */
.panel{
  background:var(--panel);
  border:1px solid var(--line);
  padding:18px;
  position:relative;
  clip-path:polygon(0 10px,10px 0,100% 0,100% calc(100% - 10px),calc(100% - 10px) 100%,0 100%);
  box-shadow:var(--shadow);
}
.panel.tight{padding:14px;}
.grid{display:grid;gap:14px;}
.grid.cols-2{grid-template-columns:1fr 1fr;}
.grid.cols-3{grid-template-columns:repeat(3,1fr);}
@media(max-width:720px){.grid.cols-2,.grid.cols-3{grid-template-columns:1fr;}}

/* buttons — chunky beveled */
.btn{
  border:none;border-radius:10px;padding:12px 18px;font-weight:700;font-size:14.5px;
  color:#0b0f21;background:var(--accent2);
  box-shadow:0 4px 0 color-mix(in srgb, var(--accent2) 60%, black 30%);
  transition:transform .08s, box-shadow .08s;
  min-height:44px;
}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 color-mix(in srgb, var(--accent2) 60%, black 30%);}
.btn.primary{background:var(--accent);color:#fff;box-shadow:0 4px 0 #1c2c9e;}
.btn.primary:active{box-shadow:0 1px 0 #1c2c9e;}
.btn.ghost{background:transparent;color:var(--ink);border:2px solid var(--line);box-shadow:none;}
.btn.danger{background:var(--danger);color:#fff;box-shadow:0 4px 0 #a3122b;}
.btn.sm{padding:8px 12px;font-size:13px;min-height:36px;}
.btn:disabled{opacity:.45;cursor:not-allowed;}
.btn-row{display:flex;gap:10px;flex-wrap:wrap;}
.icon-btn{
  width:44px;height:44px;border-radius:10px;border:2px solid var(--line);background:var(--panel2);
  display:inline-flex;align-items:center;justify-content:center;color:var(--ink);
}

/* lightning-bolt style meter */
.boltmeter{position:relative;height:26px;background:var(--panel2);border:1px solid var(--line);
  clip-path:polygon(0 0,100% 0,100% 70%,94% 70%,94% 100%,88% 100%,88% 70%,0 70%);
  overflow:hidden;}
.boltmeter-fill{
  height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));
  transition:width .6s cubic-bezier(.2,.9,.3,1.2);
}
.boltmeter-label{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  font-size:11.5px;font-weight:700;color:var(--ink);z-index:2;}

.badge{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:700;
  padding:3px 9px;border-radius:999px;background:var(--panel2);border:1px solid var(--line);color:var(--muted);}
.badge.gold{background:color-mix(in srgb, var(--accent2) 22%, var(--panel2));color:var(--accent2);border-color:var(--accent2);}
.badge.blue{background:color-mix(in srgb, var(--accent) 22%, var(--panel2));color:var(--accent);border-color:var(--accent);}
.badge.green{background:color-mix(in srgb, var(--success) 22%, var(--panel2));color:var(--success);border-color:var(--success);}
.badge.red{background:color-mix(in srgb, var(--danger) 22%, var(--panel2));color:var(--danger);border-color:var(--danger);}

.muted{color:var(--muted);}
.small{font-size:12.5px;}
.center{text-align:center;}
.row{display:flex;align-items:center;gap:10px;}
.row.between{justify-content:space-between;}
.row.wrap{flex-wrap:wrap;}
.mt8{margin-top:8px;}.mt12{margin-top:12px;}.mt16{margin-top:16px;}.mt20{margin-top:20px;}
.mb8{margin-bottom:8px;}.mb12{margin-bottom:12px;}.mb16{margin-bottom:16px;}
.clickable{cursor:pointer;}
.clickable:hover{filter:brightness(1.08);}
input[type=text], input[type=number], select{
  background:var(--panel2);border:1px solid var(--line);color:var(--ink);border-radius:8px;
  padding:10px 12px;font-size:14px;font-family:inherit;min-height:44px;
}
input[type=range]{accent-color:var(--accent);}
.card-tile{
  background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:14px;
  cursor:pointer;transition:transform .12s,border-color .12s;
}
.card-tile:hover{transform:translateY(-2px);border-color:var(--accent2);}
.topnav{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px;}
.topnav button{font-size:12.5px;padding:8px 12px;}
.topnav button.active{background:var(--accent);color:#fff;box-shadow:0 3px 0 #1c2c9e;}

/* micro animations */
@keyframes pop{0%{transform:scale(1);}40%{transform:scale(1.08);}100%{transform:scale(1);}}
@keyframes shake{0%,100%{transform:translateX(0);}20%{transform:translateX(-6px);}40%{transform:translateX(6px);}60%{transform:translateX(-4px);}80%{transform:translateX(4px);}}
@keyframes fadein{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:translateY(0);}}
.pop{animation:pop .35s ease;}
.shake{animation:shake .4s ease;}
.fadein{animation:fadein .3s ease;}
@media (prefers-reduced-motion: reduce){
  .pop,.shake,.fadein{animation:none !important;}
  .card-tile{transition:none;}
}

/* choice buttons */
.choice{
  display:block;width:100%;text-align:left;padding:14px 16px;margin-bottom:10px;
  background:var(--panel2);border:2px solid var(--line);border-radius:10px;color:var(--ink);
  font-size:14.5px;line-height:1.4;font-family:'Inter',sans-serif;
}
.choice:hover:not(:disabled){border-color:var(--accent);}
.choice.correct{border-color:var(--success);background:color-mix(in srgb, var(--success) 18%, var(--panel2));}
.choice.incorrect{border-color:var(--danger);background:color-mix(in srgb, var(--danger) 16%, var(--panel2));}
.choice.dim{opacity:.55;}
.choice-why{font-size:13px;color:var(--muted);margin-top:6px;padding-top:6px;border-top:1px dashed var(--line);}

.negation{color:var(--danger);font-weight:900;text-decoration:underline;}
.keyfact{background:color-mix(in srgb, var(--accent) 20%, transparent);padding:1px 4px;border-radius:4px;}
.trapfact{background:color-mix(in srgb, var(--danger) 20%, transparent);padding:1px 4px;border-radius:4px;}

.heartbeat{display:flex;gap:2px;align-items:flex-end;height:28px;}
.hb-bar{width:5px;border-radius:2px;background:var(--line);}
.hb-bar.c{background:var(--success);}
.hb-bar.w{background:var(--danger);}

.mascot-corner{position:absolute;right:14px;top:10px;font-size:26px;opacity:.85;}

footer.appfoot{margin-top:30px;text-align:center;}
.lightbox-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:50;display:flex;align-items:center;justify-content:center;}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--panel);border:1px solid var(--accent2);
  padding:10px 18px;border-radius:10px;z-index:60;box-shadow:var(--shadow);font-size:13.5px;}

/* ---- Notes: spacing + bold/highlight markup ---- */
.notes-list{padding-left:0;list-style:none;margin:0;}
.notes-list li{
  margin-bottom:16px;padding:12px 14px;background:var(--panel2);border-radius:10px;
  line-height:1.65;border-left:3px solid var(--line);
}
.note-key{color:var(--accent2);font-weight:800;}
.note-trap{color:var(--trap);font-weight:700;background:color-mix(in srgb, var(--trap) 14%, transparent);padding:0 3px;border-radius:4px;}
[data-theme="light"] .note-key{color:#8a5c00;}

/* ---- Glossary tappable terms ---- */
.gloss-term{
  color:var(--accent);font-weight:700;text-decoration:underline dotted;text-underline-offset:3px;
  cursor:pointer;background:none;border:none;font:inherit;padding:0;
}
.gloss-term:hover{color:var(--accent2);}
.modal-card{
  background:var(--panel);border:2px solid var(--accent2);border-radius:14px;padding:22px;
  max-width:340px;width:90%;box-shadow:var(--shadow);
}
.mnemonic-box{background:var(--panel2);border-left:3px solid var(--accent2);padding:8px 12px;border-radius:6px;margin-top:10px;font-size:13px;}
.speaker-btn{
  display:inline-flex;align-items:center;justify-content:center;width:38px;height:38px;border-radius:50%;
  background:var(--accent2);color:#161616;border:none;font-size:16px;cursor:pointer;
}
.speaker-btn:active{transform:scale(.92);}

/* ---- Streak heatmap ---- */
.heatmap{display:grid;grid-template-rows:repeat(7,1fr);grid-auto-flow:column;gap:3px;}
.heat-cell{width:11px;height:11px;border-radius:3px;background:var(--panel2);border:1px solid var(--line);}
.heat-cell.l1{background:color-mix(in srgb, var(--accent) 30%, var(--panel2));border-color:transparent;}
.heat-cell.l2{background:color-mix(in srgb, var(--accent) 60%, var(--panel2));border-color:transparent;}
.heat-cell.l3{background:var(--accent);border-color:transparent;}

/* ---- Locked buttons ---- */
.btn.locked{background:var(--panel2);color:var(--muted);box-shadow:none;border:2px dashed var(--line);cursor:not-allowed;}
.btn.locked:active{transform:none;}

/* ---- Games ---- */
.tf-btn{font-size:22px;font-weight:900;padding:22px;border-radius:14px;flex:1;}
.timeline-chip{
  display:inline-block;padding:10px 14px;margin:5px;background:var(--panel2);border:2px solid var(--line);
  border-radius:10px;cursor:pointer;font-size:13.5px;
}
.timeline-chip.placed{opacity:.4;cursor:default;}
.timeline-slot{
  min-width:120px;min-height:40px;border:2px dashed var(--line);border-radius:8px;
  display:inline-flex;align-items:center;justify-content:center;padding:6px 10px;margin:4px;font-size:12.5px;
}
.term-card{background:var(--panel2);border:2px solid var(--line);border-radius:10px;padding:14px;cursor:pointer;text-align:center;}
.term-card:hover{border-color:var(--accent);}

/* ---- Misconception clinic ---- */
.misconception-card{border-left:4px solid var(--trap);}

</style>
</head>
<body data-theme="dark">
<div id="app"></div>

</script>
<script>
// ===================== STATIC CONTENT DATA =====================
// Sourcing tiers (feature-guide.md §1):
// 1 = real official released item (cited)
// 2 = standards-aligned original item written by Claude
// 3 = textbook/curriculum-style original item
// 4 = bounded gap-fill (not used here — coverage was solid without it)

const UNITS = [
  { id:1, title:"Native Peoples & Encounter", range:"Before 1607", blurb:"Indigenous nations, migration theories, European motives for exploration, the Columbian Exchange." },
  { id:2, title:"Colonial America", range:"1607–1763", blurb:"The 13 colonies, colonial economies, mercantilism, and the French and Indian War." },
  { id:3, title:"The American Revolution", range:"1763–1783", blurb:"Causes of the Revolution, founding ideas, key battles, and independence." },
  { id:4, title:"A New Nation", range:"1783–1830s", blurb:"The Constitution, early presidents, westward expansion, and Jacksonian democracy." },
  { id:5, title:"Sectionalism & the Civil War", range:"1830s–1865", blurb:"North-South differences, the slavery crisis, and the Civil War." },
];

const NYSED_2010 = "NYS Intermediate-Level Social Studies Test, June 2010 (released, adapted)";

const QUESTIONS = [
// ---------------- UNIT 1 ----------------
{id:"u1-01",sub:"1A",u:1,cat:["history","geography"],tier:1,src:NYSED_2010,fmt:"mc",
 stem:"According to many anthropologists, a now-submerged land bridge during the last Ice Age most likely allowed early human migration between which two continents?",
 ch:["South America and North America","North America and Europe","Asia and North America","Europe and Africa"],a:2,
 why:["Not connected by this land bridge (Beringia).","Not connected by this land bridge.","Correct — the Bering Land Bridge (Beringia) connected Siberia to Alaska during the Ice Age.","Not connected by this land bridge."]},
{id:"u1-02",sub:"1A",u:1,cat:["history","geography"],tier:2,fmt:"mc",
 stem:"Which Native American nation lived in what is now New York State and later formed a confederacy of five (later six) nations?",
 ch:["Iroquois (Haudenosaunee)","Sioux","Cherokee","Seminole"],a:0,
 why:["Correct — the Haudenosaunee Confederacy formed in present-day New York.","The Sioux lived on the Great Plains.","The Cherokee lived in the southeastern woodlands.","The Seminole lived in Florida."]},
{id:"u1-03",sub:"1B",u:1,cat:["history"],tier:1,src:NYSED_2010,fmt:"mc",
 stem:"One well-documented effect of European contact on Native American populations was:",
 ch:["Native peoples rapidly adopted European farming methods","widespread deaths from European diseases like smallpox","an end to conflicts between rival Native nations","large numbers of Native peoples resettling in Europe"],a:1,
 why:["This understates the disruption European contact caused.","Correct — epidemic disease was the deadliest consequence of contact.","Contact often increased conflict as competition for land and trade grew.","This did not happen at any meaningful scale."]},
{id:"u1-04",sub:"1B",u:1,cat:["history","economics"],tier:2,fmt:"mc",
 stem:"Historians often summarize the three main motives for European exploration as \u201cGod, Gold, and ___.\u201d What completes this phrase?",
 ch:["Glory","Government","Grain","Guns"],a:0,
 why:["Correct — national pride and the glory of new territory and discovery.","Not part of the traditional phrase.","Not part of the traditional phrase.","Not part of the traditional phrase."]},
{id:"u1-05",sub:"1C",u:1,cat:["history","geography"],tier:1,src:NYSED_2010,fmt:"mc",
 stem:"Which European nation was the first to establish a permanent colony in what later became New York State?",
 ch:["Spain","England","the Netherlands (Dutch)","France"],a:2,
 why:["Spain focused mainly on Central/South America.","England arrived later and took the colony from the Dutch in 1664.","Correct — the Dutch established New Netherland, centered on present-day New York.","France focused on the fur trade further north, in Canada."]},
{id:"u1-06",sub:"1B",u:1,cat:["history"],tier:2,fmt:"mc",
 stem:"The exchange of crops, animals, people, and diseases between the Eastern and Western Hemispheres after 1492 is known as:",
 ch:["the Columbian Exchange","the Middle Passage","the Triangular Trade","the Great Migration"],a:0,
 why:["Correct.","The Middle Passage refers specifically to the transatlantic voyage of enslaved Africans.","Triangular Trade is a later trade pattern, not this exchange of goods/disease.","The Great Migration refers to 20th-century internal U.S. migration."]},
{id:"u1-07",sub:"1B",u:1,cat:["history","economics"],tier:3,fmt:"mc",
 stem:"Which crop, native to the Americas, became an important new food source in Europe, Africa, and Asia after the Columbian Exchange?",
 ch:["corn (maize)","wheat","barley","oats"],a:0,
 why:["Correct — maize originated in the Americas and spread worldwide after 1492.","Wheat originated in the Old World, not the Americas.","Barley originated in the Old World.","Oats originated in the Old World."]},
{id:"u1-08",sub:"1C",u:1,cat:["geography","history"],tier:2,fmt:"mc",
 stem:"Spanish conquistadors established their earliest and most extensive American colonies mainly in:",
 ch:["Mexico, Central America, and South America","Canada and the northern Atlantic coastline","the Pacific Northwest coast region","Caribbean islands, never the mainland"],a:0,
 why:["Correct — Spain conquered the Aztec and Inca empires and colonized this region extensively.","This area was contested mainly by France and England, not Spain.","Spain had little presence here in this period.","Spain colonized the mainland extensively, not just islands."]},
{id:"u1-09",sub:"1C",u:1,cat:["history","economics"],tier:2,fmt:"mc",
 stem:"The French in North America were most closely associated with which economic activity?",
 ch:["the fur trade with Native nations","large-scale tobacco plantations","gold mining","sugar plantations"],a:0,
 why:["Correct — French colonists built extensive trading relationships with Native nations for furs.","This was more characteristic of English colonies like Virginia.","France found little gold in North America.","Sugar plantations were more characteristic of the Caribbean."]},
{id:"u1-10",sub:"1B",u:1,cat:["history"],tier:2,fmt:"mc",
 stem:"Which of these would be considered a primary source for studying the earliest encounters between Europeans and Native Americans?",
 ch:["a ship captain's personal logbook from the voyage","a modern textbook chapter about exploration","a recent documentary film about explorers","an encyclopedia article written today"],a:0,
 why:["Correct — a firsthand account created at the time is a primary source.","A textbook is a secondary source, written later, analyzing events.","A documentary made centuries later is a secondary source.","An encyclopedia entry is a secondary source."]},
{id:"u1-11",sub:"1B",u:1,cat:["history"],tier:2,fmt:"mc",neg:true,
 stem:"Which of the following was NOT a major reason European powers sponsored voyages of exploration?",
 ch:["finding a new trade route to Asia","spreading Christianity","searching for gold and silver","ending the transatlantic slave trade"],a:3,
 why:["This was a real motive (God, Gold, Glory).","This was a real motive.","This was a real motive.","Correct — exploration and colonization expanded the slave trade rather than ending it."]},
{id:"u1-12",sub:"1A",u:1,cat:["geography","history"],tier:2,fmt:"mc",
 stem:"The migration of early peoples into the Americas via the Bering Land Bridge is estimated to have occurred during which period?",
 ch:["during the last Ice Age","during the European Middle Ages","during the Renaissance period","sometime in the early 1500s"],a:0,
 why:["Correct.","Far too recent.","Far too recent.","Far too recent — Europeans were already arriving by then."]},
{id:"u1-13",sub:"1A",u:1,cat:["geography"],tier:1,src:NYSED_2010,fmt:"mc",
 stem:"Which geographic feature made the Eastern Woodlands region (including present-day New York) well suited to the longhouse construction used by nations like the Iroquois?",
 ch:["plentiful forests providing wood","vast treeless plains for grazing","dry desert terrain","frozen Arctic ice fields"],a:0,
 why:["Correct — abundant forests supplied the wood-frame longhouses.","This describes the Great Plains, where tepees made from buffalo hide were more common.","Not a feature of the Eastern Woodlands.","Not a feature of the Eastern Woodlands."]},
{id:"u1-14",sub:"1C",u:1,cat:["history","civics"],tier:2,fmt:"mc",
 stem:"Which best describes the encomienda system used by Spain in its American colonies?",
 ch:["forced labor for Native peoples under colonists","a free public school system","a colony-wide voting system","a trade pact between France and Spain"],a:0,
 why:["Correct.","Not related to encomienda.","Not related to encomienda.","Not related to encomienda."]},
{id:"u1-15",sub:"1C",u:1,cat:["economics"],tier:2,fmt:"mc",
 stem:"Why were European monarchs willing to fund risky, expensive ocean voyages of exploration?",
 ch:["hope of profit from trade, gold, and territory","a formal treaty with other kingdoms required it","pure scientific curiosity, nothing more","pressure from the Catholic Church alone"],a:0,
 why:["Correct — the potential economic payoff was the driving motive.","No such treaty existed.","Curiosity played a role but wasn't the main driver of royal funding.","Religion was one motive among several, not the sole one."]},
{id:"u1-16",sub:"1C",u:1,cat:["economics","history"],tier:2,fmt:"type",
 stem:"What is the name for the network of trade routes across the Atlantic Ocean that carried enslaved Africans, raw materials, and manufactured goods between Africa, the Americas, and Europe?",
 accept:["triangular trade","triangle trade"], full:"Triangular Trade",
 why:null},

// ---------------- UNIT 2 ----------------
{id:"u2-01",sub:"2A",u:2,cat:["history"],tier:1,src:NYSED_2010,fmt:"mc",
 stem:"Which religious group is correctly paired with the colony its members helped establish?",
 ch:["Puritans \u2192 Massachusetts","Quakers \u2192 Georgia","Pilgrims \u2192 Virginia","Catholics \u2192 Rhode Island"],a:0,
 why:["Correct — Puritans founded the Massachusetts Bay Colony.","Quakers founded Pennsylvania, not Georgia.","Pilgrims founded Plymouth, in Massachusetts, not Virginia.","Catholics founded Maryland, not Rhode Island."]},
{id:"u2-02",sub:"2A",u:2,cat:["history","economics"],tier:1,src:NYSED_2010,fmt:"mc",
 stem:"Which cash crop is credited with helping the Jamestown colony survive economically?",
 ch:["tobacco","cotton","rice","sugar cane"],a:0,
 why:["Correct — John Rolfe's tobacco crop made Jamestown profitable.","Cotton became important later, especially in the Deep South.","Rice was a major crop further south, in the Carolinas.","Sugar cane was more central to Caribbean colonies."]},
{id:"u2-03",sub:"2A",u:2,cat:["civics","history"],tier:1,src:NYSED_2010,fmt:"mc",
 stem:"The Virginia House of Burgesses was significant in the development of colonial America because it was:",
 ch:["the first representative assembly in English America","the earliest large-scale colonial plantation economy","an organized protest movement against mercantilism","the earliest source of colonial religious freedom"],a:0,
 why:["Correct — it introduced representative government to English America (1619).","The plantation system is a separate development.","It was a governing body, not a protest movement.","Religious freedom is unrelated to this legislative body."]},
{id:"u2-04",sub:"2A",u:2,cat:["civics","history"],tier:2,fmt:"mc",
 stem:"The Mayflower Compact (1620) is historically important because it:",
 ch:["an early self-government agreement by majority rule","declared the colonies' independence from England","brought an end to the New England fur trade","created the first written American constitution"],a:0,
 why:["Correct — it was a basic social contract for governing the new colony.","Independence was not declared until 1776.","Unrelated to the fur trade.","The Constitution came in 1787, much later."]},
{id:"u2-05",sub:"2A",u:2,cat:["geography","economics"],tier:2,fmt:"mc",
 stem:"Which region of the 13 colonies was best known for rocky soil, shipbuilding, fishing, and trade rather than large-scale farming?",
 ch:["the New England colonies","the Southern colonies","the Middle colonies","none — all regions farmed equally"],a:0,
 why:["Correct.","The South relied on large-scale plantation agriculture.","The Middle colonies were known as the \"breadbasket\" for grain farming.","Regional economies differed significantly."]},
{id:"u2-06",sub:"2B",u:2,cat:["economics","history"],tier:2,fmt:"mc",
 stem:"The Southern colonies' economy depended heavily on:",
 ch:["large plantations relying on enslaved labor","small coastal fishing and shipping villages","remote inland fur-trading outposts","large shipyards built for export trade"],a:0,
 why:["Correct.","This better describes New England.","This better describes French Canada.","This better describes New England."]},
{id:"u2-07",sub:"2B",u:2,cat:["economics","history"],tier:2,fmt:"mc",
 stem:"Indentured servitude in the colonies typically involved:",
 ch:["working a set number of years in exchange for passage","permanent, hereditary enslavement based on race","paid work in a factory setting","a land grant for military service"],a:0,
 why:["Correct.","This describes race-based chattel slavery, a distinct and even harsher system.","Factories were not yet widespread in this era.","Unrelated to indentured servitude."]},
{id:"u2-08",sub:"2B",u:2,cat:["economics"],tier:2,fmt:"mc",
 stem:"Which economic system required colonies to trade primarily with the mother country to benefit the empire?",
 ch:["mercantilism","capitalism","communism","feudalism"],a:0,
 why:["Correct.","Capitalism is a broader, later economic system.","Communism did not exist as an idea yet.","Feudalism was a medieval European land-and-loyalty system."]},
{id:"u2-09",sub:"2B",u:2,cat:["economics","civics"],tier:2,fmt:"mc",
 stem:"The Navigation Acts, passed by England, were mainly intended to:",
 ch:["controlling colonial trade under mercantilism","granting the colonies full independence","abolishing slavery in the colonies","establishing new colonial universities"],a:0,
 why:["Correct.","The opposite of their intent.","Unrelated.","Unrelated."]},
{id:"u2-10",sub:"2C",u:2,cat:["history","geography"],tier:2,fmt:"mc",
 stem:"What was one major cause of the French and Indian War (1754\u20131763)?",
 ch:["Britain-France rivalry over the Ohio Valley","a religious dispute between Puritans and Quakers","a tax dispute between colonies","a Spanish invasion of Florida"],a:0,
 why:["Correct.","Not the cause of this conflict.","Not the cause of this conflict.","Spain was not the main combatant in this war."]},
{id:"u2-11",sub:"2C",u:2,cat:["history","geography"],tier:1,src:NYSED_2010,fmt:"mc",
 stem:"After the French and Indian War, many colonists were angered by the Proclamation of 1763 because it:",
 ch:["limiting settlement west of the Appalachians","handed Florida over to the French","took away disputed land from Canada","encouraged Native raids on colonists"],a:0,
 why:["Correct.","Florida was Spanish, not French, in this period.","Not accurate.","The Proclamation aimed to reduce conflict, not encourage it."]},
{id:"u2-12",sub:"2C",u:2,cat:["history","economics"],tier:2,fmt:"mc",
 stem:"One long-term result of the French and Indian War was that:",
 ch:["heavier war-debt taxes bred colonial resentment","the colonies gained full independence at once","France took control of the 13 colonies","slavery was abolished in the colonies"],a:0,
 why:["Correct — this set the stage for the Revolution.","Independence came over a decade later, after further conflict.","France lost most of its North American territory after this war.","Not related to this war's outcome."]},
{id:"u2-13",sub:"2C",u:2,cat:["geography"],tier:2,fmt:"mc",neg:true,
 stem:"Which of the following was NOT one of the three commonly-cited regions of the original 13 colonies?",
 ch:["New England","Middle","Southern","Pacific Coast"],a:3,
 why:["A real colonial region.","A real colonial region.","A real colonial region.","Correct — the Pacific Coast was not part of the original 13 colonies."]},
{id:"u2-14",sub:"2B",u:2,cat:["history"],tier:3,fmt:"mc",
 stem:"The Great Awakening of the 1730s\u201340s was a religious movement that:",
 ch:["encouraged personal religious experience","ended religious practice in the colonies","was limited only to Southern colonies","was organized by the British monarchy"],a:0,
 why:["Correct.","The opposite occurred — religious enthusiasm grew.","It spread across all colonial regions.","It arose from traveling preachers, not the crown."]},
{id:"u2-15",sub:"2B",u:2,cat:["economics","geography"],tier:2,fmt:"mc",
 stem:"The transatlantic \"triangular trade\" routes connected which three regions?",
 ch:["Europe, Africa, and the Americas","Asia, Europe, and Africa","North America, South America, and Antarctica","England, Ireland, and Scotland"],a:0,
 why:["Correct.","Asia was not part of this specific trade triangle.","Not the regions involved.","Too narrow and inaccurate."]},
{id:"u2-16",sub:"2C",u:2,cat:["geography","history"],tier:2,fmt:"type",
 stem:"What is the name of the 1763 royal proclamation that forbade colonists from settling west of the Appalachian Mountains?",
 accept:["proclamation of 1763","royal proclamation of 1763","the proclamation line","proclamation line of 1763"], full:"Proclamation of 1763",
 why:null},

// ---------------- UNIT 3 ----------------
{id:"u3-01",sub:"3C",u:3,cat:["history"],tier:1,src:NYSED_2010,fmt:"mc",
 stem:"Quotes such as \u201cGive me liberty, or give me death!\u201d and \u201cWe must indeed all hang together, or, most assuredly, we shall all hang separately\u201d reflect the views of members of which group during the Revolutionary era?",
 ch:["Patriots","Loyalists (Tories)","Redcoats","Native American nations"],a:0,
 why:["Correct — these are the words of Patrick Henry and Benjamin Franklin, both Patriots.","Loyalists supported the British crown.","Redcoats refers to British soldiers.","Native nations were not the speakers of these particular quotes."]},
{id:"u3-02",sub:"3A",u:3,cat:["economics","civics"],tier:2,fmt:"mc",
 stem:"The Stamp Act (1765) taxed colonists on:",
 ch:["printed materials such as newspapers","tea imported from Britain only","land owned by colonial settlers","tobacco imported from the colonies"],a:0,
 why:["Correct.","This describes the later Tea Act.","Not the Stamp Act's target.","Not the Stamp Act's target."]},
{id:"u3-03",sub:"3A",u:3,cat:["civics"],tier:2,fmt:"mc",
 stem:"The colonial slogan \u201cno taxation without representation\u201d expressed colonists' objection to:",
 ch:["taxation with no colonial representation","paying any taxes at all, ever","British control of the fur trade","British troops stationed in Boston"],a:0,
 why:["Correct.","Colonists objected specifically to taxation without a voice in it, not taxation itself.","Unrelated to the slogan's meaning.","A separate grievance, not what this slogan expressed."]},
{id:"u3-04",sub:"3A",u:3,cat:["history","economics"],tier:2,fmt:"mc",
 stem:"The Boston Tea Party (1773) was a protest against:",
 ch:["the Tea Act and British trade control","the earlier, separate Stamp Act","the unrelated Proclamation of 1763","the later set of Intolerable Acts"],a:0,
 why:["Correct.","The Stamp Act had already been repealed by this time.","Unrelated to tea.","The Intolerable Acts came after, partly in response to this protest."]},
{id:"u3-05",sub:"3B",u:3,cat:["history","civics"],tier:2,fmt:"mc",
 stem:"Thomas Paine's pamphlet \u201cCommon Sense\u201d (1776) is significant because it:",
 ch:["argued plainly for full independence from Britain","called for peace with King George III","was written by a Loyalist writer","proposed a brand-new colonial tax system"],a:0,
 why:["Correct — it helped shift public opinion strongly toward independence.","The opposite of Paine's argument.","Paine was a Patriot voice for independence.","Not the pamphlet's subject."]},
{id:"u3-06",sub:"3B",u:3,cat:["civics","history"],tier:1,src:NYSED_2010,fmt:"mc",
 stem:"The Declaration of Independence (1776) is best known for stating that:",
 ch:["that all men are created equal","Congress holds power to tax imports","the president may veto any law","states may leave the Union freely"],a:0,
 why:["Correct.","This is a later constitutional power, not from the Declaration.","This is a constitutional power, not from the Declaration.","Not stated in the Declaration."]},
{id:"u3-07",sub:"3B",u:3,cat:["civics"],tier:2,fmt:"mc",
 stem:"The ideas of natural rights and government by consent of the governed, reflected in the Declaration of Independence, were most influenced by the philosopher:",
 ch:["John Locke","Karl Marx","Adam Smith","Aristotle"],a:0,
 why:["Correct — Locke's writings on natural rights directly shaped Jefferson's language.","Marx wrote nearly a century later on very different ideas.","Smith wrote primarily about economics.","Aristotle's political philosophy predates these specific Enlightenment ideas by centuries."]},
{id:"u3-08",sub:"3C",u:3,cat:["history"],tier:1,src:NYSED_2010,fmt:"mc",
 stem:"The Battle of Saratoga (1777) was a turning point in the Revolutionary War chiefly because it:",
 ch:["convinced France to formally support the Americans","ended British threats in the South","forced a total British withdrawal from North America","guaranteed Canadian support for the colonists"],a:0,
 why:["Correct — the American victory persuaded France to enter the war as an ally.","The Southern campaign continued for years afterward.","British forces remained in North America for years afterward.","Canada did not join the American cause."]},
{id:"u3-09",sub:"3C",u:3,cat:["history"],tier:2,fmt:"mc",
 stem:"Colonists who remained loyal to the British crown during the Revolution were known as:",
 ch:["Loyalists (Tories)","Patriots","Minutemen","Federalists"],a:0,
 why:["Correct.","Patriots supported independence.","Minutemen were Patriot militia fighters.","Federalists is a later, 1780s–90s political term."]},
{id:"u3-10",sub:"3C",u:3,cat:["history"],tier:2,fmt:"mc",
 stem:"The Battle of Yorktown (1781), which effectively ended the fighting of the Revolutionary War, resulted in:",
 ch:["the surrender of British General Cornwallis","a decisive British victory","the death of George Washington","the signing of the Declaration of Independence"],a:0,
 why:["Correct.","The Americans and French won this battle.","Washington lived for many years after this.","The Declaration was signed years earlier, in 1776."]},
{id:"u3-11",sub:"3C",u:3,cat:["civics","history"],tier:2,fmt:"mc",
 stem:"The Treaty of Paris (1783) formally:",
 ch:["ended the war and recognized independence","started the French and Indian War","created the entire U.S. Constitution","established the Louisiana Territory purchase"],a:0,
 why:["Correct.","That war ended decades earlier, in 1763.","The Constitution was written in 1787.","The Louisiana Purchase occurred in 1803."]},
{id:"u3-12",sub:"3A",u:3,cat:["civics","history"],tier:2,fmt:"mc",neg:true,
 stem:"Which of the following was NOT a protest tactic colonists used before the Revolutionary War?",
 ch:["boycotting British goods","forming a Continental Congress","petitioning the king","a permanent military alliance with Spain"],a:3,
 why:["A real, widely used tactic.","A real tactic (First and Second Continental Congress).","A real tactic used repeatedly.","Correct — the colonies' wartime alliance was with France, not Spain."]},
{id:"u3-13",sub:"3C",u:3,cat:["history"],tier:3,fmt:"mc",
 stem:"Women such as Abigail Adams contributed to the Revolutionary era by:",
 ch:["keeping households running and pressing for rights","serving as elected members of Congress","personally commanding army regiments","signing the Declaration of Independence"],a:0,
 why:["Correct.","Women could not yet hold these elected offices.","Women did not hold these formal military commands at this time.","No women were among the signers."]},
{id:"u3-14",sub:"3A",u:3,cat:["civics","history"],tier:2,fmt:"mc",
 stem:"The First Continental Congress (1774) was called mainly in response to:",
 ch:["the Intolerable Acts, after the Tea Party","the earlier repealed Stamp Act","the older French and Indian War","the much later Louisiana Purchase"],a:0,
 why:["Correct.","The Stamp Act was years earlier and had already been repealed.","This war had ended over a decade earlier.","This purchase happened decades later, in 1803."]},
{id:"u3-15",sub:"3C",u:3,cat:["geography","history"],tier:3,fmt:"mc",
 stem:"Why was assistance from France (ships, troops, and supplies) so important to the American war effort?",
 ch:["a weak navy and thin supplies, offset by French aid","most soldiers were actually French troops","France declared war on the colonies","France controlled Boston Harbor"],a:0,
 why:["Correct.","Most soldiers remained American, though French troops and the navy were crucial at key moments like Yorktown.","France allied with the colonies against Britain, not against them.","Not accurate — Boston was never under French control."]},
{id:"u3-16",sub:"3B",u:3,cat:["civics","history"],tier:2,fmt:"type",
 stem:"What document, adopted on July 4, 1776, formally announced the American colonies' break from Great Britain?",
 accept:["declaration of independence"], full:"Declaration of Independence",
 why:null},

// ---------------- UNIT 4 ----------------
{id:"u4-01",sub:"4A",u:4,cat:["civics"],tier:2,fmt:"mc",
 stem:"A major weakness of the Articles of Confederation was that:",
 ch:["the national government had no power to tax or trade","states had too little power overall","there was a strong king-like executive","the Supreme Court could overrule Congress freely"],a:0,
 why:["Correct — this left the young national government weak and unable to function effectively.","States actually held most of the power under the Articles.","There was no strong national executive under the Articles.","There was no strong national court system under the Articles."]},
{id:"u4-02",sub:"4A",u:4,cat:["civics"],tier:2,fmt:"mc",
 stem:"At the Constitutional Convention (1787), the Great (Connecticut) Compromise resolved a dispute over:",
 ch:["how Congress representation would work","whether or not slavery was legal","how the president gets elected","the power of the judicial branch"],a:0,
 why:["Correct — it created the House (by population) and Senate (equal per state).","This was addressed by the separate Three-Fifths Compromise.","This was handled through the Electoral College debate, a separate issue.","Not the subject of this specific compromise."]},
{id:"u4-03",sub:"4A",u:4,cat:["civics","history"],tier:2,fmt:"mc",
 stem:"The Three-Fifths Compromise addressed how:",
 ch:["counting enslaved people for representation","how slavery would slowly be ended","how new states would join the Union","how tariffs would be set for trade"],a:0,
 why:["Correct.","This compromise did not abolish slavery; it counted enslaved people for political purposes.","Not the subject of this compromise.","Not the subject of this compromise."]},
{id:"u4-04",sub:"4A",u:4,cat:["civics"],tier:2,fmt:"mc",
 stem:"Federalists, at the time the Constitution was being ratified, generally argued that:",
 ch:["a strong national government was necessary","the Constitution should be rejected entirely","states should hold all governing power","there should be no president at all"],a:0,
 why:["Correct.","This was the Anti-Federalist position.","This was closer to the Anti-Federalist position.","No major group argued for eliminating the executive branch."]},
{id:"u4-05",sub:"4A",u:4,cat:["civics"],tier:1,src:NYSED_2010,fmt:"mc",
 stem:"Which document guarantees freedoms such as speech, the right to bear arms, and protection from unreasonable search and seizure?",
 ch:["the Bill of Rights","the Albany Plan of Union","the Declaration of Sentiments","the Federalist Papers"],a:0,
 why:["Correct — the first ten amendments to the Constitution.","This was an earlier, failed 1754 colonial unity plan.","This 1848 document addressed women's rights.","These were essays arguing for ratification, not a legal document itself."]},
{id:"u4-06",sub:"4A",u:4,cat:["civics"],tier:1,src:NYSED_2010,fmt:"mc",
 stem:"Which feature of the U.S. Constitution is designed to prevent any one branch of government from becoming too powerful?",
 ch:["checks and balances","federal supremacy","the electoral college","the elastic clause"],a:0,
 why:["Correct.","This concerns federal vs. state law, not branch power.","This concerns presidential elections, not branch balance.","This concerns Congress's implied powers, not inter-branch balance."]},
{id:"u4-07",sub:"4B",u:4,cat:["geography","history"],tier:1,src:NYSED_2010,fmt:"mc",
 stem:"The purpose of the Lewis and Clark expedition was to explore land gained through:",
 ch:["the Louisiana Purchase","the Gadsden Purchase","the purchase of Florida","the purchase of Alaska"],a:0,
 why:["Correct — the 1803 purchase from France roughly doubled U.S. territory.","This smaller 1853 purchase was in the Southwest.","Florida was acquired from Spain in 1819.","Alaska was purchased from Russia in 1867, decades later."]},
{id:"u4-08",sub:"4B",u:4,cat:["civics"],tier:1,src:NYSED_2010,fmt:"mc",
 stem:"One effect of the Supreme Court's decision in Marbury v. Madison (1803) was to:",
 ch:["establish the Court's power of judicial review","allow Congress to tax income","approve the president's veto power","settle disputes between House and Senate"],a:0,
 why:["Correct — this landmark case established judicial review.","This power was clarified separately, later, by amendment.","The veto power was already established directly in the Constitution.","Not the subject of this case."]},
{id:"u4-09",sub:"4B",u:4,cat:["history","civics"],tier:1,src:NYSED_2010,fmt:"mc",
 stem:"One result of the War of 1812 was that the United States:",
 ch:["kept independence, gained national pride","suffered a major defeat by Spain","gained full control over Cuba","gained large new land from Canada"],a:0,
 why:["Correct.","Spain was not the opponent in this war.","Not a result of this war.","Neither side gained territory from this war."]},
{id:"u4-10",sub:"4B",u:4,cat:["economics"],tier:1,src:NYSED_2010,fmt:"mc",
 stem:"In the early 1800s, a Northern factory owner would most likely have supported:",
 ch:["a protective tariff for factories","completely free trade, no tariffs","a complete end to all national banks","the expansion of plantation slavery"],a:0,
 why:["Correct — tariffs protected young Northern industries from cheaper foreign goods.","Southern planters, who imported manufactured goods, favored this position instead.","Not related to a factory owner's specific economic interest.","This mattered more to Southern planters than Northern manufacturers."]},
{id:"u4-11",sub:"4B",u:4,cat:["geography","economics"],tier:1,src:NYSED_2010,fmt:"mc",
 stem:"The Erie Canal, completed in 1825 under Governor DeWitt Clinton's plan, connected:",
 ch:["the Hudson River to the Great Lakes region","the Mississippi to the Gulf of Mexico","Boston Harbor to the Atlantic Ocean","Washington, D.C. to the Chesapeake"],a:0,
 why:["Correct — it linked New York City to the Midwest, spurring major economic growth.","Not the canal's route.","Not the canal's route.","Not the canal's route."]},
{id:"u4-12",sub:"4B",u:4,cat:["civics","geography"],tier:2,fmt:"mc",
 stem:"The Monroe Doctrine (1823) declared that:",
 ch:["the Americas were closed to new European colonies","the U.S. would stay neutral in every future war","slavery would not expand into new territories","the U.S. would join formal European alliances"],a:0,
 why:["Correct.","Too broad — the Doctrine specifically concerned the Western Hemisphere.","Unrelated to the Doctrine's subject.","The Doctrine actually warned the U.S. would stay out of European affairs."]},
{id:"u4-13",sub:"4C",u:4,cat:["civics","history"],tier:1,src:NYSED_2010,fmt:"mc",
 stem:"During the Jacksonian era, critics accused President Andrew Jackson of acting like a king because he:",
 ch:["expanded presidential power broadly","reduced the power of the presidency","refused to seek a second term","gave Congress more military power"],a:0,
 why:["Correct.","The opposite occurred — Jackson expanded executive power.","Jackson did run for and win a second term.","Not accurate to this criticism of Jackson."]},
{id:"u4-14",sub:"4C",u:4,cat:["history","civics"],tier:2,fmt:"mc",
 stem:"The Indian Removal Act (1830) led directly to:",
 ch:["forced relocation on the Trail of Tears","peaceful coexistence agreements instead","the creation of new Native-run states","a full end to westward expansion"],a:0,
 why:["Correct.","The opposite occurred — forced removal, not peaceful agreement.","Not the outcome of this law.","Westward expansion continued and accelerated."]},
{id:"u4-15",sub:"4C",u:4,cat:["civics","history"],tier:1,src:NYSED_2010,fmt:"mc",
 stem:"The Missouri Compromise (1820) is best associated with:",
 ch:["balancing free and slave states","the ending of the War of 1812","the creation of the Bill of Rights","the establishment of the Supreme Court"],a:0,
 why:["Correct.","That war had already ended, in 1815.","The Bill of Rights was ratified decades earlier, in 1791.","The Supreme Court was created by the Constitution in 1787."]},
{id:"u4-16",sub:"4C",u:4,cat:["history"],tier:2,fmt:"mc",neg:true,
 stem:"Which of these was NOT a stated goal of the idea known as Manifest Destiny?",
 ch:["the belief the U.S. was destined to expand","permanently ending westward expansion","settling western territories","expanding agricultural and trade opportunities"],a:1,
 why:["A real, central goal of Manifest Destiny.","Correct — this is the opposite of what Manifest Destiny promoted.","A real goal that followed from the belief.","A real goal that followed from the belief."]},
{id:"u4-17",sub:"4A",u:4,cat:["civics"],tier:2,fmt:"type",
 stem:"What term describes the constitutional principle that power is divided between the national government and the state governments?",
 accept:["federalism"], full:"Federalism",
 why:null},

// ---------------- UNIT 5 ----------------
{id:"u5-01",sub:"5A",u:5,cat:["economics","history"],tier:1,src:NYSED_2010,fmt:"mc",
 stem:"In 1861, the North held roughly 65% of farmland, 71% of railroad track, 92% of the value of manufactured goods, 85% of factories, and 92% of industrial workers, compared to the South. Which statement is best supported by this information?",
 ch:["the North held major economic advantages over the South","the South had more total farms than the North","North and South made roughly equal manufactured goods","the South had more industrial workers than the North"],a:0,
 why:["Correct — these figures show a large and lasting Northern industrial advantage.","The data shows the opposite for total farmland share.","The data shows a huge gap, not equality.","The data shows the North had the overwhelming share of industrial workers."]},
{id:"u5-02",sub:"5A",u:5,cat:["economics"],tier:2,fmt:"mc",
 stem:"The North's economy in the mid-1800s was increasingly based on:",
 ch:["factories, wage labor, and industry","large plantations worked by enslaved labor","subsistence farming only","the fur trade"],a:0,
 why:["Correct.","This better describes the South's economy.","This understates the North's growing industrial economy.","The fur trade had declined greatly in importance by this era."]},
{id:"u5-03",sub:"5A",u:5,cat:["economics"],tier:2,fmt:"mc",
 stem:"The South's economy in the mid-1800s depended heavily on:",
 ch:["cotton farming worked by enslaved labor","large-scale factory production","international banking services","shipbuilding exported to Asia"],a:0,
 why:["Correct.","This better describes the North's economy.","Not a major feature of the Southern economy.","Not a major feature of the Southern economy."]},
{id:"u5-04",sub:"5A",u:5,cat:["economics","history"],tier:2,fmt:"mc",
 stem:"The invention of the cotton gin (1793) by Eli Whitney:",
 ch:["raised demand for enslaved labor","ended the need for enslaved labor","was used mainly in Northern mills","reduced overall cotton output"],a:0,
 why:["Correct — by making processing efficient, it actually expanded slavery's economic importance.","The opposite occurred — demand for enslaved labor grew.","It was used on Southern cotton farms, not Northern factories.","Cotton production increased dramatically after this invention."]},
{id:"u5-05",sub:"5B",u:5,cat:["civics","history"],tier:2,fmt:"mc",
 stem:"The Compromise of 1850 included a stronger Fugitive Slave Act, which:",
 ch:["forced free states to help capture escapees","freed all enslaved people in the South","formally ended slavery in Washington, D.C.","gave accused escapees a jury trial"],a:0,
 why:["Correct — this angered many Northerners and fueled abolitionist sentiment.","Not what this Act did.","The Compromise banned the slave trade, but not slavery itself, in D.C.","The Act specifically denied this right to those accused of being fugitives."]},
{id:"u5-06",sub:"5B",u:5,cat:["civics","history"],tier:2,fmt:"mc",
 stem:"The Kansas-Nebraska Act (1854) increased tensions over slavery because it:",
 ch:["let settlers decide on slavery themselves","banned slavery in all new territories","admitted Kansas as free right away","left the Missouri Compromise line intact"],a:0,
 why:["Correct — this policy of \"popular sovereignty\" led to violence known as \"Bleeding Kansas.\"","The Act did the opposite of an outright ban.","Kansas's status was violently contested for years, not settled immediately.","This Act actually overturned the Missouri Compromise line."]},
{id:"u5-07",sub:"5B",u:5,cat:["civics","history"],tier:2,fmt:"mc",
 stem:"In the Dred Scott decision (1857), the Supreme Court ruled that:",
 ch:["enslaved people had no rights as citizens","enslaved people became free in free states","Congress could ban slavery anywhere","slavery was unconstitutional nationwide"],a:0,
 why:["Correct — this deeply controversial ruling denied citizenship rights to enslaved and formerly enslaved people.","The Court ruled the opposite.","The Court actually ruled Congress could NOT do this.","The Court's ruling protected slavery, not banned it."]},
{id:"u5-08",sub:"5B",u:5,cat:["history"],tier:2,fmt:"mc",
 stem:"Frederick Douglass and Harriet Tubman are best known for their work as:",
 ch:["abolitionists who aided escapes north","Union Army generals in the field","signers of the Declaration itself","members of Congress before the war"],a:0,
 why:["Correct.","Neither served as a Union general.","The Declaration was signed in 1776, before either was born.","Neither held a Congressional seat during this period."]},
{id:"u5-09",sub:"5B",u:5,cat:["civics","history"],tier:2,fmt:"mc",
 stem:"The Seneca Falls Convention (1848), held in New York, launched a major movement for:",
 ch:["women's rights, including the right to vote","abolition of slavery in the North only","westward expansion","labor union rights"],a:0,
 why:["Correct — this convention produced the Declaration of Sentiments.","Not the convention's focus, though many attendees were also abolitionists.","Not the convention's focus.","Not the convention's focus."]},
{id:"u5-10",sub:"5C",u:5,cat:["civics","history"],tier:2,fmt:"mc",
 stem:"Abraham Lincoln's election in 1860 led directly to:",
 ch:["Southern secession, fearing limits on slavery","an immediate nationwide end to slavery","a peaceful compromise, avoiding war","the annexation of Texas"],a:0,
 why:["Correct.","Slavery was not abolished nationwide until the 13th Amendment, in 1865.","War broke out within months of his inauguration.","Texas was annexed years earlier, in 1845."]},
{id:"u5-11",sub:"5C",u:5,cat:["history"],tier:2,fmt:"mc",
 stem:"The main immediate cause of the outbreak of the Civil War in 1861 was:",
 ch:["the Confederate attack on Fort Sumter","the assassination of Lincoln","the Emancipation Proclamation","the Dred Scott decision"],a:0,
 why:["Correct.","Lincoln was assassinated in 1865, at the war's end.","This came in 1863, after the war had already begun.","This 1857 decision was a longer-term cause, not the immediate trigger."]},
{id:"u5-12",sub:"5C",u:5,cat:["civics","history"],tier:2,fmt:"mc",
 stem:"The Emancipation Proclamation (1863) declared that:",
 ch:["enslaved people in Confederate areas were freed","slavery ended everywhere immediately","the Union had already won the war","the Confederacy was formally dissolved"],a:0,
 why:["Correct — it applied only to areas still in rebellion.","Full abolition nationwide came later, with the 13th Amendment.","The war continued for two more years after this.","The Confederacy fought on for two more years after this."]},
{id:"u5-13",sub:"5C",u:5,cat:["history"],tier:2,fmt:"mc",neg:true,
 stem:"Which of these was NOT a Union advantage at the start of the Civil War?",
 ch:["a much larger overall population","many more factories and railroads","far greater manufacturing capacity","experienced officers already serving the Union"],a:3,
 why:["A real Union advantage.","A real Union advantage.","A real Union advantage.","Correct — many experienced officers, including Robert E. Lee, resigned to join the Confederacy."]},
{id:"u5-14",sub:"5C",u:5,cat:["history"],tier:2,fmt:"mc",
 stem:"The Battle of Gettysburg (1863) is considered a turning point of the Civil War because it:",
 ch:["stopped the Confederate invasion cold","ended the entire war right away","was the very first battle fought","was a clearly decisive Confederate win"],a:0,
 why:["Correct.","The war continued for nearly two more years.","The war had begun two years earlier, in 1861.","The Union won this battle."]},
{id:"u5-15",sub:"5C",u:5,cat:["civics"],tier:2,fmt:"mc",
 stem:"The 13th Amendment to the Constitution (1865):",
 ch:["formally abolished slavery nationwide","gave formerly enslaved men the vote","granted citizenship to all U.S.-born people","ended the period of Reconstruction"],a:0,
 why:["Correct.","This came with the 15th Amendment (1870).","This came with the 14th Amendment (1868).","Reconstruction continued for over a decade after this amendment."]},
{id:"u5-16",sub:"5C",u:5,cat:["history"],tier:2,fmt:"type",

{id:"u1-17",sub:"1A",u:1,cat:["civics","history"],tier:2,fmt:"mc",

{id:"u1-18",sub:"1A",u:1,cat:["geography","history"],tier:2,fmt:"mc",

{id:"u1-19",sub:"1B",u:1,cat:["history","geography"],tier:3,fmt:"mc",

{id:"u1-21",sub:"1C",u:1,cat:["history","geography"],tier:3,fmt:"mc",
 stem:"Spanish explorer Ponce de Le\u00f3n is best known for early expeditions into:",

{id:"u1-22",sub:"1C",u:1,cat:["history"],tier:2,fmt:"type",

{id:"u1-23",sub:"1A",u:1,cat:["civics","history"],tier:2,fmt:"mc",neg:true,

 ch:["councils reaching decisions by consensus","oral tradition and wampum recording agreements","a written constitution modeled on ancient Rome","leadership roles passed down through specific clans"],a:2,

{id:"u2-17",sub:"2A",u:2,cat:["civics","history"],tier:3,fmt:"mc",

{id:"u2-18",sub:"2A",u:2,cat:["history"],tier:2,fmt:"mc",

{id:"u2-19",sub:"2B",u:2,cat:["economics","geography"],tier:2,fmt:"mc",

{id:"u2-20",sub:"2B",u:2,cat:["civics"],tier:2,fmt:"type",

{id:"u2-21",sub:"2C",u:2,cat:["civics","history"],tier:2,fmt:"mc",

{id:"u2-22",sub:"2C",u:2,cat:["history"],tier:3,fmt:"mc",

{id:"u2-23",sub:"2A",u:2,cat:["history","civics"],tier:2,fmt:"mc",neg:true,

{id:"u3-17",sub:"3A",u:3,cat:["history"],tier:2,fmt:"mc",
 stem:"The Boston Massacre (1770), in which British soldiers killed several colonists, became:",
 ch:["powerful Patriot propaganda against British troops","a minor, forgotten local dispute","a cause for reconciliation with Britain","the direct cause of the Declaration of Independence"],a:0,
 why:["Correct — Patriots used it to stir anti-British sentiment.","It became widely known and used for Patriot messaging.","It deepened conflict rather than easing it.","The Declaration came six years later, for broader reasons."]},
{id:"u3-18",sub:"3A",u:3,cat:["civics","history"],tier:2,fmt:"mc",

{id:"u3-19",sub:"3B",u:3,cat:["civics","history"],tier:2,fmt:"mc",
 stem:"The Second Continental Congress (1775) took the major step of:",

 why:["Correct.","France became an ally, not an enemy.","The Constitution came in 1787, years later.","Not addressed by this Congress."]},
{id:"u3-20",sub:"3B",u:3,cat:["civics","history"],tier:3,fmt:"mc",
 stem:"The Olive Branch Petition (1775) was significant because it:",
 ch:["was a final colonial attempt to avoid war by appealing to the king","formally declared American independence","asked France for military assistance","ended fighting between colonists and Britain"],a:0,
 why:["Correct — sent even as fighting had already begun.","Independence was declared a year later, separately.","This appeal went to France later, not in this petition.","Fighting continued despite this petition."]},
{id:"u3-21",sub:"3C",u:3,cat:["history"],tier:2,fmt:"mc",
 stem:"The winter at Valley Forge (1777\u201378) is remembered because the Continental Army:",

{id:"u3-22",sub:"3C",u:3,cat:["history"],tier:2,fmt:"type",

 why:null},
{id:"u3-23",sub:"3A",u:3,cat:["civics","history"],tier:2,fmt:"mc",neg:true,
 stem:"Which of these was NOT a form of pre-Revolutionary colonial protest or organizing?",
 ch:["Committees of Correspondence","the Sons of Liberty","Common Sense by Thomas Paine","the Federalist Papers"],a:3,
 why:["A real form of colonial organizing.","A real form of colonial organizing.","A real, influential piece of protest writing.","Correct — the Federalist Papers came later, during the 1787\u201388 ratification debate, not before the Revolution."]},

{id:"u4-18",sub:"4A",u:4,cat:["economics","civics"],tier:2,fmt:"mc",
 stem:"As the first Secretary of the Treasury, Alexander Hamilton's financial plan included:",

{id:"u4-19",sub:"4A",u:4,cat:["civics","history"],tier:2,fmt:"mc",
 stem:"The Whiskey Rebellion (1794) tested the new federal government's authority when:",

{id:"u4-20",sub:"4A",u:4,cat:["civics"],tier:2,fmt:"type",

{id:"u4-21",sub:"4B",u:4,cat:["civics","history"],tier:2,fmt:"mc",
 stem:"In his Farewell Address (1796), President Washington warned the nation against:",

{id:"u4-22",sub:"4B",u:4,cat:["geography","economics"],tier:2,fmt:"mc",

{id:"u4-23",sub:"4C",u:4,cat:["civics","history"],tier:2,fmt:"mc",

{id:"u4-24",sub:"4C",u:4,cat:["civics","economics"],tier:2,fmt:"mc",

{id:"u4-25",sub:"4A",u:4,cat:["economics","civics"],tier:2,fmt:"mc",neg:true,
 stem:"Which of these was NOT a purpose of Alexander Hamilton's financial plan for the new nation?",

{id:"u5-17",sub:"5A",u:5,cat:["history","geography"],tier:2,fmt:"mc",
 stem:"The Mexican-American War (1846\u201348) mattered to the slavery debate mainly because it:",
 ch:["added new territory, reigniting the slavery debate","ended Southern slavery immediately","united North and South in full agreement","left U.S. territory completely unchanged"],a:0,
 why:["Correct.","Slavery continued in the South for years afterward.","The opposite occurred — new territory deepened North-South conflict.","The war added vast new territory to the U.S."]},
{id:"u5-18",sub:"5B",u:5,cat:["civics","history"],tier:2,fmt:"mc",

{id:"u5-19",sub:"5B",u:5,cat:["history"],tier:2,fmt:"mc",
 stem:"Harriet Beecher Stowe's novel \u201cUncle Tom's Cabin\u201d (1852) had the effect of:",

{id:"u5-20",sub:"5C",u:5,cat:["civics","history"],tier:2,fmt:"mc",

{id:"u5-21",sub:"5C",u:5,cat:["history"],tier:2,fmt:"mc",
 stem:"During the later years of the Civil War, Union armies were commanded by ___ while the main Confederate army was commanded by ___.",

{id:"u5-22",sub:"5C",u:5,cat:["history","geography"],tier:2,fmt:"mc",

{id:"u5-23",sub:"5C",u:5,cat:["history","geography"],tier:2,fmt:"type",

 why:null},

{id:"r1-05",sub:"1B",u:1,cat:["history"],tier:2,fmt:"mc",pool:"random",

{id:"r1-06",sub:"1A",u:1,cat:["history","economics"],tier:3,fmt:"mc",pool:"random",

{id:"r1-07",sub:"1B",u:1,cat:["history"],tier:2,fmt:"mc",pool:"random",

{id:"r1-08",sub:"1B",u:1,cat:["economics"],tier:2,fmt:"mc",pool:"random",

{id:"r1-09",sub:"1B",u:1,cat:["history","civics"],tier:3,fmt:"mc",pool:"random",

 why:["Correct — an early, notable voice against colonial abuses.","That was Cort\u00e9s, a separate historical figure.","New Netherland was a Dutch colony.","The Mayflower Compact was written by English Pilgrims."]},

{id:"r2-01",sub:"2A",u:2,cat:["history"],tier:2,fmt:"mc",pool:"random",

{id:"r2-02",sub:"2A",u:2,cat:["history"],tier:3,fmt:"mc",pool:"random",

{id:"r2-03",sub:"2C",u:2,cat:["history"],tier:2,fmt:"mc",pool:"random",

{id:"r2-04",sub:"2B",u:2,cat:["history"],tier:2,fmt:"mc",pool:"random",
 stem:"The Salem Witch Trials (1692) took place in which colonial region?",

{id:"r2-05",sub:"2A",u:2,cat:["civics"],tier:2,fmt:"mc",pool:"random",
 stem:"A royal colony, unlike a proprietary colony, was one that was:",

{id:"r2-06",sub:"2C",u:2,cat:["civics","history"],tier:2,fmt:"mc",pool:"random",
 stem:"Colonial militias, made up of ordinary armed citizens, existed:",

{id:"r2-07",sub:"2C",u:2,cat:["history","geography"],tier:2,fmt:"mc",pool:"random",

{id:"r2-08",sub:"2B",u:2,cat:["civics","history"],tier:2,fmt:"mc",pool:"random",
 stem:"Over the 1600s and 1700s, colonial \u201cslave codes\u201d generally:",

{id:"r2-09",sub:"2B",u:2,cat:["economics","geography"],tier:2,fmt:"mc",pool:"random",

{id:"r3-01",sub:"3C",u:3,cat:["history"],tier:2,fmt:"mc",pool:"random",
 stem:"The Marquis de Lafayette is remembered as:",
 ch:["a French nobleman who volunteered to help the American cause","a British general who defected to the Patriots","the first Secretary of the Treasury","the author of Common Sense"],a:0,
 why:["Correct.","Lafayette was French, not a defecting British general.","That was Alexander Hamilton, later.","That was Thomas Paine."]},
{id:"r3-02",sub:"3C",u:3,cat:["history"],tier:2,fmt:"mc",pool:"random",
 stem:"Nathan Hale is remembered for reportedly saying, before his execution as a spy:",
 ch:["regret at having only one life to give for his country","a request for peace with Britain","support for staying loyal to the king","a demand for higher pay for soldiers"],a:0,
 why:["Correct — a famous, enduring Patriot quote.","The opposite of Hale's Patriot sentiment.","Hale was a Patriot, not a Loyalist.","Not associated with Hale's famous words."]},
{id:"r3-03",sub:"3C",u:3,cat:["history"],tier:3,fmt:"mc",pool:"random",
 stem:"Women's contributions on Revolutionary War battlefields, sometimes remembered through figures like \u201cMolly Pitcher,\u201d most often involved:",

{id:"r3-04",sub:"3C",u:3,cat:["history"],tier:2,fmt:"mc",pool:"random",

function todayStr(d){ d = d || new Date(); return d.toISOString().slice(0,10); }
function daysAgo(n){ const d=new Date(); d.setDate(d.getDate()-n); return todayStr(d); }
function esc(s){ return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function boldNegation(s){
  return esc(s).replace(/\b(NOT|EXCEPT)\b/g, '<span class="negation">$1</span>');
}
function shufflePerm(n){
  const p = Array.from({length:n}, (_,i)=>i);
  for(let i=p.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [p[i],p[j]]=[p[j],p[i]]; }
  return p;
}
function shuffleArr(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; }
  return a;
}

}

async function loadState(){
  try{
    const r = await window.storage.get(STORAGE_KEY, false);
    if(r && r.value){ return Object.assign(defaultState(), JSON.parse(r.value)); }
  }catch(e){ /* key not found or storage unavailable */ }
  return defaultState();
}
let saveFailWarned = false;
async function saveState(){
  try{
    const res = await window.storage.set(STORAGE_KEY, JSON.stringify(STATE), false);
    if(!res && !saveFailWarned){ saveFailWarned = true; showToast("Heads up — progress might not be saving right now (private browsing can block this)."); }
  }catch(e){
    if(!saveFailWarned){ saveFailWarned = true; showToast("Heads up — progress might not be saving right now (private browsing can block this)."); }
  }
}
function showToast(msg){
  const el = document.createElement('div');
  el.className = 'toast fadein';
  el.textContent = msg;
  document.body.appendChild(el);
  clearTimeout(TOAST_TIMER);
  TOAST_TIMER = setTimeout(()=>el.remove(), 4200);
}

// ---------- normalization / fuzzy matching (§6) ----------
function normalizeAnswer(s){
  return String(s).toLowerCase()
    .replace(/[.,!?;:'"()]/g,'')
    .replace(/\b(the|a|an)\b/g,'')
    .replace(/\s+/g,' ')
    .trim();
}
function fuzzyMatch(input, accepted){
  const n = normalizeAnswer(input);
  if(!n) return false;
  for(const acc of accepted){
    const na = normalizeAnswer(acc);
    if(n === na) return true;
    if(n.includes(na) || na.includes(n)) return true;
  }
  return false;
}

// ---------- sound (no external assets — synthesized) ----------
let audioCtx = null;
function beep(kind){
  if(STATE.settings.muted) return;
  try{
    audioCtx = audioCtx || new (window.AudioContext||window.webkitAudioContext)();
    const o = audioCtx.createOscillator(); const g = audioCtx.createGain();
    o.connect(g); g.connect(audioCtx.destination);
    if(kind==='correct'){ o.type='sine'; o.frequency.value=740; g.gain.value=.08;
      o.frequency.exponentialRampToValueAtTime(988, audioCtx.currentTime+.12); }
    else { o.type='sine'; o.frequency.value=220; g.gain.value=.06; }
    o.start();
    g.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + .32);
    o.stop(audioCtx.currentTime + .33);
  }catch(e){}
}

// ---------- pronunciation (browser speech synthesis, best available US voice) ----------
let cachedVoice = null;
function pickBestVoice(){
  if(!window.speechSynthesis) return null;
  const voices = window.speechSynthesis.getVoices() || [];
  if(!voices.length) return null;
  const usVoices = voices.filter(v => (v.lang||'').toLowerCase().startsWith('en-us') || (v.lang||'').toLowerCase()==='en_us');
  const pool = usVoices.length ? usVoices : voices.filter(v=>(v.lang||'').toLowerCase().startsWith('en'));
  const preferredNames = /google us english|samantha|aria|jenny|natural|ava|nova/i;
  const best = pool.find(v => preferredNames.test(v.name)) || pool[0] || voices[0];
  return best || null;
}
if(window.speechSynthesis){
  window.speechSynthesis.onvoiceschanged = () => { cachedVoice = pickBestVoice(); };
  cachedVoice = pickBestVoice();
}
function speakTerm(text){
  if(!window.speechSynthesis){ showToast("Pronunciation isn't available in this browser."); return; }
  try{
    window.speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    const v = cachedVoice || pickBestVoice();
    if(v){ u.voice = v; u.lang = v.lang; } else { u.lang = 'en-US'; }
    u.rate = 0.92;
    window.speechSynthesis.speak(u);
  }catch(e){ showToast("Couldn't play pronunciation."); }
}

// ---------- notes markup: **bold key fact**, ==highlighted trap==, auto-linked glossary terms ----------
function renderNoteText(raw, glossaryTerms){
  let s = esc(raw);
  s = s.replace(/\*\*(.+?)\*\*/g, '<b class="note-key">$1</b>');
  s = s.replace(/==(.+?)==/g, '<span class="note-trap">$1</span>');
  if(glossaryTerms && glossaryTerms.length){
    // longest terms first so multi-word terms match before their substrings
    const sorted = glossaryTerms.slice().sort((a,b)=>b.term.length-a.term.length);
    sorted.forEach(v=>{
      const escTerm = esc(v.term).replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
      const re = new RegExp('(?<![>\\w])(' + escTerm + ')(?!\\w)', 'i');
      if(re.test(s)){
        s = s.replace(re, (m)=>`<span class="gloss-term" onclick="openGlossary('${encodeURIComponent(v.term)}')">${m}</span>`);
      }
    });
  }
  return s;
}
let GLOSSARY_CTX = null; // which subunit's vocab list is active, for openGlossary lookups
function openGlossary(encodedTerm){
  const term = decodeURIComponent(encodedTerm);
  const list = GLOSSARY_CTX || [];
  const v = list.find(x=>x.term.toLowerCase()===term.toLowerCase());
  if(!v) return;
  const modal = document.createElement('div');
  modal.className = 'lightbox-backdrop';
  modal.onclick = (e)=>{ if(e.target===modal) modal.remove(); };
  modal.innerHTML = `<div class="modal-card">
    <div class="row between mb12"><h3 style="font-size:17px;">${esc(v.term)}</h3>
      <button class="speaker-btn" onclick="speakTerm('${esc(v.term).replace(/'/g,"\\'")}')" title="Hear pronunciation">🔊</button></div>
    <p style="line-height:1.6;">${esc(v.def)}</p>
    ${v.mnemonic ? `<div class="mnemonic-box"><b>💡 Memory trick:</b> ${esc(v.mnemonic)}</div>` : ''}
    <button class="btn ghost mt16" onclick="this.closest('.lightbox-backdrop').remove()">Close</button>
  </div>`;
  document.body.appendChild(modal);
}

// ===================== MASTERY ENGINE =====================
function getMastery(qid){
  return STATE.mastery[qid] || { streak:0, confidentDays:[], unsureEver:false, wrongCounts:{}, manualFlag:false,
    cleared:false, durable:false, hadClearedBefore:false, lastSeenDay:null, lastTier:null };
}
function inReviewList(m){
  return !m.cleared || m.unsureEver || m.manualFlag;
}
function recordAnswer(qid, correct, confident, chosenIdx){
  const today = todayStr();
  const m = getMastery(qid);
  m.lastSeenDay = today;
  if(correct){
    if(confident){
      m.streak = (m.streak||0) + 1;
      m.confidentDays = (m.confidentDays||[]).concat([today]).slice(-2);
      if(m.streak >= 2){
        m.cleared = true; m.hadClearedBefore = true;
        m.durable = new Set(m.confidentDays).size >= 2;
      }
      m.lastTier = null;
    } else {
      m.streak = 0; m.confidentDays = []; m.cleared = false; m.durable = false;
      m.unsureEver = true; m.lastTier = null;
    }
  } else {
    const wasSolid = m.cleared || m.durable || m.hadClearedBefore;
    m.streak = 0; m.confidentDays = []; m.cleared = false; m.durable = false;
    m.wrongCounts = m.wrongCounts || {};
    m.wrongCounts[chosenIdx] = (m.wrongCounts[chosenIdx]||0) + 1;
    if(m.wrongCounts[chosenIdx] >= 2) m.lastTier = 'recurring';
    else if(wasSolid) m.lastTier = 'slipped';
    else if(confident) m.lastTier = 'confident-miss';
    else m.lastTier = 'new-gap';
  }
  STATE.mastery[qid] = m;
  STATE.history.push({ qid, correct, confident, day: today, ts: Date.now() });
  if(STATE.history.length > 400) STATE.history = STATE.history.slice(-400);
  bumpStreak(today);
  saveState();
}
function bumpStreak(today){
  const s = STATE.streaks;
  if(s.lastActiveDay !== today){
    s.dayStreak = (s.lastActiveDay === daysAgo(1)) ? (s.dayStreak+1) : 1;
    s.lastActiveDay = today;
    s.bestStreak = Math.max(s.bestStreak||0, s.dayStreak);
  }
}
function weightForQuestion(qid){
  const hist = STATE.history.filter(h=>h.qid===qid);
  if(!hist.length) return 0;
  const last = hist[hist.length-1];
  if(!last.correct) return 0;
  return last.confident ? 1.0 : 0.5;
}
function unitReadiness(unitId){
  const qs = QUESTIONS.filter(q=>q.u===unitId);
  const sum = qs.reduce((a,q)=>a+weightForQuestion(q.id),0);
  return qs.length ? Math.round(100*sum/qs.length) : 0;
}
function subReadiness(subId){
  const qs = QUESTIONS.filter(q=>q.sub===subId);
  const sum = qs.reduce((a,q)=>a+weightForQuestion(q.id),0);
  return qs.length ? Math.round(100*sum/qs.length) : 0;
}
function overallReadiness(){
  const sum = QUESTIONS.reduce((a,q)=>a+weightForQuestion(q.id),0);
  return Math.round(100*sum/QUESTIONS.length);
}
function weakestUnit(){
  let best=null,score=101;
  for(const u of UNITS){ const r=unitReadiness(u.id); if(r<score){score=r;best=u.id;} }
  return best;
}
function weakestSubunit(){
  let best=null,score=101;
  for(const s of SUBUNITS){ const r=subReadiness(s.id); if(r<score){score=r;best=s.id;} }
  return best;
}
function reviewListIds(){
  return QUESTIONS.filter(q=>inReviewList(getMastery(q.id))).map(q=>q.id);
}
function dueScore(qid){
  const m = getMastery(qid);
  let score = 0;
  if(m.lastTier==='confident-miss') score += 100;
  else if(m.lastTier==='slipped') score += 95;
  else if(m.lastTier==='recurring') score += 85;
  else if(m.unsureEver) score += 40;
  else if(!m.lastSeenDay) score += 30;
  if(m.manualFlag) score += 20;
  if(m.lastSeenDay){
    const days = Math.round((Date.now() - new Date(m.lastSeenDay).getTime())/86400000);
    score += Math.min(days*2, 30);
  } else score += 15;
  return score;
}
function dueWeightedQueue(ids){
  return ids.slice().sort((a,b)=>dueScore(b)-dueScore(a));
}

// ===================== EXAM SET PARTITIONING (3 fixed, non-overlapping practice tests) =====================
function buildExamSets(){
  const core = QUESTIONS.filter(q=>q.pool!=='random');
  const byUnit = {};
  core.forEach(q=>{ (byUnit[q.u]=byUnit[q.u]||[]).push(q.id); });
  const sets = [[],[],[]];
  let offset = 0;
  Object.keys(byUnit).sort().forEach(u=>{
    byUnit[u].forEach((id,i)=>{ sets[(i+offset)%3].push(id); });
    offset += byUnit[u].length % 3;
  });
  return sets;
}
const EXAM_SETS = buildExamSets();

  const bars = recent.map(h=>`<div class="hb-bar ${h.correct?'c':'w'}" style="height:${h.correct?24:14}px;"></div>`).join('');
  return `<div class="heartbeat">${bars || '<span class="muted small">No attempts yet — start a session!</span>'}</div>`;
}
function examCountdown(){
  if(!STATE.settings.examDate) return `<div class="small muted">Tap to set your Iowa test date →</div>`;
  const d = Math.ceil((new Date(STATE.settings.examDate) - new Date())/86400000);
  return `<div class="display" style="font-size:22px;">${d>=0? d+' days' : 'Test day has passed'}</div><div class="muted small">until the Iowa Assessment</div>`;
}
function heatmapGrid(){
  const counts = {};
  STATE.history.forEach(h=>{ counts[h.day] = (counts[h.day]||0)+1; });
  const days = 63; // 9 weeks
  const cells = [];
  for(let i=days-1;i>=0;i--){ const d = daysAgo(i); const c = counts[d]||0;
    const lvl = c===0?'':(c<2?'l1':(c<5?'l2':'l3'));
    cells.push(`<div class="heat-cell ${lvl}" title="${d}: ${c} answered"></div>`);
  }
  return `<div class="heatmap">${cells.join('')}</div>`;
}
function misconceptionCards(){
  const out = [];
  QUESTIONS.forEach(q=>{
    const m = getMastery(q.id);
    if(!m.wrongCounts || m.cleared) return;
    const entry = Object.entries(m.wrongCounts).find(([idx,cnt])=>cnt>=2);
    if(entry) out.push({ q, badIdx: parseInt(entry[0]) });
  });
  return out.slice(0,3);
}
function tipOfTheDay(){
  const idx = new Date().getDate() % EXAM_DAY_TIPS.length;

}

// ===================== LEARN MODE (blind guess → real notes, sub-unit by sub-unit) =====================
function startLearn(unitId, opts){
  opts = opts || {};
  const subs = opts.onlySub ? [SUBUNITS.find(s=>s.id===opts.onlySub)] : SUBUNITS.filter(s=>s.unit===unitId);
  let startIdx = 0;
  if(!opts.onlySub){
    const fi = subs.findIndex(s=>!STATE.learned[s.id]);
    startIdx = fi===-1 ? 0 : fi;
  }
  LEARN = { unitId, subs, idx:startIdx, phase: opts.onlySub ? 'notes' : 'guess',
    chosen:null, revealed:false, guessQ:null, perm:null,
    returnView: opts.returnView || null, thenPractice: !!opts.thenPractice };
  if(LEARN.phase==='guess') pickGuessQuestion();
  nav('learn');
}
function pickGuessQuestion(){
  const sub = LEARN.subs[LEARN.idx];
  const pool = QUESTIONS.filter(q=>q.sub===sub.id && q.fmt==='mc');
  const src = pool.length ? pool : QUESTIONS.filter(q=>q.sub===sub.id);
  LEARN.guessQ = src[Math.floor(Math.random()*src.length)];
  LEARN.chosen = null; LEARN.revealed = false;
  LEARN.perm = LEARN.guessQ.fmt==='mc' ? shufflePerm(LEARN.guessQ.ch.length) : null;
}
function learnSelectChoice(displayPos){
  if(LEARN.revealed) return;
  const realIdx = LEARN.perm[displayPos];
  LEARN.chosen = displayPos; LEARN.revealed = true;
  beep(realIdx===LEARN.guessQ.a ? 'correct' : 'incorrect');
  render();
}
function learnSkipGuess(){ LEARN.revealed = true; LEARN.chosen = -1; learnShowNotes(); }
function learnShowNotes(){ LEARN.phase = 'notes'; render(); }
function learnPracticeSub(){
  const sub = LEARN.subs[LEARN.idx];
  STATE.learned[sub.id] = true; saveState();
  startSession('subquiz', sub.id);
}
function learnNextSub(){
  const sub = LEARN.subs[LEARN.idx];
  STATE.learned[sub.id] = true; saveState();
  if(LEARN.idx + 1 < LEARN.subs.length){
    LEARN.idx++; LEARN.phase = 'guess'; pickGuessQuestion(); render();
  } else {
    const uid = LEARN.unitId; LEARN = null;
    showToast("Nice — you've reviewed every part of this unit. Ready for Study or a Graded Quiz whenever you are.");
    nav('unit',{unitId:uid});
  }
}
function learnReturnFromDetour(){
  const sub = LEARN.subs[0];
  STATE.learned[sub.id] = true; saveState();
  const rv = LEARN.returnView, tp = LEARN.thenPractice, subId = sub.id, uid = sub.unit;
  LEARN = null;
  if(tp) startSession('subquiz', subId);
  else if(rv==='play') nav('play');
  else if(rv==='examresult') nav('examresult');
  else nav('unit', {unitId:uid});
}
function exitLearn(){ const uid = LEARN ? LEARN.unitId : null; LEARN=null; if(uid) nav('unit',{unitId:uid}); else nav('units'); }

function renderLearn(){
  if(!LEARN) return `<div class="panel">No active lesson. <button class="btn" onclick="nav('units')">Back to Units</button></div>`;
  const sub = LEARN.subs[LEARN.idx];
  const isDetour = !!LEARN.returnView || LEARN.thenPractice;
  const dots = isDetour ? '' : LEARN.subs.map((s,i)=>`<span class="badge ${i===LEARN.idx?'blue':(STATE.learned[s.id]?'green':'')}" style="font-size:10.5px;">${i+1}</span>`).join(' ');

      ${q.ch.map((_,displayPos)=>{
        const realIdx = LEARN.perm[displayPos];
        let cls='choice';
        if(LEARN.revealed && LEARN.chosen>=0){ if(realIdx===q.a) cls+=' correct'; else if(displayPos===LEARN.chosen) cls+=' incorrect'; else cls+=' dim'; }
        return `<button class="${cls}" ${LEARN.revealed?'disabled':''} onclick="learnSelectChoice(${displayPos})">${esc(q.ch[realIdx])}</button>`;

  } else {

    GLOSSARY_CTX = notes.vocab || [];
    body = `<div class="panel">
      <h2 style="font-size:17px;" class="mb12">📘 ${esc(sub.title)} — What to Know</h2>
      ${notes.diagram && DIAGRAMS[notes.diagram] ? `<div class="panel tight mb16">${DIAGRAMS[notes.diagram]}</div>` : ''}
      <ul class="notes-list">${notes.points.map(p=>`<li>${renderNoteText(p, notes.vocab)}</li>`).join('')}</ul>
      ${notes.vocab && notes.vocab.length ? `<div class="mt16"><b class="small muted">KEY TERMS — tap any term above, or here, for a definition + pronunciation</b>
        <div class="grid cols-2 mt8">${notes.vocab.map(v=>`<div class="panel tight clickable" onclick="openGlossary('${encodeURIComponent(v.term)}')"><b class="gloss-term">${esc(v.term)}</b><div class="small muted mt8">${esc(v.def)}</div></div>`).join('')}</div></div>` : ''}
      <div class="panel tight mt16" style="border-color:var(--trap);">

          : `<button class="btn primary" onclick="learnNextSub()">${LEARN.idx+1 < LEARN.subs.length ? 'Next Sub-Unit →' : 'Finish — Ready to Practice'}</button>
             <button class="btn ghost" onclick="learnPracticeSub()">Quick Practice: Just This Sub-Unit</button>`}
      </div>
    </div>`;
  }
  return `<div class="panel tight mb12"><div class="row between"><span class="small muted">${isDetour?'Reviewing':'Sub-unit '+(LEARN.idx+1)+' of '+LEARN.subs.length+':'} ${esc(sub.title)}</span><button class="btn ghost sm" onclick="exitLearn()">Exit</button></div>
    ${dots?`<div class="row wrap mt8" style="gap:4px;">${dots}</div>`:''}</div>
    ${body}`;
}
