// ===================== SESSION / PLAYER =====================
function buildQueue(mode, unitId, variant, length){
  let pool;
  if(mode==='study' || mode==='quiz') pool = QUESTIONS.filter(q=>q.u===unitId);
  else if(mode==='subquiz') pool = QUESTIONS.filter(q=>q.sub===unitId); // unitId repurposed as subId here
  else if(mode==='interleaved') pool = QUESTIONS.slice();
  else if(mode==='review') pool = reviewListIds().map(id=>QUESTIONS.find(q=>q.id===id));
  else if(mode==='examsim'){
    if(variant) pool = EXAM_SETS[variant-1].map(id=>QUESTIONS.find(q=>q.id===id));
    else pool = QUESTIONS.filter(q=>q.pool==='random'); // Random NEVER overlaps with Tests 1–3
  }
  const arr = shuffleArr(pool);
  if(mode==='examsim' && !variant) return arr.slice(0, Math.min(length||15, arr.length));
  return arr;
}
function startSession(mode, unitId, variant, length, prediction){
  const queue = buildQueue(mode, unitId, variant, length);
  if(!queue.length){ showToast("Nothing to practice here yet."); return; }
  PLAY = {
    mode, unitId, variant, queue, idx:0,
    revealed:false, chosen:null, typedVal:'', typedCorrect:null, confidence:null,
    score:{correct:0,total:0}, missed:[], correctThisQ:false, currentPerm:null,
    prediction: prediction===undefined?null:prediction,
    timerEnd: mode==='examsim' ? (Date.now() + EXAM_SPEC.minutes*60000) : null,
    startedAt: Date.now(),
  };
  const q0 = queue[0];
  PLAY.currentPerm = q0.fmt==='mc' ? shufflePerm(q0.ch.length) : null;
  nav('play');
  if(mode==='examsim') tickTimer();
}
function tickTimer(){
  clearInterval(timerInterval);
  timerInterval = setInterval(()=>{
    if(!PLAY || PLAY.mode!=='examsim'){ clearInterval(timerInterval); return; }
    if(Date.now() >= PLAY.timerEnd){ clearInterval(timerInterval); finishSession(); return; }
    const el = document.getElementById('examTimer');
    if(el){ const secs = Math.max(0, Math.round((PLAY.timerEnd - Date.now())/1000));
      el.textContent = String(Math.floor(secs/60)).padStart(2,'0')+':'+String(secs%60).padStart(2,'0'); }
  }, 500);
}
function currentQ(){ return PLAY.queue[PLAY.idx]; }

function renderPlay(){
  if(!PLAY) return `<div class="panel">Session ended. <button class="btn" onclick="nav('dashboard')">Back to Dashboard</button></div>`;
  const q = currentQ();
  const modeLabel = {study:'Study Mode',quiz:'Graded Quiz',subquiz:'Sub-Unit Practice',interleaved:'Mixed Practice',review:'Review List Practice',
    examsim: PLAY.variant ? ('Practice Test '+PLAY.variant) : 'Random Exam Sim'}[PLAY.mode];
  const needsConfidence = (PLAY.mode!=='study' && PLAY.mode!=='examsim');
  let top = `<div class="row between mb12">
      <span class="badge blue">${esc(modeLabel)}</span>
      <span class="small muted">Question ${PLAY.idx+1} of ${PLAY.queue.length}</span>
      ${PLAY.mode==='examsim' ? `<span class="badge red" id="examTimer">--:--</span>` : ''}
    </div>`;
  let body = '';
  const negFlag = q.neg ? ' <span class="badge red small">watch the negative!</span>' : '';

  if(needsConfidence && PLAY.confidence===null && !PLAY.revealed){
    body = `<div class="panel">
      <div class="mb12">${boldNegation(q.stem)}${negFlag}</div>
      <div class="muted small mb12">Before you answer — how sure are you?</div>
      <div class="btn-row">
        <button class="btn primary" onclick="setConfidence(true)">🟢 Confident</button>
        <button class="btn ghost" onclick="setConfidence(false)">🟡 Not sure</button>
      </div>
    </div>`;
  } else if(q.fmt==='mc'){
    body = `<div class="panel">
      <div class="mb12">${boldNegation(q.stem)}${negFlag}</div>
      ${q.ch.map((_,displayPos)=>{
        const realIdx = PLAY.currentPerm[displayPos];
        let cls='choice'; let extra='';
        if(PLAY.revealed){
          if(realIdx===q.a) cls+=' correct';
          else if(displayPos===PLAY.chosen) cls+=' incorrect';
          else cls+=' dim';
          extra = `<div class="choice-why">${esc(q.why[realIdx])}</div>`;
        }
        return `<button class="${cls}" ${PLAY.revealed?'disabled':''} onclick="selectChoice(${displayPos})">${esc(q.ch[realIdx])}${extra}</button>`;
      }).join('')}
    </div>`;
  } else { // type format
    body = `<div class="panel">
      <div class="mb12">${boldNegation(q.stem)}${negFlag}</div>
      ${!PLAY.revealed ? `
        <input type="text" id="typedInput" placeholder="Type your answer..." style="width:100%;" value="${esc(PLAY.typedVal||'')}">
        <button class="btn primary mt12" onclick="submitTyped()">Check Answer</button>
      ` : `
        <div class="choice ${PLAY.typedCorrect?'correct':'incorrect'}">${esc(PLAY.typedVal)||'(no answer)'}
          <div class="choice-why">${PLAY.typedCorrect? 'Correct!' : 'Correct answer: '+esc(q.full)}</div></div>
      `}
    </div>`;
  }

  const flagBtn = `<button class="btn ghost sm" onclick="toggleManualFlag('${q.id}');render()">🚩 ${getMastery(q.id).manualFlag?'Flagged':'Flag for review'}</button>`;
  let nextBtn = '';
  if(PLAY.revealed){
    nextBtn = `<button class="btn primary mt12" onclick="nextQuestion()">${PLAY.idx+1<PLAY.queue.length?'Next →':'Finish'}</button>`;
    if(PLAY.mode!=='study' && PLAY.mode!=='examsim' && !PLAY.correctThisQ){
      nextBtn += `<button class="btn ghost mt12" style="margin-left:8px;" onclick="restudyThisQuestion()">📖 Study this, then retry</button>`;
    }
  }
  return top + body + `<div class="row between mt12">${flagBtn}<button class="btn ghost sm" onclick="quitSession()">Exit Session</button></div>${nextBtn}`;
}

function setConfidence(val){ PLAY.confidence = val; render(); }
function selectChoice(displayPos){
  if(PLAY.revealed) return;
  const q = currentQ();
  const realIdx = PLAY.currentPerm[displayPos];
  PLAY.chosen = displayPos; PLAY.revealed = true;
  const correct = (realIdx===q.a);
  PLAY.correctThisQ = correct;
  beep(correct?'correct':'incorrect');
  if(PLAY.mode!=='study'){
    PLAY.score.total++; if(correct) PLAY.score.correct++;
    if(PLAY.mode==='examsim'){ if(!correct) PLAY.missed.push(q.id); }
    else recordAnswer(q.id, correct, PLAY.confidence===null?true:PLAY.confidence, realIdx);
  }
  render();
  const card = document.querySelector('.panel'); if(card) card.classList.add(correct?'pop':'shake');
}
function submitTyped(){
  const val = document.getElementById('typedInput').value;
  const q = currentQ();
  const correct = fuzzyMatch(val, q.accept);
  PLAY.typedVal = val; PLAY.typedCorrect = correct; PLAY.revealed = true; PLAY.correctThisQ = correct;
  beep(correct?'correct':'incorrect');
  if(PLAY.mode!=='study'){
    PLAY.score.total++; if(correct) PLAY.score.correct++;
    if(PLAY.mode==='examsim'){ if(!correct) PLAY.missed.push(q.id); }
    else recordAnswer(q.id, correct, PLAY.confidence===null?true:PLAY.confidence, -1);
  }
  render();
}
function restudyThisQuestion(){
  const q = currentQ();
  PLAY.queue.splice(PLAY.idx+1, 0, q); // retry copy waits right after this one
  const subObj = SUBUNITS.find(s=>s.id===q.sub);
  startLearn(subObj.unit, {onlySub:subObj.id, returnView:'play'});
}
function nextQuestion(){
  PLAY.idx++;
  PLAY.revealed=false; PLAY.chosen=null; PLAY.typedVal=''; PLAY.typedCorrect=null; PLAY.confidence=null; PLAY.correctThisQ=false;
  if(PLAY.idx >= PLAY.queue.length){ finishSession(); return; }
  const q = currentQ();
  PLAY.currentPerm = q.fmt==='mc' ? shufflePerm(q.ch.length) : null;
  render();
}
function quitSession(){
  if(!PLAY){ nav('dashboard'); return; }
  if(PLAY.mode==='examsim'){
    if(!confirm("Exiting now won't count as a completed practice test — your progress on this attempt will be lost. Exit anyway?")) return;
  }
  const mode = PLAY.mode, uid = PLAY.unitId;
  clearInterval(timerInterval);
  PLAY = null;
  if(mode==='study' || mode==='quiz') nav('unit',{unitId:uid});
  else if(mode==='subquiz'){ const su = SUBUNITS.find(s=>s.id===uid); nav('unit',{unitId: su?su.unit:1}); }
  else nav('dashboard');
}
function finishSession(){
  clearInterval(timerInterval);
  if(PLAY.mode==='examsim'){
    if(PLAY.variant){
      STATE.examResults[PLAY.variant] = { done:true, correct:PLAY.score.correct, total:PLAY.score.total, day:todayStr() };
      saveState();
    }
    nav('examresult');
  } else {
    showToast(`Session complete — ${PLAY.score.correct}/${PLAY.score.total} correct.`);
    PLAY=null;
    nav('dashboard');
  }
}
function studyMissedFromResult(qid){
  const q = QUESTIONS.find(x=>x.id===qid);
  const subObj = SUBUNITS.find(s=>s.id===q.sub);
  startLearn(subObj.unit, {onlySub:subObj.id, returnView:'examresult'});
}
function renderExamResult(){
  if(!PLAY) return `<div class="panel">No recent exam session.</div>`;
  const pct = PLAY.score.total? Math.round(100*PLAY.score.correct/PLAY.score.total):0;
  const byCat = {};
  PLAY.queue.slice(0, PLAY.score.total).forEach(q=>{
    q.cat.forEach(c=>{ byCat[c]=byCat[c]||{c:0,t:0}; byCat[c].t++; if(!PLAY.missed.includes(q.id)) byCat[c].c++; });
  });
  const catRows = Object.keys(byCat).map(c=>`<div class="row between"><span>${esc(c)}</span><span class="muted small">${byCat[c].c}/${byCat[c].t}</span></div>`).join('');
  const predictionRow = PLAY.prediction!==null ? `<div class="small muted mt8">You predicted ${PLAY.prediction} correct — you got ${PLAY.score.correct}. ${PLAY.score.correct>=PLAY.prediction?'Nice, you matched or beat your own guess!':'Good data point for next time!'}</div>` : '';
  return `
  <div class="panel mb16 center">
    <div class="badge blue mb8">${PLAY.variant ? 'Practice Test '+PLAY.variant+' Result' : 'Exam Simulation Result'}</div>
    <div class="display" style="font-size:36px;color:var(--accent2);">${pct}%</div>
    <div class="muted">${PLAY.score.correct} of ${PLAY.score.total} answered correctly</div>
    <div class="small muted mt8">Real Iowa Level ${EXAM_SPEC.level} Social Studies: ${EXAM_SPEC.count} questions in ${EXAM_SPEC.minutes} minutes.</div>
    ${predictionRow}
  </div>
  <div class="panel mb16">
    <h2 style="font-size:15px;" class="mb8">By Category</h2>
    ${catRows}
  </div>
  <div class="panel">
    <div class="row between"><h2 style="font-size:15px;">Missed Questions (${PLAY.missed.length})</h2>
    ${PLAY.missed.length? `<button class="btn sm" onclick="addMissedToReview()">Add all to Review List</button>`:''}</div>
    ${PLAY.missed.map(id=>{const q=QUESTIONS.find(x=>x.id===id); return `<div class="row between mt8">
      <span class="small muted">Unit ${q.u} — ${esc(q.stem.slice(0,80))}...</span>
      <button class="btn ghost sm" onclick="studyMissedFromResult('${id}')">Study this</button></div>`;}).join('') || '<div class="small muted mt8">None — great job!</div>'}
  </div>
  <button class="btn primary mt16" onclick="PLAY=null;nav('dashboard')">Back to Dashboard</button>
  `;
}
function addMissedToReview(){
  PLAY.missed.forEach(id=>{ const m=getMastery(id); m.manualFlag=true; STATE.mastery[id]=m; });
  saveState(); showToast("Added to Review List."); render();
}

// ===================== GAMES (optional reinforcement layer — never affects mastery) =====================
function startGame(type, unitId){
  if(type==='termmatch'){
    const subs = SUBUNITS.filter(s=>s.unit===unitId);
    const pool = [];
    subs.forEach(s=>{ (LESSON_NOTES[s.id].vocab||[]).forEach(v=>pool.push(v)); });
    if(pool.length < 2){ showToast("Not enough terms for this game yet."); return; }
    GAME = { type, unitId, pool: shuffleArr(pool), idx:0, score:0, revealed:false, chosenDef:null, options:null };
    setupTermRound();
  } else if(type==='speedround'){
    const pool = QUESTIONS.filter(q=>q.u===unitId && q.fmt==='mc' && q.stem.trim().endsWith(':'));
    if(pool.length < 4){ showToast("Not enough questions for this game yet."); return; }
    const items = shuffleArr(pool).slice(0, Math.min(12, pool.length)).map(q=>{
      const useTrue = Math.random() < 0.5;
      const stemBase = q.stem.trim().replace(/:$/,'');
      let statement, answer;
      if(useTrue){ statement = stemBase + ' ' + q.ch[q.a] + '.'; answer = true; }
      else{
        const wrongIdxs = q.ch.map((_,i)=>i).filter(i=>i!==q.a);
        const wi = wrongIdxs[Math.floor(Math.random()*wrongIdxs.length)];
        statement = stemBase + ' ' + q.ch[wi] + '.'; answer = false;
      }
      return { statement, answer, q };
    });
    GAME = { type, unitId, items, idx:0, score:0, revealed:false, startedAt:Date.now() };
  } else if(type==='timeline'){
    const events = TIMELINE_EVENTS[unitId] || [];
    if(events.length < 3){ showToast("Not enough events for this game yet."); return; }
    const chosen = shuffleArr(events).slice(0, Math.min(6, events.length));
    GAME = { type, unitId, correct: chosen.slice().sort((a,b)=>a.year-b.year), available: shuffleArr(chosen), placed: [], checked:false };
  }
  nav('game');
}
function setupTermRound(){
  const term = GAME.pool[GAME.idx];
  const distractorPool = GAME.pool.filter(v=>v.term!==term.term);
  const distractors = shuffleArr(distractorPool).slice(0,3).map(v=>v.def);
  GAME.options = shuffleArr([term.def, ...distractors]);
  GAME.revealed = false; GAME.chosenDef = null;
}
function termMatchAnswer(def){
  if(GAME.revealed) return;
  const term = GAME.pool[GAME.idx];
  GAME.chosenDef = def; GAME.revealed = true;
  const correct = def===term.def;
  if(correct) GAME.score++;
  beep(correct?'correct':'incorrect');
  render();
}
function termMatchNext(){
  GAME.idx++;
  if(GAME.idx >= GAME.pool.length){ finishGame(); return; }
  setupTermRound(); render();
}
function speedAnswer(val){
  if(GAME.revealed) return;
  const item = GAME.items[GAME.idx];
  GAME.revealed = true; GAME.lastCorrect = (val===item.answer);
  if(GAME.lastCorrect) GAME.score++;
  beep(GAME.lastCorrect?'correct':'incorrect');
  render();
  setTimeout(()=>{ if(GAME && GAME.type==='speedround'){ GAME.idx++; GAME.revealed=false;
    if(GAME.idx >= GAME.items.length){ finishGame(); } else render(); } }, 650);
}
function timelinePlace(eventId){
  if(GAME.checked) return;
  if(GAME.placed.find(e=>e.id===eventId)) return;
  const ev = GAME.available.find(e=>e.id===eventId);
  GAME.placed.push(ev); render();
}
function timelineCheck(){ GAME.checked = true; render(); }
function timelineReset(){ GAME.placed = []; GAME.checked = false; render(); }
function finishGame(){
  const key = GAME.unitId+':'+GAME.type;
  const total = GAME.type==='termmatch' ? GAME.pool.length : GAME.items.length;
  STATE.gameScores[key] = Math.max(STATE.gameScores[key]||0, GAME.score);
  saveState();
  GAME.finished = true; GAME.finalTotal = total;
  render();
}
function exitGame(){ const uid = GAME ? GAME.unitId : null; GAME=null; if(uid) nav('unit',{unitId:uid}); else nav('units'); }

function renderGame(){
  if(!GAME) return `<div class="panel">No active game. <button class="btn" onclick="nav('units')">Back to Units</button></div>`;
  const u = UNITS.find(x=>x.id===GAME.unitId);
  const header = `<div class="panel tight mb12"><div class="row between">
    <span class="small muted">🎮 ${GAME.type==='termmatch'?'Term Match':GAME.type==='speedround'?'Speed Round':'Timeline Challenge'} — ${esc(u.title)}</span>
    <button class="btn ghost sm" onclick="exitGame()">Exit</button></div></div>`;

  if(GAME.finished){
    const total = GAME.finalTotal;
    return header + `<div class="panel center pop">
      <div class="display" style="font-size:30px;color:var(--accent2);">${GAME.score} / ${total}</div>
      <p class="muted">Nice work! Best score for this game: ${STATE.gameScores[GAME.unitId+':'+GAME.type]}</p>
      <div class="btn-row" style="justify-content:center;">
        <button class="btn primary" onclick="startGame('${GAME.type}',${GAME.unitId})">Play Again</button>
        <button class="btn ghost" onclick="exitGame()">Back to Unit</button>
      </div>
    </div>`;
  }

  if(GAME.type==='termmatch'){
    const term = GAME.pool[GAME.idx];
    return header + `<div class="panel">
      <div class="row between mb12"><span class="small muted">Term ${GAME.idx+1} of ${GAME.pool.length}</span><span class="badge blue">Score: ${GAME.score}</span></div>
      <div class="row" style="gap:10px;" class="mb12"><h2 style="font-size:20px;">${esc(term.term)}</h2>
        <button class="speaker-btn" onclick="speakTerm('${esc(term.term).replace(/'/g,"\\'")}')">🔊</button></div>
      <p class="muted small mb12">Which definition matches this term?</p>
      ${GAME.options.map(def=>{
        let cls='choice';
        if(GAME.revealed){ if(def===term.def) cls+=' correct'; else if(def===GAME.chosenDef) cls+=' incorrect'; else cls+=' dim'; }
        return `<button class="${cls}" ${GAME.revealed?'disabled':''} onclick="termMatchAnswer(${JSON.stringify(def).replace(/"/g,'&quot;')})">${esc(def)}</button>`;
      }).join('')}
      ${GAME.revealed ? `<button class="btn primary mt12" onclick="termMatchNext()">${GAME.idx+1<GAME.pool.length?'Next →':'Finish'}</button>` : ''}
    </div>`;
  }

  if(GAME.type==='speedround'){
    const item = GAME.items[GAME.idx];
    return header + `<div class="panel">
      <div class="row between mb12"><span class="small muted">Statement ${GAME.idx+1} of ${GAME.items.length}</span><span class="badge blue">Score: ${GAME.score}</span></div>
      <div class="mb16" style="font-size:16px;line-height:1.5;">${esc(item.statement)}</div>
      <div class="row" style="gap:12px;">
        <button class="btn success tf-btn ${GAME.revealed && item.answer? 'pop':''}" style="background:var(--success);color:#06281c;" ${GAME.revealed?'disabled':''} onclick="speedAnswer(true)">TRUE</button>
        <button class="btn danger tf-btn" ${GAME.revealed?'disabled':''} onclick="speedAnswer(false)">FALSE</button>
      </div>
      ${GAME.revealed ? `<div class="mt12 small ${GAME.lastCorrect?'':'shake'}" style="color:${GAME.lastCorrect?'var(--success)':'var(--danger)'};">${GAME.lastCorrect?'Correct!':'Not quite — the statement was '+(item.answer?'TRUE':'FALSE')+'.'}</div>` : ''}
    </div>`;
  }

  if(GAME.type==='timeline'){
    const remaining = GAME.available.filter(e=>!GAME.placed.find(p=>p.id===e.id));
    return header + `<div class="panel">
      <p class="muted small mb12">Tap the events below in the order you think they happened, earliest first.</p>
      <div class="mb16">${GAME.placed.map((ev,i)=>{
        const mark = GAME.checked ? (GAME.correct[i] && GAME.correct[i].id===ev.id ? ' ✅' : ' ❌') : '';
        return `<span class="timeline-slot">${i+1}. ${esc(ev.yearLabel)} — ${esc(ev.label)}${mark}</span>`;
      }).join('') || '<span class="muted small">(tap events below to place them here)</span>'}</div>
      ${!GAME.checked ? `<div class="mb12">${remaining.map(ev=>`<span class="timeline-chip" onclick="timelinePlace('${ev.id}')">${esc(ev.label)}</span>`).join('')}</div>` : ''}
      ${(!GAME.checked && GAME.placed.length===GAME.available.length) ? `<button class="btn primary" onclick="timelineCheck()">Check Order</button>` : ''}
      ${GAME.checked ? `<div class="btn-row mt12">
          <button class="btn primary" onclick="finishTimelineScore()">See Score</button>
          <button class="btn ghost" onclick="timelineReset()">Try Again</button>
        </div>` : ''}
    </div>`;
  }
  return '';
}
function finishTimelineScore(){
  let correctCount = 0;
  GAME.placed.forEach((ev,i)=>{ if(GAME.correct[i] && GAME.correct[i].id===ev.id) correctCount++; });
  GAME.score = correctCount;
  GAME.items = GAME.available; // for finishGame's total lookup
  finishGame();
}

// ===================== EXPORT (feature-guide §11) =====================
function renderExport(){
  return `
  <div class="panel mb16">
    <h2 style="font-size:17px;" class="mb12">Export & Print</h2>
    <p class="muted small">Your progress auto-saves in this browser. These exports are for printing or pasting into a fresh chat — not the primary save.</p>
    <div class="btn-row mt12">
      <button class="btn" onclick="doExport('weak')">Weak Areas Only</button>
      <button class="btn" onclick="doExport('full')">Full Question Bank</button>
      <button class="btn" onclick="doExport('missed')">Everything Ever Missed</button>
    </div>
  </div>
  <div class="panel mb16">
    <h2 style="font-size:15px;" class="mb8">Unit Study Guides (printable notes)</h2>
    <div class="btn-row">
      ${UNITS.map(u=>`<button class="btn ghost sm" onclick="exportStudyGuide(${u.id})">${esc(u.title)}</button>`).join('')}
    </div>
  </div>
  <div class="panel">
    <h2 style="font-size:15px;" class="mb8">Manual Backup</h2>
    <div class="btn-row">
      <button class="btn ghost sm" onclick="copyBackup()">📋 Copy progress as text</button>
    </div>
  </div>`;
}
function questionSetFor(kind){
  if(kind==='full') return QUESTIONS;
  if(kind==='weak') return QUESTIONS.filter(q=>inReviewList(getMastery(q.id)));
  if(kind==='missed') return QUESTIONS.filter(q=>{
    return STATE.history.some(h=>h.qid===q.id && !h.correct);
  });
  return [];
}
function doExport(kind){
  const set = questionSetFor(kind);
  if(!set.length){ showToast("Nothing to export for that yet."); return; }
  const title = {weak:"Weak Areas — Practice Sheet", full:"Full Question Bank", missed:"Everything Ever Missed"}[kind];
  let n = 0;
  const body = set.map(q=>{
    n++;
    const choiceHtml = q.fmt==='mc' ? '<ol type="A">'+q.ch.map(c=>`<li>${esc(c)}</li>`).join('')+'</ol>' : '<p><em>Short answer</em></p>';
    return `<div style="page-break-inside:avoid;margin-bottom:14px;">
      <b>${n}.</b> ${esc(q.stem)}
      ${choiceHtml}
      <p style="color:#555;font-size:12px;">Answer: ${q.fmt==='mc'? esc(q.ch[q.a]) : esc(q.full)}</p>
    </div>`;
  }).join('');
  const win = window.open('', '_blank');
  win.document.write(`<!DOCTYPE html><html><head><title>${esc(title)}</title>
    <style>body{font-family:Georgia,serif;max-width:720px;margin:30px auto;color:#111;} h1{font-family:Arial,sans-serif;}
    @media print{ .noprint{display:none;} }</style></head><body>
    <div class="noprint" style="margin-bottom:16px;"><button onclick="window.print()">Print / Save as PDF</button></div>
    <h1>Saarah — ${esc(title)}</h1><p style="color:#555;">${set.length} question${set.length===1?'':'s'}, Grade 7 Social Studies</p>
    ${body}</body></html>`);
  win.document.close();
}
function copyBackup(){
  const text = JSON.stringify(STATE);
  if(navigator.clipboard){ navigator.clipboard.writeText(text).then(()=>showToast("Copied — paste it somewhere safe.")); }
  else showToast("Clipboard not available in this browser.");
}

// ===================== SETTINGS =====================
function renderSettings(){
  return `
  <div class="panel mb16">
    <h2 style="font-size:17px;" class="mb12">Settings</h2>
    <div class="row between mb12"><span>Sound</span>
      <button class="btn sm ${STATE.settings.muted?'ghost':''}" onclick="toggleMute();render()">${STATE.settings.muted?'Muted':'On'}</button></div>
    <div class="row between mb12"><span>Theme</span>
      <button class="btn sm ${STATE.settings.theme==='dark'?'':'ghost'}" onclick="toggleTheme();render()">${STATE.settings.theme==='dark'?'Dark':'Light'}</button></div>
    <div class="row between mb12"><span>Iowa test date</span>
      <input type="date" value="${STATE.settings.examDate||''}" onchange="setExamDate(this.value)"></div>
  </div>
  <div class="panel">
    <h2 style="font-size:15px;" class="mb8">Reset Progress</h2>
    <p class="muted small">This clears all mastery data and history for this app. Can't be undone.</p>
    <button class="btn danger sm" onclick="resetProgress()">Reset All Progress</button>
  </div>`;
}
function setExamDate(v){ STATE.settings.examDate = v; saveState(); render(); }
function resetProgress(){
  if(!confirm("Really reset all of Saarah's progress on this app?")) return;
  STATE = defaultState(); saveState(); render();
}

boot();
