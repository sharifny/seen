<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Saarah's Last-Minute Review \u2014 Iowa Assessments</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Source+Sans+3:wght@400;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg: #FAF5EC; --bg-elev: #FFFFFF; --ink: #2D2A26; --ink-soft: #6B655C; --line: #E7DFD1;
  --accent: #2B6CB0; --good: #2F855A; --bad: #B23B3B; --warn: #B7791F;
  --diagram-ink: #2D2A26; --diagram-line: #8A8375;
  --shadow: 0 2px 10px rgba(45,42,38,0.08); --radius: 16px;
  --font-display: 'Fraunces', Georgia, serif;
  --font-body: 'Source Sans 3', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  --font-mono: 'JetBrains Mono', ui-monospace, Menlo, monospace;
}
:root, [data-theme]{ --accent-soft: color-mix(in srgb, var(--accent) 16%, var(--bg-elev)); }
[data-theme="dark"]{
  --bg:#211E1A; --bg-elev:#2B2722; --ink:#F3EEE4; --ink-soft:#C2B9AB; --line:#443F37;
  --diagram-ink: #F3EEE4; --diagram-line: #9B927F;
  --shadow: 0 2px 14px rgba(0,0,0,0.4);
}
[data-day="1"]{ --accent: #6B46C1; }
[data-day="2"]{ --accent: #2B6CB0; }
[data-subject="math"]{ --accent: #2B6CB0; }
[data-subject="science"]{ --accent: #2F855A; }
[data-subject="social"]{ --accent: #B7791F; }
[data-subject="ela"]{ --accent: #6B46C1; }
.c1{ --hlcolor: #2B6CB0; } .c2{ --hlcolor: #2F855A; } .c3{ --hlcolor: #B7791F; }

*{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html,body{ height:100%; }
body{ margin:0; background:var(--bg); color:var(--ink); font-family:var(--font-body); padding-bottom:env(safe-area-inset-bottom); -webkit-font-smoothing:antialiased; }
button{ font-family:inherit; touch-action:manipulation; }
h1,h2,h3{ font-family:var(--font-display); font-weight:600; margin:0 0 .3em; }
strong{ color:var(--hlcolor, var(--accent)); }
.app{ max-width:660px; margin:0 auto; min-height:100vh; padding:max(16px, env(safe-area-inset-top)) 16px 100px; }

.bismillah{ text-align:center; font-family:var(--font-display); color:var(--ink-soft); margin:4px 0 14px; }
.home-header{ text-align:center; margin-bottom:14px; }
.home-header h1{ font-size:1.45rem; }
.home-header p{ color:var(--ink-soft); margin:0; font-size:.88rem; }
.countdown{ text-align:center; background:var(--accent-soft); border-radius:14px; padding:10px; margin-bottom:16px; font-weight:600; font-size:.9rem; }

.day-block{ margin-bottom:22px; }
.day-heading{ display:flex; align-items:center; gap:10px; margin-bottom:10px; }
.day-badge{ font-family:var(--font-mono); font-size:.72rem; background:var(--accent); color:#fff; border-radius:20px; padding:3px 11px; }
.day-heading h2{ font-size:1.1rem; margin:0; }

.subject-card{ background:var(--bg-elev); border:1px solid var(--line); border-radius:var(--radius); padding:16px; margin-bottom:12px; box-shadow:var(--shadow); }
.subject-card-top{ display:flex; justify-content:space-between; align-items:center; margin-bottom:10px; }
.subject-card h3{ font-size:1.05rem; margin:0; }
.subject-score{ font-family:var(--font-mono); font-size:.78rem; color:var(--ink-soft); }
.subject-actions{ display:flex; gap:8px; flex-wrap:wrap; }
.pill-btn{ flex:1; min-width:130px; border:1px solid var(--line); background:var(--bg); border-radius:12px; padding:11px 10px; font-size:.85rem; font-weight:600; text-align:center; cursor:pointer; min-height:46px; color:var(--ink); }
.pill-btn.primary{ background:var(--accent); color:#fff; border-color:var(--accent); }
.mini-progress{ height:6px; background:var(--line); border-radius:4px; overflow:hidden; margin:8px 0; }
.mini-progress > div{ height:100%; background:var(--accent); }
.subcats{ display:flex; flex-wrap:wrap; gap:6px; margin-top:8px; }
.subcat-chip{ font-size:.72rem; font-family:var(--font-mono); background:var(--bg); border:1px solid var(--line); border-radius:20px; padding:3px 9px; color:var(--ink-soft); }
.subcat-chip.done{ color:var(--good); border-color:var(--good); }

.settings-row{ display:flex; justify-content:center; gap:10px; margin-top:18px; flex-wrap:wrap; }
.icon-btn{ background:var(--bg-elev); border:1px solid var(--line); border-radius:10px; width:46px; height:46px; display:flex; align-items:center; justify-content:center; font-size:1.1rem; cursor:pointer; }
.save-cta{ background:var(--ink); color:var(--bg); border:none; border-radius:12px; padding:12px 18px; font-weight:600; min-height:48px; cursor:pointer; }

.topbar{ display:flex; align-items:center; justify-content:space-between; margin-bottom:14px; gap:8px; }
.back-btn{ background:none; border:none; color:var(--accent); font-weight:600; font-size:.92rem; min-height:44px; padding:0 4px; cursor:pointer; }
.topbar-title{ font-family:var(--font-display); font-size:1.05rem; font-weight:600; text-align:center; flex:1; }

/* Subject hub (choose sub-unit) */
.subunit-list{ display:flex; flex-direction:column; gap:10px; }
.subunit-row{ background:var(--bg-elev); border:1px solid var(--line); border-radius:14px; padding:14px 16px; cursor:pointer; }
.subunit-row-top{ display:flex; justify-content:space-between; align-items:center; }
.subunit-row .su-name{ font-weight:600; }
.subunit-row .su-meta{ font-size:.78rem; color:var(--ink-soft); font-family:var(--font-mono); }

/* Review sheet */
.review-sheet-section{ background:var(--bg-elev); border:1px solid var(--line); border-radius:14px; padding:16px; margin-bottom:12px; }
.review-sheet-section h4{ font-family:var(--font-display); font-size:1rem; margin-bottom:8px; border-bottom:2px solid var(--accent-soft); padding-bottom:6px; }
.review-sheet-section ul{ margin:0; padding-left:20px; }
.review-sheet-section li{ margin-bottom:8px; font-size:.93rem; line-height:1.5; }

/* Cluster / mistake-fix flow */
.cluster-progress{ font-family:var(--font-mono); font-size:.78rem; color:var(--ink-soft); margin-bottom:8px; }
.lesson-card{ background:var(--accent-soft); border-radius:14px; padding:16px; margin-bottom:14px; }
.lesson-card h4{ font-family:var(--font-display); margin-bottom:8px; }
.lesson-card p{ margin:0; font-size:.92rem; line-height:1.6; }
.formula-box{ background:var(--bg-elev); border:1.5px dashed var(--accent); border-radius:10px; padding:12px 14px; margin-bottom:12px; font-family:var(--font-mono); font-size:.92rem; line-height:1.7; white-space:pre-line; font-weight:600; }
.lesson-subsection{ margin-top:14px; padding-top:12px; border-top:1px solid color-mix(in srgb, var(--accent) 25%, transparent); }
.lesson-subsection p{ white-space:pre-line; }
.lesson-subhead{ font-weight:700; font-size:.85rem; margin-bottom:6px; }
.lesson-subsection.mnemonic{ background:color-mix(in srgb, var(--warn, #B7791F) 12%, transparent); border-radius:10px; padding:10px 12px; border-top:none; margin-top:12px; }
.lesson-subsection.mnemonic .lesson-subhead{ color:var(--warn, #B7791F); }
.step-label{ font-size:.75rem; font-family:var(--font-mono); text-transform:uppercase; letter-spacing:.04em; color:var(--ink-soft); margin-bottom:6px; }
.q-card{ background:var(--bg-elev); border:1px solid var(--line); border-radius:var(--radius); padding:18px; box-shadow:var(--shadow); margin-bottom:14px; }
.q-text{ font-size:1rem; line-height:1.5; margin-bottom:14px; white-space:pre-line; }
.q-passage-title{ font-style:italic; color:var(--ink-soft); font-size:.85rem; margin-bottom:6px; }
.passage-box{ background:var(--bg); border:1px solid var(--line); border-left:4px solid var(--accent); border-radius:10px; padding:14px 16px; margin-bottom:14px; }
.passage-title{ font-family:var(--font-display); font-weight:600; font-size:.92rem; margin-bottom:6px; }
.passage-note{ font-size:.78rem; color:var(--ink-soft); font-style:italic; margin-bottom:8px; }
.passage-text{ font-size:.88rem; line-height:1.6; white-space:pre-line; max-height:260px; overflow-y:auto; }
.choice-list{ display:flex; flex-direction:column; gap:9px; }
.choice{ border:1.5px solid var(--line); border-radius:12px; padding:12px 14px; text-align:left; background:var(--bg-elev); cursor:pointer; font-size:.93rem; min-height:46px; display:flex; align-items:flex-start; gap:10px; }
.choice .choice-letter{ font-family:var(--font-mono); font-weight:700; color:var(--accent); flex-shrink:0; }
.choice.chosen-correct{ border-color:var(--good); background:color-mix(in srgb, var(--good) 12%, var(--bg-elev)); }
.choice.chosen-incorrect{ border-color:var(--bad); background:color-mix(in srgb, var(--bad) 12%, var(--bg-elev)); }
.choice.reveal-correct{ border-color:var(--good); }
.explain-box{ margin-top:12px; padding:12px 14px; border-radius:12px; font-size:.88rem; line-height:1.5; }
.explain-box.correct{ background:color-mix(in srgb, var(--good) 14%, var(--bg-elev)); }
.explain-box.incorrect{ background:color-mix(in srgb, var(--bad) 14%, var(--bg-elev)); }
.attempt-note{ font-size:.78rem; color:var(--ink-soft); margin-top:8px; font-style:italic; }
.next-btn{ background:var(--accent); color:#fff; border:none; border-radius:12px; padding:13px 22px; font-weight:600; min-height:48px; cursor:pointer; width:100%; margin-top:14px; }
.next-btn[disabled]{ opacity:.35; }
.slow-down-banner{ background:color-mix(in srgb, var(--warn) 16%, var(--bg-elev)); border-radius:12px; padding:11px 14px; font-size:.85rem; margin-bottom:14px; display:flex; gap:8px; align-items:flex-start; }

.cluster-complete{ text-align:center; padding:30px 20px; }
.cluster-complete .big-check{ font-size:3rem; margin-bottom:10px; }
.mashallah{ color:var(--good); font-weight:600; margin-bottom:6px; }

.tips-list{ display:flex; flex-direction:column; gap:12px; }
.tip-full{ background:var(--bg-elev); border:1px solid var(--line); border-radius:14px; padding:16px; }
.tip-full h4{ margin:0 0 6px; font-family:var(--font-display); font-size:1rem; }
.tip-full p{ margin:0; font-size:.9rem; color:var(--ink-soft); line-height:1.5; }
.dua-closing{ background:var(--accent-soft); border-radius:16px; padding:20px; text-align:center; margin-top:18px; font-family:var(--font-display); font-size:1.02rem; line-height:1.6; }

.toast{ position:fixed; bottom:calc(16px + env(safe-area-inset-bottom)); left:50%; transform:translateX(-50%); background:var(--ink); color:var(--bg); padding:12px 18px; border-radius:30px; font-size:.85rem; z-index:50; box-shadow:var(--shadow); max-width:90%; text-align:center; opacity:0; transition:opacity .3s; }
.toast.show{ opacity:1; }
.storage-warning{ background:#FDE8E8; color:#8A2E2E; border:1px solid #F0B8B8; border-radius:12px; padding:12px 14px; font-size:.85rem; margin-bottom:14px; }
[data-theme="dark"] .storage-warning{ background:#4A2626; color:#F2C4C4; border-color:#6B3535; }

footer.build-footer{ text-align:center; color:var(--ink-soft); font-size:.72rem; margin-top:24px; opacity:.6; }

/* ===== Sky / clouds background (Saarah's favorite from the Science app) ===== */
.sky-layer{ position:fixed; inset:0; overflow:hidden; z-index:0; pointer-events:none; }
.cloud{ position:absolute; opacity:0.7; filter:drop-shadow(0 6px 10px rgba(0,0,0,0.04)); transition:opacity .6s; }
[data-theme="dark"] .cloud{ opacity:0.14; }
.cloud-drift{ animation:driftClouds linear infinite; }
@keyframes driftClouds{ from{ transform:translateX(-15vw); } to{ transform:translateX(115vw); } }
.sky-hills{ position:absolute; bottom:0; left:0; width:100%; height:16vh; min-height:100px; transition:opacity .6s; }
.sky-hills path{ fill:var(--accent); }
.app, .toast, #storageWarn{ position:relative; z-index:1; }

/* ===== Streaks & milestones ===== */
.streak-badge{ display:inline-flex; align-items:center; gap:5px; background:var(--accent-soft); border-radius:20px; padding:5px 12px; font-size:.8rem; font-weight:700; font-family:var(--font-mono); margin-bottom:10px; }
.mini-progress{ position:relative; }
.mini-progress .milestone-tick{ position:absolute; top:-2px; bottom:-2px; width:2px; background:var(--bg-elev); opacity:.8; }
.streak-home{ text-align:center; font-size:.85rem; color:var(--ink-soft); margin:6px 0 14px; }
.milestone-toast-emoji{ font-size:1.2rem; margin-right:6px; }
.confetti-burst{ position:fixed; inset:0; pointer-events:none; z-index:60; }
.confetti-piece{ position:absolute; width:8px; height:8px; opacity:0.9; animation: confettiFall 1.4s ease-out forwards; }
@keyframes confettiFall{ 0%{ transform:translateY(0) rotate(0deg); opacity:1;} 100%{ transform:translateY(70vh) rotate(360deg); opacity:0; } }
@media (prefers-reduced-motion: reduce){ *{ transition:none !important; animation:none !important; } }
.pop{ animation:pop .25s ease; } @keyframes pop{ 0%{transform:scale(1);} 40%{transform:scale(1.04);} 100%{transform:scale(1);} }
.shake{ animation:shake .3s ease; } @keyframes shake{ 0%,100%{transform:translateX(0);} 25%{transform:translateX(-4px);} 75%{transform:translateX(4px);} }

</style>
</head>
<body data-theme="light">
<div class="app"><div id="root"></div></div>
<script>
var MATH = [{"n": 1, "q": "Which of the following is listed in order from greatest to least?", "c": ["2 1/4, 32/5, 4/5, -5, -2", "32/5, 2 1/4, 4/5, -2, -5", "-5, -2, 32/5, 4/5, 2 1/4", "32/5, 2 1/4, 4/5, -5, -2"], "a": 1, "e": "Convert to decimals: 6.4, 2.25, 0.8, -2, -5. That's the correct order from greatest to least (and -2 is greater than -5)."}, {"n": 2, "q": "Ana has completed approximately 2/7 of her research paper. Which of the following best represents the percentage of the paper she has completed?", "c": ["24%", "26%", "27%", "29%"], "a": 3, "e": "2 ÷ 7 ≈ 0.29 = 29%."}, {"n": 3, "q": "What is the square root of the area represented in the model below?", "c": ["3", "12", "4", "16"], "a": 2, "e": "The grid shows a 4×4 square, so the area is 16 square units. The square root of 16 is 4.", "d": "svg:grid4x4"}, {"n": 4, "q": "A mathematics test has a 4:2 ratio of data analysis problems to algebra problems. If the test has 18 algebra problems, how many data analysis problems are on the test?", "c": ["24", "36", "38", "28"], "a": 1, "e": "4/2 = x/18, so x = 36."}, {"n": 5, "q": "Elijah has prepared 2 1/2 gallons of lemonade to distribute to guests at a party. If there are 25 guests, how much lemonade is available to each guest, given that each guest receives an equal amount?", "c": ["1/8 of a gallon", "1/6 of a gallon", "1/12 of a gallon", "1/10 of a gallon"], "a": 3, "e": "5/2 ÷ 25 = 5/2 × 1/25 = 5/50 = 1/10."}, {"n": 6, "q": "How many one-fourths are contained in 8 1/2?", "c": ["34", "64", "36", "17"], "a": 0, "e": "8 1/2 ÷ 1/4 = 17/2 × 4 = 34."}, {"n": 7, "q": "Which number sentence is represented by the model shown below?", "c": ["4 ÷ 3/4 = 5 1/3", "4 ÷ 2/3 = 5 1/3", "4 ÷ 3/4 = 5 1/4", "4 ÷ 2/3 = 5 1/4"], "a": 0, "e": "The model shows 4 divided into sections of length 3/4: 4 ÷ 3/4 = 5 1/3.", "d": "svg:barmodel4"}, {"n": 8, "q": "Which number sentence is represented by the number line below?", "c": ["24 ÷ 2 = 12", "8 + 16 = 24", "8 × 2 = 16", "24 ÷ 3 = 8"], "a": 3, "e": "The number line shows 8 jumps of size 3 reaching 24: 24 ÷ 3 = 8.", "d": "svg:numberline_jumps"}, {"n": 9, "q": "Edward drove 840 miles at a speed of 60 miles per hour. How many hours did he travel?", "c": ["14", "16", "17", "18"], "a": 0, "e": "840 ÷ 60 = 14 hours."}, {"n": 10, "q": "A bag of coffee costs $9.85 and contains 16 ounces of coffee. Which of the following best represents the cost per ounce?", "c": ["$0.67", "$0.64", "$0.65", "$0.62"], "a": 3, "e": "$9.85 ÷ 16 ≈ $0.62 per ounce."}, {"n": 11, "q": "Which of the following is equivalent to 4³ + 12 ÷ 4 + 8² × 3?", "c": ["249", "393", "211", "259"], "a": 3, "e": "64 + 3 + 192 = 259 (exponents first, then multiplication/division left to right, then addition)."}, {"n": 12, "q": "Amy deposits $1 in her savings account during Month 1. For each subsequent month, she deposits an amount equal to the square of the number of the month. Douglas deposits the same amount in his savings account during Month 1. However, for each subsequent month, he deposits twice the amount deposited the previous month. Which is the first month that the amount deposited by Douglas exceeds the amount deposited by Amy?", "c": ["Month 4", "Month 6", "Month 7", "Month 8"], "a": 2, "e": "In Month 7, Douglas deposits $64 while Amy deposits $49 — the first month Douglas's deposit exceeds Amy's (in Month 6, Amy=$36 vs Douglas=$32)."}, {"n": 13, "q": "Hannah will donate a total of $1,400 in equal amounts to 13 charities. Which of the following is a reasonable estimate for the amount donated to each charity?", "c": ["More than $110 but less than $115", "More than $105 but less than $110", "More than $120 but less than $125", "More than $115 but less than $120"], "a": 1, "e": "$1,400 ÷ 13 ≈ $107.69, which falls between $105 and $110."}, {"n": 14, "q": "The original price of a jacket is $36.95. The jacket is discounted by 25%. Before tax, which of the following best represents the cost of the jacket?", "c": ["$27.34", "$27.71", "$28.82", "$29.56"], "a": 1, "e": "36.95 - (0.25 × 36.95) = $27.71."}, {"n": 15, "q": "A car dealership is having a blowout sale. Douglas finds a car sale-priced at $36,549.15. The car was originally priced at $42,999. What percentage discount would Douglas receive?", "c": ["12%", "15%", "18%", "20%"], "a": 1, "e": "(42,999 - 36,549.15) / 42,999 = 0.15 = 15%."}, {"n": 16, "q": "A bottle of lotion contains 20 fluid ounces and costs $3.96. Which of the following best represents the cost per fluid ounce?", "c": ["$0.18", "$0.20", "$0.22", "$0.24"], "a": 1, "e": "$3.96 ÷ 20 ≈ $0.20."}, {"n": 17, "q": "What is the 18th term in the sequence -7, -14, -21, -28, ...?", "c": ["-133", "-126", "-119", "-112"], "a": 1, "e": "Common difference is -7: 18 × -7 = -126."}, {"n": 18, "q": "Triangle A has side lengths of 12 cm, 8 cm, and 16 cm. Triangle B is related to Triangle A by a scale factor of 1/4. Which of the following represents the dimensions of Triangle B?", "c": ["4 cm, 2 cm, 8 cm", "2 cm, 3 cm, 8 cm", "3 cm, 2 cm, 4 cm", "6 cm, 4 cm, 8 cm"], "a": 2, "e": "12×1/4=3, 8×1/4=2, 16×1/4=4."}, {"n": 19, "q": "A book has a width of 2.5 decimeters. What is the width of the book in centimeters?", "c": ["0.25 centimeters", "25 centimeters", "250 centimeters", "0.025 centimeters"], "a": 1, "e": "1 decimeter = 10 cm, so 2.5 dm = 25 cm."}, {"n": 20, "q": "The approximate volumes of spheres with different radii are listed in the table below. If the volume of each sphere is equal to some ratio multiplied by the product of the cubed radius and pi (π), what is the ratio?", "c": ["4", "1/3", "3", "4/3"], "a": 3, "e": "33.49 = 8π·x → x = 4/3 (confirmed by checking the other rows too).", "table": {"headers": ["Radius", "Volume"], "rows": [["2", "33.49 in³"], ["4", "267.95 in³"], ["6", "904.32 in³"], ["8", "2,143.57 in³"]]}}, {"n": 21, "q": "Which of the following graphs accurately portrays the relationship between number of feet and number of yards?", "c": ["Graph A", "Graph B", "Graph C", "Graph D"], "a": 0, "e": "Since 1 foot is 1/3 of a yard, the correct graph shows the line y = 1/3x through the origin.", "d": "svg:graph_feet_yards"}, {"n": 22, "q": "Given the sequence represented in the table below, where n represents the position of the term and aₙ represents the value of the term, which of the following describes the relationship between the position number and the value of the term?", "c": ["Multiply n by 2 and subtract 4", "Multiply n by 2 and subtract 3", "Multiply n by -3 and add 8", "Multiply n by -4 and add 1"], "a": 2, "e": "aₙ = -3n + 8 fits every row: n=1→5, n=2→2, n=3→-1, etc.", "table": {"headers": ["n", "1", "2", "3", "4", "5", "6"], "rows": [["aₙ", "5", "2", "-1", "-4", "-7", "-10"]]}}, {"n": 23, "q": "The number 123 is the 11th term in a sequence with a constant rate of change. Which of the following sequences has this number as its 11th term?", "c": ["5, 17, 29, 41, ...", "3, 15, 27, 39, ...", "-1, 11, 23, 35, ...", "1, 13, 25, 37, ..."], "a": 1, "e": "All have common difference 12; only 3,15,27,39,... gives an 11th term of 123 (3 + 10×12 = 123)."}, {"n": 24, "q": "Given the equation represented by the algebra tiles shown below, where the long tile represents x and the small square represents the positive integer 1, which of the following represents the solution?", "c": ["x = 6", "x = 9", "x = 3", "x = 12"], "a": 1, "e": "The tiles represent 2x + 9 = x + 18, which simplifies to x = 9.", "d": "svg:algebratiles"}, {"n": 25, "q": "Kevin pays $12.95 for a text messaging service plus $0.07 for each text message he sends. Which of the following equations could be used to represent the total cost, y, when x represents the number of text messages sent?", "c": ["y = $12.95x + $0.07", "y = $13.02x", "y = ($12.95/$0.07)x", "y = $0.07x + $12.95"], "a": 3, "e": "Fixed cost $12.95 is the y-intercept; $0.07 per text is the rate: y = 0.07x + 12.95."}, {"n": 26, "q": "Hannah draws two supplementary angles. One angle measures 34°. What is the measure of the other angle?", "c": ["56°", "66°", "146°", "326°"], "a": 2, "e": "Supplementary angles sum to 180°: 180 - 34 = 146°."}, {"n": 27, "q": "The cost for different numbers of boxes of doughnuts is shown in the table below. Which equation can be used to find the cost per box, x? Let c represent the total cost and b represent the number of boxes.", "c": ["x = bc", "x = b/c", "x = c/b", "x = c + b"], "a": 2, "e": "Every row gives $3.75/box, confirming x = c/b.", "table": {"headers": ["Boxes (b)", "Total Cost (c)"], "rows": [["4", "$15.00"], ["7", "$26.25"], ["12", "$45.00"], ["18", "$67.50"]]}}, {"n": 28, "q": "A triangle has the following angle measures: 98°, 47°, and 35°. What type of triangle is it?", "c": ["Obtuse", "Right", "Acute", "Equiangular"], "a": 0, "e": "A triangle with an angle greater than 90° (98°) is obtuse."}, {"n": 29, "q": "Which figure has 5 faces and 8 edges?", "c": ["Triangular pyramid", "Cube", "Square pyramid", "Triangular prism"], "a": 2, "e": "A square pyramid has 4 triangular faces + 1 square base = 5 faces, and 8 edges."}, {"n": 30, "q": "Which figure has two circular bases and a lateral face?", "c": ["Cone", "Prism", "Cylinder", "Sphere"], "a": 2, "e": "A cylinder has two circular bases connected by one curved lateral face."}, {"n": 31, "q": "What ordered pair is shown on the graph below?", "c": ["(-2, 5)", "(-2, -5)", "(2, 5)", "(2, -5)"], "a": 0, "e": "The point is 2 units left of the origin and 5 units up: (-2, 5).", "d": "svg:point_neg2_5"}, {"n": 32, "q": "Edward draws a triangle with vertices at (1, 4), (5, 1), and (5, 6). If he wishes to reflect the triangle across the x-axis, which of the following vertices should he plot?", "c": ["(-1, 4), (-5, 1), (-5, 6)", "(1, -4), (5, -1), (5, -6)", "(-1, -4), (-5, -1), (-5, -6)", "(4, 1), (1, 5), (6, 5)"], "a": 1, "e": "Reflecting across the x-axis negates the y-value only: (1,-4), (5,-1), (5,-6)."}, {"n": 33, "q": "A carpenter must fix a broken section of a kitchen cabinet. The intact portion of the cabinet forms a 76° angle with the wall. The width of the cabinet is supposed to form a 90° angle with the wall. What angle measure should the carpenter use when cutting the piece that will fit next to the 76° angle?", "c": ["12°", "14°", "104°", "136°"], "a": 1, "e": "90° - 76° = 14°."}, {"n": 34, "q": "Which of the following represents the net of a triangular prism?", "c": ["Net A", "Net B", "Net C", "Net D"], "a": 3, "e": "A triangular prism's net has 2 triangular bases and 3 rectangular faces — that's Net D.", "d": "svg:nets4"}, {"n": 35, "q": "A circle has a radius of 23 cm. Which of the following is the best estimate for the circumference of the circle?", "c": ["71.76 cm", "143.52 cm", "144.44 cm", "72.22 cm"], "a": 2, "e": "C = πd = 3.14 × 46 = 144.44 cm."}, {"n": 36, "q": "Which three-dimensional figure is approximated by the net shown below?", "c": ["Cone", "Rectangular prism", "Sphere", "Cylinder"], "a": 2, "e": "The net of narrow curved strips (like an orange peel/globe gore pattern) approximates a sphere.", "d": "img:math_q36_net"}, {"n": 37, "q": "Triangle ABC has side lengths of 18 cm, 14 cm, and 12 cm. Which of the following dimensions belong to a similar triangle?", "c": ["9 cm, 7 cm, 6 cm", "36 cm, 28 cm, 22 cm", "6 cm, 7 cm, 4 cm", "27 cm, 21 cm, 15 cm"], "a": 0, "e": "9,7,6 is exactly half of 18,14,12 — the only option with a consistent scale factor."}, {"n": 38, "q": "Given the triangle below, which of the following is the best estimate for the perimeter of the triangle?", "c": ["10 in", "11 in", "12 in", "13 in"], "a": 2, "e": "Rounding each side to about 4 in: 4+4+4=12 in (exact sum is 3.8+3.8+4.2=11.8, which rounds to 12).", "d": "svg:triangle_isosceles"}, {"n": 39, "q": "In the formula for the volume of the figure shown below, written as V = B · h, h represents the height of the prism when it rests one of its bases. What does the B represent?", "c": ["1/3 bh, where b is the triangle's base and h is the triangle's height", "bh, where b is the triangle's base and h is the triangle's height", "2bh, where b is the triangle's base and h is the triangle's height", "1/2 bh, where b is the triangle's base and h is the triangle's height"], "a": 3, "e": "B is the area of the triangular base, which is 1/2 × base × height.", "d": "svg:triangularprism3d"}, {"n": 40, "q": "A rectangular prism has a length of 14.3 cm, a width of 8.9 cm, and a height of 11.7 cm. Which of the following is the best estimate for the volume of the rectangular prism?", "c": ["1,512 cm³", "1,287 cm³", "1,386 cm³", "1,620 cm³"], "a": 0, "e": "Rounding each dimension (14, 9, 12) and multiplying: 14 × 9 × 12 = 1,512 cm³."}, {"n": 41, "q": "A can has a radius of 3.5 cm and a height of 8 cm. Which of the following best represents the volume of the can?", "c": ["294.86 cm³", "298.48 cm³", "307.72 cm³", "309.24 cm³"], "a": 2, "e": "V = πr²h = 3.14 × 12.25 × 8 ≈ 307.72 cm³."}, {"n": 42, "q": "Fred designs a candy box in the shape of a triangular prism. The base of each triangular face measures 4 inches, while the height of the prism is 7 inches. Given that the length of the prism is 11 inches, what is the volume of the candy box?", "c": ["102 in³", "128 in³", "154 in³", "308 in³"], "a": 2, "e": "V = 1/2 × 4 × 7 × 11 = 154 in³."}, {"n": 43, "q": "Miranda rolls a standard die and spins a spinner with 4 equal sections. Which of the following represents the sample space?", "c": ["10", "12", "24", "36"], "a": 2, "e": "6 × 4 = 24 total outcomes."}, {"n": 44, "q": "What is the sample space when flipping three coins?", "c": ["6", "8", "12", "15"], "a": 1, "e": "2³ = 8 possible outcomes."}, {"n": 45, "q": "A hat contains 6 red dice, 4 green dice, and 2 blue dice. What is the probability that Sarah pulls out a blue die, replaces it, and then pulls out a green die?", "c": ["1/18", "1/3", "1/2", "1/16"], "a": 0, "e": "P(blue)=2/12, P(green)=4/12; since she replaces it, 2/12 × 4/12 = 1/18."}, {"n": 46, "q": "Eli wishes to compare the changes in monthly deposits made to his savings account over a period of two years. Which of the following is the best graphical tool for analyzing the data?", "c": ["Line graph", "Histogram", "Line plot", "Bar graph"], "a": 0, "e": "A line graph is best for showing changes over continuous time."}, {"n": 47, "q": "The histogram below represents the overall GRE scores for a sample of college students. Which of the following is a true statement?", "c": ["The range of GRE scores is approximately 600.", "The average GRE score is 750.", "The median GRE score is approximately 500.", "The fewest number of college students had an approximate score of 800."], "a": 2, "e": "With 50 data points total, the median falls between the 25th and 26th scores, which lands in the interval around 500.", "d": "img:math_q47_histogram"}, {"n": 48, "q": "The ages at which a sample of female dogs is spayed is shown below. Based on this sample, what is the average age a female dog gets spayed? 6, 7, 2, 8, 4, 1, 7, 8, 3, 1, 8, 2", "c": ["3.75", "4", "4.75", "5"], "a": 2, "e": "Sum = 57, divided by 12 dogs = 4.75."}, {"n": 49, "q": "Student scores on Mrs. Thompson's last math test are shown below. Which of the following is the best representation of class performance? 76, 39, 87, 85, 91, 93, 86, 90, 77, 89, 74, 82, 68, 86, 79", "c": ["Mean", "Median", "Mode", "Range"], "a": 1, "e": "The score of 39 is an outlier; the median resists being skewed by outliers, unlike the mean."}, {"n": 50, "q": "Amy rolled a die and flipped a coin. What is the probability that she rolled an even number and got heads?", "c": ["1/4", "1/2", "3/4", "1/3"], "a": 0, "e": "P(even)=1/2 (or 3/6), P(heads)=1/2: 1/2 × 1/2 = 1/4."}, {"n": 51, "q": "Which of the following is listed in order from least to greatest?", "c": ["-2 3/4, -2 7/8, -1/5, 2/5, 1/8", "-1/5, 1/8, 2/5, -2 3/4, -2 7/8", "-2 7/8, -2 3/4, -1/5, 1/8, 2/5", "1/8, 2/5, -1/5, -2 3/4, -2 7/8"], "a": 2, "e": "As decimals: -2.875, -2.75, -0.2, 0.125, 0.4 — that's the correct least-to-greatest order."}, {"n": 52, "q": "Amanda has finished 80% of a grant proposal. Which of the following fractions represents the amount she has finished?", "c": ["3/4", "7/9", "4/5", "6/7"], "a": 2, "e": "80% = 4/5 exactly (4 ÷ 5 = 0.80)."}, {"n": 53, "q": "In a square built with unit squares, which of the following would represent the square root of the square?", "c": ["The number of unit squares comprising a side", "The total number of unit squares within the square", "Half of the total number of unit squares within the square", "The number of unit squares comprising the perimeter of the square"], "a": 0, "e": "The square root of the area of a square equals its side length."}, {"n": 54, "q": "According to the order of operations, which of the following steps should be completed immediately following the evaluation of the squared number when evaluating the expression 9 - 18² × 2 + 12 ÷ 4?", "c": ["Subtract 18² from 9", "Multiply the squared value by 2", "Divide 12 by 4", "Add 2 and 12"], "a": 1, "e": "After exponents, multiplication/division happen left to right — the squared value gets multiplied by 2 next."}, {"n": 55, "q": "A publishing company has been given 29 manuscripts to review. If the company divides the work equally amongst 8 editors, which of the following represents the number of manuscripts each editor will review?", "c": ["3 3/5", "3 5/8", "3 1/7", "3 2/3"], "a": 1, "e": "29 ÷ 8 = 3 remainder 5, so 3 5/8."}, {"n": 56, "q": "Given the counters shown below, where the grey circle represents negative 1 and the black circle represents positive 1, what is the sum?", "c": ["-20", "4", "20", "-4"], "a": 3, "e": "12 grey (-1 each) and 8 black (+1 each): -12 + 8 = -4.", "d": "svg:counters"}, {"n": 57, "q": "A parcel of land has 35 mature trees for every 3 acres. How many mature trees can be found on 18 of the acres?", "c": ["206", "212", "210", "214"], "a": 2, "e": "35/3 = x/18 → x = 210."}, {"n": 58, "q": "Which of the following is equivalent to -8² + (17 - 9) × 4 + 7?", "c": ["-217", "24", "-64", "-25"], "a": 3, "e": "-64 + 8×4 + 7 = -64 + 32 + 7 = -25."}, {"n": 59, "q": "Jason chooses a number that is the square root of four less than two times Amy's number. If Amy's number is 20, what is Jason's number?", "c": ["6", "7", "8", "9"], "a": 0, "e": "√(2×20 - 4) = √36 = 6."}, {"n": 60, "q": "Gitta brings $2,082 on a business trip. The trip will last 7 days. Which of the following is the best estimate for the amount of money she has to spend per day?", "c": ["$200", "$320", "$240", "$300"], "a": 3, "e": "$2,082 rounds to $2,100; $2,100 ÷ 7 = $300."}, {"n": 61, "q": "Josiah walks 8 3/5 miles on Monday. Which of the following is equivalent to the number of miles he walked?", "c": ["8.8", "8.6", "8.7", "8.4"], "a": 1, "e": "3/5 = 0.6, so 8 3/5 = 8.6."}, {"n": 62, "q": "Brianna used five 3/4 cups of sugar while baking. How many cups of sugar did she use in all?", "c": ["3 2/3", "3 3/4", "3 1/4", "3 1/2"], "a": 1, "e": "5 × 3/4 = 15/4 = 3 3/4."}, {"n": 63, "q": "Robert secures three new clients every eight months. After how many months has he secured 24 new clients?", "c": ["64", "58", "52", "66"], "a": 0, "e": "3/8 = 24/x → x = 64 months."}, {"n": 64, "q": "A landscaping company charges $25 per 1/2-acre to mow a yard. The company is offering a 20% discount for the month of May. If Douglas has a two-acre yard, how much will the company charge?", "c": ["$65", "$80", "$70", "$75"], "a": 1, "e": "2 acres = 4 half-acres × $25 = $100; with 20% off, $100 - $20 = $80."}, {"n": 65, "q": "A house is priced at $278,000. The price of the house has been reduced by $12,600. Which of the following best represents the percentage of the reduction?", "c": ["3%", "4%", "5%", "6%"], "a": 1, "e": "Original price = $278,000 + $12,600 = $290,600. $12,600 / $290,600 ≈ 4%."}, {"n": 66, "q": "A 20-ounce drink costs $1.19. Which of the following best represents the cost per ounce?", "c": ["$0.07", "$0.06", "$0.04", "$0.08"], "a": 1, "e": "$1.19 ÷ 20 ≈ $0.06."}, {"n": 67, "q": "Mel studied 25 hours per week when he took four college courses. If he spends the same amount of time studying per course, how many hours will he spend studying when he takes five college courses?", "c": ["30.75", "32.50", "31.75", "31.25"], "a": 3, "e": "25/4 = x/5 → x = 31.25."}, {"n": 68, "q": "A cone has a radius of 4 cm and an approximate volume of 150.72 cm³. What is the height of the cone?", "c": ["7 cm", "9 cm", "8 cm", "12 cm"], "a": 1, "e": "150.72 = 1/3 × π × 16 × h → h = 9 cm."}, {"n": 69, "q": "Which of the following graphs represents the relationship between the side length of a square and its perimeter?", "c": ["Graph A", "Graph B", "Graph C", "Graph D"], "a": 3, "e": "Perimeter = 4 × side length, so the line y = 4x (through the origin) is correct.", "d": "svg:graph_perimeter_side"}, {"n": 70, "q": "Which of the following represents the relationship between the diameter of a circle and its circumference?", "c": ["Graph A", "Graph B", "Graph C", "Graph D"], "a": 0, "e": "Circumference = π × diameter, so the line y = πx (through the origin, slope ≈3.14) is correct.", "d": "svg:graph_circumference_diameter"}];
var SCIENCE = [{"n": 1, "q": "A botanist examining a collection of related plants of a certain species notices that plants with white flowers tend to be taller than plants with yellow flowers. Which of the following is the most likely explanation for this?", "c": ["White flowers and tallness are both dominant traits.", "White flowers and tallness are both recessive traits.", "The genes for white flowers and tallness are on the same chromosome.", "The genes for white flowers and tallness are on different chromosomes."], "a": 2, "e": "When two traits are frequently inherited together, it's most likely because the genes for them are linked — located near each other on the same chromosome."}, {"n": 2, "q": "Which of the following organisms is likely to have the largest number of cells?", "c": ["A housefly", "A bacterium", "A field mouse", "A mature pine tree"], "a": 3, "e": "A bacterium is single-celled. Among the multicellular organisms, the much larger pine tree is likely to have far more cells than a housefly or field mouse."}, {"n": 3, "q": "“For every action there is an equal and opposite reaction.” What is this statement?", "c": ["Newton's First Law", "Newton's Second Law", "Newton's Third Law", "The First Law of Thermodynamics"], "a": 2, "e": "This is Newton's Third Law."}, {"n": 4, "q": "Which of the following is NOT considered a renewable energy source?", "c": ["Hydroelectricity", "Natural gas", "Solar energy", "Wind energy"], "a": 1, "e": "Natural gas takes thousands of years to form and is used up faster than it's replenished, unlike water flow, sunlight, and wind."}, {"n": 5, "q": "Twenty specimens of a new species of butterfly are introduced to a small forest. According to the graph, about how many butterflies were in the forest five years after they were first introduced?", "c": ["200", "400", "1,000", "The graph does not give this information."], "a": 0, "e": "Tracing up from year 5 to the curve and across to the y-axis shows about 200 butterflies.", "d": "svg:butterfly_scurve"}, {"n": 6, "q": "Which of the following best describes the growth of the butterfly population after a long period of time, as shown by this graph?", "c": ["The butterflies will eventually die out because they will stop reproducing.", "The butterflies will keep increasing without limit because new mutations will keep increasing their variety.", "The butterflies will eventually tend toward a stable number because there is a limit to how many butterflies the available resources will support.", "The butterflies will eventually tend toward a stable number because they are genetically preprogrammed to reach a particular population size."], "a": 2, "e": "The graph levels off because any environment has finite resources (food, space) that can only support a limited population — this is carrying capacity.", "d": "svg:butterfly_scurve"}, {"n": 7, "q": "Francis finds that he is able to dissolve six times as much sugar in a glass of water as he can dissolve salt in the same amount of water. Which of the following can he accurately conclude from this?", "c": ["The solubility of sugar in water is higher than the solubility of salt in water.", "The solubility of salt in water is higher than the solubility of sugar in water.", "The solubility of water in sugar is higher than the solubility of water in salt.", "The solubility of water in salt is higher than the solubility of water in sugar."], "a": 0, "e": "Solubility describes how much of a substance dissolves in a solvent — sugar dissolves more, so it has higher solubility in water."}, {"n": 8, "q": "If Francis used twice as much water, would he get a different result for the solubility of the salt?", "c": ["Yes, because the more water he uses, the more salt he can dissolve in it.", "Yes, because the more water he uses, the less salt he can dissolve in it.", "No, because solubility is a property of a material; it doesn't depend on the amount.", "No, because it would only have changed his measurement for the sugar, not for the salt."], "a": 2, "e": "Solubility is a fixed property of a substance (a ratio), so it doesn't change just because you use more water."}, {"n": 9, "q": "What are comets mostly made of?", "c": ["Ice", "Iron", "Plasma", "Nothing; comets are optical illusions with no physical substance."], "a": 0, "e": "Comets are mostly ice, mixed with dust and rock particles."}, {"n": 10, "q": "A comet called 12P/Pons-Brooks last passed by the Earth in 1954. The time before that, it passed by the Earth in 1884. In what year is it likely to pass by the Earth again?", "c": ["2024", "2084", "2134", "If it has already passed by the Earth twice, this comet will never pass by the Earth again."], "a": 0, "e": "The comet's orbital period is about 70 years (1954-1884=70), so it should pass again around 1954+70=2024."}, {"n": 11, "q": "What structures inside the cell are primarily responsible for generating energy for the cell?", "c": ["Cytoplasm", "Mitochondria", "Nuclei", "Ribosomes"], "a": 1, "e": "Mitochondria are the organelles primarily responsible for generating cellular energy."}, {"n": 12, "q": "Which of the following best describes why an ice cube left on the counter at room temperature will warm up and melt?", "c": ["The ice cube will radiate cold into its surroundings.", "Cold will be conducted from the ice cube into the counter and air.", "The counter will radiate heat into the ice cube.", "Heat will be conducted from the counter and air into the ice cube."], "a": 3, "e": "Heat always moves from warmer objects to colder ones; here heat is conducted from the counter and air into the ice cube. Cold is just the absence of heat, not something that moves on its own."}, {"n": 13, "q": "How will the mass of the ice cube compare to the mass of the puddle of water left after it melts? (Assume that no water evaporates while the ice is melting.)", "c": ["The water will have a larger mass because water is denser than ice.", "The ice will have a larger mass because ice is denser than water.", "The ice will have a larger mass because solids have more mass than liquids.", "The ice and the water will have the same mass because mass is conserved."], "a": 3, "e": "Matter isn't created or destroyed when ice melts — same atoms, same mass, just a different volume (density changes, not mass)."}, {"n": 14, "q": "A student measures the average temperature where he lives in each of four different months during three consecutive years. What is the three-year average temperature in July where the student lives?", "c": ["54°F", "55°F", "56°F", "57°F"], "a": 1, "e": "(53+54+58)/3 = 165/3 = 55°F.", "table": {"headers": ["Year", "January", "April", "July", "October"], "rows": [["2011", "73°F", "68°F", "53°F", "63°F"], ["2012", "75°F", "65°F", "54°F", "66°F"], ["2013", "71°F", "65°F", "58°F", "63°F"]]}}, {"n": 15, "q": "How would the student's results have changed had he taken the measurements in degrees Celsius instead of Fahrenheit?", "c": ["The measurements would have been less accurate.", "The measurements would have been more accurate.", "The numbers would be different, but they would have been just as useful.", "There would be no change; the numbers would be exactly the same."], "a": 2, "e": "Accuracy depends on the instrument, not the scale used. The numbers would differ but show the same patterns and remain equally useful."}, {"n": 16, "q": "From these data, where is the student likely to be located?", "c": ["On the equator because the temperature never goes below freezing", "Near the ocean because there is a large variation in temperature", "The Northern Hemisphere, because the temperature is about the same in spring (April) and fall (October)", "The Southern Hemisphere, because it is hottest in January and coldest in July"], "a": 3, "e": "January is hottest and July is coldest — that's the seasonal pattern of the Southern Hemisphere, not the Northern."}, {"n": 17, "q": "What instrument is the student likely to have used to take these measurements?", "c": ["An anemometer", "A barometer", "A multimeter", "A thermometer"], "a": 3, "e": "A thermometer measures temperature."}, {"n": 18, "q": "Which of these organs is NOT part of the respiratory system?", "c": ["Heart", "Lungs", "Trachea", "Diaphragm"], "a": 0, "e": "The heart circulates blood and belongs to the circulatory system, not the respiratory system."}, {"n": 19, "q": "Which system of the human body is responsible for gathering and processing information?", "c": ["Circulatory system", "Digestive system", "Nervous system", "Reproductive system"], "a": 2, "e": "The nervous system gathers information through the senses and processes it in the brain."}, {"n": 20, "q": "A student measures the length of a hanging spring when different masses are attached to the free end. Which of the following best explains what is causing the length of the spring to change?", "c": ["The pull of gravity on the mass exerts a downward force that stretches the spring.", "The mass exerts a gravitational force directly on the spring, causing it to stretch.", "The pull of gravity on the spring is cancelled by the mass, causing it to compress.", "The spring exerts a gravitational force on the mass, pulling it upward and compressing the spring."], "a": 0, "e": "Gravity pulls down on the mass, and because the mass is attached to the spring, this stretches the spring.", "table": {"headers": ["Mass", "Length"], "rows": [["0 g", "30.0 cm"], ["100 g", "33.1 cm"], ["200 g", "36.3 cm"], ["300 g", "39.2 cm"], ["400 g", "42.5 cm"]]}}, {"n": 21, "q": "In what direction is the net force on the mass when the student takes his measurements?", "c": ["The direction on the net force is upward.", "The direction on the net force is downward.", "The direction on the net force is zero.", "The direction on the net force cannot be determined."], "a": 2, "e": "Since the mass hangs motionless (not accelerating), the net force on it must be zero."}, {"n": 22, "q": "In the table, what does the g stand for after the mass measurements?", "c": ["Gauge", "Grams", "Gravity", "Ground"], "a": 1, "e": "g is the metric abbreviation for grams, a unit of mass."}, {"n": 23, "q": "A lunar eclipse always happens during which phase of the moon?", "c": ["New moon", "Full moon", "Crescent moon", "Gibbous moon"], "a": 1, "e": "A lunar eclipse happens when Earth is directly between the Moon and Sun — which only happens at full moon."}, {"n": 24, "q": "Which gas makes up the majority of the atmosphere?", "c": ["Carbon dioxide", "Nitrogen", "Oxygen", "Water vapor"], "a": 1, "e": "The atmosphere is about 78% nitrogen and 21% oxygen; carbon dioxide is a very small fraction."}, {"n": 25, "q": "The marks on the following map (from the U.S. Geological Survey Web site) show the locations of volcanoes. What is the best explanation for the fact that many of the volcanoes seem to be clustered along certain lines?", "c": ["Volcanoes tend to form along the edges of continental plates.", "Volcanoes tend to form along the Earth's magnetic field lines.", "Volcanoes tend to form near warm ocean currents.", "Volcanoes tend to spread; when one forms it, gives rise to other volcanoes near it."], "a": 0, "e": "At the edges of tectonic plates, magma can leak through as plates buckle or overlap, giving rise to volcanoes.", "d": "img:sci_q25_volcanomap"}, {"n": 26, "q": "Anemia is a disorder of the blood in which insufficient oxygen reaches the organs. A deficiency in which component of the blood is likely to cause anemia?", "c": ["Red blood cells", "White blood cells", "Plasma", "Platelets"], "a": 0, "e": "Red blood cells carry oxygen, so a deficiency in them is the likely cause of anemia."}, {"n": 27, "q": "Sea urchins belong to which animal phylum?", "c": ["Arthropoda (arthropods)", "Chordata (chordates)", "Echinodermata (echinoderms)", "Mollusca (molluscs)"], "a": 2, "e": "Sea urchins are echinoderms, along with starfish and sea cucumbers."}, {"n": 28, "q": "What kind of cell is pictured below?", "c": ["Animal cell", "Bacterium", "Paramecium", "Plant cell"], "a": 3, "e": "The large central vacuole, cell wall, and chloroplasts are all hallmarks of a plant cell.", "d": "svg:cell_diagram"}, {"n": 29, "q": "Suppose you have two blocks of cement and two blocks of polished marble. Between which combination of blocks would you expect the friction to be greatest?", "c": ["Between the two cement blocks", "Between the two marble blocks", "Between one block of cement and one block of marble", "Between any two blocks"], "a": 0, "e": "Rougher surfaces create more friction — two rough cement blocks together produce the most friction."}, {"n": 30, "q": "What happens when the buoyant force on a submerged object is greater than the force of gravity on the object?", "c": ["The object sinks.", "The object floats.", "The object neither sinks nor floats but hangs suspended in the same position.", "This can't happen; the buoyant force is always less than or equal to the force of gravity."], "a": 1, "e": "If the upward buoyant force is greater than the downward pull of gravity, the net force is upward and the object floats."}, {"n": 31, "q": "In what units is electrical current measured?", "c": ["Amperes", "Joules", "Ohms", "Volts"], "a": 0, "e": "Current is measured in amperes (amps)."}, {"n": 32, "q": "During a lightning storm, a student counts three seconds between seeing the flash of lightning and hearing the report. In order to know how far away the lightning was, what else would the student need to know?", "c": ["The air temperature", "The height of the storm clouds", "The time of day", "The speed of sound"], "a": 3, "e": "Distance = speed × time, so knowing the speed of sound lets the student calculate the distance from the 3-second delay."}, {"n": 33, "q": "What would it mean if the student heard the report first before seeing the lightning bolt?", "c": ["The storm is moving away.", "The lightning bolt is less than a mile away.", "The air pressure is very low, which means there might be danger of a cyclone.", "This can't happen; you always see the lightning before you hear it."], "a": 3, "e": "Light travels far faster than sound, so you always see lightning before you hear the thunder."}, {"n": 34, "q": "The corpse flower is a Sumatran flower that smells like rotting meat. Which of the following is the most likely reason it would have developed such a scent?", "c": ["To attract mates", "To drive away predators", "To attract flies to pollinate it", "To inhibit the growth of other plants nearby"], "a": 2, "e": "Flowers use scent to attract pollinators — the rotting-meat smell specifically attracts flies, which then carry its pollen."}, {"n": 35, "q": "Which of the following accurately describes a difference between sound waves and light waves?", "c": ["Light waves have a period and amplitude; sound waves do not.", "Unlike light waves, sound waves require a medium to travel through.", "Unlike sound waves, all light waves have the same frequency.", "Light waves can be reflected or refracted; sound waves cannot."], "a": 1, "e": "Sound waves are vibrations of a physical medium and can't travel through a vacuum; light waves can travel through empty space."}, {"n": 36, "q": "Which of the following types of electromagnetic wave has the largest wavelength?", "c": ["Infrared light", "Ultraviolet light", "Visible light", "Radio waves"], "a": 3, "e": "Radio waves have the longest wavelength (and lowest frequency) of the options."}, {"n": 37, "q": "What is the main source of energy in a star?", "c": ["Nuclear fission of helium into hydrogen", "Nuclear fusion of hydrogen into helium", "Chemical reactions between the various gases in the star", "Electricity generated by the friction between the gases"], "a": 1, "e": "Stars generate energy through nuclear fusion, combining hydrogen nuclei into helium."}, {"n": 38, "q": "Past the edge of the continental shelf, the ocean floor drops in the continental slope and then flattens out again in a deep underwater plain. What is this part of the ocean floor called?", "c": ["Abyssal plain", "Mid-ocean ridge", "Subcontinental plain", "Oceanic trench"], "a": 0, "e": "The flat deep-ocean floor beyond the continental slope is called the abyssal plain."}, {"n": 39, "q": "Using a microscope, a student looks at a cross-section of a plant root and counts the number of cells she sees in each phase of mitosis. Which phase does each cell seem to spend the most time in?", "c": ["Interphase, because that is the phase in which she saw the most cells", "Anaphase, because that is the phase in which she saw the least cells", "Telophase, because that is the last phase she looked at", "Metaphase, because that is the phase directly in the middle"], "a": 0, "e": "A cell is more likely to be caught in the phase it spends the most time in, so more cells observed in interphase means cells spend the most time there.", "d": "svg:mitosis_bars"}, {"n": 40, "q": "In which phase are all the chromosomes lined up in a plane?", "c": ["Prophase", "Metaphase", "Anaphase", "Telophase"], "a": 1, "e": "In metaphase, chromosomes line up along the metaphase (equatorial) plate.", "d": "svg:mitosis_bars"}, {"n": 41, "q": "How would this experiment have gone differently had the student looked at bacterial cells instead of plant root cells?", "c": ["The process would have worked just as well with bacterial cells.", "In bacterial cells, all the phases take exactly the same amount of time.", "She would not have been able to do the experiment with bacterial cells because they are too small to see, even with a microscope.", "The experiment would not have gone the same with bacterial cells because they do not undergo mitosis and do not have the same stages."], "a": 3, "e": "Bacteria are prokaryotic — they don't have nuclei and don't undergo mitosis; they divide by binary fission instead."}];
var CIVICS = [{"n": 1, "q": "The word 'suffrage' refers to what right?", "c": ["The right to vote in political elections", "The right to bear arms", "Protection from cruel and unusual punishment", "Protection from unreasonable search and seizures"], "a": 0, "e": "Suffrage is the right to vote in political elections."}, {"n": 2, "q": "There is a five-step process by which a bill becomes a law: introduction, committee action, floor action, final approval, and...", "c": ["Actualization.", "Authorization.", "Mandate.", "Enactment."], "a": 3, "e": "The final stage of a bill becoming law is enactment — putting the new law into practice."}, {"n": 3, "q": "What purpose does the Necessary and Proper, or Elastic, Clause serve?", "c": ["It dictates the etiquette that must be observed on Capitol Hill.", "It is the final form of the annual budget.", "It grants Congress the power to pass legislation needed for the exercise of its explicit powers.", "None of the above"], "a": 2, "e": "The Necessary and Proper (Elastic) Clause lets Congress pass laws needed to carry out its other constitutional powers."}, {"n": 4, "q": "By what means can the Constitution be altered?", "c": ["An amendment", "A Supreme Court ruling", "A congressional vote", "A presidential veto"], "a": 0, "e": "Only a constitutional amendment can directly alter the Constitution."}, {"n": 5, "q": "What is meant by the term \"due process\"?", "c": ["The government must administer justice in a way that protects its citizens from an intrusion on their rights.", "Criminal cases must be based in the wealth and status of the accused.", "Due process refers to the order in which congressional hearings take place.", "Due process refers to the series of trials a judge must preside over before being considered for the Supreme Court."], "a": 0, "e": "Due process means the government must administer justice fairly, protecting citizens' rights regardless of their wealth or status."}, {"n": 6, "q": "George Washington set a precedent for presidential term limits by leaving office after two. Washington's precedent was officially codified into law after which four-term President?", "c": ["Harry S. Truman", "Calvin Coolidge", "Theodore Roosevelt", "Franklin D. Roosevelt"], "a": 3, "e": "Franklin D. Roosevelt served more than two terms, after which a constitutional amendment formally limited presidents to two terms."}, {"n": 7, "q": "Which of the following titles is used for the presiding officer of the House of Representatives?", "c": ["Majority Leader", "Speaker of the House", "Majority Whip", "President pro tempore"], "a": 1, "e": "The Speaker of the House presides over the House of Representatives."}, {"n": 8, "q": "What is the name of Abraham Lincoln's executive order that freed all slaves in the Confederate states?", "c": ["Abolition Proclamation", "Writ of Habeas Corpus", "Emancipation Proclamation", "Magna Carta"], "a": 2, "e": "The Emancipation Proclamation freed all slaves in the Confederate states."}, {"n": 9, "q": "In what type of election would a caucus be used?", "c": ["Presidential election", "Primary election", "General election", "Local election"], "a": 1, "e": "Caucuses are used in primary elections to help select a party's candidate."}, {"n": 10, "q": "Which of the following best describes the Electoral College?", "c": ["The alma mater of the president", "A body of people, representing the voters of each state, who cast formal votes to elect the members of the Supreme Court.", "A body of people, representing the members of congress, who cast formal votes to elect the president and vice president.", "The site at which members of the Supreme Court cast their votes."], "a": 2, "e": "The Electoral College is a body that casts formal votes to elect the president and vice president; Supreme Court justices are appointed, not elected this way."}, {"n": 11, "q": "Which of the following best describes the idea of popular sovereignty?", "c": ["The government derives its power from the people.", "The Supreme Court changes rulings depending on the attitudes of the people.", "Leaders are well loved because they are in a position of authority.", "The more populous states preside over less populated."], "a": 0, "e": "Popular sovereignty is the principle that government power comes from the people."}];
var GEOGRAPHY = [{"n": 1, "q": "Geography is studied through which of the following main concepts?", "c": ["Soil samples, rock structures, and climate patterns", "Location, place, interaction between humans and their environment, movement and region", "Regional language, culture, ethics, morals, and historical governments", "Livestock, agriculture, sources of water, and wind patterns"], "a": 1, "e": "Geography's core concepts are location, place, human-environment interaction, movement, and region."}, {"n": 2, "q": "When one refers to the Middle East, what are they referring to specifically?", "c": ["A continent", "A region", "A country", "A city"], "a": 1, "e": "The Middle East is a region — an area with definable characteristics but no fixed boundaries like a country or continent."}, {"n": 3, "q": "Use this map to answer questions 3-4. Which of the following nations share a border with Egypt?", "c": ["Sudan", "Turkey", "India", "Iran"], "a": 0, "e": "Sudan borders Egypt to the south (Egypt also borders Libya, the Gaza Strip, and Israel).", "d": "img:ss_geo_map"}, {"n": 4, "q": "Which of the following nations would Egypt culturally relate to most closely with regard to both religious and historical roots?", "c": ["Israel", "Turkey", "India", "Iran"], "a": 1, "e": "Egypt and Turkey share a predominantly Sunni Muslim population and both were part of the Ottoman Empire.", "d": "img:ss_geo_map"}, {"n": 5, "q": "Civilizations located on fertile soil tend to cultivate and farm, while civilizations close to bodies of waters learn to fish. This is an example of what?", "c": ["Adaptation", "Cultural stereotypes", "Environmental limitations", "Geographic insulation"], "a": 0, "e": "This is adaptation — humans adjusting their practices to their environment."}, {"n": 6, "q": "Which of the following is NOT a means of cultural diffusion?", "c": ["The Internet", "European colonialism", "Immigration", "Isolationism"], "a": 3, "e": "Isolationism restricts contact with other nations, which impedes cultural diffusion rather than causing it."}, {"n": 7, "q": "What is the main cause of the desertification affecting the Sahara region of Africa?", "c": ["Lack of farming", "Deforestation", "Heat", "Drought"], "a": 3, "e": "Drought reduces plant growth, allowing wind to move soil more easily and leaving the land barren."}, {"n": 8, "q": "Which of the following best describes the gradual process of destruction or diminution by wind, water, or other natural means?", "c": ["Flooding", "Demolition", "Erosion", "Tectonic shift"], "a": 2, "e": "Erosion is the gradual wearing away of land by wind, water, or other natural forces."}, {"n": 9, "q": "What type of map is best suited for depicting battles and military campaigns?", "c": ["Political map", "Historical map", "Physical map", "None of the above"], "a": 1, "e": "Historical maps depict events, troop movements, and other features needed to understand battles and campaigns."}, {"n": 10, "q": "What map feature explains the colors, lines, and other symbols on a map?", "c": ["Projection", "Compass rose", "Legend", "Scale"], "a": 2, "e": "A map's legend explains what its colors, lines, and symbols mean."}];
var HISTORY = [{"n": 1, "q": "Many explorers travelled the regions of the Louisiana Purchase. Which of these men's expeditions included the Arkansas River, the Rocky Mountains, and the Rio Grande?", "c": ["Meriwether Lewis and William Clark", "Zebulon Pike", "Henry Clay", "Toussaint L'Overture"], "a": 1, "e": "Zebulon Pike's expeditions covered the Arkansas River, the Rocky Mountains, and the Rio Grande."}, {"n": 2, "q": "For what reason did the United States become involved in the War of 1812?", "c": ["The United States wanted its independence from England.", "United States citizens were determined to gain freedom of religion.", "United States citizens wanted the British to cease interfering with their trading laws.", "Americans wanted the British to cease colonizing the United States of America."], "a": 2, "e": "The War of 1812 began mainly because of British interference with American trade."}, {"n": 3, "q": "What was a major result of the Industrial Revolution?", "c": ["A decrease in large-scale manufacturing", "The development of the factory system", "The growth of rural areas", "The increase in imported commodities, rather than American-produced materials"], "a": 1, "e": "The Industrial Revolution led to the development of the factory system and large-scale manufacturing."}, {"n": 4, "q": "The Civil Rights Act of 1866 granted the right of citizenship to all people of the United States EXCEPT...", "c": ["African Americans.", "European Americans.", "Asian Americans.", "Native Americans."], "a": 3, "e": "The Civil Rights Act of 1866 granted citizenship to all people born in the U.S. except Native Americans."}, {"n": 5, "q": "Which of the following was NOT a reason President Andrew Johnson was impeached in 1867?", "c": ["He insisted that the new state governments in the South ratify the 13th Amendment abolishing slavery.", "He gave ex-Confederate military officers and large plantation owners official government pardons.", "He vetoed the bill for the Civil Rights Act.", "He allowed ex-Confederates to serve as military commanders in the South."], "a": 0, "e": "Requiring ratification of the 13th Amendment happened before Johnson's presidency and was not a reason for his impeachment."}, {"n": 6, "q": "Which of the following is NOT a reason the South seceded from the Union in 1861?", "c": ["The election of Abraham Lincoln", "The Southern States believed their state rights were being violated.", "Slaves started an Underground Railroad.", "The South did not like the North infringing on southern trade."], "a": 2, "e": "The Underground Railroad was not a reason for secession — Lincoln's election and disputes over states' rights and trade were the real drivers."}, {"n": 7, "q": "Which of the following states did NOT secede from the United States at the start of the Civil War?", "c": ["South Carolina", "Maryland", "North Carolina", "Virginia"], "a": 1, "e": "Maryland remained in the Union and did not secede."}, {"n": 8, "q": "During the Reconstruction after the Civil War, the Southerners had animosity toward the \"carpetbaggers\" because they...", "c": ["Traveled from the North to take advantage of financial opportunities in the devastated South.", "Convinced the newly-freed slaves to run for political office.", "Took advantage of newly-impoverished plantation owners to gain land and political power.", "All of the above"], "a": 3, "e": "Southern resentment toward carpetbaggers came from all of these reasons."}, {"n": 9, "q": "Which of the following battles was fought during the Civil War?", "c": ["Battle of Bunker Hill", "Battle of Yorktown", "Battle of the Bulge", "Battle of Antietam"], "a": 3, "e": "The Battle of Antietam was fought during the Civil War; the others belong to the Revolutionary War and WWII."}, {"n": 10, "q": "Which of the following groups of American citizens gained suffrage first?", "c": ["Women", "Native Americans", "African-American men", "African-American women"], "a": 2, "e": "African-American men gained the right to vote first (15th Amendment, 1870), before women (1920) or Native Americans (1948 in some states)."}, {"n": 11, "q": "Who among the following was NOT a President of the United States?", "c": ["Benjamin Franklin", "Benjamin Harrison", "Rutherford B. Hayes", "Chester A. Arthur"], "a": 0, "e": "Benjamin Franklin never served as President, though he was a Founding Father."}];
var ECONOMICS = [{"n": 1, "q": "Under which of the following economic models does the United States of America operate?", "c": ["Socialist system", "Barter system", "Capitalist system", "Communist system"], "a": 2, "e": "The U.S. operates under a capitalist economic system, based on private ownership."}, {"n": 2, "q": "Water, time, and raw materials are all examples of what?", "c": ["Products", "Liquid assets", "Common goods", "Commodities"], "a": 3, "e": "Commodities are useful, valuable things bought or sold in their original, untooled form."}, {"n": 3, "q": "A fall in the value of a currency coupled with an overall increase in prices is also called a(n)...", "c": ["Economic crisis.", "Inflation.", "Stock market collapse.", "Recession."], "a": 1, "e": "This describes inflation — falling currency value paired with rising prices."}, {"n": 4, "q": "The dollar value of all goods and services a country produces in a year is measured in which of the following terms?", "c": ["Quality of life", "A country's natural resources", "Gross domestic product", "Profit"], "a": 2, "e": "Gross domestic product (GDP) measures the dollar value of all goods and services a country produces in a year."}, {"n": 5, "q": "If a product were highly desired, the concept of supply and demand would dictate that prices would...", "c": ["Rise.", "Remain stagnant.", "Fluctuate inconsistently.", "None of the above"], "a": 0, "e": "High demand for a desired product drives prices up, according to supply and demand."}, {"n": 6, "q": "The federal government providing purchasing incentives for electric car buyers is an example of what?", "c": ["Subsidy", "Mandate", "Stipulation", "Change in demand"], "a": 0, "e": "Government incentives to encourage a purchase are an example of a subsidy."}, {"n": 7, "q": "What is an interest rate?", "c": ["The level of consumer appeal an organization has at a given moment", "A factor that motivates and influences the behavior of an individual", "The value of a good or service", "A percentage paid for the ability to borrow money over a specified amount of time"], "a": 3, "e": "An interest rate is the percentage paid for borrowing money over a set period of time."}, {"n": 8, "q": "Companies can protect ideas and products from competitors by using which of the following?", "c": ["Reservation", "Copyright", "Entrepreneurship", "Quota"], "a": 1, "e": "A copyright protects ideas and creative products from being used by competitors."}, {"n": 9, "q": "The activity of buying and selling is known as what?", "c": ["Commerce", "Business", "Shopping", "Collateral"], "a": 0, "e": "Commerce is the activity of buying and selling goods and services."}];
var MATH_CLUSTERS_FULL = [{"id": "ordering-rationals", "title": "Ordering Fractions, Decimals & Negatives", "missed": [1], "lesson": "To put mixed numbers, fractions, and negatives in order, **convert everything to decimals first** — it's much easier to compare 6.4, 2.25, 0.8, -2, -5 than the original mixed forms. Remember: **any positive number beats any negative number**, and between two negatives, the one **closer to zero is actually greater** (-2 > -5, not the other way around). Slow down on that last part — it's the #1 trap in these questions.", "checks": [{"q": "Which list is ordered from LEAST to GREATEST?", "c": ["5, -3, 2, -1", "-3, -1, 2, 5", "5, 2, -1, -3", "-1, -3, 2, 5"], "a": 1, "e": "Convert to a number line in your head: -3 is furthest left (least), then -1, then 2, then 5."}, {"q": "Which is greater: -7 or -2?", "c": ["-7", "-2", "They are equal", "Cannot be determined"], "a": 1, "e": "-2 is closer to zero, so it's the greater (less negative) number."}], "missedFull": [{"qid": "math-1", "n": 1, "stem": "Which of the following is listed in order from greatest to least?", "choices": ["2 1/4, 32/5, 4/5, -5, -2", "32/5, 2 1/4, 4/5, -2, -5", "-5, -2, 32/5, 4/5, 2 1/4", "32/5, 2 1/4, 4/5, -5, -2"], "correctIdx": 1, "chosenIdx": 2, "explain": "Convert to decimals: 6.4, 2.25, 0.8, -2, -5. That's the correct order from greatest to least (and -2 is greater than -5).", "diagram": null}]}, {"id": "fraction-division", "title": "Dividing Fractions & Mixed Numbers", "missed": [6, 7, 55], "lesson": "Dividing by a fraction means **flip the second fraction and multiply** (\"keep, change, flip\"). For mixed numbers, **convert to an improper fraction first**. When a division doesn't come out even (like 29 ÷ 8), the leftover remainder becomes the **numerator of the fraction part** — 29 ÷ 8 = 3 remainder 5, so the answer is 3 5/8, not 3 with some other fraction.", "checks": [{"q": "What is 9 1/3 ÷ 1/3?", "c": ["3", "28", "3 1/3", "9 2/3"], "a": 1, "e": "9 1/3 = 28/3. Dividing by 1/3 means multiplying by 3: 28/3 × 3 = 28."}, {"q": "A team divides 35 trophies equally among 8 players. How many does each player get?", "c": ["4 3/8", "4 1/2", "4 5/8", "4 3/4"], "a": 0, "e": "35 ÷ 8 = 4 remainder 3, so each player gets 4 3/8."}], "missedFull": [{"qid": "math-6", "n": 6, "stem": "How many one-fourths are contained in 8 1/2?", "choices": ["34", "64", "36", "17"], "correctIdx": 0, "chosenIdx": 2, "explain": "8 1/2 ÷ 1/4 = 17/2 × 4 = 34.", "diagram": null}, {"qid": "math-7", "n": 7, "stem": "Which number sentence is represented by the model shown below?", "choices": ["4 ÷ 3/4 = 5 1/3", "4 ÷ 2/3 = 5 1/3", "4 ÷ 3/4 = 5 1/4", "4 ÷ 2/3 = 5 1/4"], "correctIdx": 0, "chosenIdx": 2, "explain": "The model shows 4 divided into sections of length 3/4: 4 ÷ 3/4 = 5 1/3.", "diagram": "svg:barmodel4"}, {"qid": "math-55", "n": 55, "stem": "A publishing company has been given 29 manuscripts to review. If the company divides the work equally amongst 8 editors, which of the following represents the number of manuscripts each editor will review?", "choices": ["3 3/5", "3 5/8", "3 1/7", "3 2/3"], "correctIdx": 1, "chosenIdx": 0, "explain": "29 ÷ 8 = 3 remainder 5, so 3 5/8.", "diagram": null}]}, {"id": "percent-conversions", "title": "Percent, Discount & Fraction Conversions", "missed": [15, 52], "lesson": "**Percent discount** problems: find the discount amount as a percent of the ORIGINAL price — not the sale price, and not just the dollar difference. Formula: `discount % = (original − sale) ÷ original`. For **fraction-to-percent**, divide top by bottom: 4/5 = 4÷5 = 0.80 = 80% exactly. These convert cleanly when the denominator divides evenly into 100 (like 5, 10, 20, 25).", "checks": [{"q": "A $50 shirt is on sale for $40. What percent discount is that?", "c": ["10%", "15%", "20%", "25%"], "a": 2, "e": "(50-40)/50 = 10/50 = 20%."}, {"q": "Which fraction equals 75%?", "c": ["3/5", "3/4", "2/3", "4/5"], "a": 1, "e": "3/4 = 3÷4 = 0.75 = 75%."}], "missedFull": [{"qid": "math-15", "n": 15, "stem": "A car dealership is having a blowout sale. Douglas finds a car sale-priced at $36,549.15. The car was originally priced at $42,999. What percentage discount would Douglas receive?", "choices": ["12%", "15%", "18%", "20%"], "correctIdx": 1, "chosenIdx": 2, "explain": "(42,999 - 36,549.15) / 42,999 = 0.15 = 15%.", "diagram": null}, {"qid": "math-52", "n": 52, "stem": "Amanda has finished 80% of a grant proposal. Which of the following fractions represents the amount she has finished?", "choices": ["3/4", "7/9", "4/5", "6/7"], "correctIdx": 2, "chosenIdx": 0, "explain": "80% = 4/5 exactly (4 ÷ 5 = 0.80).", "diagram": null}]}, {"id": "metric-conversion", "title": "Metric Unit Conversion", "missed": [19], "lesson": "Metric conversions are all powers of 10. The ladder from biggest to smallest unit: **kilo → hecto → deka → (base unit) → deci → centi → milli**. Each step is ×10. So 1 decimeter = 10 centimeters (moving from deci to centi is one step down = ×10). A common mistake is dividing instead of multiplying when going from a bigger unit to a smaller one — going to a smaller unit always means a BIGGER number.", "checks": [{"q": "How many centimeters are in 3.5 meters?", "c": ["0.35 cm", "35 cm", "350 cm", "3500 cm"], "a": 2, "e": "Meters to centimeters is ×100: 3.5 × 100 = 350 cm."}, {"q": "How many millimeters are in 1 centimeter?", "c": ["10", "100", "1", "1000"], "a": 0, "e": "centi to milli is one step down the ladder = ×10."}], "missedFull": [{"qid": "math-19", "n": 19, "stem": "A book has a width of 2.5 decimeters. What is the width of the book in centimeters?", "choices": ["0.25 centimeters", "25 centimeters", "250 centimeters", "0.025 centimeters"], "correctIdx": 1, "chosenIdx": 0, "explain": "1 decimeter = 10 cm, so 2.5 dm = 25 cm.", "diagram": null}]}, {"id": "sequences", "title": "Number Patterns & Sequences", "missed": [12, 22, 23], "lesson": "For an **arithmetic sequence** (adds/subtracts the same amount each time), the rule looks like `aₙ = (common difference)×n + (starting adjustment)`. Test your rule against EVERY row of the table, not just one. For **growth comparisons** (like one person doubling vs. another squaring), don't assume the faster-looking pattern wins early — **build an actual table month by month** until one overtakes the other; guessing the crossover point is the most common error here.", "checks": [{"q": "A sequence is 4, 9, 14, 19, ... What is the 10th term?", "c": ["44", "49", "54", "45"], "a": 1, "e": "Common difference is 5. aₙ = 5n - 1. a10 = 50-1 = 49."}, {"q": "Which rule matches: n=1→7, n=2→4, n=3→1, n=4→-2?", "c": ["Multiply n by -3, add 10", "Multiply n by 3, add 4", "Multiply n by -2, add 9", "Multiply n by 2, add 5"], "a": 0, "e": "-3(1)+10=7, -3(2)+10=4, -3(3)+10=1 — matches every row."}], "missedFull": [{"qid": "math-12", "n": 12, "stem": "Amy deposits $1 in her savings account during Month 1. For each subsequent month, she deposits an amount equal to the square of the number of the month. Douglas deposits the same amount in his savings account during Month 1. However, for each subsequent month, he deposits twice the amount deposited the previous month. Which is the first month that the amount deposited by Douglas exceeds the amount deposited by Amy?", "choices": ["Month 4", "Month 6", "Month 7", "Month 8"], "correctIdx": 2, "chosenIdx": 0, "explain": "In Month 7, Douglas deposits $64 while Amy deposits $49 — the first month Douglas's deposit exceeds Amy's (in Month 6, Amy=$36 vs Douglas=$32).", "diagram": null}, {"qid": "math-22", "n": 22, "stem": "Given the sequence represented in the table below, where n represents the position of the term and aₙ represents the value of the term, which of the following describes the relationship between the position number and the value of the term?", "choices": ["Multiply n by 2 and subtract 4", "Multiply n by 2 and subtract 3", "Multiply n by -3 and add 8", "Multiply n by -4 and add 1"], "correctIdx": 2, "chosenIdx": 0, "explain": "aₙ = -3n + 8 fits every row: n=1→5, n=2→2, n=3→-1, etc.", "diagram": null}, {"qid": "math-23", "n": 23, "stem": "The number 123 is the 11th term in a sequence with a constant rate of change. Which of the following sequences has this number as its 11th term?", "choices": ["5, 17, 29, 41, ...", "3, 15, 27, 39, ...", "-1, 11, 23, 35, ...", "1, 13, 25, 37, ..."], "correctIdx": 1, "chosenIdx": 3, "explain": "All have common difference 12; only 3,15,27,39,... gives an 11th term of 123 (3 + 10×12 = 123).", "diagram": null}]}, {"id": "3d-shapes", "title": "3D Shape Properties: Faces, Edges & Nets", "missed": [29, 36], "lesson": "Memorize these landmark shapes: a **cube** has 6 faces/12 edges; a **square pyramid** has 5 faces/8 edges (4 triangles + 1 square base); a **triangular prism** has 5 faces/9 edges (2 triangles + 3 rectangles). For **nets** (the flattened, unfolded version), picture folding it back up: if it's made of narrow curved gores like orange-peel slices, it approximates a **sphere**; if it's triangles + rectangles, it's a prism or pyramid.", "checks": [{"q": "Which figure has 6 faces, 12 edges, and 8 vertices?", "c": ["Square pyramid", "Cube", "Triangular prism", "Cone"], "a": 1, "e": "That's the definition of a cube (or any rectangular prism)."}, {"q": "A net made of one rectangle and two circles (one on each short end) folds into a:", "c": ["Cone", "Cylinder", "Prism", "Sphere"], "a": 1, "e": "Two circular bases + one rectangular lateral surface = cylinder."}], "missedFull": [{"qid": "math-29", "n": 29, "stem": "Which figure has 5 faces and 8 edges?", "choices": ["Triangular pyramid", "Cube", "Square pyramid", "Triangular prism"], "correctIdx": 2, "chosenIdx": 0, "explain": "A square pyramid has 4 triangular faces + 1 square base = 5 faces, and 8 edges.", "diagram": null}, {"qid": "math-36", "n": 36, "stem": "Which three-dimensional figure is approximated by the net shown below?", "choices": ["Cone", "Rectangular prism", "Sphere", "Cylinder"], "correctIdx": 2, "chosenIdx": 3, "explain": "The net of narrow curved strips (like an orange peel/globe gore pattern) approximates a sphere.", "diagram": "img:math_q36_net"}]}, {"id": "coordinate-geometry", "title": "Coordinate Plane: Plotting & Reflections", "missed": [31, 32], "lesson": "An ordered pair is always **(x, y)** — x is left/right (horizontal) first, y is up/down (vertical) second. To **reflect across the x-axis**, keep x the same and flip the SIGN of y only. To reflect across the y-axis, keep y the same and flip the sign of x only. Write out all the new coordinates one at a time rather than doing it in your head — that's where sign errors creep in.", "checks": [{"q": "What are the coordinates of a point 3 units left and 4 units up from the origin?", "c": ["(3, 4)", "(-3, 4)", "(3, -4)", "(-3, -4)"], "a": 1, "e": "Left is negative x, up is positive y: (-3, 4)."}, {"q": "Reflecting the point (6, -2) across the x-axis gives:", "c": ["(6, 2)", "(-6, -2)", "(-6, 2)", "(2, 6)"], "a": 0, "e": "x-axis reflection flips the sign of y only: (6, -2) → (6, 2)."}], "missedFull": [{"qid": "math-31", "n": 31, "stem": "What ordered pair is shown on the graph below?", "choices": ["(-2, 5)", "(-2, -5)", "(2, 5)", "(2, -5)"], "correctIdx": 0, "chosenIdx": 1, "explain": "The point is 2 units left of the origin and 5 units up: (-2, 5).", "diagram": "svg:point_neg2_5"}, {"qid": "math-32", "n": 32, "stem": "Edward draws a triangle with vertices at (1, 4), (5, 1), and (5, 6). If he wishes to reflect the triangle across the x-axis, which of the following vertices should he plot?", "choices": ["(-1, 4), (-5, 1), (-5, 6)", "(1, -4), (5, -1), (5, -6)", "(-1, -4), (-5, -1), (-5, -6)", "(4, 1), (1, 5), (6, 5)"], "correctIdx": 1, "chosenIdx": 0, "explain": "Reflecting across the x-axis negates the y-value only: (1,-4), (5,-1), (5,-6).", "diagram": null}]}, {"id": "angle-relationships", "title": "Angle Relationships", "missed": [33], "lesson": "**Complementary** angles add to
