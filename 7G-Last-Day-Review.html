90°. **Supplementary** angles add to 180°. When a problem says two angles together must complete a right angle (like fitting against a wall) or a straight line, figure out which total applies FIRST, then subtract the known angle from that total.", "checks": [{"q": "Two angles are complementary. One is 27°. What is the other?", "c": ["53°", "63°", "153°", "73°"], "a": 1, "e": "90 - 27 = 63°."}, {"q": "An angle and its supplement add to how many degrees?", "c": ["90°", "180°", "270°", "360°"], "a": 1, "e": "Supplementary angles always sum to 180°."}], "missedFull": [{"qid": "math-33", "n": 33, "stem": "A carpenter must fix a broken section of a kitchen cabinet. The intact portion of the cabinet forms a 76° angle with the wall. The width of the cabinet is supposed to form a 90° angle with the wall. What angle measure should the carpenter use when cutting the piece that will fit next to the 76° angle?", "choices": ["12°", "14°", "104°", "136°"], "correctIdx": 1, "chosenIdx": 2, "explain": "90° - 76° = 14°.", "diagram": null}]}, {"id": "circumference", "title": "Circle Circumference", "missed": [35], "lesson": "Circumference formula: **C = π × diameter** (or C = 2πr, since diameter = 2×radius). The #1 mistake is plugging in the **radius** where the formula needs the **diameter** — always double the radius first if that's what you're given.", "checks": [{"q": "A circle has a radius of 10 cm. Using π ≈ 3.14, what is its circumference?", "c": ["31.4 cm", "62.8 cm", "78.5 cm", "15.7 cm"], "a": 1, "e": "Diameter = 20 cm. C = 3.14 × 20 = 62.8 cm."}, {"q": "A circle has a diameter of 9 in. What is its circumference (π ≈ 3.14)?", "c": ["14.13 in", "28.26 in", "56.52 in", "9 in"], "a": 1, "e": "C = 3.14 × 9 = 28.26 in."}], "missedFull": [{"qid": "math-35", "n": 35, "stem": "A circle has a radius of 23 cm. Which of the following is the best estimate for the circumference of the circle?", "choices": ["71.76 cm", "143.52 cm", "144.44 cm", "72.22 cm"], "correctIdx": 2, "chosenIdx": 0, "explain": "C = πd = 3.14 × 46 = 144.44 cm.", "diagram": null}]}, {"id": "volume-formulas", "title": "Volume: Prisms & Cones", "missed": [39, 40, 42, 68], "lesson": "**Every prism**: Volume = (area of the base shape) × height. For a triangular prism, the base is a triangle, so Volume = (1/2 × base × height of triangle) × length of prism. For **rectangular prisms**, when a question says \"best estimate,\" round EACH dimension to a whole number FIRST, then multiply — don't calculate the exact answer and round at the end, since that gives a different number than the test expects. **Cones**: Volume = (1/3) × π × r² × h — that 1/3 is easy to forget.", "checks": [{"q": "A triangular prism has a triangular base with base 6 in and height 5 in, and the prism is 10 in long. What is its volume?", "c": ["150 in³", "300 in³", "30 in³", "75 in³"], "a": 0, "e": "(1/2 × 6 × 5) × 10 = 15 × 10 = 150 in³."}, {"q": "Using the round-each-dimension-first method, what's the best volume estimate for a box 9.8 cm × 5.1 cm × 3.9 cm?", "c": ["150 cm³", "180 cm³", "200 cm³", "220 cm³"], "a": 2, "e": "Round each dimension first: 9.8→10, 5.1→5, 3.9→4. Then 10×5×4 = 200 cm³."}], "missedFull": [{"qid": "math-39", "n": 39, "stem": "In the formula for the volume of the figure shown below, written as V = B · h, h represents the height of the prism when it rests one of its bases. What does the B represent?", "choices": ["1/3 bh, where b is the triangle's base and h is the triangle's height", "bh, where b is the triangle's base and h is the triangle's height", "2bh, where b is the triangle's base and h is the triangle's height", "1/2 bh, where b is the triangle's base and h is the triangle's height"], "correctIdx": 3, "chosenIdx": 1, "explain": "B is the area of the triangular base, which is 1/2 × base × height.", "diagram": "svg:triangularprism3d"}, {"qid": "math-40", "n": 40, "stem": "A rectangular prism has a length of 14.3 cm, a width of 8.9 cm, and a height of 11.7 cm. Which of the following is the best estimate for the volume of the rectangular prism?", "choices": ["1,512 cm³", "1,287 cm³", "1,386 cm³", "1,620 cm³"], "correctIdx": 0, "chosenIdx": 2, "explain": "Rounding each dimension (14, 9, 12) and multiplying: 14 × 9 × 12 = 1,512 cm³.", "diagram": null}, {"qid": "math-42", "n": 42, "stem": "Fred designs a candy box in the shape of a triangular prism. The base of each triangular face measures 4 inches, while the height of the prism is 7 inches. Given that the length of the prism is 11 inches, what is the volume of the candy box?", "choices": ["102 in³", "128 in³", "154 in³", "308 in³"], "correctIdx": 2, "chosenIdx": 3, "explain": "V = 1/2 × 4 × 7 × 11 = 154 in³.", "diagram": null}, {"qid": "math-68", "n": 68, "stem": "A cone has a radius of 4 cm and an approximate volume of 150.72 cm³. What is the height of the cone?", "choices": ["7 cm", "9 cm", "8 cm", "12 cm"], "correctIdx": 1, "chosenIdx": 0, "explain": "150.72 = 1/3 × π × 16 × h → h = 9 cm.", "diagram": null}]}, {"id": "statistics-median", "title": "Reading Histograms & Finding the Median", "missed": [47], "lesson": "The **median** is the middle value when everything is in order — with an even number of data points, count to the halfway spot. On a histogram, add up the bar heights (frequencies) as you move left to right until you reach the halfway point in the TOTAL count — the bar you land in when you cross the halfway mark is where the median lives. This is different from the **mean** (add everything, divide by count) and different from **mode** (the most frequent value).", "checks": [{"q": "A histogram has 40 total data points. Where does the median fall?", "c": ["Between the 1st and 2nd values", "Between the 20th and 21st values", "At the 40th value", "At the highest bar"], "a": 1, "e": "With 40 values, the median sits between the 20th and 21st when ordered."}, {"q": "Which measure is most affected by one extremely high or low outlier?", "c": ["Median", "Mode", "Mean", "Range doesn't include outliers"], "a": 2, "e": "The mean factors in every value directly, so a single extreme value pulls it noticeably; the median is resistant to outliers."}], "missedFull": [{"qid": "math-47", "n": 47, "stem": "The histogram below represents the overall GRE scores for a sample of college students. Which of the following is a true statement?", "choices": ["The range of GRE scores is approximately 600.", "The average GRE score is 750.", "The median GRE score is approximately 500.", "The fewest number of college students had an approximate score of 800."], "correctIdx": 2, "chosenIdx": 1, "explain": "With 50 data points total, the median falls between the 25th and 26th scores, which lands in the interval around 500.", "diagram": "img:math_q47_histogram"}]}, {"id": "probability", "title": "Probability of Independent Events", "missed": [50], "lesson": "For two **independent** events (one doesn't affect the other, like a die roll AND a coin flip), **multiply their individual probabilities**: P(A and B) = P(A) × P(B). Write each probability as a fraction first — don't skip that step, since combining them in your head is where errors happen.", "checks": [{"q": "What is the probability of flipping heads AND rolling a 6 on a standard die?", "c": ["1/6", "1/2", "1/12", "1/8"], "a": 2, "e": "P(heads)=1/2, P(rolling 6)=1/6. 1/2 × 1/6 = 1/12."}, {"q": "A bag has 3 red and 2 blue marbles. What is the probability of picking red, replacing it, then picking red again?", "c": ["3/5", "9/25", "6/10", "3/10"], "a": 1, "e": "P(red)=3/5 each time (replaced). 3/5 × 3/5 = 9/25."}], "missedFull": [{"qid": "math-50", "n": 50, "stem": "Amy rolled a die and flipped a coin. What is the probability that she rolled an even number and got heads?", "choices": ["1/4", "1/2", "3/4", "1/3"], "correctIdx": 0, "chosenIdx": 3, "explain": "P(even)=1/2 (or 3/6), P(heads)=1/2: 1/2 × 1/2 = 1/4.", "diagram": null}]}, {"id": "square-roots", "title": "Square Roots & Area", "missed": [53], "lesson": "For a square, **Area = side²**, so **side = √Area**. If you build a square out of unit squares, the number of unit squares along ONE SIDE is the square root of the total number of unit squares inside. Don't confuse this with the perimeter (4 × side) or with half the area — the square root is specifically about the side length.", "checks": [{"q": "A square has an area of 81 square units. What is the length of one side?", "c": ["9 units", "40.5 units", "81 units", "20.25 units"], "a": 0, "e": "√81 = 9."}, {"q": "If a square's side is 7 cm, what is its area?", "c": ["14 cm²", "28 cm²", "49 cm²", "21 cm²"], "a": 2, "e": "Area = side² = 7² = 49 cm²."}], "missedFull": [{"qid": "math-53", "n": 53, "stem": "In a square built with unit squares, which of the following would represent the square root of the square?", "choices": ["The number of unit squares comprising a side", "The total number of unit squares within the square", "Half of the total number of unit squares within the square", "The number of unit squares comprising the perimeter of the square"], "correctIdx": 0, "chosenIdx": 3, "explain": "The square root of the area of a square equals its side length.", "diagram": null}]}, {"id": "order-of-operations", "title": "Order of Operations", "missed": [54, 58], "lesson": "The order is: **Parentheses → Exponents → Multiplication & Division (left to right) → Addition & Subtraction (left to right)** (PEMDAS). The trickiest part: multiplication and division are the SAME priority level — do them left to right in the order they appear, not \"all multiplication then all division.\" Same for addition/subtraction. Also watch negative signs with exponents: **-8² = -64** (the negative is NOT squared unless it's in parentheses like (-8)² = 64).", "checks": [{"q": "Evaluate: 6 + 2 × (5 - 3)²", "c": ["16", "14", "64", "22"], "a": 1, "e": "Parentheses first: (5-3)=2. Exponent: 2²=4. Multiply: 2×4=8. Add: 6+8=14."}, {"q": "Evaluate: -5²  + 10", "c": ["-15", "35", "-35", "15"], "a": 0, "e": "-5² means -(5²) = -25 (no parentheses around -5). -25 + 10 = -15."}], "missedFull": [{"qid": "math-54", "n": 54, "stem": "According to the order of operations, which of the following steps should be completed immediately following the evaluation of the squared number when evaluating the expression 9 - 18² × 2 + 12 ÷ 4?", "choices": ["Subtract 18² from 9", "Multiply the squared value by 2", "Divide 12 by 4", "Add 2 and 12"], "correctIdx": 1, "chosenIdx": 2, "explain": "After exponents, multiplication/division happen left to right — the squared value gets multiplied by 2 next.", "diagram": null}, {"qid": "math-58", "n": 58, "stem": "Which of the following is equivalent to -8² + (17 - 9) × 4 + 7?", "choices": ["-217", "24", "-64", "-25"], "correctIdx": 3, "chosenIdx": 2, "explain": "-64 + 8×4 + 7 = -64 + 32 + 7 = -25.", "diagram": null}]}, {"id": "rates-proportions", "title": "Rates & Proportions", "missed": [67], "lesson": "When a rate stays constant (like hours per course, or miles per gallon), set up a **proportion**: (known rate) = (unknown rate), cross-multiply, and solve. Keep the SAME units in the same position in both fractions (hours over courses = hours over courses), or the cross-multiplication will give a wrong setup.", "checks": [{"q": "If 3 pizzas feed 12 people, how many pizzas are needed for 20 people?", "c": ["4", "5", "6", "8"], "a": 1, "e": "3/12 = x/20. 12x = 60, x = 5."}, {"q": "A car uses 8 gallons to travel 240 miles. At the same rate, how many gallons for 300 miles?", "c": ["9", "10", "12", "15"], "a": 1, "e": "8/240 = x/300. 240x = 2400, x = 10."}], "missedFull": [{"qid": "math-67", "n": 67, "stem": "Mel studied 25 hours per week when he took four college courses. If he spends the same amount of time studying per course, how many hours will he spend studying when he takes five college courses?", "choices": ["30.75", "32.50", "31.75", "31.25"], "correctIdx": 3, "chosenIdx": 2, "explain": "25/4 = x/5 → x = 31.25.", "diagram": null}]}];
var SCIENCE_CLUSTERS_FULL = [{"id": "genetics", "title": "Genetics & Linked Traits", "missed": [1], "lesson": "When two traits **always seem to show up together** in relatives (like white flowers + tallness), the most likely reason is that their genes sit **close together on the same chromosome** — this is called being **linked**. Linked genes tend to get inherited as a package deal, since it's rare for them to get separated during reproduction.", "checks": [{"q": "In a species, curly fur and short tails are almost always found together. This is best explained by:", "c": ["The traits are both dominant", "The genes are linked on the same chromosome", "The genes are on different chromosomes", "The traits are caused by diet"], "a": 1, "e": "Traits that consistently travel together point to linked genes on the same chromosome."}, {"q": "Genes located far apart on the same chromosome, or on different chromosomes, tend to be inherited:", "c": ["Always together", "Independently of each other", "Never at all", "Only in males"], "a": 1, "e": "Unlinked genes assort independently during reproduction."}], "missedFull": [{"qid": "science-1", "n": 1, "stem": "A botanist examining a collection of related plants of a certain species notices that plants with white flowers tend to be taller than plants with yellow flowers. Which of the following is the most likely explanation for this?", "choices": ["White flowers and tallness are both dominant traits.", "White flowers and tallness are both recessive traits.", "The genes for white flowers and tallness are on the same chromosome.", "The genes for white flowers and tallness are on different chromosomes."], "correctIdx": 2, "chosenIdx": 1, "explain": "When two traits are frequently inherited together, it's most likely because the genes for them are linked — located near each other on the same chromosome.", "diagram": null}]}, {"id": "forces-newton", "title": "Newton's Laws & Net Force", "missed": [3, 21], "lesson": "**Newton's Third Law**: every action has an equal and opposite reaction. **Newton's First Law**: an object at rest stays at rest, and an object in motion stays in motion, unless an outside force acts on it. Key idea: if something is **motionless** (not accelerating), the **net force on it must be zero** — all the forces are balanced/cancelling out, even though individual forces (like gravity) are still acting on it.", "checks": [{"q": "A book sits still on a table. What is the net force on the book?", "c": ["Equal to gravity, pointing down", "Zero", "Equal to the table's push, pointing up", "Cannot be determined"], "a": 1, "e": "Since the book isn't accelerating, the upward push of the table exactly balances gravity — net force is zero."}, {"q": "\"When you push on a wall, the wall pushes back on you with equal force\" describes:", "c": ["Newton's First Law", "Newton's Second Law", "Newton's Third Law", "The Law of Conservation of Energy"], "a": 2, "e": "Equal and opposite reaction forces = Newton's Third Law."}], "missedFull": [{"qid": "science-3", "n": 3, "stem": "“For every action there is an equal and opposite reaction.” What is this statement?", "choices": ["Newton's First Law", "Newton's Second Law", "Newton's Third Law", "The First Law of Thermodynamics"], "correctIdx": 2, "chosenIdx": 3, "explain": "This is Newton's Third Law.", "diagram": null}, {"qid": "science-21", "n": 21, "stem": "In what direction is the net force on the mass when the student takes his measurements?", "choices": ["The direction on the net force is upward.", "The direction on the net force is downward.", "The direction on the net force is zero.", "The direction on the net force cannot be determined."], "correctIdx": 2, "chosenIdx": 1, "explain": "Since the mass hangs motionless (not accelerating), the net force on it must be zero.", "diagram": null}]}, {"id": "energy-sources", "title": "Renewable vs. Nonrenewable Energy", "missed": [4], "lesson": "**Renewable** energy sources are naturally replenished on a human timescale: **solar, wind, hydroelectric (water), geothermal**. **Nonrenewable** sources take millions of years to form and get used up faster than they're replaced: **natural gas, coal, oil/petroleum**. A quick test: could nature restock it within your lifetime?", "checks": [{"q": "Which of these is a nonrenewable energy source?", "c": ["Wind", "Solar", "Coal", "Hydroelectric"], "a": 2, "e": "Coal takes millions of years to form — it's nonrenewable."}, {"q": "Which pair are BOTH renewable?", "c": ["Coal and oil", "Wind and solar", "Natural gas and coal", "Oil and wind"], "a": 1, "e": "Wind and solar are both naturally and continuously replenished."}], "missedFull": [{"qid": "science-4", "n": 4, "stem": "Which of the following is NOT considered a renewable energy source?", "choices": ["Hydroelectricity", "Natural gas", "Solar energy", "Wind energy"], "correctIdx": 1, "chosenIdx": 0, "explain": "Natural gas takes thousands of years to form and is used up faster than it's replenished, unlike water flow, sunlight, and wind.", "diagram": null}]}, {"id": "population-ecology", "title": "Population Growth & Carrying Capacity", "missed": [6], "lesson": "Population growth often follows an **S-curve**: fast growth at first, then it **levels off** as it approaches the environment's **carrying capacity** — the maximum population the available food, water, and space can support. It doesn't grow forever, and it doesn't crash to zero just because it slows down; it stabilizes.", "checks": [{"q": "A population of rabbits grows quickly then levels off. What most likely caused the leveling off?", "c": ["The rabbits stopped reproducing entirely", "Limited food and space (carrying capacity)", "A new predator wiped them out", "Genetic mutations capped their number"], "a": 1, "e": "Leveling off after fast growth is the classic sign of reaching carrying capacity — resource limits, not extinction."}, {"q": "Carrying capacity refers to:", "c": ["The fastest possible growth rate", "The maximum population an environment can sustainably support", "The number of predators in an area", "The average lifespan of a species"], "a": 1, "e": "Carrying capacity = the sustainable population ceiling for that environment."}], "missedFull": [{"qid": "science-6", "n": 6, "stem": "Which of the following best describes the growth of the butterfly population after a long period of time, as shown by this graph?", "choices": ["The butterflies will eventually die out because they will stop reproducing.", "The butterflies will keep increasing without limit because new mutations will keep increasing their variety.", "The butterflies will eventually tend toward a stable number because there is a limit to how many butterflies the available resources will support.", "The butterflies will eventually tend toward a stable number because they are genetically preprogrammed to reach a particular population size."], "correctIdx": 2, "chosenIdx": 3, "explain": "The graph levels off because any environment has finite resources (food, space) that can only support a limited population — this is carrying capacity.", "diagram": "svg:butterfly_scurve"}]}, {"id": "solubility", "title": "Solubility as a Property", "missed": [8], "lesson": "**Solubility** is a fixed property of a substance (how much can dissolve in a given amount of solvent) — it does **not change** just because you use more or less solvent. If you double the water, you can dissolve twice as much solute, but the **ratio (solubility) stays the same**.", "checks": [{"q": "If salt has a solubility of 36 g per 100 mL of water, how much dissolves in 200 mL?", "c": ["36 g", "54 g", "72 g", "18 g"], "a": 2, "e": "Double the water, double the amount dissolved: 72 g — but the solubility ratio (36g/100mL) itself hasn't changed."}, {"q": "Which statement about solubility is TRUE?", "c": ["It depends on how much solvent you use", "It is a fixed property of the substance at a given temperature", "It is always the same for every substance", "It only applies to solids dissolving in solids"], "a": 1, "e": "Solubility is defined per fixed amount of solvent — it's an intrinsic property (though it can change with temperature)."}], "missedFull": [{"qid": "science-8", "n": 8, "stem": "If Francis used twice as much water, would he get a different result for the solubility of the salt?", "choices": ["Yes, because the more water he uses, the more salt he can dissolve in it.", "Yes, because the more water he uses, the less salt he can dissolve in it.", "No, because solubility is a property of a material; it doesn't depend on the amount.", "No, because it would only have changed his measurement for the sugar, not for the salt."], "correctIdx": 2, "chosenIdx": 0, "explain": "Solubility is a fixed property of a substance (a ratio), so it doesn't change just because you use more water.", "diagram": null}]}, {"id": "astronomy-comets", "title": "Comets & Orbital Periods", "missed": [10], "lesson": "Comets orbit the Sun on a **regular, repeating cycle** (their orbital period). If a comet passed by in Year A and again in Year B, its period is (B − A) years, and it should return roughly every (B − A) years after that — just add the period to the most recent sighting.", "checks": [{"q": "A comet passed Earth in 1950 and again in 2020. When should it next appear?", "c": ["2050", "2090", "2070", "2100"], "a": 1, "e": "Period = 2020-1950 = 70 years. Next appearance: 2020+70 = 2090."}, {"q": "Comets are mostly made of:", "c": ["Solid iron", "Ice, dust, and rock particles", "Pure hydrogen gas", "Molten lava"], "a": 1, "e": "Comets are often called \"dirty snowballs\" — mostly ice mixed with dust and rock."}], "missedFull": [{"qid": "science-10", "n": 10, "stem": "A comet called 12P/Pons-Brooks last passed by the Earth in 1954. The time before that, it passed by the Earth in 1884. In what year is it likely to pass by the Earth again?", "choices": ["2024", "2084", "2134", "If it has already passed by the Earth twice, this comet will never pass by the Earth again."], "correctIdx": 0, "chosenIdx": 2, "explain": "The comet's orbital period is about 70 years (1954-1884=70), so it should pass again around 1954+70=2024.", "diagram": null}]}, {"id": "heat-matter", "title": "Heat Transfer & Conservation of Mass", "missed": [12, 13], "lesson": "Heat always flows from **warmer to colder** objects (conduction) — \"cold\" isn't a thing that moves on its own, it's just the absence of heat. When ice melts into water, **no matter is created or destroyed** — the mass stays exactly the same, even though the water takes up less space (it's just denser than ice).", "checks": [{"q": "A warm spoon is placed in a glass of ice water. What happens?", "c": ["Cold flows from the water into the spoon", "Heat flows from the spoon into the water", "Nothing, they stay separate", "The spoon radiates cold"], "a": 1, "e": "Heat always flows from the warmer object (spoon) to the colder one (water)."}, {"q": "A 50 g ice cube fully melts into a puddle with no evaporation. What is the puddle's mass?", "c": ["Less than 50 g, since liquids weigh less", "More than 50 g", "Exactly 50 g", "Cannot be determined"], "a": 2, "e": "Mass is conserved — melting only changes state/volume, not mass."}], "missedFull": [{"qid": "science-12", "n": 12, "stem": "Which of the following best describes why an ice cube left on the counter at room temperature will warm up and melt?", "choices": ["The ice cube will radiate cold into its surroundings.", "Cold will be conducted from the ice cube into the counter and air.", "The counter will radiate heat into the ice cube.", "Heat will be conducted from the counter and air into the ice cube."], "correctIdx": 3, "chosenIdx": 0, "explain": "Heat always moves from warmer objects to colder ones; here heat is conducted from the counter and air into the ice cube. Cold is just the absence of heat, not something that moves on its own.", "diagram": null}, {"qid": "science-13", "n": 13, "stem": "How will the mass of the ice cube compare to the mass of the puddle of water left after it melts? (Assume that no water evaporates while the ice is melting.)", "choices": ["The water will have a larger mass because water is denser than ice.", "The ice will have a larger mass because ice is denser than water.", "The ice will have a larger mass because solids have more mass than liquids.", "The ice and the water will have the same mass because mass is conserved."], "correctIdx": 3, "chosenIdx": 1, "explain": "Matter isn't created or destroyed when ice melts — same atoms, same mass, just a different volume (density changes, not mass).", "diagram": null}]}, {"id": "climate-hemispheres", "title": "Seasons & Hemispheres", "missed": [16], "lesson": "The **Northern Hemisphere** is warm in June/July/August and cold in December/January/February. The **Southern Hemisphere** has the OPPOSITE pattern — warm in December-February, cold in June-August. If a location's data shows it's hottest in January and coldest in July, that's a strong clue it's in the **Southern Hemisphere**.", "checks": [{"q": "A city records its hottest temperatures in January and coldest in July. Where is it likely located?", "c": ["Northern Hemisphere", "Southern Hemisphere", "On the equator", "At the North Pole"], "a": 1, "e": "That's the reversed seasonal pattern of the Southern Hemisphere."}, {"q": "In the Northern Hemisphere, which month is typically the coldest?", "c": ["July", "January", "April", "October"], "a": 1, "e": "January falls in Northern Hemisphere winter."}], "missedFull": [{"qid": "science-16", "n": 16, "stem": "From these data, where is the student likely to be located?", "choices": ["On the equator because the temperature never goes below freezing", "Near the ocean because there is a large variation in temperature", "The Northern Hemisphere, because the temperature is about the same in spring (April) and fall (October)", "The Southern Hemisphere, because it is hottest in January and coldest in July"], "correctIdx": 3, "chosenIdx": 2, "explain": "January is hottest and July is coldest — that's the seasonal pattern of the Southern Hemisphere, not the Northern.", "diagram": null}]}, {"id": "atmosphere", "title": "Atmosphere Composition", "missed": [24], "lesson": "Earth's atmosphere is roughly **78% nitrogen, 21% oxygen**, and less than 1% everything else (argon, carbon dioxide, water vapor). Even though we need oxygen to breathe, it is NOT the majority gas — **nitrogen is**. This is one of the most commonly missed \"obvious-seeming but wrong\" science facts.", "checks": [{"q": "What is the most abundant gas in Earth's atmosphere?", "c": ["Oxygen", "Carbon dioxide", "Nitrogen", "Water vapor"], "a": 2, "e": "Nitrogen makes up about 78% of the atmosphere."}, {"q": "About what percent of the atmosphere is oxygen?", "c": ["78%", "21%", "50%", "5%"], "a": 1, "e": "Oxygen is about 21% of the atmosphere — the second most abundant gas."}], "missedFull": [{"qid": "science-24", "n": 24, "stem": "Which gas makes up the majority of the atmosphere?", "choices": ["Carbon dioxide", "Nitrogen", "Oxygen", "Water vapor"], "correctIdx": 1, "chosenIdx": 0, "explain": "The atmosphere is about 78% nitrogen and 21% oxygen; carbon dioxide is a very small fraction.", "diagram": null}]}, {"id": "buoyancy", "title": "Buoyancy & Floating", "missed": [30], "lesson": "An object **floats** when the **buoyant (upward) force is greater than gravity (downward force)**. It **sinks** when gravity wins. It hangs suspended when the two are exactly equal. A simple shortcut: objects **less dense than the fluid** float; denser objects sink.", "checks": [{"q": "A block of wood is placed underwater and released. What happens?", "c": ["It sinks, since wood is heavy", "It floats up, since wood is less dense than water", "It stays exactly where it was placed", "It dissolves"], "a": 1, "e": "Wood is less dense than water, so the buoyant force wins and it floats upward."}, {"q": "An object sinks in water. This means:", "c": ["Buoyant force > gravity", "Buoyant force = gravity", "Buoyant force < gravity", "There is no buoyant force at all"], "a": 2, "e": "Sinking means gravity's downward pull is stronger than the upward buoyant force."}], "missedFull": [{"qid": "science-30", "n": 30, "stem": "What happens when the buoyant force on a submerged object is greater than the force of gravity on the object?", "choices": ["The object sinks.", "The object floats.", "The object neither sinks nor floats but hangs suspended in the same position.", "This can't happen; the buoyant force is always less than or equal to the force of gravity."], "correctIdx": 1, "chosenIdx": 0, "explain": "If the upward buoyant force is greater than the downward pull of gravity, the net force is upward and the object floats.", "diagram": null}]}, {"id": "electricity", "title": "Electricity Basics: Units", "missed": [31], "lesson": "Know these four units cold: **current → amperes (amps)**, **voltage → volts**, **resistance → ohms**, **energy → joules**. A memory trick: think \"A Very Odd Joke\" for Amps-Volts-Ohms-Joules in that order of the concepts current-voltage-resistance-energy.", "checks": [{"q": "Electrical resistance is measured in:", "c": ["Amperes", "Volts", "Ohms", "Joules"], "a": 2, "e": "Ohms measure resistance."}, {"q": "Which unit measures electrical current?", "c": ["Volts", "Amperes", "Ohms", "Watts"], "a": 1, "e": "Amperes (amps) measure current."}], "missedFull": [{"qid": "science-31", "n": 31, "stem": "In what units is electrical current measured?", "choices": ["Amperes", "Joules", "Ohms", "Volts"], "correctIdx": 0, "chosenIdx": 3, "explain": "Current is measured in amperes (amps).", "diagram": null}]}, {"id": "waves", "title": "Light, Sound & the EM Spectrum", "missed": [33, 35, 36], "lesson": "**Light travels far faster than sound** — that's why you always see lightning before you hear thunder. **Sound needs a medium** (air, water, solid) to travel through and can't cross empty space; **light doesn't need a medium** and can travel through a vacuum. In the electromagnetic spectrum, wavelength and frequency trade off: **radio waves have the longest wavelength** (and lowest frequency), while gamma rays have the shortest wavelength (and highest frequency). Order from longest to shortest wavelength: radio → microwave → infrared → visible → ultraviolet → X-ray → gamma.", "checks": [{"q": "Why do you see a firework burst before you hear the bang?", "c": ["Light is brighter than sound", "Light travels much faster than sound", "Sound only travels at night", "There is no real delay"], "a": 1, "e": "Light's speed (~300,000 km/s) vastly outpaces sound's speed (~343 m/s)."}, {"q": "Which of these can travel through the vacuum of space?", "c": ["Sound waves only", "Light waves only", "Both sound and light waves", "Neither"], "a": 1, "e": "Light doesn't need a medium; sound does, so only light crosses a vacuum."}], "missedFull": [{"qid": "science-33", "n": 33, "stem": "What would it mean if the student heard the report first before seeing the lightning bolt?", "choices": ["The storm is moving away.", "The lightning bolt is less than a mile away.", "The air pressure is very low, which means there might be danger of a cyclone.", "This can't happen; you always see the lightning before you hear it."], "correctIdx": 3, "chosenIdx": 0, "explain": "Light travels far faster than sound, so you always see lightning before you hear the thunder.", "diagram": null}, {"qid": "science-35", "n": 35, "stem": "Which of the following accurately describes a difference between sound waves and light waves?", "choices": ["Light waves have a period and amplitude; sound waves do not.", "Unlike light waves, sound waves require a medium to travel through.", "Unlike sound waves, all light waves have the same frequency.", "Light waves can be reflected or refracted; sound waves cannot."], "correctIdx": 1, "chosenIdx": 0, "explain": "Sound waves are vibrations of a physical medium and can't travel through a vacuum; light waves can travel through empty space.", "diagram": null}, {"qid": "science-36", "n": 36, "stem": "Which of the following types of electromagnetic wave has the largest wavelength?", "choices": ["Infrared light", "Ultraviolet light", "Visible light", "Radio waves"], "correctIdx": 3, "chosenIdx": 2, "explain": "Radio waves have the longest wavelength (and lowest frequency) of the options.", "diagram": null}]}, {"id": "stars", "title": "Stars & Nuclear Fusion", "missed": [37], "lesson": "Stars generate their energy through **nuclear fusion** — squeezing hydrogen nuclei together under immense gravity/pressure until they **fuse into helium**, releasing huge amounts of energy. This is the opposite of fission (splitting atoms), which is what nuclear power plants on Earth use.", "checks": [{"q": "The Sun's energy comes primarily from:", "c": ["Burning hydrogen gas like a fire", "Fusing hydrogen into helium", "Splitting uranium atoms", "Chemical reactions between gases"], "a": 1, "e": "Nuclear fusion of hydrogen into helium powers stars."}, {"q": "Fusion is best described as:", "c": ["Splitting a large atom into smaller ones", "Combining small atomic nuclei into a larger one", "A chemical reaction between molecules", "Radioactive decay"], "a": 1, "e": "Fusion combines (fuses) small nuclei into a larger one, releasing energy."}], "missedFull": [{"qid": "science-37", "n": 37, "stem": "What is the main source of energy in a star?", "choices": ["Nuclear fission of helium into hydrogen", "Nuclear fusion of hydrogen into helium", "Chemical reactions between the various gases in the star", "Electricity generated by the friction between the gases"], "correctIdx": 1, "chosenIdx": 0, "explain": "Stars generate energy through nuclear fusion, combining hydrogen nuclei into helium.", "diagram": null}]}, {"id": "ocean-floor", "title": "Ocean Floor Features", "missed": [38], "lesson": "Moving from shore to deep ocean: **continental shelf** (shallow, gentle slope) → **continental slope** (steep drop-off) → **abyssal plain** (flat, deep ocean floor). Two other features form where tectonic plates interact: **mid-ocean ridges** (underwater mountain ranges where plates spread apart) and **oceanic trenches** (deep canyons where plates collide/subduct).", "checks": [{"q": "The flat, deep part of the ocean floor beyond the continental slope is called the:", "c": ["Continental shelf", "Abyssal plain", "Mid-ocean ridge", "Oceanic trench"], "a": 1, "e": "That flat deep-sea floor is the abyssal plain."}, {"q": "A deep underwater canyon formed where two tectonic plates collide is called a(n):", "c": ["Abyssal plain", "Continental shelf", "Oceanic trench", "Estuary"], "a": 2, "e": "Oceanic trenches form at subduction zones where plates collide."}], "missedFull": [{"qid": "science-38", "n": 38, "stem": "Past the edge of the continental shelf, the ocean floor drops in the continental slope and then flattens out again in a deep underwater plain. What is this part of the ocean floor called?", "choices": ["Abyssal plain", "Mid-ocean ridge", "Subcontinental plain", "Oceanic trench"], "correctIdx": 0, "chosenIdx": 3, "explain": "The flat deep-ocean floor beyond the continental slope is called the abyssal plain.", "diagram": null}]}];
var SOCIAL_CLUSTERS_FULL = [{"id": "civ-suffrage", "cat": "civics", "title": "Suffrage", "missed": [1], "lesson": "**Suffrage** = the right to vote in political elections. It's one of the most-tested vocabulary words in civics — don't confuse it with other Bill of Rights protections (bearing arms, unreasonable search, cruel punishment).", "checks": [{"q": "The 19th Amendment granted women which right?", "c": ["The right to bear arms", "Suffrage (the right to vote)", "Freedom of speech", "The right to a jury trial"], "a": 1, "e": "The 19th Amendment gave women suffrage — voting rights."}, {"q": "\"Universal suffrage\" means:", "c": ["Everyone must serve in government", "All adult citizens have the right to vote", "Voting is optional", "Only property owners can vote"], "a": 1, "e": "Universal suffrage = voting rights extended to all adult citizens."}], "missedFull": [{"qid": "social-civics-1", "n": 1, "stem": "The word 'suffrage' refers to what right?", "choices": ["The right to vote in political elections", "The right to bear arms", "Protection from cruel and unusual punishment", "Protection from unreasonable search and seizures"], "correctIdx": 0, "chosenIdx": 3, "explain": "Suffrage is the right to vote in political elections.", "diagram": null}]}, {"id": "civ-bill-to-law", "cat": "civics", "title": "How a Bill Becomes a Law", "missed": [2], "lesson": "The order is: **Introduction → Committee action → Floor action → Final approval → Enactment**. \"Enactment\" is the last step — the bill officially becomes law and gets put into practice/enforced. Watch out for similar-sounding decoy words like \"authorization\" or \"mandate,\" which aren't the correct term here.", "checks": [{"q": "After a bill receives final approval from both houses of Congress, the last step is:", "c": ["Committee review", "Enactment", "Introduction", "Floor debate"], "a": 1, "e": "Enactment is the final step — the law is put into force."}, {"q": "Which step comes FIRST in a bill becoming a law?", "c": ["Final approval", "Introduction", "Enactment", "Floor action"], "a": 1, "e": "Introduction is always the first step."}], "missedFull": [{"qid": "social-civics-2", "n": 2, "stem": "There is a five-step process by which a bill becomes a law: introduction, committee action, floor action, final approval, and...", "choices": ["Actualization.", "Authorization.", "Mandate.", "Enactment."], "correctIdx": 3, "chosenIdx": 1, "explain": "The final stage of a bill becoming law is enactment — putting the new law into practice.", "diagram": null}]}, {"id": "civ-elastic-clause", "cat": "civics", "title": "The Necessary and Proper (Elastic) Clause", "missed": [3], "lesson": "The **Necessary and Proper Clause** (nicknamed the **\"Elastic Clause\"**) gives Congress the power to pass laws needed to carry out its other listed (explicit) powers. It's called \"elastic\" because it stretches Congress's power to fit new situations the Constitution's writers didn't specifically list.", "checks": [{"q": "Why is the Necessary and Proper Clause nicknamed the \"Elastic Clause\"?", "c": ["It deals with rubber and manufacturing regulation", "It stretches/expands Congress's power to carry out its other duties", "It only applies during emergencies", "It limits presidential power"], "a": 1, "e": "It's called \"elastic\" because it flexibly expands Congress's implied powers."}, {"q": "The Elastic Clause is found in which part of the government?", "c": ["The Supreme Court", "The Constitution's description of Congress's powers", "The Bill of Rights", "State governments only"], "a": 1, "e": "It's part of Article I, which defines Congress's powers."}], "missedFull": [{"qid": "social-civics-3", "n": 3, "stem": "What purpose does the Necessary and Proper, or Elastic, Clause serve?", "choices": ["It dictates the etiquette that must be observed on Capitol Hill.", "It is the final form of the annual budget.", "It grants Congress the power to pass legislation needed for the exercise of its explicit powers.", "None of the above"], "correctIdx": 2, "chosenIdx": 3, "explain": "The Necessary and Proper (Elastic) Clause lets Congress pass laws needed to carry out its other constitutional powers.", "diagram": null}]}, {"id": "civ-amend-constitution", "cat": "civics", "title": "Amending the Constitution", "missed": [4], "lesson": "The **only** way to directly change the Constitution's actual text is through a formal **constitutional amendment**. A Supreme Court ruling can interpret the Constitution, and Congress can pass laws — but neither one literally rewrites the document itself.", "checks": [{"q": "Which of these can DIRECTLY change the words of the Constitution?", "c": ["A presidential executive order", "A Supreme Court ruling", "A constitutional amendment", "A act of Congress alone"], "a": 2, "e": "Only a formal amendment changes the Constitution's actual text."}, {"q": "A Supreme Court ruling does which of the following?", "c": ["Rewrites the Constitution's text", "Interprets how the Constitution applies", "Passes new amendments", "Vetoes laws"], "a": 1, "e": "The Court interprets the Constitution; it doesn't rewrite it."}], "missedFull": [{"qid": "social-civics-4", "n": 4, "stem": "By what means can the Constitution be altered?", "choices": ["An amendment", "A Supreme Court ruling", "A congressional vote", "A presidential veto"], "correctIdx": 0, "chosenIdx": 3, "explain": "Only a constitutional amendment can directly alter the Constitution.", "diagram": null}]}, {"id": "civ-due-process", "cat": "civics", "title": "Due Process", "missed": [5], "lesson": "**Due process** means the government must treat people fairly and follow proper legal procedures before taking away their life, liberty, or property — protecting citizens from unfair or arbitrary treatment by the justice system, regardless of wealth or status.", "checks": [{"q": "Due process is best described as:", "c": ["A person's wealth determining their legal outcome", "Fair legal procedures that protect citizens' rights", "The order of Senate confirmation hearings", "A president's veto power"], "a": 1, "e": "Due process guarantees fair treatment/procedure under the law."}, {"q": "Due process rights are found in which document?", "c": ["The Declaration of Independence", "The U.S. Constitution", "State lottery rules", "City zoning codes"], "a": 1, "e": "Due process is guaranteed by the 5th and 14th Amendments to the Constitution."}], "missedFull": [{"qid": "social-civics-5", "n": 5, "stem": "What is meant by the term \"due process\"?", "choices": ["The government must administer justice in a way that protects its citizens from an intrusion on their rights.", "Criminal cases must be based in the wealth and status of the accused.", "Due process refers to the order in which congressional hearings take place.", "Due process refers to the series of trials a judge must preside over before being considered for the Supreme Court."], "correctIdx": 0, "chosenIdx": 3, "explain": "Due process means the government must administer justice fairly, protecting citizens' rights regardless of their wealth or status.", "diagram": null}]}, {"id": "civ-term-limits", "cat": "civics", "title": "Presidential Term Limits", "missed": [6], "lesson": "George Washington set the informal **two-term tradition** by choosing to step down. **Franklin D. Roosevelt** was the only president to break that tradition, serving more than two terms — afterward, the **22nd Amendment** made the two-term limit official law.", "checks": [{"q": "Which amendment formally limits presidents to two terms?", "c": ["19th Amendment", "22nd Amendment", "1st Amendment", "13th Amendment"], "a": 1, "e": "The 22nd Amendment (1951) set the two-term limit into law."}, {"q": "Which president served more than two terms, prompting the term-limit amendment?", "c": ["Theodore Roosevelt", "Franklin D. Roosevelt", "Harry Truman", "George Washington"], "a": 1, "e": "FDR served four terms, which led to the 22nd Amendment."}], "missedFull": [{"qid": "social-civics-6", "n": 6, "stem": "George Washington set a precedent for presidential term limits by leaving office after two. Washington's precedent was officially codified into law after which four-term President?", "choices": ["Harry S. Truman", "Calvin Coolidge", "Theodore Roosevelt", "Franklin D. Roosevelt"], "correctIdx": 3, "chosenIdx": 2, "explain": "Franklin D. Roosevelt served more than two terms, after which a constitutional amendment formally limited presidents to two terms.", "diagram": null}]}, {"id": "civ-speaker", "cat": "civics", "title": "Congressional Leadership Titles", "missed": [7], "lesson": "The **Speaker of the House** presides over the House of Representatives — it's the top leadership position there. Don't confuse it with \"Majority Leader\" (a Senate/party leadership role) or \"President pro tempore\" (presides over the Senate when the VP is absent).", "checks": [{"q": "Who presides over the House of Representatives?", "c": ["The Vice President", "The Speaker of the House", "The President pro tempore", "The Chief Justice"], "a": 1, "e": "The Speaker of the House leads and presides over the House."}, {"q": "The President pro tempore presides over which body when the VP is absent?", "c": ["The House of Representatives", "The Senate", "The Supreme Court", "The Cabinet"], "a": 1, "e": "The President pro tempore fills in for the VP in the Senate."}], "missedFull": [{"qid": "social-civics-7", "n": 7, "stem": "Which of the following titles is used for the presiding officer of the House of Representatives?", "choices": ["Majority Leader", "Speaker of the House", "Majority Whip", "President pro tempore"], "correctIdx": 1, "chosenIdx": 0, "explain": "The Speaker of the House presides over the House of Representatives.", "diagram": null}]}, {"id": "civ-emancipation", "cat": "civics", "title": "The Emancipation Proclamation", "missed": [8], "lesson": "The **Emancipation Proclamation** was Abraham Lincoln's executive order that freed slaves in the Confederate states during the Civil War. Don't confuse it with the **Magna Carta** (a 13th-century English document) or **Writ of Habeas Corpus** (a legal right to be brought before a court).", "checks": [{"q": "What did the Emancipation Proclamation do?", "c": ["Ended the Civil War", "Freed slaves in Confederate states", "Created the Bill of Rights", "Established the two-party system"], "a": 1, "e": "It declared freedom for enslaved people in Confederate territory."}, {"q": "Who issued the Emancipation Proclamation?", "c": ["George Washington", "Thomas Jefferson", "Abraham Lincoln", "Andrew Johnson"], "a": 2, "e": "Abraham Lincoln issued it in 1863."}], "missedFull": [{"qid": "social-civics-8", "n": 8, "stem": "What is the name of Abraham Lincoln's executive order that freed all slaves in the Confederate states?", "choices": ["Abolition Proclamation", "Writ of Habeas Corpus", "Emancipation Proclamation", "Magna Carta"], "correctIdx": 2, "chosenIdx": 0, "explain": "The Emancipation Proclamation freed all slaves in the Confederate states.", "diagram": null}]}, {"id": "civ-popular-sovereignty", "cat": "civics", "title": "Popular Sovereignty", "missed": [11], "lesson": "**Popular sovereignty** = the idea that the government's power/authority comes from **the people**. It's a foundational principle behind elections and representative democracy — the people are the ultimate source of political power.", "checks": [{"q": "Popular sovereignty means:", "c": ["Popular celebrities influence laws", "Government power comes from the people", "The most populous state always wins votes", "Courts follow public opinion polls"], "a": 1, "e": "It's the principle that political authority is rooted in the consent of the people."}, {"q": "Which document's opening words reflect the idea of popular sovereignty (\"We the People\")?", "c": ["The Declaration of Independence", "The Constitution", "The Magna Carta", "The Federalist Papers"], "a": 1, "e": "The Constitution's preamble begins \"We the People,\" reflecting popular sovereignty."}], "missedFull": [{"qid": "social-civics-11", "n": 11, "stem": "Which of the following best describes the idea of popular sovereignty?", "choices": ["The government derives its power from the people.", "The Supreme Court changes rulings depending on the attitudes of the people.", "Leaders are well loved because they are in a position of authority.", "The more populous states preside over less populated."], "correctIdx": 0, "chosenIdx": 1, "explain": "Popular sovereignty is the principle that government power comes from the people.", "diagram": null}]}, {"id": "geo-core-concepts", "cat": "geography", "title": "Core Concepts of Geography", "missed": [1], "lesson": "Geography is organized around five core ideas: **location, place, human-environment interaction, movement, and region**. It's a much broader field than just maps — it includes how people interact with and adapt to their environment.", "checks": [{"q": "Which of these is one of the five core themes of geography?", "c": ["Human-environment interaction", "Stock market trends", "Sports statistics", "Musical composition"], "a": 0, "e": "Human-environment interaction is one of geography's five core themes."}, {"q": "Studying how a river's location influenced where a city was built falls under which geography theme?", "c": ["Region", "Location", "Movement", "Culture only"], "a": 1, "e": "This is about physical location influencing settlement — the location theme."}], "missedFull": [{"qid": "social-geography-1", "n": 1, "stem": "Geography is studied through which of the following main concepts?", "choices": ["Soil samples, rock structures, and climate patterns", "Location, place, interaction between humans and their environment, movement and region", "Regional language, culture, ethics, morals, and historical governments", "Livestock, agriculture, sources of water, and wind patterns"], "correctIdx": 1, "chosenIdx": 0, "explain": "Geography's core concepts are location, place, human-environment interaction, movement, and region.", "diagram": null}]}, {"id": "geo-egypt-map", "cat": "geography", "title": "Map Reading: Egypt & Neighboring Regions", "missed": [3, 4], "lesson": "Egypt is in northeastern Africa. It borders **Sudan** to the south (plus Libya and Israel/Gaza). Culturally and historically, Egypt relates most closely to **Turkey** — both nations are predominantly Sunni Muslim and were both part of the Ottoman Empire, giving them shared historical roots.", "checks": [{"q": "Which country borders Egypt?", "c": ["Sudan", "Iran", "India", "Turkey"], "a": 0, "e": "Sudan borders Egypt to the south."}, {"q": "Egypt shares strong historical/religious ties with which nation due to the Ottoman Empire?", "c": ["India", "Turkey", "Iran", "China"], "a": 1, "e": "Both Egypt and Turkey were part of the Ottoman Empire and share Sunni Muslim heritage."}], "missedFull": [{"qid": "social-geography-3", "n": 3, "stem": "Use this map to answer questions 3-4. Which of the following nations share a border with Egypt?", "choices": ["Sudan", "Turkey", "India", "Iran"], "correctIdx": 0, "chosenIdx": 2, "explain": "Sudan borders Egypt to the south (Egypt also borders Libya, the Gaza Strip, and Israel).", "diagram": "img:ss_geo_map"}, {"qid": "social-geography-4", "n": 4, "stem": "Which of the following nations would Egypt culturally relate to most closely with regard to both religious and historical roots?", "choices": ["Israel", "Turkey", "India", "Iran"], "correctIdx": 1, "chosenIdx": 0, "explain": "Egypt and Turkey share a predominantly Sunni Muslim population and both were part of the Ottoman Empire.", "diagram": "img:ss_geo_map"}]}, {"id": "geo-cultural-diffusion", "cat": "geography", "title": "Cultural Diffusion", "missed": [6], "lesson": "**Cultural diffusion** is the spread of ideas, customs, and practices between groups — through things like the **Internet, immigration, and colonialism**. **Isolationism** is the OPPOSITE — it limits contact with other nations and therefore blocks diffusion rather than causing it.", "checks": [{"q": "Which of these promotes cultural diffusion?", "c": ["Isolationism", "Immigration", "Closed borders", "Trade bans"], "a": 1, "e": "Immigration brings people (and their customs) into contact with new cultures, spreading diffusion."}, {"q": "A country that refuses nearly all contact with the outside world is practicing:", "c": ["Cultural diffusion", "Isolationism", "Colonialism", "Globalization"], "a": 1, "e": "Isolationism = minimal contact with other nations."}], "missedFull": [{"qid": "social-geography-6", "n": 6, "stem": "Which of the following is NOT a means of cultural diffusion?", "choices": ["The Internet", "European colonialism", "Immigration", "Isolationism"], "correctIdx": 3, "chosenIdx": 0, "explain": "Isolationism restricts contact with other nations, which impedes cultural diffusion rather than causing it.", "diagram": null}]}, {"id": "geo-desertification", "cat": "geography", "title": "Desertification in the Sahara", "missed": [7], "lesson": "**Drought** (a long period of below-normal rainfall) is the main driver of desertification in the Sahara — less rain means fewer plants grow, which lets wind erode and move soil more easily, leaving barren land. Heat alone isn't the main cause; it's the LACK OF WATER.", "checks": [{"q": "What is the primary cause of desertification in regions like the Sahara?", "c": ["Extreme heat alone", "Drought (lack of rainfall)", "Too much farming", "Ocean currents"], "a": 1, "e": "Drought reduces plant cover, accelerating desertification."}, {"q": "Desertification is most directly caused by a lack of:", "c": ["Sunlight", "Wind", "Rainfall", "Wildlife"], "a": 2, "e": "Lack of rainfall (drought) is the key driver."}], "missedFull": [{"qid": "social-geography-7", "n": 7, "stem": "What is the main cause of the desertification affecting the Sahara region of Africa?", "choices": ["Lack of farming", "Deforestation", "Heat", "Drought"], "correctIdx": 3, "chosenIdx": 2, "explain": "Drought reduces plant growth, allowing wind to move soil more easily and leaving the land barren.", "diagram": null}]}, {"id": "geo-map-types", "cat": "geography", "title": "Map Types & Features", "missed": [9, 10], "lesson": "**Historical maps** show past events, battles, and troop movements. **Political maps** show boundaries/cities; **physical maps** show natural features like rivers and mountains. A map's **legend** (or key) explains what its colors, lines, and symbols mean — different from the **compass rose** (shows direction) and **scale** (shows distance).", "checks": [{"q": "Which type of map would best show Civil War troop movements?", "c": ["Physical map", "Historical map", "Population density map", "Climate map"], "a": 1, "e": "Historical maps are designed to depict past events like battles and troop movements."}, {"q": "Which map feature tells you what the symbols and colors on the map represent?", "c": ["Compass rose", "Scale", "Legend", "Projection"], "a": 2, "e": "The legend (key) explains a map's symbols and colors."}], "missedFull": [{"qid": "social-geography-9", "n": 9, "stem": "What type of map is best suited for depicting battles and military campaigns?", "choices": ["Political map", "Historical map", "Physical map", "None of the above"], "correctIdx": 1, "chosenIdx": 2, "explain": "Historical maps depict events, troop movements, and other features needed to understand battles and campaigns.", "diagram": null}, {"qid": "social-geography-10", "n": 10, "stem": "What map feature explains the colors, lines, and other symbols on a map?", "choices": ["Projection", "Compass rose", "Legend", "Scale"], "correctIdx": 2, "chosenIdx": 3, "explain": "A map's legend explains what its colors, lines, and symbols mean.", "diagram": null}]}, {"id": "hist-louisiana-explorers", "cat": "history", "title": "Explorers of the Louisiana Purchase", "missed": [1], "lesson": "**Zebulon Pike** explored the Arkansas River, the Rocky Mountains, and the Rio Grande region. **Lewis and Clark** explored a different route — further north, toward the Pacific Northwest. Don't mix up the two expeditions' specific territories.", "checks": [{"q": "Which explorer's expedition covered the Arkansas River and Rocky Mountains?", "c": ["Lewis and Clark", "Zebulon Pike", "Daniel Boone", "Francisco Coronado"], "a": 1, "e": "Zebulon Pike explored this southern/central region of the Louisiana Purchase."}, {"q": "Lewis and Clark's expedition primarily aimed to reach:", "c": ["The Gulf of Mexico", "The Pacific Ocean", "The Great Lakes", "Florida"], "a": 1, "e": "Lewis and Clark's Corps of Discovery sought a route to the Pacific."}], "missedFull": [{"qid": "social-history-1", "n": 1, "stem": "Many explorers travelled the regions of the Louisiana Purchase. Which of these men's expeditions included the Arkansas River, the Rocky Mountains, and the Rio Grande?", "choices": ["Meriwether Lewis and William Clark", "Zebulon Pike", "Henry Clay", "Toussaint L'Overture"], "correctIdx": 1, "chosenIdx": 0, "explain": "Zebulon Pike's expeditions covered the Arkansas River, the Rocky Mountains, and the Rio Grande.", "diagram": null}]}, {"id": "hist-war-1812", "cat": "history", "title": "Causes of the War of 1812", "missed": [2], "lesson": "The War of 1812 was mainly caused by **British interference with American trade** (and impressment of American sailors) — NOT a fight for independence (that was already won in 1783) and not about religious freedom.", "checks": [{"q": "A major cause of the War of 1812 was:", "c": ["Religious persecution", "British interference with U.S. trade", "Independence from England", "French colonization attempts"], "a": 1, "e": "British trade interference and ship seizures were the main triggers."}, {"q": "By 1812, the United States had already gained independence from Britain in which earlier war?", "c": ["The French and Indian War", "The Revolutionary War", "The Mexican-American War", "World War I"], "a": 1, "e": "Independence was secured in the Revolutionary War (ending 1783), decades before 1812."}], "missedFull": [{"qid": "social-history-2", "n": 2, "stem": "For what reason did the United States become involved in the War of 1812?", "choices": ["The United States wanted its independence from England.", "United States citizens were determined to gain freedom of religion.", "United States citizens wanted the British to cease interfering with their trading laws.", "Americans wanted the British to cease colonizing the United States of America."], "correctIdx": 2, "chosenIdx": 0, "explain": "The War of 1812 began mainly because of British interference with American trade.", "diagram": null}]}, {"id": "hist-civil-rights-1866", "cat": "history", "title": "The Civil Rights Act of 1866", "missed": [4], "lesson": "The Civil Rights Act of 1866 granted citizenship to nearly everyone born in the U.S. — **EXCEPT Native Americans**, who were not granted full citizenship until much later (1924).", "checks": [{"q": "Which group was NOT granted citizenship by the Civil Rights Act of 1866?", "c": ["African Americans", "European immigrants", "Native Americans", "Freed slaves"], "a": 2, "e": "Native Americans were excluded from this 1866 law; full citizenship came later in 1924."}, {"q": "The Civil Rights Act of 1866 was primarily meant to grant rights to:", "c": ["Recently freed enslaved people", "Foreign diplomats", "Territorial governors", "Only landowners"], "a": 0, "e": "Its main purpose was securing citizenship rights for freed slaves after the Civil War."}], "missedFull": [{"qid": "social-history-4", "n": 4, "stem": "The Civil Rights Act of 1866 granted the right of citizenship to all people of the United States EXCEPT...", "choices": ["African Americans.", "European Americans.", "Asian Americans.", "Native Americans."], "correctIdx": 3, "chosenIdx": 0, "explain": "The Civil Rights Act of 1866 granted citizenship to all people born in the U.S. except Native Americans.", "diagram": null}]}, {"id": "hist-secession", "cat": "history", "title": "Causes of Southern Secession & States Involved", "missed": [6, 7], "lesson": "The South seceded mainly due to: **the election of Lincoln**, disputes over **states' rights**, and conflicts over **trade/tariffs** — the Underground Railroad was a resistance network, NOT a cause of secession. **Maryland did not secede** and stayed in the Union, even though it was a border slave state.", "checks": [{"q": "Which was NOT a cause of Southern secession in 1861?", "c": ["Lincoln's election", "States' rights disputes", "The Underground Railroad", "Trade/tariff disagreements"], "a": 2, "e": "The Underground Railroad helped enslaved people escape — it wasn't a cause of secession."}, {"q": "Which border state did NOT secede from the Union?", "c": ["South Carolina", "Virginia", "Maryland", "Georgia"], "a": 2, "e": "Maryland remained in the Union throughout the Civil War."}], "missedFull": [{"qid": "social-history-6", "n": 6, "stem": "Which of the following is NOT a reason the South seceded from the Union in 1861?", "choices": ["The election of Abraham Lincoln", "The Southern States believed their state rights were being violated.", "Slaves started an Underground Railroad.", "The South did not like the North infringing on southern trade."], "correctIdx": 2, "chosenIdx": 3, "explain": "The Underground Railroad was not a reason for secession — Lincoln's election and disputes over states' rights and trade were the real drivers.", "diagram": null}, {"qid": "social-history-7", "n": 7, "stem": "Which of the following states did NOT secede from the United States at the start of the Civil War?", "choices": ["South Carolina", "Maryland", "North Carolina", "Virginia"], "correctIdx": 1, "chosenIdx": 3, "explain": "Maryland remained in the Union and did not secede.", "diagram": null}]}, {"id": "hist-reconstruction", "cat": "history", "title": "Reconstruction & \"Carpetbaggers\"", "missed": [8], "lesson": "\"Carpetbaggers\" were Northerners who moved South after the Civil War — Southerners resented them for **multiple overlapping reasons**: taking financial advantage of the devastated South, pushing freed slaves into politics, and gaining land/power from impoverished plantation owners. When a question lists several true reasons, **\"all of the above\" is often the answer**.", "checks": [{"q": "Southern resentment toward carpetbaggers stemmed from:", "c": ["Only one narrow grievance", "Multiple reasons including financial and political motives", "Their support for the Confederacy", "Their refusal to vote"], "a": 1, "e": "Historical resentment toward carpetbaggers had several combined causes."}, {"q": "\"Carpetbaggers\" is a term referring to:", "c": ["Southern plantation owners", "Northerners who moved South after the Civil War", "Foreign immigrants", "Confederate soldiers"], "a": 1, "e": "Carpetbaggers were Northerners relocating South during Reconstruction."}], "missedFull": [{"qid": "social-history-8", "n": 8, "stem": "During the Reconstruction after the Civil War, the Southerners had animosity toward the \"carpetbaggers\" because they...", "choices": ["Traveled from the North to take advantage of financial opportunities in the devastated South.", "Convinced the newly-freed slaves to run for political office.", "Took advantage of newly-impoverished plantation owners to gain land and political power.", "All of the above"], "correctIdx": 3, "chosenIdx": 1, "explain": "Southern resentment toward carpetbaggers came from all of these reasons.", "diagram": null}]}, {"id": "hist-civil-war-battles", "cat": "history", "title": "Identifying Civil War Battles", "missed": [9], "lesson": "Match battles to their war: **Battle of Antietam** = Civil War. **Bunker Hill & Yorktown** = Revolutionary War. **Battle of the Bulge** = World War II. When you see an unfamiliar battle name, think about which war era it fits.", "checks": [{"q": "Which battle was fought during the Civil War?", "c": ["Battle of Gettysburg", "Battle of Yorktown", "Battle of Bunker Hill", "Battle of the Bulge"], "a": 0, "e": "Gettysburg (1863) was a major Civil War battle."}, {"q": "The Battle of Bunker Hill was fought during which war?", "c": ["The Civil War", "The Revolutionary War", "World War I", "The War of 1812"], "a": 1, "e": "Bunker Hill (1775) was an early Revolutionary War battle."}], "missedFull": [{"qid": "social-history-9", "n": 9, "stem": "Which of the following battles was fought during the Civil War?", "choices": ["Battle of Bunker Hill", "Battle of Yorktown", "Battle of the Bulge", "Battle of Antietam"], "correctIdx": 3, "chosenIdx": 1, "explain": "The Battle of Antietam was fought during the Civil War; the others belong to the Revolutionary War and WWII.", "diagram": null}]}, {"id": "hist-presidents", "cat": "history", "title": "U.S. Presidents Trivia", "missed": [11], "lesson": "**Benjamin Franklin was never President** — he was a Founding Father, inventor, and diplomat, but never held the presidency. Don't confuse him with actual presidents like Benjamin Harrison, Rutherford B. Hayes, or Chester A. Arthur.", "checks": [{"q": "Which of these Founding Fathers never served as U.S. President?", "c": ["John Adams", "Benjamin Franklin", "Thomas Jefferson", "James Madison"], "a": 1, "e": "Franklin was a key Founding Father but never President."}, {"q": "Benjamin Harrison, Rutherford B. Hayes, and Chester A. Arthur all shared which role?", "c": ["Founding Fathers", "U.S. Presidents", "Supreme Court Justices", "Vice Presidents only"], "a": 1, "e": "All three actually served as U.S. Presidents in the late 1800s."}], "missedFull": [{"qid": "social-history-11", "n": 11, "stem": "Who among the following was NOT a President of the United States?", "choices": ["Benjamin Franklin", "Benjamin Harrison", "Rutherford B. Hayes", "Chester A. Arthur"], "correctIdx": 0, "chosenIdx": 3, "explain": "Benjamin Franklin never served as President, though he was a Founding Father.", "diagram": null}]}, {"id": "econ-capitalism", "cat": "economics", "title": "The U.S. Economic System", "missed": [1], "lesson": "The United States operates under a **capitalist system**, based on private ownership of business and property. This differs from **socialism/communism** (government/collective ownership) and a **barter system** (trading goods directly without money).", "checks": [{"q": "A system based on private ownership of wealth and business is called:", "c": ["Socialism", "Capitalism", "Communism", "Barter system"], "a": 1, "e": "Capitalism is defined by private ownership and free markets."}, {"q": "A barter system is characterized by:", "c": ["Trading goods directly without currency", "Government-owned factories", "Stock market trading", "Taxation of income"], "a": 0, "e": "Barter = direct exchange of goods/services without money."}], "missedFull": [{"qid": "social-economics-1", "n": 1, "stem": "Under which of the following economic models does the United States of America operate?", "choices": ["Socialist system", "Barter system", "Capitalist system", "Communist system"], "correctIdx": 2, "chosenIdx": 3, "explain": "The U.S. operates under a capitalist economic system, based on private ownership.", "diagram": null}]}, {"id": "econ-commodities", "cat": "economics", "title": "Commodities", "missed": [2], "lesson": "**Commodities** are basic, useful raw materials or resources bought/sold in their original form — like **water, time, and raw materials**. This differs from \"products\" (which have been processed/manufactured for a specific use).", "checks": [{"q": "Which of the following is best described as a commodity?", "c": ["A smartphone", "Raw cotton", "A pair of sneakers", "A restaurant meal"], "a": 1, "e": "Raw cotton is an unprocessed raw material — a commodity."}, {"q": "Commodities differ from finished products because commodities are:", "c": ["More expensive", "In their original, untooled form", "Only sold overseas", "Always illegal to trade"], "a": 1, "e": "Commodities haven't been processed into a specific finished product yet."}], "missedFull": [{"qid": "social-economics-2", "n": 2, "stem": "Water, time, and raw materials are all examples of what?", "choices": ["Products", "Liquid assets", "Common goods", "Commodities"], "correctIdx": 3, "chosenIdx": 2, "explain": "Commodities are useful, valuable things bought or sold in their original, untooled form.", "diagram": null}]}, {"id": "econ-inflation", "cat": "economics", "title": "Inflation", "missed": [3], "lesson": "**Inflation** = a fall in the value of currency combined with a general rise in prices. It's different from a **recession** (an economic downturn) or a **stock market collapse** (a sudden drop in stock prices) — inflation is specifically about prices rising / money losing purchasing power.", "checks": [{"q": "Rising prices combined with a currency losing value describes:", "c": ["A recession", "Inflation", "A stock market crash", "A trade surplus"], "a": 1, "e": "That combination defines inflation."}, {"q": "During high inflation, the purchasing power of money:", "c": ["Increases", "Stays exactly the same", "Decreases", "Doubles automatically"], "a": 2, "e": "Inflation erodes purchasing power — your money buys less."}], "missedFull": [{"qid": "social-economics-3", "n": 3, "stem": "A fall in the value of a currency coupled with an overall increase in prices is also called a(n)...", "choices": ["Economic crisis.", "Inflation.", "Stock market collapse.", "Recession."], "correctIdx": 1, "chosenIdx": 2, "explain": "This describes inflation — falling currency value paired with rising prices.", "diagram": null}]}, {"id": "econ-subsidy", "cat": "economics", "title": "Subsidies", "missed": [6], "lesson": "A **subsidy** is government financial support/incentive to encourage a particular activity (like tax credits for buying electric cars). It's different from a **mandate** (a requirement/order) or a **quota** (a limit on quantity).", "checks": [{"q": "A government tax credit encouraging people to install solar panels is an example of a:", "c": ["Mandate", "Subsidy", "Quota", "Tariff"], "a": 1, "e": "Financial incentives to encourage a behavior are subsidies."}, {"q": "A mandate is best described as:", "c": ["A financial incentive", "A government requirement/order", "A voluntary suggestion", "A type of tax refund"], "a": 1, "e": "A mandate is an order/requirement, not an incentive."}], "missedFull": [{"qid": "social-economics-6", "n": 6, "stem": "The federal government providing purchasing incentives for electric car buyers is an example of what?", "choices": ["Subsidy", "Mandate", "Stipulation", "Change in demand"], "correctIdx": 0, "chosenIdx": 2, "explain": "Government incentives to encourage a purchase are an example of a subsidy.", "diagram": null}]}, {"id": "econ-commerce", "cat": "economics", "title": "Commerce", "missed": [9], "lesson": "**Commerce** = the activity of buying and selling goods and services, especially on a larger scale between businesses/economies. It's broader than just \"shopping\" (which implies personal, small-scale buying).", "checks": [{"q": "Large-scale buying and selling of goods between businesses and nations is called:", "c": ["Shopping", "Commerce", "Collateral", "Philanthropy"], "a": 1, "e": "Commerce refers to organized, large-scale trade activity."}, {"q": "Which best distinguishes \"commerce\" from \"shopping\"?", "c": ["They mean exactly the same thing", "Commerce refers to broader trade activity, not just personal purchases", "Shopping only happens online", "Commerce excludes services"], "a": 1, "e": "Commerce is the broader term covering trade of goods and services generally."}], "missedFull": [{"qid": "social-economics-9", "n": 9, "stem": "The activity of buying and selling is known as what?", "choices": ["Commerce", "Business", "Shopping", "Collateral"], "correctIdx": 0, "chosenIdx": 1, "explain": "Commerce is the activity of buying and selling goods and services.", "diagram": null}]}];
var ELA_CLUSTERS_FULL = [{"id": "read-purpose", "cat": "reading", "title": "Author's Purpose & Inference", "missed": ["R7"], "lesson": "When a question asks WHY an author included a detail, look for what that detail **does for the story or argument**, not just what it literally says. A detail about a crowd size, for instance, might exist to set up a later plot point (like the risk of getting lost) rather than just to describe popularity. Ask: **\"what job is this sentence doing?\"**", "checks": [{"q": "A story mentions that the hallway lights kept flickering before the character got lost in the dark. Why most likely is this detail included?", "c": ["To describe the school's old wiring", "To foreshadow the character getting lost", "To show the character is scared of the dark", "To add humor to the scene"], "a": 1, "e": "A detail placed right before a key event (getting lost) is usually there to set up or foreshadow that event."}, {"q": "An author mentions a character checking the time three times in one paragraph. This detail most likely serves to:", "c": ["Show the character is bored", "Build tension about the character being late or rushed", "Prove the character owns a watch", "Describe the setting"], "a": 1, "e": "Repeated small actions like time-checking are usually included to build tension, not just as background detail."}], "missedFull": [{"qid": "ela-R7", "n": "R7", "stem": "Why does the narrator discuss the number of people at the park?", "passageTitle": "Adventure Land Chase", "passage": {"title": "“Adventure Land Chase” (recreated excerpt)", "note": "The exact original wording wasn't saved from her test — this recreated excerpt preserves the same key detail (the size of the crowd) needed to answer the question.", "text": "By noon, Adventure Land was packed — easily the biggest crowd Malik had ever seen there, with families squeezed shoulder to shoulder along every path. Malik counted at least a dozen different school groups wearing matching T-shirts, plus what looked like an entire youth soccer league in matching jerseys. He gripped his little sister's hand a little tighter as they pushed toward the roller coaster line, weaving between strollers and souvenir carts. “Don't let go,” he told her, “not even for a second.” With this many people, he knew it would be almost impossible to find her again if they got separated."}, "choices": ["To explain why it was important to not get lost", "To explain the popularity of the park", "To justify her complaints about waiting in line", "To explain that it was hot"], "correctIdx": 0, "chosenText": "To explain the popularity of the park", "explain": "The crowding is introduced right before the buddy-system warning, and it directly sets up the real danger later in the story: Natalie losing track of George in the crowd.", "allExplanations": ["The crowding is introduced right before the buddy-system warning, and it directly sets up the real danger later in the story: Natalie losing track of George in the crowd.", "The crowd is framed as a problem (\"one huge problem\") the narrator noticed, not as praise for the park's popularity.", "The complaints about the line come from Riley and Ryan later, not from the narrator's initial comments about crowd size.", "Heat is mentioned separately later in the story and isn't connected to the crowd-size comments."], "diagram": null}]}, {"id": "we-poetry", "cat": "written_expression", "title": "Poetry: Imagery & Rhyme Scheme", "missed": ["W1", "W2", "W4"], "lesson": "For **imagery questions**, trace the description back to the exact line before/after it — descriptive phrases often refer to something mentioned just one line earlier (like \"her face\" being the \"dwelling-place\" of her thoughts). For **rhyme scheme**, label each line's ending sound with a letter (A, B, C...) — a NEW letter each time you hit a sound that hasn't appeared yet in that stanza, and reuse a letter when a line rhymes with an earlier one. Alternating patterns (ABABAB) mean odd lines rhyme together and even lines rhyme together. For **theme/interpretation** questions about contrasting images (like light and dark), consider that authors often use contrast to show two qualities existing **together in one thing**, not necessarily one thing changing into another.", "checks": [{"q": "In a poem, line 6 says \"her laughter rang like silver bells.\" The line before it describes her voice. What does \"her laughter\" most likely refer back to?", "c": ["Her appearance", "Her voice", "Her personality", "Her family"], "a": 1, "e": "Descriptive imagery typically connects to the subject introduced in the adjacent line — here, her voice."}, {"q": "A poem's first stanza rhymes: light/night (A), day/way (B), light/night (A). What is the rhyme scheme?", "c": ["ABA", "AAB", "ABB", "BAB"], "a": 0, "e": "First and third lines share sound A, middle line is B: ABA."}], "missedFull": [{"qid": "ela-W1", "n": "W1", "stem": "The following lines refer to what characteristic of the woman being talked about in the poem?\n\"Where thoughts serenely sweet express / How pure, how dear their dwelling-place\"", "passageTitle": "She Walks in Beauty", "passage": {"title": "“She Walks in Beauty” — Lord Byron (1815)", "note": null, "text": "She walks in beauty, like the night\nOf cloudless climes and starry skies;\nAnd all that's best of dark and bright\nMeet in her aspect and her eyes:\nThus mellow'd to that tender light\nWhich heaven to gaudy day denies.\n\nOne shade the more, one ray the less,\nHad half impair'd the nameless grace\nWhich waves in every raven tress,\nOr softly lightens o'er her face;\nWhere thoughts serenely sweet express\nHow pure, how dear their dwelling-place.\n\nAnd on that cheek, and o'er that brow,\nSo soft, so calm, yet eloquent,\nThe smiles that win, the tints that glow,\nBut tell of days in goodness spent,\nA mind at peace with all below,\nA heart whose love is innocent!"}, "choices": ["her hair", "her eyes", "her mind", "her face"], "correctIdx": 3, "chosenText": "her mind", "explain": "The line right before this says her grace \"softly lightens o'er her face\" — her face is the \"dwelling-place\" where her sweet thoughts are expressed.", "allExplanations": ["Her hair (\"raven tress\") is mentioned in the line just before this one, but the \"dwelling-place\" of her thoughts is a different image.", "Her eyes are mentioned earlier, in the first stanza, not in this line.", "Close, but the lines describe where her thoughts show themselves outwardly — that's her face, not an abstract description of her mind itself.", "The line right before this says her grace \"softly lightens o'er her face\" — her face is the \"dwelling-place\" where her sweet thoughts are expressed."], "diagram": null}, {"qid": "ela-W2", "n": "W2", "stem": "The rhyme scheme of this poem is", "passageTitle": "She Walks in Beauty", "passage": {"title": "“She Walks in Beauty” — Lord Byron (1815)", "note": null, "text": "She walks in beauty, like the night\nOf cloudless climes and starry skies;\nAnd all that's best of dark and bright\nMeet in her aspect and her eyes:\nThus mellow'd to that tender light\nWhich heaven to gaudy day denies.\n\nOne shade the more, one ray the less,\nHad half impair'd the nameless grace\nWhich waves in every raven tress,\nOr softly lightens o'er her face;\nWhere thoughts serenely sweet express\nHow pure, how dear their dwelling-place.\n\nAnd on that cheek, and o'er that brow,\nSo soft, so calm, yet eloquent,\nThe smiles that win, the tints that glow,\nBut tell of days in goodness spent,\nA mind at peace with all below,\nA heart whose love is innocent!"}, "choices": ["ABABAB, CDCDCD, efefeF.", "ABABBA, CDCDDC, EFEFFE.", "ABAABB, CDCCDD, EFEEFF.", "ABCBCA, CDEDEC, EFCFCE."], "correctIdx": 0, "chosenText": "ABABBA, CDCDDC, EFEFFE.", "explain": "Each six-line stanza rhymes in an alternating pattern with a new rhyme sound per stanza: night/bright/light rhyme with each other (A), and skies/eyes/denies rhyme together (B), giving
