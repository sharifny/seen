ABABAB — and the same pattern repeats with new sounds in stanzas two and three.", "allExplanations": ["Each six-line stanza rhymes in an alternating pattern with a new rhyme sound per stanza: night/bright/light rhyme with each other (A), and skies/eyes/denies rhyme together (B), giving ABABAB — and the same pattern repeats with new sounds in stanzas two and three.", "This pattern would require the last two lines of each stanza to rhyme with each other and reverse the order — that's not what happens here.", "This would group rhymes in pairs at the end of each stanza, which doesn't match the alternating pattern in the actual poem.", "This scheme doesn't match the poem — the actual rhymes alternate cleanly line by line (1-3-5 together, 2-4-6 together)."], "diagram": null}, {"qid": "ela-W4", "n": "W4", "stem": "The images of darkness and light in this poem can be interpreted as showing", "passageTitle": "She Walks in Beauty", "passage": {"title": "“She Walks in Beauty” — Lord Byron (1815)", "note": null, "text": "She walks in beauty, like the night\nOf cloudless climes and starry skies;\nAnd all that's best of dark and bright\nMeet in her aspect and her eyes:\nThus mellow'd to that tender light\nWhich heaven to gaudy day denies.\n\nOne shade the more, one ray the less,\nHad half impair'd the nameless grace\nWhich waves in every raven tress,\nOr softly lightens o'er her face;\nWhere thoughts serenely sweet express\nHow pure, how dear their dwelling-place.\n\nAnd on that cheek, and o'er that brow,\nSo soft, so calm, yet eloquent,\nThe smiles that win, the tints that glow,\nBut tell of days in goodness spent,\nA mind at peace with all below,\nA heart whose love is innocent!"}, "choices": ["that beauty doesn't last and you should enjoy it whenever you encounter it.", "how people view beauty differently at different times in their lives.", "how something that is beautiful may look different at different times and under different circumstances, but always remains beautiful.", "the speaker's devotion to the woman he is praising."], "correctIdx": 2, "chosenText": "the speaker's devotion to the woman he is praising.", "explain": "The poem blends \"dark and bright\" together in her single, constant beauty — showing that contrasting qualities combine into one lasting beauty rather than beauty changing or fading.", "allExplanations": ["The poem doesn't suggest her beauty is fleeting or temporary anywhere in the text.", "The poem is focused on one woman's beauty as the speaker sees it, not on differing perspectives over time.", "The poem blends \"dark and bright\" together in her single, constant beauty — showing that contrasting qualities combine into one lasting beauty rather than beauty changing or fading.", "Devotion is present throughout the poem, but it isn't specifically what the light/dark imagery is illustrating — that imagery is about the nature of her beauty itself."], "diagram": null}]}, {"id": "we-nonfiction-purpose", "cat": "written_expression", "title": "Author's Purpose, Fact vs. Opinion & Deletable Sentences", "missed": ["W11", "W14", "W21"], "lesson": "A **fact** is something specific and verifiable (a date, an event, a measurement) — an **opinion or belief statement** (\"I believe...\", \"we will not only defend ourselves...\") is NOT a fact, even if it sounds confident. For \"which sentence could be deleted\" questions, find the sentence that's a **side detail** rather than something the rest of the paragraph depends on — if removing it doesn't break the logical flow or leave a gap, it's deletable. For a photo's **purpose**, look past the literal subject and ask what larger point or feeling it's meant to convey (like lasting impact, not just \"this happened\").", "checks": [{"q": "Which of these is a FACT rather than an opinion?", "c": ["I believe this was the best decision ever made.", "The bridge was completed in 1937.", "This is clearly the greatest invention in history.", "Everyone agrees this was a mistake."], "a": 1, "e": "A specific date is verifiable — that's a fact, unlike the belief/opinion statements in the other options."}, {"q": "A paragraph explains why a bridge collapsed, then includes one sentence describing the bridge's paint color. If asked which sentence could be cut without changing the meaning, you should pick:", "c": ["The sentence about the cause of collapse", "The sentence about the paint color", "The topic sentence", "The concluding sentence"], "a": 1, "e": "The paint color is a side detail unrelated to the main explanation — it's the safely deletable one."}], "missedFull": [{"qid": "ela-W11", "n": "W11", "stem": "Which sentence could be deleted from paragraph 5 without changing the overall message of the paragraph?", "passageTitle": "Brett's narrative draft", "passage": {"title": "Brett's narrative draft (paragraph 5)", "note": "The exact original wording wasn't saved from her test — this recreated paragraph keeps the same content and sentence numbering so the question can still be answered from evidence in the text.", "text": "(17) Brett stood frozen at the edge of the parking lot, watching his parents' car pull away toward the store. (18) He knew they would only be gone for a few minutes, but his chest still felt tight. (19) He remembered the time last year he'd thrown a tantrum in the cereal aisle and how embarrassed he'd felt afterward. (20) What if they forgot to come back for him, or couldn't find him in the crowd? (21) He gripped the bench tighter and made himself count slowly to one hundred, just like his mom had taught him."}, "choices": ["sentence 17", "sentence 19", "sentence 20", "sentence 21"], "correctIdx": 1, "chosenText": "sentence 20", "explain": "The detail about being embarrassed over a tantrum is a side note that doesn't affect the paragraph's main point — his fear about losing his parents' attention still comes through clearly without it.", "allExplanations": ["This sentence sets up the key event of the paragraph (mom going into labor) and can't be removed without losing context.", "The detail about being embarrassed over a tantrum is a side note that doesn't affect the paragraph's main point — his fear about losing his parents' attention still comes through clearly without it.", "\"I was scared, though\" is central to the paragraph's emotional point and directly connects to the next sentence.", "This sentence explains exactly what he was scared of, which is essential to the paragraph's meaning."], "diagram": null}, {"qid": "ela-W14", "n": "W14", "stem": "Which of the following is a fact presented in this address?", "passageTitle": "Address to Congress, December 8, 1941", "passage": {"title": "Address to Congress — President Franklin D. Roosevelt, December 8, 1941", "note": null, "text": "Yesterday, December 7th, 1941 — a date which will live in infamy — the United States of America was suddenly and deliberately attacked by naval and air forces of the Empire of Japan.\n\nYesterday, the Japanese government also launched an attack against Malaya. Last night, Japanese forces attacked Hong Kong. Last night, Japanese forces attacked Guam. Last night, Japanese forces attacked the Philippine Islands. Last night, the Japanese attacked Wake Island. And this morning, the Japanese attacked Midway Island.\n\nJapan has, therefore, undertaken a surprise offensive extending throughout the Pacific area. The facts of yesterday and today speak for themselves. The people of the United States have already formed their opinions and well understand the implications to the very life and safety of our nation.\n\nAs Commander in Chief of the Army and Navy, I have directed that all measures be taken for our defense. But always will our whole nation remember the character of the onslaught against us. No matter how long it may take us to overcome this premeditated invasion, the American people in their righteous might will win through to absolute victory.\n\nI believe that I interpret the will of the Congress and of the people when I assert that we will not only defend ourselves to the uttermost, but will make it very certain that this form of treachery shall never again endanger us."}, "choices": ["No matter how long it may take us to overcome this premeditated invasion, the American people in their righteous might will win through to absolute victory.", "But always will our whole nation remember the character of the onslaught against us.", "I believe that I interpret the will of the Congress and of the people when I assert that we will not only defend ourselves to the uttermost...", "Last night, Japanese forces attacked Hong Kong."], "correctIdx": 3, "chosenText": "I believe that I interpret the will of the Congress and of the people when I assert that we will not only defend ourselves to the uttermost...", "explain": "This is a specific, verifiable historical event being reported, not an opinion or prediction.", "allExplanations": ["This is a prediction and expression of confidence about the future, not a verifiable fact.", "This is a statement about future national memory and sentiment, which can't be verified as fact.", "Roosevelt explicitly frames this as his belief (\"I believe\"), marking it as opinion rather than fact.", "This is a specific, verifiable historical event being reported, not an opinion or prediction."], "diagram": null}, {"qid": "ela-W21", "n": "W21", "stem": "What is the likely purpose of the photo?", "passageTitle": "Described scene (image unavailable in source material)", "passage": {"title": "Photo description (image unavailable — recreated description)", "note": "The original test showed an actual photograph here. Since the image itself wasn't saved, here's a description of the scene it showed, which is enough to answer the purpose question.", "text": "The photo shows a young boy, maybe seven or eight years old, standing quietly in front of a large stone memorial wall engraved with hundreds of names. His father kneels beside him, one hand resting on the boy's shoulder, pointing to one specific name on the wall. The boy's expression is serious and thoughtful. The photo was taken decades after the tragic event the memorial honors."}, "choices": ["to show the ideology behind a historic event", "to make a political statement about a recent event", "to show the lasting impact of a tragic event", "to inform the public about a recent event"], "correctIdx": 2, "chosenText": "to show the ideology behind a historic event", "explain": "A young boy visiting a memorial with his father's name on it, years after a tragic event, powerfully shows how that loss still affects people today.", "allExplanations": ["The image shows a personal, present-day moment of remembrance, not an explanation of a historical ideology.", "Nothing in the scene suggests a political message — it reads as personal and reflective, not political.", "A young boy visiting a memorial with his father's name on it, years after a tragic event, powerfully shows how that loss still affects people today.", "A quiet, personal memorial scene isn't structured like a news photo meant to inform the public about breaking events."], "diagram": null}]}, {"id": "we-dangling-modifier", "cat": "written_expression", "title": "Grammar: Dangling Modifiers", "missed": ["W22"], "lesson": "A **dangling modifier** happens when a descriptive phrase at the start of a sentence isn't followed by the actual person/thing it's describing. \"Aware that his decision would affect his life, the college Ben chose was Harvard\" is wrong because the phrase describes **Ben**, but the very next words are \"the college\" — not Ben. Fix: make sure whoever/whatever the opening phrase describes comes right after the comma.", "checks": [{"q": "Which sentence has a dangling modifier?", "c": ["Running late, Maria grabbed her keys and rushed out.", "Running late, the keys were grabbed by Maria.", "Maria, running late, grabbed her keys.", "Because she was running late, Maria grabbed her keys."], "a": 1, "e": "\"Running late\" should describe Maria, but the sentence puts \"the keys\" right after the comma instead."}, {"q": "How would you fix: \"Excited about the trip, the suitcase was packed quickly.\"?", "c": ["Excited about the trip, Sam packed the suitcase quickly.", "The suitcase, excited about the trip, was packed quickly.", "Excited, quickly the suitcase was packed.", "No fix needed."], "a": 0, "e": "The modifier \"Excited about the trip\" needs to describe a person (Sam), not the suitcase."}], "missedFull": [{"qid": "ela-W22", "n": "W22", "stem": "What is the grammatical error in the following sentence?\n\"Aware that his decision would affect the rest of his life, the college Ben chose was Harvard.\"", "passageTitle": null, "passage": null, "choices": ["The subject and the verb do not agree.", "The sentence contains a comma splice.", "There is a dangling modifier.", "There is no error."], "correctIdx": 2, "chosenText": "There is no error.", "explain": "\"Aware that his decision would affect the rest of his life\" is meant to describe Ben, but the subject right after the comma is \"the college\" — leaving the modifier dangling with nothing correct to attach to.", "allExplanations": ["Subject-verb agreement isn't the issue here — \"the college... was Harvard\" agrees correctly.", "There's only one comma here, separating an introductory phrase from the main clause — that's not a comma splice, which requires two complete sentences joined only by a comma.", "\"Aware that his decision would affect the rest of his life\" is meant to describe Ben, but the subject right after the comma is \"the college\" — leaving the modifier dangling with nothing correct to attach to.", "The sentence does contain an error — a dangling modifier, since the opening phrase doesn't correctly describe the subject of the main clause."], "diagram": null}]}, {"id": "we-figurative-analogy", "cat": "written_expression", "title": "Idioms & Analogies", "missed": ["W25", "W26"], "lesson": "For **idiom meaning** questions, think about the phrase's traditional/figurative meaning, not the literal words — \"the fold\" traditionally means a group or community, so \"going into the fold\" means **joining a group**. For **analogies** (A:B :: C:D), figure out the RELATIONSHIP between the first pair, then apply that exact same relationship to the second pair. \"Hyperventilation : air\" = excessive breathing OF air, so \"hyperthermia : ___\" needs the thing there's excessively much of — **heat**.", "checks": [{"q": "\"She finally came out of her shell\" means she:", "c": ["Left her house", "Became less shy/more open", "Broke an object", "Went into hiding"], "a": 1, "e": "\"Coming out of one's shell\" is an idiom for becoming more open or less shy."}, {"q": "Complete the analogy: hypoglycemia : sugar :: hypothermia : ___", "c": ["Water", "Cold", "Heat/temperature", "Air"], "a": 2, "e": "Hypoglycemia = too little sugar; hypothermia = too little body heat/temperature — same \"too little of X\" relationship."}], "missedFull": [{"qid": "ela-W25", "n": "W25", "stem": "The phrase \"going into the fold\" refers to", "passageTitle": null, "passage": null, "choices": ["joining or rejoining a group.", "rejecting an idea.", "holding true to a belief.", "starting a new journey."], "correctIdx": 0, "chosenText": "rejecting an idea.", "explain": "\"The fold\" traditionally refers to a group or community, so \"going into the fold\" means becoming part of that group.", "allExplanations": ["\"The fold\" traditionally refers to a group or community, so \"going into the fold\" means becoming part of that group.", "This phrase is about joining, not rejecting.", "This describes loyalty to an idea, not the act of joining a group.", "The phrase is about belonging to a group, not about travel or new beginnings."], "diagram": null}, {"qid": "ela-W26", "n": "W26", "stem": "hyperventilation : air :: hyperthermia :", "passageTitle": null, "passage": null, "choices": ["hair", "air", "heat", "money"], "correctIdx": 2, "chosenText": "air", "explain": "Hyperventilation involves excessive breathing of air; hyperthermia involves excessive body heat — \"thermia\" relates to heat, just as \"ventilation\" relates to air.", "allExplanations": ["Hair has no connection to \"hyperthermia,\" which relates to body heat.", "Air is already paired with hyperventilation in the analogy — hyperthermia needs its own matching word.", "Hyperventilation involves excessive breathing of air; hyperthermia involves excessive body heat — \"thermia\" relates to heat, just as \"ventilation\" relates to air.", "Money has no relationship to either hyperventilation or hyperthermia."], "diagram": null}]}, {"id": "we-sentence-structure", "cat": "written_expression", "title": "Compound Sentences & Internal Punctuation (Colons/Semicolons)", "missed": ["W28", "W30"], "lesson": "A **compound sentence** joins two complete, independent clauses (each could stand alone as its own sentence) with a conjunction like **and, but, or, so** — usually with a comma before the conjunction. A **semicolon** can join two closely related independent clauses WITHOUT a conjunction (\"Mary had an appointment at 3 p.m.; George had one at 4 p.m.\"). A **colon** introduces a list or explanation after a complete independent clause.", "checks": [{"q": "Which is a compound sentence?", "c": ["Running fast, she caught the bus.", "She ran fast and caught the bus, which was late.", "She ran fast, and she caught the bus.", "She ran fast to catch the bus."], "a": 2, "e": "\"She ran fast\" and \"she caught the bus\" are both complete independent clauses joined by \"and\" — a compound sentence."}, {"q": "Which sentence uses a semicolon correctly?", "c": ["I packed: shoes, a coat, and gloves.", "The store closes at 9; we should hurry.", "I like tea; coffee, and juice.", "She said; \"Let's go.\""], "a": 1, "e": "A semicolon correctly joins two independent clauses here without a conjunction."}], "missedFull": [{"qid": "ela-W28", "n": "W28", "st ool\" and \"he first had to stop at the store and pick up some napkins\") with the conjunction \"but\" — the definition of a compound sentence.", "allExplanations": ["This is a simple sentence with only one independent clause.", "This joins two complete independent clauses (\"Anton needed to get to school\" and \"he first had to stop at the store and pick up some napkins\") with the conjunction \"but\" — the definition of a compound sentence.", "This is actually a compound-complex sentence, since the first clause itself contains a subordinate clause (\"that the rent was due\") in addition to the two joined independent clauses.", "This is a complex sentence — one subordinate clause (\"Because there was no time...\") attached to one independent clause, not two independent clauses joined together."], "diagram": null}]}, {"id": "vocab-context", "cat": "vocabulary", "title": "Vocabulary in Context", "missed": ["V15", "V19", "V27"], "lesson": "Watch for words that sound like they might mean something related but actually point in a **different or even opposite** direction. Three to lock in: **raucous** = loud/rowdy (NOT long or crowded). **turmoil** = a state of great disturbance/chaos (NOT a loss or victory). **precede** = to come/go BEFORE something (its near-twin \"proceed\" means to go forward — easy to mix up, but precede is specifically about ORDER, coming first).", "checks": [{"q": "\"The classroom was raucous after the fire alarm.\" This means the classroom was:", "c": ["Very quiet", "Very loud and disorderly", "Very organized", "Very empty"], "a": 1, "e": "Raucous = loud and disorderly."}, {"q": "\"The introduction will precede the main speech.\" This means the introduction happens:", "c": ["After the speech", "At the same time as the speech", "Before the speech", "Instead of the speech"], "a": 2, "e": "Precede = to come before."}], "missedFull": [{"qid": "ela-V15", "n": "V15", "stem": "That was a raucous gathering last night.", "passageTitle": null, "passage": n ial degree title.", "One of the sentences above does have a capitalization error, so NO MISTAKES isn't correct here."], "diagram": null}]}, {"id": "punc-quote-end-marks", "cat": "punctuation", "title": "Quotation Marks + End Punctuation Placement", "missed": ["P7", "P10", "P20"], "lesson": "In American English: a **period or comma always goes INSIDE the closing quotation mark** — no exceptions: \"Striving for Excellence.\" (not \".) A **question mark** goes inside the quotes only if the QUOTED WORDS THEMSELVES are the question (\"What time is it?\"); if the whole sentence around the quote is the question but the quoted part isn't, the question mark goes OUTSIDE: Did Jack really say, \"I can't make it tonight\"? Also, when a quote is followed by a name being directly addressed, that name needs a comma before it: Who said, \"...,\" Heather?", "checks": [{"q": "Which is punctuated correctly?", "c": ["She said, \"I'm ready\".", "She said, \"I'm ready.\"", "She said \"I'm ready,\".", "She said, \"I'm ready,\"."], "a": 1, "e": "The period belongs inside the closing quotation mark."}, {"q": "Which is punctuated correctly, if the whole sentence (not just the quoted words) is a question?", "c": ["Did she really say \"I quit?\"", "Did she really say, \"I quit\"?", "Did she really say, \"I quit?\"", "Did she really say \"I quit\"?"], "a": 1, "e": "Since the overall sentence is the question (not the quoted words themselves), the question mark goes outside the quotes, and a comma introduces the quote."}], "missedFull": [{"qid": "ela-P7", "n": "P7", "stem": "Which sentence has a punctuation error? (Choose NO MISTAKES if all are correct.)", "passageTitle": null, "passage": null, "choices": ["Who said, \"All's fair in love and war\", Heather?", "\"These are the times that try men's souls\" is a famous quote.", "My kitten is \"six months old\" today.", "NO MISTAKES"], "correctIdx": 0, "chosenText": "My kitten is \"six months old\" today.", "explain": "The comma should go inside the var FORMULA_CLUSTERS_FULL = [{"id": "fx-perimeter-circumference", "title": "Perimeter & Circumference", "formula": "Rectangle: P = 2l + 2w\nSquare: P = 4s\nCircle: C = πd = 2πr", "explanation": "Perimeter and circumference both mean “distance all the way around the outside.” For straight-sided shapes, just add up the side lengths (or use the shortcut formulas). For a circle, the distance around is called the **circumference**, and it's always π (≈3.14) times the diameter.", "example": "A rectangle is 9 cm long and 5 cm wide: P = 2(9) + 2(5) = 18 + 10 = **28 cm**.\nA circle has a radius of 4 in, so its diameter is 8 in: C = 3.14 × 8 = **25.12 in**.", "mnemonic": "“Cherry Pie is Delicious” → **C**ircumference = **p**i × **d**iameter. And remember: if you're only given the radius, **double it first** to get the diameter.", "checks": [{"q": "A rectangle has a length of 9 cm and a width of 5 cm. What is its perimeter?", "c": ["14 cm", "28 cm", "45 cm", "23 cm"], "a": 1, "e": "P = 2(9) + 2(5) = 18 + 10 = 28 cm."}, {"q": "A circle has a radius of 5 in. Using π ≈ 3.14, what is its circumference?", "c": ["15.7 in", "31.4 in", "78.5 in", "62.8 in"], "a": 1, "e": "Diameter = 2 × 5 = 10 in. C = 3.14 × 10 = 31.4 in."}], "missedFull": [], "cat": null}, {"id": "fx-area-flat", "title": "Area of Flat Shapes", "formula": "Rectangle/Square: A = lw or A = s²\nTriangle: A = ½bh\nParallelogram: A = bh\nTrapezoid: A = ½(b₁+b₂)h\nCircle: A = πr²", "explanation": "Area is how much flat space a shape covers, measured in square units. A triangle is always **half** of the rectangle that would surround it — that's why its formula has the ½. A trapezoid has two different parallel sides (b₁ and b₂), so you average them before multiplying by the height.", "example": "A triangle has a base of 10 in and a height of 7 in: A = ½(10)(7) = **35 in²**.\nA circle has a radius of 3 cm: A = 3.14 × 3² = 3.14 × 9 = **28.26 cm²**.", "mnemonic": "“Apple Pies are Squared” → **A**rea = **p**i × **r**adius **squared**. This is the easiest way to remember area uses r² while circumference just uses r (or d) — area is the one with the exponent.", "checks": [{"q": "A trapezoid has parallel sides of 6 ft and 10 ft, and a height of 4 ft. What is its area?", "c": ["20 ft²", "64 ft²", "32 ft²", "40 ft²"], "a": 2, "e": "A = ½(6+10)(4) = ½(16)(4) = 32 ft²."}, {"q": "A circle has a radius of 6 m. Using π ≈ 3.14, what is its area?", "c": ["18.84 m²", "37.68 m²", "113.04 m²", "226.08 m²"], "a": 2, "e": "A = 3.14 × 6² = 3.14 × 36 = 113.04 m²."}], "missedFull": [], "cat": null}, {"id": "fx-volume", "title": "Volume of 3D Shapes", "formula": "Rectangular prism: V = lwh\nAny prism: V = B × h  (area of base × height)\nCylinder: V = πr²h\nCone: V = ⅓πr²h\nSphere: V = ⁴⁄₃πr³", "explanation": "Volume measures how much space fills up a 3D shape, in cubic units. Notice the pattern: a **cylinder is like a stack of circles** (πr² × height), and a **cone is exactly ⅓ of a cylinder** with the same base and height. A **sphere** has its own formula with ⁴⁄₃.", "example": "A cylinder has radius 3 cm and height 10 cm: V = 3.14 × 3² × 10 = 3.14 × 9 × 10 = **282.6 cm³**.\nA cone with the same radius and height would be exactly ⅓ of that: **94.2 cm³**.", "mnemonic": "“Cones and spheres like their thirds” — cone = **⅓**πr²h, sphere = **⁴⁄₃**πr³. Everything else (prisms, cylinders) is just base × height, no fraction needed.", "checks": [{"q": "A cylinder has a radius of 3 cm and a height of 10 cm. Using π ≈ 3.14, what is its volume?", "c": ["94.2 cm³", "188.4 cm³", "282.6 cm³", "942 cm³"], "a": 2, "e": "V = 3.14 × 3² × 10 = 3.14 × 9 × 10 = 282.6 cm³."}, {"q": "A cone has a radius of 6 in and a height of 9 in. Using π ≈ 3.14, what is its volume?", "c": ["169.56 in³", "339.12 in³", "1017.36 in³", "113.04 in³"], "a": 1, "e": "V = ⅓ × 3.14 × 6² × 9 = ⅓ × 1017.36 = 339.12 in³."}], "missedFull": [], "cat": null}, {"id": "fx-rates", "title": "Rates: Distance, Interest & Slope", "formula": "Distance = Rate × Time  (d = rt)\nSimple Interest: I = Prt\nSlope: m = rise/run = (y₂-y₁)/(x₂-x₁)\nPercent change = (new − old) ÷ old × 100%", "explanation": "These formulas all describe **how fast something changes**. Distance/rate/time connects speed and travel. Simple interest tells you how much money grows (Principal × rate × time). Slope tells you how steep a line is — how much y changes for each step in x.", "example": "A car travels at 55 mph for 3 hours: d = 55 × 3 = **165 miles**.\n$800 invested at 5% (0.05) for 2 years: I = 800 × 0.05 × 2 = **$80** in interest.", "mnemonic": "Distance/rate/time → think **“DIRT”**: **D** = **I** (is) **R** × **T**. For interest, remember **“I PRT”** (say it like “I party!”): Interest = Principal × Rate × Time.", "checks": [{"q": "A train travels at 60 mph for 4 hours. How far does it travel?", "c": ["64 miles", "240 miles", "15 miles", "224 miles"], "a": 1, "e": "d = rt = 60 × 4 = 240 miles."}, {"q": "What is the simple interest on $500 at a rate of 4% (0.04) for 3 years?", "c": ["$20", "$60", "$2,000", "$15"], "a": 1, "e": "I = Prt = 500 × 0.04 × 3 = $60."}], "missedFull": [], "cat": null}, {"id": "fx-pythagorean", "title": "Pythagorean Theorem (Right Triangles)", "formula": "a² + b² = c²\n(a and b are the two shorter legs; c is the hypotenuse — always the longest side, opposite the right angle)", "explanation": "This only works for **right triangles**. It says: if you square both shorter sides and add them, you get the square of the longest side (the hypotenuse). Use it to find a missing side when you know the other two.", "example": "Legs of 6 and 8: c² = 6² + 8² = 36 + 64 = 100, so c = √100 = **10**.\nIf the hypotenuse is 13 and one leg is 5: b² = 13² − 5² = 169 − 25 = 144, so b = √144 = **12**.", "mnemonic": "The famous **3–4–5 triangle** (and its multiples, like 6–8–10 or 9–12–15) is a right triangle every time — if you spot those numbers, you can skip the math entirely. Also remember: **c is always alone on one side of the equation** because it's always the biggest.", "checks": [{"q": "A right triangle has legs of 9 and 12. What is the length of the hypotenuse?", "c": ["15", "21", "10.5", "144"], "a": 0, "e": "c² = 9² + 12² = 81 + 144 = 225. c = √225 = 15. (This is just the 3-4-5 triangle tripled!)"}, {"q": "A right triangle has a hypotenuse of 17 and one leg of 8. What is the other leg?", "c": ["9", "15", "13", "25"], "a": 1, "e": "b² = 17² − 8² = 289 − 64 = 225. b = √225 = 15."}], "missedFull": [], "cat": null}, {"id": "fx-stats-prob", "title": "Mean & Probability", "formula": "Mean = (sum of values) ÷ (number of values)\nProbability = (favorable outcomes) ÷ (total outcomes)\nIndependent events: P(A and B) = P(A) × P(B)", "explanation": "Mean is just the everyday “average.” Probability is always a fraction between 0 and 1 (or 0% and 100%): how many outcomes you want, out of all the outcomes possible. When two events don't affect each other, multiply their probabilities together.", "example": "Data set 4, 8, 6, 10, 12: mean = (4+8+6+10+12) ÷ 5 = 40 ÷ 5 = **8**.\nRolling an even number (3 out of 6) AND spinning red (1 out of 4): ½ × ¼ = **⅛**.", "mnemonic": "For probability, always ask two questions in order: **“what do I want?”** (top of the fraction) then **“what's possible?”** (bottom of the fraction). For combined events, the word **“and” usually means multiply**.", "checks": [{"q": "What is the mean of this data set? 5, 9, 7, 11, 13", "c": ["7", "9", "45", "8"], "a": 1, "e": "(5+9+7+11+13) ÷ 5 = 45 ÷ 5 = 9."}, {"q": "A bag has 4 red and 6 blue marbles. What is the probability of picking a red marble?", "c": ["4/6", "4/10", "6/10", "1/4"], "a": 1, "e": "Favorable (red) = 4, total = 10. P(red) = 4/10."}], "missedFull": [], "cat": null}];
var MATH_REVIEW = [{"id": "numbers-fractions", "title": "Number Sense, Fractions & Decimals", "color": "c1", "sections": [{"h": "Comparing & Ordering", "bullets": ["Convert everything to **decimals** to compare fractions, mixed numbers, and negatives on one scale.", "**Any positive number > any negative number.** Between two negatives, the one **closer to zero is greater** (-2 > -5).", "Common denominators also work: compare numerators once denominators match."]}, {"h": "Fraction Operations", "bullets": ["**Add/Subtract**: need a common denominator first.", "**Multiply**: multiply straight across (numerator × numerator, denominator × denominator). No common denominator needed.", "**Divide**: \"Keep, Change, Flip\" — keep the first fraction, change ÷ to ×, flip the second fraction.", "**Mixed numbers**: convert to an improper fraction before multiplying or dividing.", "A remainder in division becomes the **numerator** of the leftover fraction (29÷8 → 3 remainder 5 → **3 5/8**)."]}, {"h": "Decimals & Percent", "bullets": ["Fraction → decimal: **divide top by bottom**. Decimal → percent: **multiply by 100** (move decimal point 2 places right).", "**Percent discount** = (original price − sale price) ÷ **original** price. Always divide by the *original*, not the sale price.", "80% = 4/5, 75% = 3/4, 60% = 3/5, 50% = 1/2, 25% = 1/4, 20% = 1/5, 10% = 1/10 — memorize these landmark conversions."]}, {"h": "Rounding & Estimation", "bullets": ["For \"best estimate\" volume/area problems: **round each dimension first**, then multiply. Don't calculate exact and round at the end — the test expects the rounded-first method.", "Round money problems to compatible numbers first ($2,082 → $2,100) before dividing for a clean estimate."]}]}, {"id": "ratios-proportions", "title": "Ratios, Rates & Proportions", "color": "c2", "sections": [{"h": "Setting Up a Proportion", "bullets": ["Keep the **same units in the same position** in both fractions: (rate 1) = (rate 2), e.g. hours/courses = hours/courses.", "**Cross-multiply** to solve: if a/b = c/d, then a×d = b×c.", "Unit rate = divide to get \"per one\" (cost per ounce = total cost ÷ total ounces)."]}, {"h": "Metric Conversion Ladder", "bullets": ["**kilo → hecto → deka → (base unit) → deci → centi → milli** — each step is ×10 or ÷10.", "Going to a **smaller** unit → **multiply** (bigger number). Going to a **bigger** unit → **divide** (smaller number).", "1 m = 100 cm = 1000 mm. 1 dm = 10 cm. 1 km = 1000 m."]}]}, {"id": "algebra-patterns", "title": "Algebra, Expressions & Patterns", "color": "c3", "sections": [{"h": "Order of Operations (PEMDAS)", "bullets": ["**Parentheses → Exponents → Multiplication/Division (left to right) → Addition/Subtraction (left to right)**.", "Multiplication and division are the **same priority** — do whichever comes first reading left to right. Same for + and −.", "**-8² = -64** (negative NOT squared). **(-8)² = 64** (negative IS squared, because of the parentheses)."]}, {"h": "Sequences & Patterns", "bullets": ["**Arithmetic sequence** (same amount added/subtracted each time): rule looks like aₙ = (common difference) × n + (adjustment).", "Test your rule against **every row**, not just the first one.", "For growth-race problems (doubling vs. squaring, etc.), **build an actual table** month by month rather than guessing who wins."]}]}, {"id": "equations", "title": "Equations & Coordinate Geometry", "color": "c1", "sections": [{"h": "Solving Equations", "bullets": ["**Algebra tiles**: long tile = x, small square = 1. Match up tiles on each side, then cancel/remove equal amounts from both sides.", "Linear equations from word problems: identify the **fixed cost** (y-intercept) and the **rate per unit** (slope): y = (rate)x + (fixed cost)."]}, {"h": "Coordinate Plane", "bullets": ["Ordered pairs are **(x, y)**: x = left/right, y = up/down.", "**Reflect across x-axis**: keep x, flip the sign of y.", "**Reflect across y-axis**: keep y, flip the sign of x.", "Write out new coordinates one at a time — don't do sign flips in your head."]}]}, {"id": "geometry", "title": "Geometry: Shapes, Angles & Measurement", "color": "c2", "sections": [{"h": "Angle Relationships", "bullets": ["**Complementary** angles sum to **90°**. **Supplementary** angles sum to **180°**.", "Figure out which total applies first (right angle vs. straight line), then subtract the known angle."]}, {"h": "Circles", "bullets": ["**Circumference = π × diameter** (or 2πr). Double the radius first if only radius is given!", "Use π ≈ **3.14** unless told otherwise."]}, {"h": "3D Shapes: Faces, Edges, Nets", "bullets": ["**Cube**: 6 faces, 12 edges. **Square pyramid**: 5 faces, 8 edges. **Triangular prism**: 5 faces, 9 edges.", "A net of narrow curved \"orange-peel\" gores folds into a **sphere**.", "A net of 2 triangles + 3 rectangles folds into a **triangular prism**. 2 circles + 1 rectangle folds into a **cylinder**."]}, {"h": "Volume Formulas", "bullets": ["**Any prism**: Volume = (area of base shape) × height.", "**Triangular prism**: V = (1/2 × base × height of triangle) × length.", "**Rectangular prism**: V = length × width × height.", "**Cone**: V = (1/3) × π × r² × h — don't forget the 1/3!", "**Sphere**: V = (4/3) × π × r³."]}, {"h": "Squares & Square Roots", "bullets": ["Area of a square = **side²**. So **side = √Area**.", "√Area gives the number of unit squares along ONE side — not the perimeter, not half the area."]}, {"h": "Similar & Scaled Figures", "bullets": ["Similar figures have **proportional (same-ratio) side lengths**. Check EVERY side pair has the same scale factor, not just one."]}]}, {"id": "data-probability", "title": "Statistics & Probability", "color": "c3", "sections": [{"h": "Measures of Center", "bullets": ["**Mean** = add all values, divide by count. Sensitive to outliers.", "**Median** = the middle value when ordered. Resistant to outliers — best choice when there's an extreme value.", "**Mode** = most frequent value. **Range** = highest − lowest."]}, {"h": "Reading Graphs", "bullets": ["**Histogram**: bars show frequency counts across number ranges. To find the median, add frequencies left to right until you cross the halfway point of the TOTAL count.", "**Line graph**: best for showing change over continuous time.", "**Bar graph**: compares categories. **Line plot**: shows frequency of individual values with dots/X's."]}, {"h": "Probability", "bullets": ["P(event) = (favorable outcomes) / (total possible outcomes).", "**Independent events** (one doesn't affect the other): **multiply** their probabilities. P(A and B) = P(A) × P(B).", "**Sample space** for combined independent events = multiply the number of outcomes of each (die × spinner, coin × coin × coin, etc.)."]}]}];
var SCIENCE_REVIEW = [{"id": "life-science", "title": "Life Science", "color": "c1", "sections": [{"h": "Cells", "bullets": ["**Plant cells** have a **cell wall**, **chloroplasts** (photosynthesis), and a large central **vacuole**.", "**Animal cells** lack a cell wall and chloroplasts, but have a nucleus and mitochondria.", "**Bacteria** are single-celled with NO nucleus and NO mitochondria (prokaryotic).", "**Mitochondria** = the cell's energy-generating structures (\"powerhouse of the cell\")."]}, {"h": "Genetics & Heredity", "bullets": ["Traits that consistently appear together across generations suggest **linked genes** on the same chromosome.", "**Dominant** traits show up even with one copy of the gene; **recessive** traits need two copies to appear."]}, {"h": "Cell Division: Mitosis", "bullets": ["Order: **Interphase → Prophase → Metaphase → Anaphase → Telophase**.", "**Interphase**: cell grows, DNA copies (cell spends the MOST time here).", "**Metaphase**: chromosomes line up in the middle (the \"metaphase plate\").", "**Anaphase**: chromosomes pull apart to opposite ends.", "**Telophase**: nuclear membranes re-form; the cell then physically splits.", "**Bacteria do NOT undergo mitosis** — they divide by simpler binary fission."]}, {"h": "Body Systems", "bullets": ["**Respiratory** (lungs, trachea, diaphragm): gas exchange — oxygen in, CO₂ out. (Heart is NOT respiratory — it's circulatory.)", "**Circulatory** (heart, blood vessels): pumps blood, delivers oxygen/nutrients.", "**Nervous** (brain, nerves): gathers and processes information from the senses.", "**Digestive**: breaks down food into nutrients. **Reproductive**: produces offspring.", "**Blood**: red blood cells carry oxygen (deficiency → anemia); white blood cells fight pathogens; platelets clot; plasma is the fluid carrier."]}, {"h": "Ecology", "bullets": ["Population growth often follows an **S-curve**: fast growth, then leveling off at the environment's **carrying capacity** (resource limit).", "**Sea urchins** = Echinodermata. **Insects/spiders/crabs** = Arthropoda. **Vertebrates** = Chordata. **Snails/octopuses** = Mollusca."]}]}, {"id": "physical-science", "title": "Physical Science", "color": "c2", "sections": [{"h": "Newton's Laws", "bullets": ["**1st Law (Inertia)**: objects at rest stay at rest, objects in motion stay in motion, unless acted on by an outside force.", "**2nd Law**: Force = mass × acceleration (bigger force or smaller mass = more acceleration).", "**3rd Law**: every action has an equal and opposite reaction.", "If an object is **motionless**, its **net force is zero** — forces are balanced even if individual forces (like gravity) still act on it."]}, {"h": "Heat & Matter", "bullets": ["Heat flows from **warmer objects to colder objects** (conduction). \"Cold\" doesn't flow — it's just an absence of heat.", "**Mass is conserved** when matter changes state (ice melting doesn't gain or lose mass, just density/volume changes)."]}, {"h": "Forces: Buoyancy & Friction", "bullets": ["**Buoyant force > gravity** → object floats. **Buoyant force < gravity** → object sinks. Equal → suspended.", "**Rougher surfaces = more friction.** Polished/smooth surfaces = less friction."]}, {"h": "Electricity", "bullets": ["**Current → amperes**. **Voltage → volts**. **Resistance → ohms**. **Energy → joules**."]}, {"h": "Waves: Light & Sound", "bullets": ["**Light travels much faster than sound** — see lightning before hearing thunder.", "**Sound needs a medium** (air, water, solid) to travel; **light doesn't** (can cross the vacuum of space).", "Both light and sound waves have period, amplitude, and can reflect/refract.", "**Electromagnetic spectrum**, longest to shortest wavelength: **radio → microwave → infrared → visible light → ultraviolet → X-ray → gamma ray**."]}, {"h": "Solubility", "bullets": ["Solubility is a **fixed property** of a substance — it doesn't change just because you use more or less solvent (though it can change with temperature)."]}]}, {"id": "earth-space", "title": "Earth & Space Science", "color": "c3", "sections": [{"h": "Astronomy", "bullets": ["**Stars generate energy through nuclear fusion** — hydrogen fusing into helium.", "**Lunar eclipse** happens only at **full moon** (Earth directly between Sun and Moon).", "**Comets** are mostly **ice, dust, and rock** — orbit the Sun on a regular repeating period; add the period to the last sighting to predict the next."]}, {"h": "Atmosphere & Weather", "bullets": ["Atmosphere composition: about **78% nitrogen, 21% oxygen**, less than 1% everything else (CO₂, water vapor, argon).", "**Thermometer** measures temperature; **barometer** measures pressure; **anemometer** measures wind speed.", "**Northern Hemisphere**: summer in June/July/August. **Southern Hemisphere**: OPPOSITE — summer in December/January/February."]}, {"h": "Earth's Structure", "bullets": ["**Volcanoes cluster along tectonic plate boundaries** (like the \"Ring of Fire\") — plates buckle/overlap, letting magma escape.", "Ocean floor, shore to deep: **continental shelf → continental slope → abyssal plain** (flat deep floor).", "**Mid-ocean ridges** = underwater mountains where plates spread apart. **Oceanic trenches** = deep canyons where plates collide."]}, {"h": "Sound & Distance", "bullets": ["To find lightning's distance: you need the **speed of sound** — distance = speed × time (using the delay between seeing the flash and hearing thunder)."]}]}];
var SOCIAL_REVIEW = [{"id": "civics", "title": "Civics & Government", "color": "c1", "sections": [{"h": "Key Vocabulary", "bullets": ["**Suffrage** = the right to vote.", "**Due process** = government must treat citizens fairly under the law, regardless of wealth/status.", "**Popular sovereignty** = government power comes from the people.", "**Necessary and Proper Clause** (\"Elastic Clause\") = gives Congress power to pass laws needed for its other duties."]}, {"h": "How a Bill Becomes a Law", "bullets": ["**Introduction → Committee action → Floor action → Final approval → Enactment.**", "Enactment = the law is finally put into force/practice."]}, {"h": "The Constitution", "bullets": ["Can ONLY be changed by a **constitutional amendment** — not by a Supreme Court ruling, a regular law, or a veto.", "The **22nd Amendment** limits presidents to two terms (after FDR served four).", "The **Bill of Rights** = first 10 amendments (speech, bear arms, unreasonable search, etc. — don't confuse these rights with \"suffrage,\" which comes from separate amendments)."]}, {"h": "Branches & Leadership", "bullets": ["**Speaker of the House** presides over the House of Representatives.", "**President pro tempore** presides over the Senate when the VP is absent.", "**Electoral College**: body representing Congress members that formally elects the President & VP (NOT the Supreme Court)."]}, {"h": "Elections", "bullets": ["**Caucus** = used in **primary elections** to help choose a party's candidate.", "**Primary election** picks a party's nominee; **general election** decides the final winner."]}, {"h": "Historical Civics Facts", "bullets": ["**Emancipation Proclamation** (Lincoln) = freed slaves in Confederate states.", "**Writ of Habeas Corpus** = right to be brought before a court when accused.", "**Magna Carta** = 13th-century English document, early root of legal rights (not American)."]}]}, {"id": "geography", "title": "Geography", "color": "c2", "sections": [{"h": "Core Concepts", "bullets": ["Geography's 5 core themes: **location, place, human-environment interaction, movement, region**."]}, {"h": "Regions & Middle East", "bullets": ["**Middle East** = a region, not a country/continent/city.", "**Egypt** borders **Sudan**, Libya, Israel/Gaza. Relates culturally/historically to **Turkey** (shared Ottoman & Sunni Muslim history)."]}, {"h": "Human-Environment Interaction", "bullets": ["Farming near fertile soil, fishing near water = **adaptation** (humans adjusting to environment).", "**Cultural diffusion** = spread of ideas/customs (Internet, immigration, colonialism spread it; **isolationism blocks it**).", "**Desertification** (like in the Sahara) is mainly caused by **drought** (lack of rainfall), which lets wind erode exposed soil.", "**Erosion** = gradual wearing away by wind/water (vs. sudden events like flooding or tectonic shifts)."]}, {"h": "Map Skills", "bullets": ["**Historical map** = best for battles/troop movements. **Political map** = boundaries/cities. **Physical map** = natural features.", "**Legend/key** = explains symbols/colors. **Compass rose** = shows direction. **Scale** = shows distance."]}]}, {"id": "history", "title": "U.S. History", "color": "c3", "sections": [{"h": "Exploration & Early 1800s", "bullets": ["**Zebulon Pike**: explored Arkansas River, Rocky Mountains, Rio Grande. **Lewis & Clark**: explored route to the Pacific.", "**War of 1812** cause: British interference with U.S. trade (NOT independence — that was already won in 1783).", "**Industrial Revolution**: led to the **factory system** and large-scale manufacturing."]}, {"h": "Civil War Era", "bullets": ["Causes of Southern secession (1861): **Lincoln's election**, **states' rights disputes**, **trade/tariff conflicts**. (NOT the Underground Railroad.)", "**Maryland did NOT secede** — stayed in the Union despite being a border slave state.", "**Battle of Antietam** = Civil War. (Bunker Hill/Yorktown = Revolutionary War. Battle of the Bulge = WWII.)", "**Civil Rights Act of 1866**: granted citizenship to nearly everyone born in the U.S. **except Native Americans**."]}, {"h": "Reconstruction", "bullets": ["**Carpetbaggers** = Northerners who moved South after the war — resented for financial exploitation, political motives, and land/power grabs (often \"all of the above\").", "**Andrew Johnson's impeachment (1867)**: caused by pardoning ex-Confederates, vetoing the Civil Rights Act, letting ex-Confederates hold military posts — NOT by requiring 13th Amendment ratification (that happened before his impeachment issues)."]}, {"h": "Suffrage Timeline", "bullets": ["**African-American men** gained suffrage first (15th Amendment, 1870).", "**Women** gained suffrage in 1920 (19th Amendment).", "**Native Americans** had voting restrictions lifted in some states by 1948."]}, {"h": "Presidents Trivia", "bullets": ["**Benjamin Franklin was NEVER President** (Founding Father only).", "Benjamin Harrison, Rutherford B. Hayes, Chester A. Arthur — all WERE actual presidents (late 1800s)."]}]}, {"id": "economics", "title": "Economics", "color": "c1", "sections": [{"h": "Economic Systems", "bullets": ["U.S. = **capitalist system** (private ownership). **Socialism/communism** = collective/government ownership. **Barter** = trading goods directly, no money."]}, {"h": "Key Vocabulary", "bullets": ["**Commodities** = raw/basic resources bought and sold (water, time, raw materials) — different from finished \"products.\"", "**Inflation** = falling currency value + rising prices together.", "**GDP (Gross Domestic Product)** = total dollar value of all goods/services a country produces in a year.", "**Subsidy** = government financial incentive to encourage an activity. **Mandate** = a requirement/order. **Quota** = a quantity limit.", "**Interest rate** = a percentage paid for borrowing money over time.", "**Copyright** = protects ideas/products from being copied by competitors.", "**Commerce** = the broad activity of buying and selling (bigger concept than just \"shopping\")."]}, {"h": "Supply & Demand", "bullets": ["High demand for a desired product → prices **rise**. This is the core rule of supply and demand."]}]}];
var ELA_REVIEW = [{"id": "reading", "title": "Reading Comprehension", "color": "c1", "sections": [{"h": "Author's Purpose & Inference", "bullets": ["Ask **\"what job is this detail doing?\"** — details often set up a later event (foreshadowing), not just describe something.", "**Inference** = a conclusion based on evidence in the text + your own reasoning, not something stated outright. Find the textual clue that supports it."]}, {"h": "Main Idea vs. Supporting Detail", "bullets": ["The **main idea** is what the whole passage is mostly about. **Supporting details** are the specific facts/examples that back it up.", "A sentence is \"deletable\" if it's a side note that doesn't carry the paragraph's core point."]}, {"h": "Fact vs. Opinion", "bullets": ["**Fact** = specific and verifiable (a date, an event, a measurement).", "**Opinion/belief** = phrases like \"I believe,\" \"clearly the best,\" \"everyone agrees\" — even if stated confidently, these are NOT facts."]}, {"h": "Reading Strategy — Slow Down Here", "bullets": ["Since you read fast, deliberately **re-read the specific lines the question points to** before answering — many \"detail\" questions hinge on one exact phrase.", "For \"why\" and \"purpose\" questions, resist picking the first answer that sounds plausible; check it against the actual text."]}]}, {"id": "written_expression", "title": "Written Expression", "color": "c2", "sections": [{"h": "Poetry Analysis", "bullets": ["**Rhyme scheme**: label each line's end sound with a letter; new sound = new letter; reused sound = reused letter. Alternating pattern = ABAB (odd lines rhyme, even lines rhyme).", "**Imagery**: trace a description back to the noun mentioned in the line right before/after it.", "**Theme/interpretation**: contrasting images (light/dark, etc.) often show two qualities existing **together**, not one replacing the other."]}, {"h": "Nonfiction & Rhetoric", "bullets": ["**Fact vs. interpretation**: pick the specific, verifiable statement, not the persuasive or opinion-based one.", "A photo's **purpose** usually points to a bigger idea (lasting impact, emotional weight) — not just \"showing what happened.\""]}, {"h": "Grammar", "bullets": ["**Dangling modifier**: an opening descriptive phrase must be followed immediately by the person/thing it describes. If the wrong noun follows the comma, it's dangling.", "**Compound sentence**: two complete independent clauses joined by a conjunction (and, but, or, so), usually with a comma before the conjunction.", "**Semicolon**: joins two closely related independent clauses WITHOUT a conjunction.", "**Colon**: introduces a list or explanation after a complete independent clause."]}, {"h": "Figurative Language & Analogies", "bullets": ["**Idioms**: think figuratively, not literally (\"the fold\" = a group/community).", "**Analogies (A:B::C:D)**: find the exact relationship between the first pair, then match it for the second pair."]}]}, {"id": "vocabulary", "title": "Vocabulary", "color": "c3", "sections": [{"h": "Words to Lock In (from her practice)", "bullets": ["**Raucous** = loud and disorderly (not long, not crowded).", "**Turmoil** = a state of great disturbance/chaos (not a loss or a victory).", "**Precede** = to come/go BEFORE (opposite of \"go after\"); don't confuse with \"proceed\" (to go forward)."]}, {"h": "Strategy for Unfamiliar Words", "bullets": ["Look for **context clues**: nearby words, tone of the sentence, or a contrast word (\"but,\" \"however\") that hints at the opposite meaning.", "Break the word into **prefix/root/suffix** if possible (hyper- = excessive, hypo- = too little, -therm- = heat, -logy = study of).", "Eliminate answer choices that don't match the sentence's tone (positive/negative) even if you're unsure of the exact definition."]}]}, {"id": "spelling", "title": "Spelling", "color": "c1", "sections": [{"h": "Words to Lock In (from her practice)", "bullets": ["**Salutary** (not \"solutary\") — means beneficial.", "**Indulge** (not \"endulge\") — prefix is IN-, not EN-.", "**Buoyant** (not \"boyant\") — remember b-**u-o**-y-a-n-t.", "**Rapport** — this IS spelled correctly (silent T). Don't second-guess correct-but-unusual-looking words."]}, {"h": "General Strategy", "bullets": ["Don't assume \"NO MISTAKES\" just because every word looks unfamiliar — check each one individually.", "Watch commonly confused prefixes: **in-/im-/en-/un-** all can mean \"not\" or intensify a word — there's no universal rule, so these need memorization.", "Say the word slowly in your head, syllable by syllable, if it looks off."]}]}, {"id": "capitalization", "title": "Capitalization", "color": "c2", "sections": [{"h": "THE Big Rule (her #1 pattern to fix)", "bullets": ["**A word is NOT capitalized just because it sounds official or important.** Only capitalize specific, official NAMES — not generic descriptions of them."]}, {"h": "Don't Capitalize (generic/common nouns)", "bullets": ["**national anthem** (generic term — only capitalize the actual title, like \"The Star-Spangled Banner\")", "**military career**, **bulletin board** — generic phrases, not proper names", "**language** after a nationality — \"Russian language\" (only \"Russian\" is capitalized)", "**ducks**, **doctor** — generic common nouns, unless part of an official name or used as a title right before someone's name"]}, {"h": "DO Capitalize", "bullets": ["**Specific/official titles**: \"The Star-Spangled Banner,\" \"Fort Leonard Wood\"", "**Political party names**: **Republican**, **Democrat** — these ARE proper nouns", "**Titles directly before a name**: Dr. Smith, President Lincoln", "**Proper nouns**: names of people, specific places, days/months, nationalities/languages themselves (Russian, French)"]}, {"h": "Strategy — Slow Down Here", "bullets": ["For every capitalized word in a sentence, ask: **\"is this a specific, official name — or just a generic description?\"**", "Don't default to \"NO MISTAKES\" — this is the error type you're most likely to miss because it doesn't *look* wrong."]}]}, {"id": "punctuation", "title": "Punctuation", "color": "c3", "sections": [{"h": "Quotation Marks + End Punctuation", "bullets": ["**Period or comma**: ALWAYS goes INSIDE the closing quotation mark. \"Like this.\" — no exceptions in American English.", "**Question mark**: goes INSIDE the quotes if the quoted words themselves are the question (\"What time is it?\"). Goes OUTSIDE if the whole surrounding sentence is the question but the quote isn't: Did she say, \"I'm ready\"?", "A name being directly addressed after a quote needs a **comma before it**: Who said, \"...,\" Heather?"]}, {"h": "Apostrophes for Possession", "bullets": ["One owner: add **'s** (the dog's bone).", "Family name made plural + possessive: **pluralize first, then add the apostrophe after the S** (the Smiths' house, the Garcias' car) — NOT \"the Smith's.\""]}, {"h": "Commas After Introductory Phrases", "bullets": ["Any sentence that opens with a word/phrase/clause before the main subject needs a **comma right after it**: \"After the movie, we grabbed pizza.\" \"Although tired, she kept working.\""]}, {"h": "Commas in a Series", "bullets": ["Separate 3+ items with commas, **including before the final \"and\"**: apples, bananas, and milk.", "Short parallel sayings need a comma between their two halves: \"Easy come, easy go.\""]}, {"h": "When NOT to Add Punctuation (avoid over-flagging!)", "bullets": ["A complete parenthetical aside in parentheses doesn't need extra punctuation around it if it's grammatically whole on its own.", "A correctly-formed quoted question with a comma before it and the question mark inside is already correct — don't manufacture an error.", "**Not every sentence in these questions has a mistake.** Slow down and verify there IS an error before picking a specific sentence over \"NO MISTAKES.\""]}, {"h": "Strategy — Her Specific Pattern", "bullets": ["She tends to **both over-flag correct sentences AND under-flag real errors** in the same practice set — meaning the issue isn't rushing to \"NO MISTAKES\" or rushing away from it, it's **not systematically checking each punctuation RULE one at a time**.", "Fix: for each sentence, deliberately check in order — (1) quote+end-punctuation placement, (2) apostrophes, (3) intro commas, (4) series commas — rather than reading for a general \"feel.\""]}]}];
var TIPS = [{"short": "Slow down — speed is not the goal, accuracy is.", "expand": "Looking at your practice results, most of your misses weren't from not knowing the material — they were from moving fast and missing a detail. You have plenty of time on the real test. Read every word of the question and every answer choice before choosing. A few extra seconds per question is a tiny cost compared to a mistake."}, {"short": "Read the WHOLE question stem before looking at any answer choice.", "expand": "It's tempting to start scanning answers half-way through reading the question. Force yourself to finish reading the entire question first — many wrong answers happen because a detail in the second half of the question changes what's actually being asked."}, {"short": "For \"which sentence has an error\" questions: check ALL choices, even after you think you found it.", "expand": "Your punctuation/capitalization practice shows a mixed pattern — sometimes picking an error that isn't there, sometimes missing a real one. The fix for both is the same: don't stop at the first sentence that feels a little off. Read every option before deciding, and be equally open to \"NO MISTAKES\" being correct."}, {"short": "Capitalization: ask \"is this a specific NAME, or just a description?\" every time.", "expand": "Your #1 capitalization pattern is over-capitalizing words that sound official (Military Career, Bulletin Board, Language) but are actually generic. Before accepting a capital letter, ask if it's naming one specific, official thing — if not, it should be lowercase."}, {"short": "Punctuation: check quotes, apostrophes, and commas as separate mini-checks, not one \"feel.\"", "expand": "Run through this order on tricky sentences: (1) Is the period/comma inside the closing quotation mark? (2) Are possessive apostrophes in the right place? (3) Is there a comma after an introductory phrase? (4) Are series items separated by commas? Checking each rule individually beats a general impression."}, {"short": "In math, write down what's given and what's being asked — don't solve in your head.", "expand": "Several of your math misses were on multi-step word problems. Jot the key numbers and the exact question being asked before you start calculating. This prevents solving for the wrong thing or losing track of a step."}, {"short": "Watch for NOT and EXCEPT — they flip the entire question.", "expand": "Words like NOT, EXCEPT, and LEAST reverse what you're looking for. On science and social studies especially, slow down when you see one of these words — it's an easy, avoidable place to lose points."}, {"short": "Estimate first in math, then calculate — your estimate catches wrong answers.", "expand": "Before doing exact math on word problems, picture roughly what the answer should look like. If your calculated answer is wildly different from your estimate, that's your signal to double-check your work."}, {"short": "For social studies vocabulary terms, connect the word to ONE clear memory hook.", "expand": "Many of your social studies misses were specific vocabulary (suffrage, elastic clause, popular sovereignty). These are memorizable facts, not reasoning puzzles — review the term list once more right before the test, since recent review helps recall most on test day."}, {"short": "Eliminate before you guess — cross out choices you know are wrong.", "expand": "Even ruling out one wrong choice meaningfully improves your odds on a guess. Don't stare at four options as equals if you can already rule two out."}, {"short": "If a question stumps you, mark it and move on — come back after finishing the rest.", "expand": "A tough question eats your time AND your confidence if you dwell on it. Answer what you know first, then return to hard questions with a clearer head and whatever time remains."}, {"short": "A little nervousness is normal — a few slow breaths before starting helps.", "expand": "Feeling a bit nervous means you care — it's not a sign something's wrong. Before you start each section, take three slow breaths. In shā Allah, steady and calm effort will carry you further than rushing ever could."}, {"short": "Sleep tonight matters more than one more hour of cramming.", "expand": "Your brain consolidates today's review into long-term memory while you sleep. Get a full night's rest tonight so everything you review today is actually there for you tomorrow."}, {"short": "Being confident and wrong today is actually good news.", "expand": "Research on the “hypercorrection effect” shows that catching and correcting a confident wrong answer makes it stick BETTER than if you'd been unsure. Every mistake you fix today is one you're now less likely to repeat Tuesday."}, {"short": "Trust your preparation — you reviewed this material for a reason.", "expand": "You've now gone through every mistake from your practice tests and confirmed you understand the underlying idea, not just the answer. That's real, durable preparation — trust it on test day instead of second-guessing your first careful read of a question."}];
var CLOSING_DUA = "Rabbi zidni ilma — “My Lord, increase me in knowledge” (Surah Taha, 20:114). Saarah, you put in a full day of real, focused work today — reviewing every mistake, relearning every concept, and proving to yourself you understand it. That effort is never wasted, whatever the exact score turns out to be. Tomorrow, slow down, breathe, trust what you know, and read every question carefully. In shā Allah, it will be made easy for you.";

<script>
/* ===================== Storage layer ===================== */
var STORAGE_OK = true;
var PREFIX = "saarah_last_minute_review_";

function storageTest(){
  try{ var k=PREFIX+"__t__"; localStorage.setItem(k,"1"); localStorage.removeItem(k); return true; }
  catch(e){ return false; }
}
function loadState(){
  var defaults = { theme:"light", muted:false, clusterState:{}, sheetViewed:{}, saveNudge:0,
                    streak:0, bestStreak:0, milestonesShown:{} };
  if(!STORAGE_OK) return defaults;
  try{
    var raw = localStorage.getItem(PREFIX+"state_v1");
    if(!raw) return defaults;
    var parsed = JSON.parse(raw);
    for(var k in defaults){ if(!(k in parsed)) parsed[k]=defaults[k]; }
    return parsed;
  }catch(e){ return defaults; }
}
function saveState(){
  if(!STORAGE_OK) return false;
  try{ localStorage.setItem(PREFIX+"state_v1", JSON.stringify(STATE)); return true; }
  catch(e){ return false; }
}

var STATE = null;
var SAVE_NUDGE_INTERVAL = 6; /* frequent, per request */

/* ===================== Subject registry ===================== */
var SUBJECTS = {
  ela: { label:"ELA / Language", day:1, subcats:[
      {key:"reading", label:"Reading"}, {key:"written_expression", label:"Written Expression"},
      {key:"vocabulary", label:"Vocabulary"}, {key:"spelling", label:"Spelling"},
      {key:"capitalization", label:"Capitalization"}, {key:"punctuation", label:"Punctuation"} ] },
  math: { label:"Math", day:2, subcats:null },
  mathformulas: { label:"Key Formulas", day:2, subcats:null, isFormulas:true },
  science: { label:"Science", day:2, subcats:null },
  social: { label:"Social Studies", day:2, subcats:[
      {key:"civics", label:"Civics/Government"}, {key:"geography", label:"Geography"},
      {key:"history", label:"History"}, {key:"economics", label:"Economics"} ] },
};

function clustersFor(subject, cat){
  if(subject === "mathformulas") return FORMULA_CLUSTERS_FULL;
  var all = subject==="math"?MATH_CLUSTERS_FULL : subject==="science"?SCIENCE_CLUSTERS_FULL :
            subject==="social"?SOCIAL_CLUSTERS_FULL : ELA_CLUSTERS_FULL;
  if(cat) return all.filter(function(c){ return c.cat===cat; });
  return all;
}
function reviewFor(subject){
  return subject==="math"?MATH_REVIEW : subject==="science"?SCIENCE_REVIEW :
         subject==="social"?SOCIAL_REVIEW : ELA_REVIEW;
}
function clusterKey(subject, id){ return subject+"::"+id; }
function getClusterState(subject, id){
  var k = clusterKey(subject, id);
  if(!STATE.clusterState[k]) STATE.clusterState[k] = { done:false, missedOK:{}, checksOK:[] };
  return STATE.clusterState[k];
}
function isClusterDone(subject, id){ return getClusterState(subject,id).done; }

function milestoneTicksHtml(){
  return [25,50,75].map(function(m){ return '<div class="milestone-tick" style="left:'+m+'%"></div>'; }).join("");
}

function subjectProgress(subject, cat){
  var cls = clustersFor(subject, cat);
  var done = cls.filter(function(c){ return isClusterDone(subject, c.id); }).length;
  return { total: cls.length, done: done, pct: cls.length? Math.round(100*done/cls.length):0 };
}

/* ===================== View state ===================== */
var VIEW = { screen:"home", subject:null, cat:null, clusterIdx:0,
             step:"lesson", missedIdx:0, checkIdx:0, shuffled:null, attemptWrong:false };

function goHome(){ VIEW = { screen:"home", subject:null, cat:null, clusterIdx:0, step:"lesson", missedIdx:0, checkIdx:0, shuffled:null }; render(); }

/* ===================== Rendering helpers ===================== */
var root=null;
function el(html){ var d=document.createElement("div"); d.innerHTML=html.trim(); return d.firstElementChild; }
function mdlite(s){
  if(!s) return "";
  return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")
          .replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>")
          .replace(/`(.+?)`/g, "<code>$1</code>")
          .replace(/\n/g, "<br>");
}
function letters(n){ return "ABCDE".slice(0,n).split(""); }

function render(){
  root.innerHTML = "";
  document.body.setAttribute("data-theme", STATE.theme);
  document.body.setAttribute("data-subject", VIEW.subject||"");
  document.body.setAttribute("data-day", VIEW.subject ? String(SUBJECTS[VIEW.subject].day) : "");
  if(VIEW.screen==="home") root.appendChild(renderHome());
  else if(VIEW.screen==="subjectHub") root.appendChild(renderSubjectHub());
  else if(VIEW.screen==="reviewSheet") root.appendChild(renderReviewSheet());
  else if(VIEW.screen==="clusterList") root.appendChild(renderClusterList());
  else if(VIEW.screen==="clusterFlow") root.appendChild(renderClusterFlow());
  else if(VIEW.screen==="tips") root.appendChild(renderTips());
  maybeStorageWarning();
}

/* ===================== HOME ===================== */
function overallDayStats(daySubjects){
  var totalDone=0, totalAll=0;
  daySubjects.forEach(function(s){
    if(SUBJECTS[s].subcats){
      SUBJECTS[s].subcats.forEach(function(sc){ var p=subjectProgress(s, sc.key); totalDone+=p.done; totalAll+=p.total; });
    } else { var p=subjectProgress(s,null); totalDone+=p.done; totalAll+=p.total; }
  });
  return {done:totalDone, total:totalAll, pct: totalAll? Math.round(100*totalDone/totalAll):0};
}

function renderHome(){
  var wrap = el('<div></div>');
  wrap.appendChild(el('<div class="bismillah">Bismillah</div>'));
  wrap.appendChild(el('<div class="home-header"><h1>Last-Minute Review</h1><p>Saarah\u2019s Iowa Assessments \u2014 fix every mistake, review every unit</p></div>'));
  wrap.appendChild(el('<div class="countdown">\ud83d\udcc5 Exam is Tuesday \u2014 today is your one full review day. You\u2019ve got this, in sh\u0101 All\u0101h.</div>'));
  if(STATE.bestStreak >= 3){
    wrap.appendChild(el('<div class="streak-home">\ud83d\udd25 Best streak today: <strong>'+STATE.bestStreak+' in a row</strong></div>'));
  }

  var day1 = overallDayStats(["ela"]);
  var day2 = overallDayStats(["math","science","social"]);

  wrap.appendChild(renderDayBlock(1, "Day 1 \u2014 ELA & Language", ["ela"], day1));
  wrap.appendChild(renderDayBlock(2, "Day 2 \u2014 Math, Science & Social Studies", ["math","science","social"], day2));

  var tipsCard = el('<div class="subject-card" data-subject="tips" style="cursor:pointer;"><div class="subject-card-top"><h3>\ud83d\udca1 Test Tips</h3><div>\u2192</div></div><div class="subject-score">Slow down, watch for tricky details, and stay calm</div></div>');
  tipsCard.onclick = function(){ VIEW.screen="tips"; render(); };
  wrap.appendChild(tipsCard);

  var settingsRow = el('<div class="settings-row"></div>');
  var themeBtn = el('<button class="icon-btn" aria-label="Toggle dark mode">'+(STATE.theme==="dark"?"\u2600\ufe0f":"\ud83c\udf19")+'</button>');
  themeBtn.onclick = function(){ STATE.theme = STATE.theme==="dark"?"light":"dark"; saveState(); render(); };
  var muteBtn = el('<button class="icon-btn" aria-label="Toggle sound">'+(STATE.muted?"\ud83d\udd07":"\ud83d\udd0a")+'</button>');
  muteBtn.onclick = function(){ STATE.muted = !STATE.muted; saveState(); render(); };
  var saveBtn = el('<button class="save-cta">\ud83d\udcbe Save Progress</button>');
  saveBtn.onclick = exportProgress;
  var openBtn = el('<button class="save-cta">\ud83d\udcc2 Open Saved File</button>');
  openBtn.onclick = triggerImport;
  settingsRow.appendChild(themeBtn); settingsRow.appendChild(muteBtn); settingsRow.appendChild(saveBtn); settingsRow.appendChild(openBtn);
  wrap.appendChild(settingsRow);
  var fileInput = el('<input type="file" accept="application/json" style="display:none" id="importFile">');
  fileInput.onchange = handleImportFile;
  wrap.appendChild(fileInput);

  wrap.appendChild(el('<footer class="build-footer">Built from Saarah\u2019s actual practice results \u00b7 111 mistakes, 69 concept lessons, 19 full review sheets</footer>'));
  return wrap;
}

function renderDayBlock(dayNum, label, subjectKeys, stats){
  var block = el('<div class="day-block"></div>');
  block.appendChild(el('<div class="day-heading"><span class="day-badge">DAY '+dayNum+'</span><h2>'+label+'</h2></div>'));
  subjectKeys.forEach(function(s){
    block.appendChild(renderSubjectCard(s));
  });
  return block;
}

function renderSubjectCard(subject){
  var meta = SUBJECTS[subject];
  var card = el('<div class="subject-card" data-subject="'+subject+'"></div>');
  var prog = meta.subcats ? (function(){
    var done=0,total=0; meta.subcats.forEach(function(sc){ var p=subjectProgress(subject,sc.key); done+=p.done; total+=p.total; });
    return {done:done,total:total,pct: total? Math.round(100*done/total):0};
  })() : subjectProgress(subject,null);
  card.appendChild(el('<div class="subject-card-top"><h3>'+meta.label+'</h3><div class="subject-score">'+prog.done+'/'+prog.total+' concepts mastered</div></div>'));
  card.appendChild(el('<div class="mini-progress"><div style="width:'+prog.pct+'%"></div>'+milestoneTicksHtml()+'</div>'));
  if(meta.subcats){
    var chips = el('<div class="subcats"></div>');
    meta.subcats.forEach(function(sc){
      var p = subjectProgress(subject, sc.key);
      var chip = el('<span class="subcat-chip'+(p.done===p.total&&p.total>0?" done":"")+'">'+sc.label+' '+p.done+'/'+p.total+'</span>');
      chips.appendChild(chip);
    });
    card.appendChild(chips);
  }
  if(subject === "math"){
    var fp = subjectProgress("mathformulas", null);
    var fchips = el('<div class="subcats"></div>');
    fchips.appendChild(el('<span class="subcat-chip'+(fp.done===fp.total&&fp.total>0?" done":"")+'">\ud83d\udcd0 Key Formulas '+fp.done+'/'+fp.total+'</span>'));
    card.appendChild(fchips);
  }
  var actions = el('<div class="subject-actions" style="margin-top:10px;"></div>');
  var reviewBtn = el('<button class="pill-btn">\ud83d\udcd6 Last-Minute Review</button>');
  reviewBtn.onclick = function(){ VIEW.screen="subjectHub"; VIEW.subject=subject; VIEW.mode="review"; render(); };
  var fixBtn = el('<button class="pill-btn primary">\ud83c\udfaf Fix My Mistakes</button>');
  fixBtn.onclick = function(){ VIEW.screen="subjectHub"; VIEW.subject=subject; VIEW.mode="fix"; render(); };
  actions.appendChild(reviewBtn); actions.appendChild(fixBtn);
  card.appendChild(actions);
  if(subject === "math"){
    var formulaBtn = el('<button class="pill-btn" style="width:100%;margin-top:8px;">\ud83d\udcd0 Key Formulas to Know</button>');

function choiceLabelsFor(item){ return letters(item.choices.length); }

function renderMissedReviewStep(cl){

  item.choices.forEach(function(ctext, idx){

    if(idx===item.correctIdx) cls2 += " chosen-correct";
    else if(item.chosenIdx!=null && idx===item.chosenIdx) cls2 += " chosen-incorrect";
    else if(item.chosenText!=null && ctext===item.chosenText) cls2 += " chosen-incorrect";

  });

  btn.onclick = function(){ VIEW.step="missed_retry"; VIEW.shuffled=null; render(); };
  wrap.appendChild(btn);
  return wrap;
}

function ensureShuffled(choicesArr){
  if(VIEW.shuffled) return VIEW.shuffled;
  var idxs = choicesArr.map(function(_,i){return i;});
  for(var i=idxs.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=idxs[i]; idxs[i]=idxs[j]; idxs[j]=t; }
  VIEW.shuffled = idxs;
  return idxs;
}

function renderMissedRetryStep(cl){
  var item = cl.missedFull[VIEW.missedIdx];
  var wrap = el('<div></div>');
  wrap.appendChild(el('<div class="step-label">Step 2 of 3 \u00b7 Your turn \u2014 same question, no peeking!</div>'));
  if(streakBadgeHtml()) wrap.appendChild(el(streakBadgeHtml()));
  if(VIEW.attemptWrong){
    wrap.appendChild(el('<div class="slow-down-banner">\ud83d\udc22 Not this time \u2014 take a breath, re-read the question and each choice slowly, then try again.</div>'));
  }
  var order = ensureShuffled(item.choices);
  var card = el('<div class="q-card"></div>');
  card.appendChild(el(passageHtml(item) || "<div></div>"));
  if(item.passageTitle && !item.passage) card.appendChild(el('<div class="q-passage-title">From: '+item.passageTitle+'</div>'));
  card.appendChild(el('<div class="q-text">'+esc(item.stem)+'</div>'));
  card.appendChild(el(diagramHtml(item)));
  var list = el('<div class="choice-list"></div>');
  var labs = letters(order.length);
  order.forEach(function(origIdx, pos){
    var btn = el('<button class="choice"><span class="choice-letter">'+labs[pos]+'</span><span>'+esc(item.choices[origIdx])+'</span></button>');
    btn.onclick = function(){ handleRetryAnswer(cl, item, origIdx, btn, list, order); };
    list.appendChild(btn);
  });
  card.appendChild(list);
  wrap.appendChild(card);
  return wrap;
}

function handleRetryAnswer(cl, item, chosenOrigIdx, btnEl, listEl, order){
  var correct = chosenOrigIdx === item.correctIdx;
  Array.from(listEl.children).forEach(function(b){ b.disabled = true; });
  recordAnswerResult(correct);
  if(correct){
    btnEl.classList.add("chosen-correct","pop");
    var gs = getClusterState(VIEW.subject, cl.id);
    gs.missedOK[item.qid] = true; saveState();
    playTone(true);
    var goNext = el('<button class="next-btn" style="margin-top:14px;">Continue \u2192</button>');
    goNext.onclick = function(){
      VIEW.attemptWrong = false;
      if(VIEW.missedIdx+1 < cl.missedFull.length){ VIEW.missedIdx++; VIEW.step="missed_review"; VIEW.shuffled=null; }
      else { VIEW.step="check"; VIEW.checkIdx=0; VIEW.shuffled=null; }
      render();
    };
    listEl.parentElement.appendChild(goNext);
  } else {
    btnEl.classList.add("chosen-incorrect","shake");
    playTone(false);
    VIEW.attemptWrong = true;
    var retryBtn = el('<button class="next-btn" style="margin-top:14px;">Try again</button>');
    retryBtn.onclick = function(){ render(); };
    listEl.parentElement.appendChild(retryBtn);
  }
}

function renderCheckStep(cl){
  var chk = cl.checks[VIEW.checkIdx];
  var hasMissed = cl.missedFull.length > 0;
  var wrap = el('<div></div>');
  var stepNum = hasMissed ? "Step 3 of 3" : "Step 2 of 2";
  wrap.appendChild(el('<div class="step-label">'+stepNum+' \u00b7 Quick check ('+(VIEW.checkIdx+1)+'/'+cl.checks.length+')</div>'));
  if(streakBadgeHtml()) wrap.appendChild(el(streakBadgeHtml()));
  if(VIEW.attemptWrong){
    wrap.appendChild(el('<div class="slow-down-banner">\ud83d\udd0d This is a NEW question testing the same idea \u2014 think about the rule from the lesson, not the exact wording.</div>'));
  }
  var order = ensureShuffled(chk.c);
  var card = el('<div class="q-card"></div>');
  card.appendChild(el('<div class="q-text">'+esc(chk.q)+'</div>'));
  var list = el('<div class="choice-list"></div>');
  var labs = letters(order.length);
  order.forEach(function(origIdx, pos){
    var btn = el('<button class="choice"><span class="choice-letter">'+labs[pos]+'</span><span>'+esc(chk.c[origIdx])+'</span></button>');
    btn.onclick = function(){ handleCheckAnswer(cl, chk, origIdx, btn, list); };
    list.appendChild(btn);
  });
  card.appendChild(list);
  wrap.appendChild(card);
  return wrap;
}

function handleCheckAnswer(cl, chk, chosenOrigIdx, btnEl, listEl){
  var correct = chosenOrigIdx === chk.a;
  Array.from(listEl.children).forEach(function(b){ b.disabled = true; });
  recordAnswerResult(correct);
  if(correct){
    btnEl.classList.add("chosen-correct","pop");
    playTone(true);
    listEl.parentElement.appendChild(el('<div class="explain-box correct">'+esc(chk.e)+'</div>'));
    var gs = getClusterState(VIEW.subject, cl.id);
    gs.checksOK[VIEW.checkIdx] = true;
    var goNext = el('<button class="next-btn">Continue \u2192</button>');
    goNext.onclick = function(){
      VIEW.attemptWrong = false;
      if(VIEW.checkIdx+1 < cl.checks.length){ VIEW.checkIdx++; VIEW.shuffled=null; render(); }
      else {
        gs.done = true; saveState(); VIEW.step="complete";
        var catLabel = VIEW.cat && SUBJECTS[VIEW.subject].subcats ? SUBJECTS[VIEW.subject].subcats.find(function(s){return s.key===VIEW.cat;}).label : null;
        checkMilestones(VIEW.subject, catLabel);
        render();
      }
    };
    listEl.parentElement.appendChild(goNext);
    saveState();
  } else {
    btnEl.classList.add("chosen-incorrect","shake");
    playTone(false);
    VIEW.attemptWrong = true;
    listEl.parentElement.appendChild(el('<div class="explain-box incorrect">'+esc(chk.e)+'</div>'));
    var retryBtn = el('<button class="next-btn">Try again</button>');
    retryBtn.onclick = function(){ render(); };
    listEl.parentElement.appendChild(retryBtn);
  }
}

/* ===================== Toast / audio ===================== */
function showToast(msg){
  var t = document.getElementById("toastEl");
  if(!t){ t=document.createElement("div"); t.id="toastEl"; t.className="toast"; document.body.appendChild(t); }
  t.textContent = msg; t.classList.add("show");
  clearTimeout(window.__toastTimer);
  window.__toastTimer = setTimeout(function(){ t.classList.remove("show"); }, 3600);
}
var audioCtx=null;
function playTone(correct){
  if(STATE.muted) return;
  try{
    audioCtx = audioCtx || new (window.AudioContext||window.webkitAudioContext)();
    if(correct){
      var notes = [523.25, 659.25, 784.0]; /* C5, E5, G5 - happy ascending chime */
      notes.forEach(function(freq, i){
        var t0 = audioCtx.currentTime + i*0.09;
        var o = audioCtx.createOscillator(), g = audioCtx.createGain();
        o.type = "sine"; o.frequency.value = freq;
        g.gain.setValueAtTime(0.0001, t0);
        g.gain.exponentialRampToValueAtTime(0.09, t0+0.02);
        g.gain.exponentialRampToValueAtTime(0.0001, t0+0.28);
        o.connect(g); g.connect(audioCtx.destination);
        o.start(t0); o.stop(t0+0.3);
      });
    } else {
      var o=audioCtx.createOscillator(), g=audioCtx.createGain();
      o.type="sine"; o.frequency.value = 220; g.gain.value=0.05;
      o.connect(g); g.connect(audioCtx.destination); o.start(); o.stop(audioCtx.currentTime+0.2);
    }
  }catch(e){}
}

  var url = URL.createObjectURL(blob);
  var a = document.createElement("a"); a.href=url; a.download="saarah-last-minute-review-progress.json";
  document.body.appendChild(a); a.click(); document.body.removeChild(a); URL.revokeObjectURL(url);
  showToast("Progress saved to a file.");
}
function triggerImport(){ document.getElementById("importFile").click(); }
function handleImportFile(ev){
  var file = ev.target.files[0]; if(!file) return;
  var reader = new FileReader();
  reader.onload = function(e){
    try{
      var parsed = JSON.parse(e.target.result);
      if(!parsed.clusterState) throw new Error("bad file");
      STATE = parsed; saveState(); showToast("Progress restored."); render();
    }catch(err){ showToast("That file doesn\u2019t look like a saved progress file."); }
  };
  reader.readAsText(file);
}

/* ===================== Storage warning ===================== */
function maybeStorageWarning(){
  var existing = document.getElementById("storageWarn");
  if(existing) existing.remove();
  if(STORAGE_OK) return;
  var w = el('<div id="storageWarn" class="storage-warning">\u26a0\ufe0f Progress isn\u2019t saving automatically right now (often happens in Private Browsing). Use \ud83d\udcbe Save Progress often today.</div>');
  root.insertBefore(w, root.firstChild.nextSibling);
}

/* ===================== Sky background (persistent, created once) ===================== */
function createSkyBackground(){
  if(document.getElementById("skyLayer")) return;
  var clouds = [
    {top:"6%", w:130, dur:75, delay:-10, op:0.8},
    {top:"16%", w:85, dur:58, delay:-32, op:0.65},
    {top:"3%", w:160, dur:95, delay:-55, op:0.75},
    {top:"26%", w:60, dur:48, delay:-6, op:0.55},
  ];
  var cloudSvg = '<svg viewBox="0 0 200 80"><ellipse cx="60" cy="50" rx="55" ry="26" fill="#fff"/><ellipse cx="110" cy="38" rx="45" ry="30" fill="#fff"/><ellipse cx="150" cy="52" rx="38" ry="22" fill="#fff"/></svg>';
  var layer = document.createElement("div");
  layer.id = "skyLayer"; layer.className = "sky-layer"; layer.setAttribute("aria-hidden","true");
  clouds.forEach(function(c){
    var d = document.createElement("div");
    d.className = "cloud cloud-drift";
    d.style.top = c.top; d.style.width = c.w+"px";
    d.style.animationDuration = c.dur+"s"; d.style.animationDelay = c.delay+"s"; d.style.opacity = c.op;
    d.innerHTML = cloudSvg;
    layer.appendChild(d);
  });
  var hills = document.createElement("div");
  hills.className = "sky-hills";
  hills.innerHTML = '<svg viewBox="0 0 400 100" preserveAspectRatio="none" width="100%" height="100%">'+
    '<path d="M0 60 Q100 20 200 55 T400 45 V100 H0 Z" opacity="0.10"/>'+
    '<path d="M0 75 Q120 45 250 75 T400 65 V100 H0 Z" opacity="0.16"/></svg>';
  layer.appendChild(hills);
  document.body.insertBefore(layer, document.body.firstChild);
}

/* ===================== Boot ===================== */
window.addEventListener("DOMContentLoaded", function(){
  root = document.getElementById("root");
  STORAGE_OK = storageTest();
  STATE = loadState();
  createSkyBackground();
  render();
  window.addEventListener("visibilitychange", function(){ if(document.visibilityState==="hidden") saveState(); });
  window.addEventListener("pagehide", function(){ saveState(); });
});

</script>
