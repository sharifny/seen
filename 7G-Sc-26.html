<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
<title>Mei's Science Journey — Preview Build</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --cream:#FFF8F0;
    --cream-2:#FDEEDD;
    --ink:#3B1740;
    --ink-soft:#7A5583;    /* darkened from #8A6690 for AA contrast on cream/white */
    --white:#FFFFFF;
    --magenta:#C0327E;
    --magenta-dark:#8F2260;
    --life:#1FAE7A;        /* Life & Cells Land */
    --life-dark:#138257;
    --coral:#F0455B;       /* Body & Ecosystems Land */
    --coral-dark:#C22F42;
    --gold:#FFB627;        /* Matter & Energy Land */
    --gold-dark:#E0961A;
    --indigo:#6C4FE0;      /* Earth & Space Land */
    --indigo-dark:#4F35B8;
    --teal:#16C4B4;
    --teal-dark:#0A7A6F;   /* darkened from #0E9C8F — old value was 3.4:1 on white, fails AA; this is 5.2:1 */
    --hijab:#A8285F;       /* Mei's signature hijab color — fixed across every outfit */
    --hijab-dark:#7A1D46;
    --hijab-fold:#C24B80;
    --eye:#8B4A2A;
    --skin:#F0C39D;
    --ok:#1FAE7A;
    --bad:#F0455B;
    --shadow-ink: rgba(59,23,64,0.18);
    --radius-lg:26px;
    --radius-md:18px;
    --radius-sm:12px;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;font-family:'Inter',sans-serif;font-size:16.5px;
    background:var(--cream);color:var(--ink);
    -webkit-tap-highlight-color:transparent;
  }
  h1,h2,h3{font-family:'Fredoka',sans-serif;}
  #app{max-width:720px;margin:0 auto;padding:14px 14px 90px;}
  .view{display:none;}
  .view.active{display:block;}

  /* ---------- PREVIEW BANNER ---------- */
  .preview-banner{
    background:linear-gradient(135deg,#EDE0FF,#F7E6F2);border:2px dashed var(--magenta);
    border-radius:var(--radius-md);padding:12px 16px;margin-bottom:14px;font-weight:700;
    font-size:.88rem;color:var(--magenta-dark);
  }
  .preview-banner b{font-family:'Fredoka';}

  /* ---------- TOP BAR ---------- */
  #topbar{
    display:flex;align-items:center;justify-content:space-between;
    background:var(--white);border-bottom:3px solid var(--cream-2);
    padding:10px 14px;position:sticky;top:0;z-index:50;
  }
  .brand{display:flex;align-items:center;gap:8px;cursor:pointer;}
  .brand #topbarMei{display:flex;align-items:center;}
  .brand #topbarMei svg{width:38px;height:57px;}
  #topbar .brand span{font-family:'Fredoka';font-weight:600;font-size:1.05rem;color:var(--ink);}
  .actions{display:flex;align-items:center;gap:8px;}
  .streak-chip{
    background:var(--cream-2);border-radius:20px;padding:6px 12px;font-weight:800;
    font-family:'Fredoka';font-size:.9rem;display:flex;align-items:center;gap:4px;color:var(--ink);
  }
  .icon-btn{
    background:var(--cream-2);border:none;border-radius:50%;width:36px;height:36px;
    font-size:1.1rem;cursor:pointer;display:flex;align-items:center;justify-content:center;
  }

  /* ---------- HOME / TRAIL ---------- */
  .hero-card{
    background:var(--white);border-radius:var(--radius-lg);padding:20px;margin:14px 0;
    box-shadow:0 8px 0 var(--shadow-ink);
  }
  .hero-card h1{margin:0 0 4px;font-size:1.4rem;color:var(--ink);}
  .hero-card p{margin:0;color:var(--ink-soft);font-weight:700;font-size:.95rem;}
  .land-card{
    background:var(--white);border-radius:var(--radius-md);padding:16px;margin-bottom:12px;
    display:flex;align-items:center;gap:14px;cursor:pointer;
    box-shadow:0 5px 0 var(--shadow-ink);
  }
  .land-card.empty{opacity:.72;}
  .land-emoji{
    width:52px;height:52px;border-radius:16px;display:flex;align-items:center;justify-content:center;
    font-size:1.6rem;flex-shrink:0;
  }
  .land-info{flex:1;min-width:0;}
  .land-info h3{margin:0 0 3px;font-size:1.05rem;color:var(--ink);}
  .land-info .sub{font-size:.82rem;color:var(--ink-soft);font-weight:700;}
  .progress-track{background:var(--cream-2);border-radius:8px;height:8px;margin-top:6px;overflow:hidden;}
  .progress-fill{height:100%;border-radius:8px;transition:width .3s ease;}
  .chev{font-size:1.3rem;color:var(--ink-soft);}

  /* ---------- WARDROBE QUEST (home page motivator) ---------- */
  .quest-card{
    background:linear-gradient(135deg,var(--magenta),var(--magenta-dark));color:white;
    border-radius:var(--radius-lg);padding:16px 18px;margin-bottom:20px;
    display:flex;align-items:center;gap:14px;cursor:pointer;box-shadow:0 8px 0 #6B1A48;
  }
  .quest-silhouette{position:relative;flex-shrink:0;}
  .quest-silhouette svg{width:64px;height:96px;}
  .quest-silhouette .lock-icon{
    position:absolute;bottom:2px;right:-2px;background:var(--gold);
    border-radius:50%;width:22px;height:22px;display:flex;align-items:center;justify-content:center;
    font-size:.9rem;box-shadow:0 2px 0 var(--gold-dark);
  }
  .quest-info{flex:1;min-width:0;}
  .quest-info .eyebrow{font-size:.72rem;font-weight:800;text-transform:uppercase;letter-spacing:.05em;opacity:.85;}
  .quest-info h3{margin:2px 0 8px;font-size:1.02rem;line-height:1.35;}
  .quest-track{background:rgba(255,255,255,.3);border-radius:8px;height:7px;overflow:hidden;}
  .quest-fill{height:100%;background:var(--gold);border-radius:8px;}
  .quest-sub{font-size:.8rem;font-weight:700;margin-top:6px;opacity:.9;}
  .quest-card.all-done{background:linear-gradient(135deg,var(--life),var(--life-dark));box-shadow:0 8px 0 #0C5E3E;}

  /* ---------- UNLOCK CELEBRATION MODAL ---------- */
  #unlockModal, #peekModal{
    position:fixed;inset:0;background:rgba(59,23,64,.55);display:none;
    align-items:center;justify-content:center;z-index:400;padding:20px;
  }
  #unlockModal.show, #peekModal.show{display:flex;}
  .unlock-card{
    background:var(--white);border-radius:28px;padding:28px 24px;text-align:center;
    max-width:340px;width:100%;
  }
  .unlock-card svg{width:150px;height:225px;}
  .unlock-card h2{font-size:1.3rem;margin:8px 0 4px;color:var(--ink);}
  .unlock-card p{font-weight:700;color:var(--ink-soft);margin:0 0 16px;font-size:.92rem;}

  /* ---------- PEEK AT LESSON DRAWER ---------- */
  .peek-sheet{
    background:var(--cream);width:100%;max-width:720px;max-height:82vh;
    border-radius:24px 24px 0 0;display:flex;flex-direction:column;overflow:hidden;
  }
  @media(min-width:760px){.peek-sheet{border-radius:24px;max-height:80vh;}}
  .peek-header{
    display:flex;align-items:center;justify-content:space-between;
    padding:14px 18px;font-family:'Fredoka';font-weight:600;color:var(--ink);
    border-bottom:3px solid var(--cream-2);flex-shrink:0;background:var(--white);
  }
  .peek-body{padding:16px 18px;overflow-y:auto;}

  /* ---------- LAND VIEW ---------- */
  .back-row{display:flex;align-items:center;gap:10px;margin:10px 0 16px;}
  .back-btn{
    background:var(--white);border:none;border-radius:12px;
    padding:8px 14px;font-weight:800;font-family:'Fredoka';
    cursor:pointer;box-shadow:0 3px 0 var(--shadow-ink);color:var(--ink);
  }
  .empty-land-card{
    background:var(--white);border-radius:var(--radius-lg);padding:26px 20px;text-align:center;
    box-shadow:0 6px 0 var(--shadow-ink);color:var(--ink-soft);font-weight:700;
  }
  .module-grid{display:flex;flex-direction:column;gap:10px;}
  .module-row{
    background:var(--white);border-radius:16px;padding:14px 16px;
    display:flex;align-items:center;gap:12px;cursor:pointer;
    box-shadow:0 4px 0 var(--shadow-ink);
  }
  .module-status{
    width:30px;height:30px;border-radius:50%;background:var(--cream-2);color:var(--ink-soft);
    display:flex;align-items:center;justify-content:center;font-weight:800;flex-shrink:0;font-size:.85rem;
  }
  .module-status.done{background:var(--life);color:white;}
  .m-title{flex:1;font-weight:700;color:var(--ink);}

  /* ---------- LESSON VIEW ---------- */
  .mei-speech-row{display:flex;gap:12px;align-items:flex-start;margin-bottom:14px;}
  .mei-avatar{flex-shrink:0;margin-top:6px;}
  .mei-avatar svg{width:64px;height:96px;}
  .scout-log{
    border-radius:18px;padding:14px 18px;box-shadow:0 5px 0 var(--shadow-ink);
    position:relative;flex:1;color:white;overflow:hidden;
  }
  .scout-log:after{
    content:'🐾';position:absolute;right:10px;bottom:6px;font-size:2.4rem;opacity:.16;
    transform:rotate(-12deg);
  }
  .scout-log .scout-log-label{
    font-family:'Inter';font-weight:800;font-size:.68rem;text-transform:uppercase;
    letter-spacing:.07em;opacity:.85;margin-bottom:5px;display:block;
  }
  .scout-log .scout-log-text{font-weight:700;font-size:1rem;line-height:1.5;position:relative;z-index:1;}
  .scout-log.land-life{background:linear-gradient(135deg,var(--life),var(--life-dark));}
  .scout-log.land-body{background:linear-gradient(135deg,var(--coral),var(--coral-dark));}
  .scout-log.land-matter{background:linear-gradient(135deg,var(--gold),var(--gold-dark));}
  .scout-log.land-earth{background:linear-gradient(135deg,var(--indigo),var(--indigo-dark));}
  .lesson-card{
    background:var(--white);border-radius:var(--radius-lg);padding:20px;
    box-shadow:0 8px 0 var(--shadow-ink);margin-bottom:16px;
  }
  .lesson-card h2{margin-top:0;font-size:1.28rem;}
  .lesson-card p{line-height:1.7;font-weight:600;color:#4a3550;font-size:1.02rem;}
  .fun-fact{
    background:linear-gradient(135deg,#FFF3D6,#FFE8B8);
    border-radius:14px;padding:12px 14px;font-weight:700;font-size:.94rem;
    margin:14px 0;border:2px dashed var(--gold);
  }
  .formula-card{
    background:linear-gradient(135deg,#E1F8F5,#D3F3EE);border:2px solid var(--teal);
    border-radius:16px;padding:18px 20px;margin:16px 0 8px;text-align:center;
  }
  .formula-card .formula-eq{
    font-family:'Fredoka';font-weight:700;font-size:1.3rem;color:var(--teal-dark);letter-spacing:.01em;
  }
  .formula-card .formula-unit{margin-top:6px;font-size:.85rem;font-weight:700;color:var(--ink-soft);}
  .example-card{
    background:var(--white);border:2px dashed #D9C7E0;border-radius:14px;
    padding:12px 16px;margin:0 0 16px;font-size:.94rem;font-weight:700;color:var(--ink);
  }
  .example-card .example-label{
    font-family:'Inter';font-weight:800;font-size:.7rem;text-transform:uppercase;
    letter-spacing:.06em;color:var(--magenta-dark);display:block;margin-bottom:5px;
  }
  .vocab{
    text-decoration:underline dotted var(--teal);text-decoration-thickness:2px;
    color:var(--teal-dark);font-weight:800;cursor:pointer;position:relative;
  }
  .popover{
    position:absolute;bottom:130%;left:0;background:var(--ink);color:white;
    padding:10px 12px;border-radius:12px;font-size:.85rem;font-weight:700;
    width:230px;z-index:30;box-shadow:0 6px 16px rgba(0,0,0,.25);display:none;
  }
  .popover.show{display:block;}
  .popover button{
    margin-top:6px;background:rgba(255,255,255,.18);border:none;color:white;
    border-radius:8px;padding:4px 8px;cursor:pointer;font-weight:800;font-size:.78rem;
  }
  .diagram-box{
    background:var(--cream-2);border-radius:18px;padding:14px;margin:14px 0;
    display:flex;flex-direction:column;justify-content:center;gap:0;width:100%;
  }
  .diagram-box > *{width:100%;}
  .diagram-box svg{max-width:100%;height:auto;}
  .caption-strip{
    background:var(--ink);color:white;padding:10px 14px;border-radius:0 0 12px 12px;
    display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:8px;
    font-weight:800;font-family:'Inter';font-size:.85rem;text-align:center;line-height:1.5;
  }
  .img-placeholder{
    background:var(--white);border:3px dashed #E4D2C0;border-radius:16px 16px 0 0;
    padding:24px 16px;text-align:center;color:var(--ink-soft);
    background-size:cover;background-position:center;min-height:110px;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
  }
  .img-placeholder.has-photo{border-style:solid;border-color:transparent;min-height:160px;}
  .img-placeholder.has-photo .ph-icon,.img-placeholder.has-photo .ph-text{display:none;}
  .img-placeholder .ph-icon{font-size:2rem;margin-bottom:6px;}
  .img-placeholder .ph-text{font-weight:800;font-family:'Fredoka';font-size:.85rem;line-height:1.5;}
  .btn{
    font-family:'Fredoka';font-weight:600;border:none;border-radius:14px;
    padding:12px 20px;cursor:pointer;font-size:1rem;color:white;
    box-shadow:0 4px 0 rgba(0,0,0,.18);transition:transform .12s ease;
  }
  .btn:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,.18);}
  .btn.primary{background:linear-gradient(135deg,var(--magenta),var(--magenta-dark));}
  .btn.ghost{background:var(--cream-2);color:var(--ink);box-shadow:0 4px 0 #E4D2C0;}
  .btn.teal{background:linear-gradient(135deg,var(--teal),var(--teal-dark));}
  .btn[disabled]{opacity:.5;cursor:default;}
  .btn-row{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px;}

  /* ---------- HINT LADDER ---------- */
  .hint-box{
    background:#FFF;border:2px solid var(--cream-2);border-radius:16px;
    padding:12px 14px;margin-top:12px;
  }
  .hint-reveal{
    margin-top:8px;padding:10px 12px;background:var(--cream-2);border-radius:10px;
    font-weight:700;font-size:.92rem;display:none;
  }
  .hint-reveal.show{display:block;animation:fadeIn .3s ease;}
  @keyframes fadeIn{from{opacity:0;}to{opacity:1;}}

  /* ---------- QUIZ VIEW ---------- */
  .quiz-progress{display:flex;gap:6px;margin-bottom:16px;}
  .quiz-progress .dot{flex:1;height:8px;border-radius:6px;background:var(--cream-2);}
  .quiz-progress .dot.active{background:var(--teal);}
  .quiz-progress .dot.correct{background:var(--life);}
  .quiz-progress .dot.wrong{background:var(--coral);}
  .q-card{background:var(--white);border-radius:var(--radius-lg);padding:20px;box-shadow:0 8px 0 var(--shadow-ink);}
  .q-card .qtype{font-size:.75rem;font-weight:800;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.05em;}
  .q-card h3{margin:6px 0 16px;font-size:1.14rem;line-height:1.45;}
  .choice{
    display:block;width:100%;text-align:left;background:var(--cream-2);
    border:3px solid transparent;border-radius:14px;padding:12px 14px;margin-bottom:10px;
    font-weight:700;font-family:'Inter';font-size:.98rem;cursor:pointer;color:var(--ink);
  }
  .choice:hover{border-color:#E4D2C0;}
  .choice.selected-correct{background:#DDF3E9;border-color:var(--life);}
  .choice.selected-wrong{background:#FBE1E5;border-color:var(--coral);}
  .choice.reveal-correct{background:#DDF3E9;border-color:var(--life);}
  .choice[disabled]{cursor:default;}
  .feedback{
    margin-top:14px;padding:14px;border-radius:14px;font-weight:700;
    display:flex;gap:10px;align-items:flex-start;
  }
  .feedback.good{background:#DDF3E9;color:var(--life-dark);}
  .feedback.think{background:#FDF0DD;color:var(--gold-dark);}
  .feedback svg{width:34px;height:51px;flex-shrink:0;}

  /* match question */
  .match-wrap{display:flex;gap:14px;}
  .match-col{flex:1;display:flex;flex-direction:column;gap:8px;}
  .match-item{
    background:var(--cream-2);border-radius:12px;padding:10px 12px;font-weight:700;
    cursor:pointer;border:3px solid transparent;font-size:.88rem;text-align:center;
  }
  .match-item.sel{border-color:var(--teal);background:#E1F8F5;}
  .match-item.paired-correct{cursor:default;}
  .match-item.paired-wrong{background:#FBE1E5;border-color:var(--coral);}
  /* each matched PAIR gets its own color so you can see which left/right go together,
     instead of every pair turning the same green */
  .match-item.pair-0{background:#E1F8F5;border-color:var(--teal);color:var(--teal-dark);}
  .match-item.pair-1{background:#FFF3D6;border-color:var(--gold-dark);color:#8A5A0A;}
  .match-item.pair-2{background:#FBE1E5;border-color:var(--coral);color:var(--coral-dark);}
  .match-item.pair-3{background:#EAE3FB;border-color:var(--indigo);color:var(--indigo-dark);}
  .match-item.pair-4{background:#FDE6F3;border-color:var(--magenta);color:var(--magenta-dark);}

  /* true/false */
  .tf-row{display:flex;gap:12px;}
  .tf-row .choice{flex:1;text-align:center;}

  /* calc question */
  .calc-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:4px;}
  .calc-input{
    font-family:'Inter';font-weight:800;font-size:1.1rem;padding:11px 14px;
    border-radius:12px;border:3px solid var(--cream-2);width:150px;color:var(--ink);
  }
  .calc-input:focus{outline:none;border-color:var(--teal);}
  .calc-input.calc-wrong{border-color:var(--coral);}
  .calc-unit{font-weight:800;color:var(--ink-soft);}

  /* ---------- WARDROBE ---------- */
  .wardrobe-stage{
    background:var(--white);border-radius:var(--radius-lg);padding:24px;text-align:center;
    box-shadow:0 8px 0 var(--shadow-ink);margin-bottom:18px;
  }
  .wardrobe-stage svg{width:200px;height:300px;}
  .outfit-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;}
  .outfit-card{
    background:var(--white);border-radius:16px;padding:14px 8px;text-align:center;
    cursor:pointer;border:3px solid transparent;box-shadow:0 4px 0 var(--shadow-ink);
    font-weight:800;font-family:'Inter';font-size:.85rem;color:var(--ink);
  }
  .outfit-card.active{border-color:var(--teal);background:#E1F8F5;}
  .outfit-card.locked{opacity:.55;cursor:pointer;position:relative;}
  .outfit-card.locked .swatch{filter:grayscale(1);}
  .outfit-card .lock-tag{
    display:block;font-size:.65rem;font-weight:800;color:var(--ink-soft);
    margin-top:3px;text-transform:none;
  }
  .outfit-card .swatch{font-size:1.7rem;margin-bottom:4px;}

  /* ---------- BOTTOM NAV ---------- */
  #bottomnav{
    position:fixed;bottom:0;left:0;right:0;
    background:var(--white);border-top:3px solid var(--cream-2);
    display:flex;justify-content:center;padding:8px 0;z-index:60;
  }
  #bottomnav .inner{max-width:720px;width:100%;display:flex;justify-content:space-around;}
  .nav-btn{
    background:none;border:none;display:flex;flex-direction:column;align-items:center;gap:2px;
    color:var(--ink-soft);font-weight:800;font-family:'Inter';font-size:.72rem;cursor:pointer;
    padding:4px 10px;border-radius:10px;
  }
  .nav-btn.active{color:var(--magenta);background:#F7E6F2;}
  .nav-btn .ic{font-size:1.3rem;}

  /* Mei mascot idle + hijab drape animation */
  .mei-idle{transform-origin:50% 90%;animation:meiBreathe 2.8s ease-in-out infinite;}
  @keyframes meiBreathe{
    0%,100%{transform:translateY(0) scale(1);}
    50%{transform:translateY(-3px) scale(1.015);}
  }
  .mei-drape-sway{transform-origin:50% 0%;animation:drapeSway 3.6s ease-in-out infinite;}
  @keyframes drapeSway{
    0%,100%{transform:rotate(0deg);}
    45%{transform:rotate(-2deg);}
    55%{transform:rotate(1.5deg);}
  }
  @media (prefers-reduced-motion: reduce){
    .mei-idle, .mei-drape-sway{animation:none;}
  }

  /* confetti canvas */
  #confetti-canvas{position:fixed;inset:0;pointer-events:none;z-index:200;}

  /* toast */
  #toast{
    position:fixed;left:50%;top:16px;transform:translate(-50%,-140%);
    background:var(--ink);color:white;padding:10px 18px;border-radius:14px;
    font-weight:700;font-family:'Fredoka';z-index:300;transition:transform .3s ease;
    box-shadow:0 6px 20px rgba(0,0,0,.25);
  }
  #toast.show{transform:translate(-50%,0);}

  /* signs-in-creation callout */
  .signs-box{
    background:linear-gradient(135deg,#EAF7F2,#DCF1E5);
    border:2px dashed var(--life);border-radius:14px;padding:12px 14px;margin:14px 0;
  }
  .signs-box .label{font-family:'Inter';font-weight:800;color:var(--life-dark);font-size:.8rem;text-transform:uppercase;letter-spacing:.03em;}
  .quran-embed-wrap{margin:10px 0;border-radius:14px;overflow:hidden;background:white;min-height:150px;}
  .quran-embed-wrap iframe{display:block;min-height:150px;border:none;width:100%;}

  ::selection{background:var(--eye);color:white;}
</style>
</head>
<body>
<canvas id="confetti-canvas"></canvas>
<div id="toast"></div>
<div id="unlockModal">
  <div class="unlock-card" id="unlockCardInner"></div>
</div>
<div id="peekModal">

/* =====================================================
   SOUND (Web Audio API — synthesized, no files)
===================================================== */
let actx = null;
function ac(){ if(!actx) actx = new (window.AudioContext||window.webkitAudioContext)(); return actx; }
function tone(freq, start, dur, type='sine', gain=0.18){
  if(state.muted) return;
  const c = ac();
  const t0 = c.currentTime + start;
  const osc = c.createOscillator();
  const g = c.createGain();
  osc.type = type; osc.frequency.setValueAtTime(freq, t0);
  g.gain.setValueAtTime(0.0001, t0);
  g.gain.exponentialRampToValueAtTime(gain, t0+0.02);
  g.gain.exponentialRampToValueAtTime(0.0001, t0+dur);
  osc.connect(g); g.connect(c.destination);
  osc.start(t0); osc.stop(t0+dur+0.02);
}

function sndCorrect(){ tone(523,0,0.14,'triangle'); tone(659,0.1,0.16,'triangle'); tone(784,0.2,0.22,'triangle'); }

/* =====================================================
   CONFETTI
===================================================== */
function launchConfetti(){
  const canvas = document.getElementById('confetti-canvas');
  canvas.width = window.innerWidth; canvas.height = window.innerHeight;
  const ctx = canvas.getContext && canvas.getContext('2d');
  if(!ctx) return;
  const colors = ['#C0327E','#1FAE7A','#FFB627','#F0455B','#16C4B4'];
  let particles = Array.from({length:70}, ()=>({
    x: Math.random()*canvas.width, y:-20-Math.random()*200,
    vy: 2+Math.random()*3, vx: -1.5+Math.random()*3,
    size: 5+Math.random()*6, color: colors[Math.floor(Math.random()*colors.length)],
    rot: Math.random()*360, vr: -6+Math.random()*12
  }));
  if(window.matchMedia('(prefers-reduced-motion: reduce)').matches){ return; }
  let frame = 0;
  function step(){
    ctx.clearRect(0,0,canvas.width,canvas.height);
    particles.forEach(p=>{
      p.x+=p.vx; p.y+=p.vy; p.rot+=p.vr;
      ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(p.rot*Math.PI/180);
      ctx.fillStyle=p.color; ctx.fillRect(-p.size/2,-p.size/2,p.size,p.size*0.6);
      ctx.restore();
    });
    frame++;
    if(frame<110) requestAnimationFrame(step);
    else ctx.clearRect(0,0,canvas.width,canvas.height);
  }
  step();
}

    lessonHTML:`
      <h2>Describing Motion With Real Numbers</h2>
      <p><span class="vocab" data-term="speed">Speed</span> tells you how fast something is moving — the distance it covers over a certain time:</p>
      <div class="formula-card">
        <div class="formula-eq">speed = distance ÷ time</div>
        <div class="formula-unit">usually measured in meters per second (m/s)</div>
      </div>
      <div class="example-card"><span class="example-label">🧮 Worked example</span>A cyclist travels 150 meters in 30 seconds.<br>150 ÷ 30 = <strong>5 m/s</strong>.</div>
      <p><span class="vocab" data-term="velocity">Velocity</span> is speed with a direction attached. Two runners moving at exactly 4 m/s — one heading north, one heading south — have the same speed but different velocities, because velocity is a <span class="vocab" data-term="vector">vector</span> (it includes direction), while speed is a <span class="vocab" data-term="scalar">scalar</span> (just a number, no direction).</p>
      <p><span class="vocab" data-term="acceleration">Acceleration</span> measures how quickly velocity changes — speeding up, slowing down, or changing direction:</p>
      <div class="formula-card">
        <div class="formula-eq">acceleration = (final velocity − initial velocity) ÷ time</div>
        <div class="formula-unit">measured in meters per second squared (m/s²)</div>

      <p>Important: acceleration isn't only "speeding up." A car braking to a stop is also accelerating — scientists call slowing down <span class="vocab" data-term="deceleration">negative acceleration (deceleration)</span> — because velocity is still changing, just in the opposite direction of motion.</p>

    lessonHTML:`
      <h2>The Building Blocks of Life — Compared</h2>
      <p>Every living thing is made of <span class="vocab" data-term="cell">cells</span>, and every cell has working parts called <span class="vocab" data-term="organelle">organelles</span>. The <span class="vocab" data-term="nucleus">nucleus</span> holds the cell's DNA instructions, the <span class="vocab" data-term="mitochondria2">mitochondria</span> release usable energy, and the <span class="vocab" data-term="cellmembrane">cell membrane</span> controls what enters and leaves — animal and plant cells share all three.</p>
      <p>But plant cells have extra structures animal cells don't: a rigid <span class="vocab" data-term="cellwall">cell wall</span> outside the membrane for support and shape, a large <span class="vocab" data-term="vacuole">central vacuole</span> that stores water and keeps the cell firm, and <span class="vocab" data-term="chloroplast">chloroplasts</span>, which carry out photosynthesis. Animal cells are usually more irregular/rounded in shape since they have no rigid wall holding a fixed shape.</p>

      <div class="fun-fact">🌟 Fun fact: The cell wall is why a wilted plant can "perk back up" after watering — the vacuole refills with water and pushes against the rigid wall again, restoring the plant's firmness.</div>

      <h2>Turning Sunlight Into Food</h2>
      <p>Plants make their own food through <span class="vocab" data-term="photosynthesis2">photosynthesis</span>, which happens inside <span class="vocab" data-term="chloroplast2">chloroplasts</span> in the leaf. The green pigment <span class="vocab" data-term="chlorophyll2">chlorophyll</span> captures light energy and uses it to combine <span class="vocab" data-term="water2">water</span> (pulled up through the roots) with <span class="vocab" data-term="co2">carbon dioxide</span> (pulled in through tiny leaf pores called stomata) to build <span class="vocab" data-term="glucose2">glucose</span> — releasing <span class="vocab" data-term="oxygen2">oxygen</span> as a byproduct.</p>

      <p>Chlorophyll actually absorbs red and blue light for energy and reflects green light back to our eyes — that reflected green is why leaves look green, not because green light is useful to the plant.</p>

    lessonHTML:`
      <h2>Predicting Traits With Punnett Squares</h2>
      <p>Every trait is controlled by <span class="vocab" data-term="gene">genes</span>, and most genes come in different versions called <span class="vocab" data-term="allele">alleles</span> — one inherited from each parent. A <span class="vocab" data-term="dominant">dominant</span> allele (written with a capital letter, like "B") shows up in an organism's traits even if only one copy is present. A <span class="vocab" data-term="recessive">recessive</span> allele (lowercase, "b") only shows up if BOTH copies are recessive.</p>
      <p>A <span class="vocab" data-term="punnett">Punnett square</span> is a grid tool that predicts the possible allele combinations of offspring. If both parents are "Bb" (one dominant, one recessive allele each — called <span class="vocab" data-term="heterozygous">heterozygous</span>), the square shows four equally likely combinations: BB, Bb, Bb, bb.</p>
      <div class="diagram-box">
        <svg viewBox="0 0 260 190" xmlns="http://www.w3.org/2000/svg" style="background:white;border-radius:16px 16px 0 0;padding:10px;">
          <rect x="70" y="10" width="90" height="30" fill="none"/>
          <text x="90" y="30" font-size="16" font-weight="800" fill="#3B1740" text-anchor="middle">B</text>
          <text x="140" y="30" font-size="16" font-weight="800" fill="#3B1740" text-anchor="middle">b</text>
          <text x="30" y="70" font-size="16" font-weight="800" fill="#3B1740" text-anchor="middle">B</text>
          <text x="30" y="130" font-size="16" font-weight="800" fill="#3B1740" text-anchor="middle">b</text>
          <rect x="60" y="45" width="80" height="50" fill="#DDF3E9" stroke="#3B1740" stroke-width="1.5"/>
          <rect x="140" y="45" width="80" height="50" fill="#FFF3D6" stroke="#3B1740" stroke-width="1.5"/>
          <rect x="60" y="95" width="80" height="50" fill="#FFF3D6" stroke="#3B1740" stroke-width="1.5"/>
          <rect x="140" y="95" width="80" height="50" fill="#FBE1E5" stroke="#3B1740" stroke-width="1.5"/>
          <text x="100" y="75" font-size="18" font-weight="800" text-anchor="middle" fill="#138257">BB</text>
          <text x="180" y="75" font-size="18" font-weight="800" text-anchor="middle" fill="#8A5A0A">Bb</text>
          <text x="100" y="125" font-size="18" font-weight="800" text-anchor="middle" fill="#8A5A0A">Bb</text>
          <text x="180" y="125" font-size="18" font-weight="800" text-anchor="middle" fill="#C22F42">bb</text>
        </svg>
        <div class="caption-strip">🧩 Bb × Bb → 1 BB : 2 Bb : 1 bb — a 3-out-of-4 (75%) chance of showing the dominant trait.</div>

      <div class="fun-fact">🌟 Fun fact: this exact cross is why two brown-eyed (Bb) parents can have a blue-eyed (bb) child — but two blue-eyed (bb × bb) parents essentially can't have a brown-eyed child, since neither parent has a dominant allele to pass down.</div>

    lessonHTML:`
      <h2>The Molecule That Carries All the Instructions</h2>
      <p><span class="vocab" data-term="dnaterm">DNA</span> (deoxyribonucleic acid) is a molecule shaped like a twisted ladder — a <span class="vocab" data-term="doublehelix">double helix</span>. The rungs of the ladder are made of paired chemical letters called <span class="vocab" data-term="base">bases</span>: A always pairs with T, and C always pairs with G. The order of these bases spells out the instructions for building and running an organism.</p>
      <p>A specific stretch of DNA that codes for one trait is a <span class="vocab" data-term="gene2">gene</span>. DNA is tightly coiled and packaged into structures called <span class="vocab" data-term="chromosome">chromosomes</span>, which sit inside the nucleus of every cell. Humans have 46 chromosomes (23 pairs) — one chromosome of each pair from each parent.</p>
      <div class="diagram-box">
        <svg viewBox="0 0 220 200" xmlns="http://www.w3.org/2000/svg" style="background:white;border-radius:16px 16px 0 0;padding:10px;">

          <line x1="60" y1="90" x2="160" y2="90" stroke="#F0455B" stroke-width="4"/>
          <line x1="50" y1="125" x2="170" y2="125" stroke="#FFB627" stroke-width="4"/>
          <line x1="66" y1="160" x2="154" y2="160" stroke="#F0455B" stroke-width="4"/>
        </svg>
        <div class="caption-strip">🧬 A = red rungs (paired with T), C/G = gold rungs — the twisted-ladder double helix</div>
      </div>
      <div class="fun-fact">🌟 Fun fact: if you stretched out all the DNA in just one of your cells, it would measure about 6 feet long — yet it's coiled up tightly enough to fit inside a nucleus far too small to see without a microscope.</div>

    lessonHTML:`
      <h2>Two Very Different Ways to Reproduce</h2>
      <p>In <span class="vocab" data-term="asexual">asexual reproduction</span>, a single organism produces offspring on its own — no second parent needed. The offspring is genetically identical (a clone) to the parent. Bacteria dividing in two, a hydra budding a new individual off its side, and a strawberry plant sending out runners are all asexual reproduction.</p>
      <p>In <span class="vocab" data-term="sexualrepro">sexual reproduction</span>, genetic material from TWO parents combines to make offspring. This is why siblings look similar but not identical — each one got a different mix of genes from the same two parents. This mixing is the main source of the genetic variation within a population.</p>
      <div class="diagram-box">
        <div class="img-placeholder" data-img="images/3.jpg"><div class="ph-icon">🖼️</div><div class="ph-text">Photo: a budding hydra (asexual) beside flowering plants being pollinated (sexual)<br>(coming soon)</div></div>
        <div class="caption-strip">🧫 Asexual: 1 parent, identical clone offspring &nbsp;|&nbsp; 🌸 Sexual: 2 parents, genetically varied offspring</div>
      </div>
      <div class="fun-fact">🌟 Fun fact: genetic variation from sexual reproduction is a big reason species can adapt to a changing environment over generations — a population that's all identical clones can be wiped out by a single disease that every member is equally vulnerable to.</div>

    lessonHTML:`
      <h2>How Populations Change Over Time</h2>
      <p><span class="vocab" data-term="naturalselection">Natural selection</span> is the process by which individuals with traits better suited to their environment survive and reproduce at higher rates than individuals without those traits — passing those helpful traits on to more offspring. Over many generations, this shifts the traits common in the whole population — a change called <span class="vocab" data-term="evolution">evolution</span>.</p>
      <p>An inherited trait that improves survival or reproduction in a specific environment is called an <span class="vocab" data-term="adaptation">adaptation</span>. Note: individual organisms don't "choose" to adapt during their lifetime — natural selection works across generations, acting on traits that already exist due to natural genetic variation.</p>
      <div class="diagram-box">
        <div class="img-placeholder" data-img="images/4.jpg"><div class="ph-icon">🖼️</div><div class="ph-text">Photo: peppered moths on tree bark showing camouflage variation<br>(coming soon)</div></div>
        <div class="caption-strip">🦋 Classic example: light and dark peppered moths, and how bark color affected which survived predators</div>
      </div>
      <div class="fun-fact">🌟 Fun fact: Darwin's finches on the Galápagos Islands developed differently shaped beaks suited to different food sources on different islands — one of the most famous real-world examples of natural selection in action.</div>
    `,

    lessonHTML:`
      <h2>Organizing All of Life</h2>
      <p><span class="vocab" data-term="taxonomy">Taxonomy</span> is the science of classifying living things into nested groups, from broadest to most specific: <span class="vocab" data-term="kingdom">Kingdom</span> → Phylum → Class → Order → Family → Genus → <span class="vocab" data-term="species">Species</span>. Each level down is more specific — species is the narrowest group, containing organisms that can interbreed and produce fertile offspring.</p>
      <p>Every species gets a two-part scientific name (its Genus and species, e.g., <em>Homo sapiens</em>) called <span class="vocab" data-term="binomial">binomial nomenclature</span> — this gives every organism on Earth one universal name, avoiding the confusion of different common names in different languages/regions.</p>
      <div class="diagram-box">
        <svg viewBox="0 0 260 190" xmlns="http://www.w3.org/2000/svg" style="background:white;border-radius:16px 16px 0 0;padding:10px;">

          <rect x="80" y="78" width="100" height="24" rx="6" fill="#5FC79A"/><text x="130" y="94" font-size="11" fill="#3B1740" text-anchor="middle" font-weight="800">Class</text>
          <rect x="70" y="112" width="120" height="24" rx="6" fill="#8FD8B0"/><text x="130" y="128" font-size="11" fill="#3B1740" text-anchor="middle" font-weight="800">Order → Family</text>
          <rect x="55" y="146" width="150" height="24" rx="6" fill="#C24B80"/><text x="130" y="162" font-size="11" fill="white" text-anchor="middle" font-weight="800">Genus + species (e.g., Homo sapiens)</text>
        </svg>
        <div class="caption-strip">🌳 Broadest (Kingdom) at top, narrowest (species) at bottom — each level nests inside the one above it</div>
      </div>
      <div class="fun-fact">🌟 Fun fact: humans belong to Kingdom Animalia, Phylum Chordata, Class Mammalia, Order Primates, and species Homo sapiens — the same classification system used for every living thing ever described.</div>

    lessonHTML:`
      <h2>Shaping Traits On Purpose</h2>
      <p>For thousands of years, humans have used <span class="vocab" data-term="selectivebreeding">selective breeding</span> — choosing organisms with desirable traits (biggest fruit, friendliest temperament, most milk) to reproduce, generation after generation, to gradually shift a population's traits. Nearly every crop and farm animal today looks very different from its wild ancestor because of this.</p>
      <p>Modern <span class="vocab" data-term="geneticengineering">genetic engineering</span> works faster and more directly: scientists can copy a specific gene from one organism and insert it directly into another organism's DNA. An organism containing a gene from a different species this way is called a <span class="vocab" data-term="gmo">genetically modified organism (GMO)</span> — for example, a crop engineered to resist a specific pest or survive drought.</p>

    lessonHTML:`
      <h2>Three Systems, One Job: Feeding Your Cells</h2>
      <p>The <span class="vocab" data-term="digestivesys">digestive system</span> breaks food down into small <span class="vocab" data-term="nutrient">nutrients</span> — including glucose — that can pass into the blood. The <span class="vocab" data-term="respiratorysys">respiratory system</span> brings in oxygen through the lungs and passes it into the blood. The <span class="vocab" data-term="circulatorysys">circulatory system</span> — heart, blood, and blood vessels — pumps that oxygen and those nutrients to every cell in the body.</p>
      <p>Remember cellular respiration? Cells combine glucose (from digestion) with oxygen (from the lungs) to release energy, producing carbon dioxide as waste — which blood then carries back to the lungs to be exhaled. All three systems exist to support that one cellular process.</p>

        <div class="img-placeholder" data-img="images/6.jpg"><div class="ph-icon">🖼️</div><div class="ph-text">Diagram: heart, lungs, and digestive tract with arrows showing nutrient/oxygen delivery to cells<br>(coming soon)</div></div>

      </div>
      <div class="fun-fact">🌟 Fun fact: your heart beats roughly 100,000 times a day without you ever consciously thinking about it, moving about 2,000 gallons of blood through nearly 60,000 miles of blood vessels.</div>

    lessonHTML:`
      <h2>Keeping Your Internal Conditions Stable</h2>
      <p><span class="vocab" data-term="homeostasis">Homeostasis</span> is the body's process of keeping internal conditions — temperature, water balance, blood sugar, and more — stable despite changes in the outside environment. This mostly happens through <span class="vocab" data-term="negfeedback">negative feedback loops</span>: a change is detected, and the body responds in the OPPOSITE direction to bring things back to normal.</p>
      <p>Example: if your body temperature rises above the normal 98.6°F (37°C), you sweat — evaporating sweat cools the skin, bringing temperature back down. If temperature drops, you shiver — rapid muscle contractions generate heat, warming you back up. Both responses push the <span class="vocab" data-term="stimulus">stimulus</span> back toward the stable set point, which is what makes them "negative" (opposing) feedback.</p>
      <div class="fun-fact">🌟 Fun fact: a fever is actually the body deliberately RAISING its internal set point higher (usually to fight off pathogens more effectively) — it's the body's thermostat being reset on purpose, not a malfunction.</div>
    `,

      homeostasis:{def:'The body\'s process of keeping internal conditions stable despite outside changes.'},

    },

    lessonHTML:`
      <h2>Puberty: A Normal, Hormone-Driven Stage of Growth</h2>
      <p><span class="vocab" data-term="puberty">Puberty</span> is the stage of development when the body matures from childhood toward physical adulthood. It's triggered by the brain's pituitary gland releasing signaling chemicals called <span class="vocab" data-term="hormone">hormones</span>, which travel through the blood and trigger the reproductive organs to increase production of their own hormones — <span class="vocab" data-term="estrogen">estrogen</span> in females and <span class="vocab" data-term="testosterone">testosterone</span> in males (both hormones are present in both sexes, just in very different amounts).</p>
      <p>These hormones drive a general growth spurt and the development of <span class="vocab" data-term="secondarysex">secondary sex characteristics</span> — physical changes beyond the reproductive organs themselves, such as changes in body shape, voice, and body hair. The exact timing and pace of these changes varies a great deal from person to person — there is no single "normal" schedule, only a wide normal range.</p>

      <p>This connects back to what you learned in the Reproduction training: the reproductive system is what makes sexual reproduction — and the fertilization and early development discussed there — biologically possible.</p>
      <div class="fun-fact">🌟 Fun fact: the pituitary gland, the structure that kicks off this whole process, is only about the size of a pea — yet it directs hormone changes throughout the entire body.</div>

        <p style="margin:6px 0 0;">This ayah reflects on the human form itself — worth sitting with during the very stage of life when that form is changing the most.</p>

    lessonHTML:`
      <h2>Following Energy Through an Ecosystem</h2>
      <p><span class="vocab" data-term="producer">Producers</span> (plants, algae) capture energy from the sun via photosynthesis. <span class="vocab" data-term="consumer">Consumers</span> eat other organisms to get energy, and <span class="vocab" data-term="decomposer">decomposers</span> break down dead material, recycling nutrients back into the ecosystem. A <span class="vocab" data-term="foodweb">food web</span> shows the many overlapping feeding connections in a real ecosystem — more realistic than a single straight-line food chain.</p>
      <p>Energy is lost as heat at every step — typically only about 10% of the energy at one <span class="vocab" data-term="trophiclevel">trophic level</span> transfers to the next level up. This is why an <span class="vocab" data-term="energypyramid">energy pyramid</span> gets dramatically smaller toward the top, and why ecosystems can support far more producers than top predators.</p>
      <div class="diagram-box">
        <svg viewBox="0 0 240 190" xmlns="http://www.w3.org/2000/svg" style="background:white;border-radius:16px 16px 0 0;padding:10px;">
          <polygon points="120,20 150,60 90,60" fill="#F0455B"/><text x="120" y="45" font-size="10" fill="white" text-anchor="middle" font-weight="800">10 kcal</text>
          <polygon points="120,55 170,105 70,105" fill="#FFB627"/><text x="120" y="90" font-size="11" fill="#3B1740" text-anchor="middle" font-weight="800">100 kcal</text>
          <polygon points="120,100 195,150 45,150" fill="#1FAE7A"/><text x="120" y="135" font-size="11" fill="white" text-anchor="middle" font-weight="800">1,000 kcal</text>

        </svg>
        <div class="caption-strip">🔺 Energy pyramid: only ~10% transfers up each level — that's why top predators are always rare compared to producers</div>
      </div>
      <div class="fun-fact">🌟 Fun fact: this 10% rule is exactly why the ocean can support enormous numbers of tiny plankton but only a relatively small number of large sharks at the very top of the food web.</div>
      <div class="signs-box"><span class="label">✨ Signs in creation</span>
        <div class="quran-embed-wrap"><iframe src="https://quran.com/embed/v1?verses=6%3A38&translations=131&reciter=7&wbw=true&showTranslationName=true&tafsir=false&reflections=false&lessons=false&answers=false" width="100%" data-quran-embed="true" allow="clipboard-write" frameborder="0"></iframe></div>
        <p style="margin:6px 0 0;">This ayah describes every creature as part of "communities like you" — a fitting description of how tightly every organism in a food web depends on the others around it.</p>

      <h2>Where Life Lives, and How Much of It Fits</h2>
      <p>A <span class="vocab" data-term="biome">biome</span> is a large region defined by its climate and the plant/animal communities adapted to it — deserts, rainforests, tundra, grasslands, and oceans are all distinct biomes, each shaped by temperature and rainfall patterns.</p>
      <p>Every environment has a <span class="vocab" data-term="carryingcapacity">carrying capacity</span> — the maximum population size it can sustainably support, limited by <span class="vocab" data-term="limitingfactor">limiting factors</span> like food, water, space, and predators. A population that grows past carrying capacity typically declines afterward, since resources can't support everyone.</p>

    hunch:"Mei's hunch: \"A clownfish lives inside a sea anemone's stinging tentacles and doesn't get hurt — while most other fish get stung badly. What kind of relationship do you think that is?\"",
    lessonHTML:`
      <h2>How Species Interact With Each Other</h2>
      <p><span class="vocab" data-term="symbiosis">Symbiosis</span> is any close, long-term relationship between two different species. There are three main types: <span class="vocab" data-term="mutualism">mutualism</span> (both species benefit — like a bee getting nectar while pollinating a flower), <span class="vocab" data-term="commensalism">commensalism</span> (one benefits, the other is unaffected — like a bird nesting in a tree without harming it), and <span class="vocab" data-term="parasitism">parasitism</span> (one benefits at the other's expense — like a tick feeding on a deer).</p>
      <p><span class="vocab" data-term="predatorprey">Predator-prey relationships</span> also shape population sizes over time: as prey increases, predators have more food and their population grows too — until so many predators reduce the prey population, which then causes the predator population to shrink again, cycling back and forth.</p>
      <div class="diagram-box">
        <div class="img-placeholder" data-img="images/10.jpg"><div class="ph-icon">🖼️</div><div class="ph-text">Photo: a clownfish nestled safely among sea anemone tentacles (mutualism example)<br>(coming soon)</div></div>
        <div class="caption-strip">🐠 Clownfish get protection from predators; the anemone gets cleaned and defended — mutualism</div>
      </div>
      <div class="fun-fact">🌟 Fun fact: predator-prey population cycles (like Canada lynx and snowshoe hares) have been tracked in real wildlife records for over 200 years, showing the same rise-and-fall pattern again and again.</div>
    `,

    lessonHTML:`
      <h2>How Human Activity Reshapes Ecosystems</h2>
      <p>Human activity affects ecosystems through <span class="vocab" data-term="habitatloss">habitat loss</span> (clearing land for farming, cities, or roads), <span class="vocab" data-term="pollution2">pollution</span> (chemicals, plastics, or excess nutrients entering water/air/soil), and <span class="vocab" data-term="overharvesting">overharvesting</span> (removing a resource — fish, timber, wildlife — faster than it can naturally replenish).</p>
      <p><span class="vocab" data-term="conservation">Conservation</span> efforts aim to reduce these impacts: protected land/marine reserves, sustainable harvesting limits, pollution regulations, and habitat restoration projects are all real, measurable strategies that have successfully helped some species and ecosystems recover.</p>
      <div class="diagram-box">
        <div class="img-placeholder" data-img="images/11.jpg"><div class="ph-icon">🖼️</div><div class="ph-text">Photo: before/after of a restored wetland or reforested area<br>(coming soon)</div></div>
        <div class="caption-strip">🌱 Conservation works — many restoration projects show measurable ecosystem recovery within years</div>
      </div>
      <div class="fun-fact">🌟 Fun fact: bald eagles were removed from the U.S. endangered species list in 2007 after decades of conservation protections and a ban on the pesticide DDT — a genuine large-scale recovery success story.</div>
      <div class="signs-box"><span class="label">✨ Signs in creation</span>
        <div class="quran-embed-wrap"><iframe src="https://quran.com/embed/v1?verses=30%3A41&translations=131&reciter=7&wbw=true&showTranslationName=true&tafsir=false&reflections=false&lessons=false&answers=false" width="100%" data-quran-embed="true" allow="clipboard-write" frameborder="0"></iframe></div>
        <p style="margin:6px 0 0;">This ayah is one of the most frequently cited in Islamic environmental writing, directly naming human action as a cause of ecological harm — strikingly relevant to this exact topic.</p>
      </div>
    `,
    glossary:{
      habitatloss:{def:'The destruction or clearing of natural habitat for human use.'},
      pollution2:{def:'Harmful substances entering water, air, or soil.'},

      <p>A <span class="vocab" data-term="pathogen">pathogen</span> is any organism or particle that causes disease — including bacteria, viruses, and fungi. The <span class="vocab" data-term="immunesystem">immune system</span> defends against pathogens using <span class="vocab" data-term="whitebloodcell">white blood cells</span>, which detect and destroy invaders circulating in the blood.</p>
      <p>Some white blood cells produce <span class="vocab" data-term="antibody">antibodies</span> — proteins shaped to recognize and lock onto one specific pathogen, marking it for destruction. After fighting off a particular pathogen once, the immune system often "remembers" it, allowing a much faster response if that same pathogen ever returns — called immune memory.</p>

    lessonHTML:`
      <h2>Speaking the Same Measurement Language</h2>
      <p>Scientists worldwide use the <span class="vocab" data-term="metricsys">metric system</span>, built on units of 10: meters (length), grams (mass), liters (volume), and seconds (time). Prefixes scale these units: <span class="vocab" data-term="kilo">kilo-</span> = ×1,000, <span class="vocab" data-term="centi">centi-</span> = ÷100, <span class="vocab" data-term="milli">milli-</span> = ÷1,000.</p>
      <p>Very large or small numbers are often written in <span class="vocab" data-term="scinotation">scientific notation</span> — a number between 1 and 10, times a power of 10 (e.g., 3,400,000 = 3.4 × 10⁶). Lab safety always starts with the basics: goggles for eye protection, tying back hair/loose clothing, never tasting chemicals, and knowing where the safety equipment is before starting any procedure.</p>
      <div class="formula-card">
        <div class="formula-eq">kilo (k) = ×1,000 &nbsp;·&nbsp; centi (c) = ÷100 &nbsp;·&nbsp; milli (m) = ÷1,000</div>
        <div class="formula-unit">the three most common metric prefixes</div>
      </div>
      <div class="example-card"><span class="example-label">🧮 Worked example</span>How many centimeters are in 2.5 meters?<br>2.5 × 100 = <strong>250 cm</strong> (since 1 m = 100 cm).</div>
      <div class="fun-fact">🌟 Fun fact: the mismatched-units mistake mentioned above is real — NASA's 1999 Mars Climate Orbiter was lost because one engineering team used imperial (pound-force) units while another used metric (newton) units for the same navigation calculation.</div>

      <h2>Pure Substances vs. Combinations</h2>
      <p>An <span class="vocab" data-term="element2">element</span> is a pure substance of one atom type (like oxygen or gold). A <span class="vocab" data-term="compound">compound</span> is two or more elements chemically bonded together in a fixed ratio, forming a new substance with different properties than its parts — like water (H₂O), made from hydrogen and oxygen, neither of which is wet or drinkable on its own.</p>

      <div class="fun-fact">🌟 Fun fact: table salt (sodium chloride) is a compound made from sodium — a metal so reactive it explodes in water — and chlorine — a toxic gas. Combined chemically, they form the harmless crystal you sprinkle on food.</div>

      <h2>Two Different Kinds of Change</h2>
      <p>A <span class="vocab" data-term="physicalchange">physical change</span> alters an object's form or appearance WITHOUT creating a new substance — melting, freezing, cutting, and dissolving are all physical changes, and they're generally reversible. Melted ice can be refrozen back into the exact same water.</p>
      <p>A <span class="vocab" data-term="chemicalchange">chemical change</span> creates one or more entirely new substances with different properties, and is usually NOT easily reversible. Signs of a chemical change include: color change, gas bubbles forming, a temperature change with no outside heat source, or a new smell. Burning wood turns it into ash and gases (carbon dioxide, water vapor) — you cannot simply "un-burn" wood back into its original form.</p>

    hunch:"Mei's hunch: \"An ice cube floats in a glass of water — but the SAME water, once boiled into steam, rises and disappears into the air. All three are the same substance. What's actually different between them?\"",
    lessonHTML:`
      <h2>Solid, Liquid, Gas — and How Tightly Packed They Are</h2>
      <p>In a <span class="vocab" data-term="solidstate">solid</span>, particles are tightly packed and vibrate in fixed positions. In a <span class="vocab" data-term="liquidstate">liquid</span>, particles are close together but can flow past each other. In a <span class="vocab" data-term="gasstate">gas</span>, particles are far apart and move independently, filling any container. Adding heat energy generally moves matter from solid → liquid → gas; removing it reverses the process.</p>
      <p><span class="vocab" data-term="density">Density</span> measures how tightly packed the matter in an object is — mass per unit of volume. An object less dense than water floats in it; an object more dense sinks.</p>
      <div class="formula-card">
        <div class="formula-eq">density = mass ÷ volume</div>
        <div class="formula-unit">commonly measured in grams per cubic centimeter (g/cm³)</div>
      </div>
      <div class="example-card"><span class="example-label">🧮 Worked example</span>A rock has a mass of 60 g and a volume of 20 cm³.<br>60 ÷ 20 = <strong>3 g/cm³</strong>.</div>
      <div class="fun-fact">🌟 Fun fact: solid ice is actually LESS dense than liquid water (unusual for a solid vs. its own liquid form) — which is exactly why ice floats instead of sinking, letting fish survive under frozen lake surfaces in winter.</div>

    hunch:"Mei's hunch: \"If you're standing in a bus that suddenly brakes hard, your body keeps moving forward even though the bus stopped. What do you think that says about how objects naturally behave?\"",
    lessonHTML:`
      <h2>The Three Rules That Govern All Motion</h2>
      <p><span class="vocab" data-term="firstlaw">Newton's First Law</span> (inertia): an object at rest stays at rest, and an object in motion stays in motion at constant velocity, UNLESS acted on by an unbalanced force. This is why your body keeps moving forward when a bus suddenly brakes — your body's inertia resists the change in motion.</p>
      <p><span class="vocab" data-term="secondlaw">Newton's Second Law</span> relates force, mass, and acceleration:</p>
      <div class="formula-card">

      <p><span class="vocab" data-term="thirdlaw">Newton's Third Law</span>: for every action, there is an equal and opposite reaction. When you push on a wall, the wall pushes back on you with equal force — you can feel it in your hand.</p>

    lessonHTML:`
      <h2>Trading Distance for Force</h2>
      <p>A <span class="vocab" data-term="simplemachine">simple machine</span> makes work easier — not by reducing the total work needed, but by changing the amount of force required, usually by increasing the distance over which that force is applied. The six classic simple machines are the lever, wheel and axle, pulley, inclined plane, wedge, and screw.</p>
      <p><span class="vocab" data-term="mechadvantage">Mechanical advantage</span> tells you how many times a machine multiplies your input force:</p>
      <div class="formula-card">
        <div class="formula-eq">Mechanical advantage = output force ÷ input force</div>
        <div class="formula-unit">no units — it's a ratio</div>
      </div>
      <div class="example-card"><span class="example-label">🧮 Worked example</span>A lever lets you lift 300 N of resistance using only 50 N of your own force.<br>300 ÷ 50 = <strong>a mechanical advantage of 6</strong>.</div>
      <div class="fun-fact">🌟 Fun fact: a longer ramp (inclined plane) requires less force to push something up to the same height than a short, steep one — you're trading a longer distance traveled for a smaller force needed, not getting "free" energy.</div>

      <h2>Energy Changes Form, But Never Disappears</h2>
      <p><span class="vocab" data-term="potentialenergy">Potential energy</span> is stored energy based on position or condition — like a roller coaster car at the top of a hill, or a stretched rubber band. <span class="vocab" data-term="kineticenergy">Kinetic energy</span> is the energy of motion. As the roller coaster car descends, its potential energy converts into kinetic energy — this is an <span class="vocab" data-term="energytransform">energy transformation</span>.</p>
      <p>The <span class="vocab" data-term="conservationenergy">law of conservation of energy</span> states that energy cannot be created or destroyed — only converted from one form to another (potential, kinetic, thermal, chemical, electrical, light, sound, etc.).</p>
      <div class="fun-fact">🌟 Fun fact: a gas stove converts chemical energy (from the gas) into thermal energy (heat) and light energy (the flame) — one chemical reaction producing at least two different energy forms simultaneously.</div>
    `,

      kineticenergy:{def:'The energy of motion.'},

    lessonHTML:`
      <h2>Two Forces That Are Secretly Connected</h2>
      <p>An electric <span class="vocab" data-term="circuit">circuit</span> is a closed loop that allows electric <span class="vocab" data-term="current">current</span> (the flow of electric charge) to travel from a power source, through a load (like a lightbulb), and back. In a <span class="vocab" data-term="seriescircuit">series circuit</span>, components are connected in a single loop — if one breaks, the whole circuit stops. In a <span class="vocab" data-term="parallelcircuit">parallel circuit</span>, components have separate branches — one breaking doesn't stop the others.</p>
      <p>A moving electric current creates a <span class="vocab" data-term="magneticfield">magnetic field</span> around it — this is <span class="vocab" data-term="electromagnetism">electromagnetism</span>, the link between electricity and magnetism. This is exactly how an electromagnet (and every electric motor) works: coiling a wire carrying current around a core creates a controllable magnetic field.</p>

    lessonHTML:`
      <h2>Sound as a Traveling Vibration</h2>
      <p>Sound is a <span class="vocab" data-term="soundwave">wave</span> of vibrating particles traveling through a medium (air, water, or solids) — sound cannot travel through a vacuum, since there are no particles to vibrate. <span class="vocab" data-term="frequency">Frequency</span> (measured in Hertz, Hz) is how many wave vibrations occur per second, and determines <span class="vocab" data-term="pitch">pitch</span> — higher frequency means higher pitch. <span class="vocab" data-term="amplitude">Amplitude</span> (the wave's height) determines volume/loudness.</p>

        <div class="formula-eq">wave speed = frequency × wavelength</div>
        <div class="formula-unit">a relationship that applies to every type of wave, not just sound</div>

      <div class="fun-fact">🌟 Fun fact: sound travels about 4 times faster through water than through air, and roughly 15 times faster through steel — denser, more tightly-connected particles transmit the vibration faster.</div>

      <p>In order from longest wavelength (lowest energy) to shortest (highest energy): radio waves, microwaves, infrared, <span class="vocab" data-term="visiblelight">visible light</span>, ultraviolet, X-rays, and gamma rays. Visible light — the only part humans can see — is actually a very narrow band in the middle of this enormous spectrum.</p>

          <text x="20" y="90" font-size="9" fill="#3B1740" font-weight="700">← longer wavelength, lower energy</text>

    lessonHTML:`
      <h2>A Planet Made of Moving Pieces</h2>
      <p>Earth's outer shell is broken into large pieces called <span class="vocab" data-term="tectonicplate">tectonic plates</span>, which float on the slowly-flowing mantle beneath them and drift just a few centimeters per year — about as fast as fingernails grow. <span class="vocab" data-term="continentaldrift">Continental drift</span> is the theory that continents have moved over millions of years — supported by matching coastlines, matching rock layers across oceans, and matching fossils found on now-separated continents.</p>
      <p>At plate boundaries, three things can happen: plates can pull apart (<span class="vocab" data-term="divergent">divergent</span>), collide (<span class="vocab" data-term="convergent">convergent</span>, often forming mountains or trenches), or slide past each other (<span class="vocab" data-term="transform">transform</span>, causing earthquakes, like California's San Andreas Fault).</p>

      <div class="fun-fact">🌟 Fun fact: the Atlantic Ocean is slowly widening a few centimeters every year — meaning North America and Europe are, very slowly, drifting apart.</div>

    id:'earth-rockcycle',

    hunch:"Mei's hunch: \"A rock you pick up today could once have been molten lava, then a sedimentary layer at the bottom of an ancient sea, then squeezed into something else entirely. What do you think connects all those stages?\"",
    lessonHTML:`
      <h2>Rocks Are Never Really "Finished"</h2>
      <p>The <span class="vocab" data-term="rockcycle">rock cycle</span> describes how rocks continuously transform between three types. <span class="vocab" data-term="igneous">Igneous rock</span> forms when molten rock (magma or lava) cools and hardens. <span class="vocab" data-term="sedimentary">Sedimentary rock</span> forms when layers of sediment (sand, mud, shell fragments) get compressed and cemented together over time. <span class="vocab" data-term="metamorphic">Metamorphic rock</span> forms when existing rock is transformed by intense heat and pressure, without fully melting.</p>
      <p><span class="vocab" data-term="weathering">Weathering</span> breaks rock down into smaller pieces (via wind, water, ice, or chemical reactions), <span class="vocab" data-term="erosion">erosion</span> carries those pieces away (by wind, water, or ice), and <span class="vocab" data-term="deposition">deposition</span> is when those transported pieces settle somewhere new — often becoming the sediment that eventually forms new sedimentary rock.</p>
      <div class="diagram-box">

      <p>A <span class="vocab" data-term="front">front</span> is the boundary between two air masses of different temperature/humidity. A <span class="vocab" data-term="coldfront">cold front</span> (cold air pushing under warm air) often brings sudden, intense storms; a <span class="vocab" data-term="warmfront">warm front</span> (warm air sliding over cold air) typically brings longer, gentler periods of rain.</p>
      <div class="fun-fact">🌟 Fun fact: a single, unusually cold winter does NOT disprove long-term climate trends — weather is what happens on one particular day, while climate describes the average pattern across decades.</div>

    lessonHTML:`
      <h2>Testing Ideas Fairly</h2>
      <p>The <span class="vocab" data-term="scimethod">scientific method</span> is a systematic process: ask a question, form a testable <span class="vocab" data-term="hypothesis">hypothesis</span> (an educated, testable prediction), design and run a <span class="vocab" data-term="controlledexp">controlled experiment</span>, collect and analyze data, then draw conclusions. A controlled experiment changes only ONE <span class="vocab" data-term="variable">variable</span> (the <span class="vocab" data-term="independentvar">independent variable</span>) at a time, while keeping everything else constant, so you can confidently attribute any change in the result (the <span class="vocab" data-term="dependentvar">dependent variable</span>) to that one factor.</p>
      <p>Engineering design follows a related but distinct cycle: define the problem, brainstorm and design possible solutions, build a prototype, test it, and improve it based on results — often repeating this cycle multiple times before reaching a final design.</p>
      <div class="fun-fact">🌟 Fun fact: in the garden example above, changing fertilizer, water, AND sunlight all at once means you genuinely cannot tell which single factor (or combination) caused the improvement — this is exactly why "fair testing," changing only one variable at a time, matters so much.</div>

  document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));

  document.querySelectorAll('.nav-btn').forEach(b=>b.classList.remove('active'));

  if(navBtn) navBtn.classList.add('active');

  if(name==='home') renderHome();
  if(name==='wardrobe') renderWardrobe();

function landModules(landId){ return MODULES.filter(m=>m.land===landId); }
function landProgress(landId){
  const mods = landModules(landId);
  if(mods.length===0) return 0;
  const done = mods.filter(m=>state.completed[m.id]).length;
  return Math.round(done/mods.length*100);
}
function landDoneCount(landId){
  const mods = landModules(landId);
  return {done: mods.filter(m=>state.completed[m.id]).length, total: mods.length};
}
function landComplete(landId){
  const mods = landModules(landId);
  return mods.length>0 && mods.every(m=>state.completed[m.id]);
}

let cachedVoices = [];
function refreshVoices(){
  const v = speechSynthesis.getVoices();
  if(v && v.length) cachedVoices = v;
}
if('speechSynthesis' in window){
  refreshVoices();
  speechSynthesis.onvoiceschanged = refreshVoices;
}
function pickBestVoice(){
  if(!cachedVoices.length) refreshVoices();
  const rank = [
    /en-US.*(Enhanced|Premium|Neural)/i,
    /(Enhanced|Premium|Neural)/i,
    /^(Samantha|Ava|Nicky|Allison|Susan)$/i,
    /Samantha|Ava|Nicky|Allison|Susan/i,
    /en-US/i,
    /^en/i
  ];
  for(const pattern of rank){
    const match = cachedVoices.find(v=>pattern.test(v.name) || pattern.test(v.lang));
    if(match) return match;
  }
  return null;
}
function speakTerm(e, term){
  e.stopPropagation();
  if(!('speechSynthesis' in window)) return;
  speechSynthesis.cancel();
  const utter = new SpeechSynthesisUtterance(term);
  utter.lang = 'en-US';
  const preferred = pickBestVoice();
  if(preferred) utter.voice = preferred;
  utter.rate = 0.9;
  utter.pitch = 1.0;
  speechSynthesis.speak(utter);
}

/* =====================================================
   QUIZ ENGINE (with Socratic hint ladder)
   Types: mc, tf, match, calc (numeric — new for 7th grade)
===================================================== */
let quizIndex = 0;
let quizResults = [];
let hintLevel = 0;
let wrongAttempts = 0;
let answered = false;
let matchState = {leftSel:null, pairs:{}, done:0};

function startQuiz(){
  quizIndex = 0; quizResults = [];
  renderQuestion();
  showViewRaw('quiz');
}
function renderQuizProgress(){
  const wrap = document.getElementById('quizProgress');
  wrap.innerHTML='';
  currentModule.quiz.forEach((q,i)=>{
    const d = document.createElement('div');
    d.className='dot'+(i===quizIndex?' active':'')+
      (quizResults[i]===true?' correct':'')+(quizResults[i]===false?' wrong':'');
    wrap.appendChild(d);
  });
}

function renderQuestion(){
  const q = currentModule.quiz[quizIndex];
  const area = document.getElementById('quizArea');
  let bodyHTML = '';
  if(q.type==='mc'){
    bodyHTML = `<div class="qtype">Multiple Choice</div><h3>${q.q}</h3>` +
      q.choices.map((c,i)=>`<button class="choice" data-i="${i}" onclick="answerMC(${i})">${c}</button>`).join('');
  } else if(q.type==='tf'){
    bodyHTML = `<div class="qtype">True or False</div><h3>${q.q}</h3>
      <div class="tf-row">
        <button class="choice" data-b="true" onclick="answerTF(true)">✅ True</button>
        <button class="choice" data-b="false" onclick="answerTF(false)">❌ False</button>
      </div>`;
  } else if(q.type==='match'){
    bodyHTML = `<div class="qtype">Match It</div><h3>${q.q}</h3>
      <div class="match-wrap">
        <div class="match-col" id="matchLeft"></div>
        <div class="match-col" id="matchRight"></div>
      </div>`;
  } else if(q.type==='calc'){
    bodyHTML = `<div class="qtype">Calculate</div><h3>${q.q}</h3>
      <div class="calc-row">
        <input type="number" step="any" id="calcInput" class="calc-input" placeholder="Your answer" inputmode="decimal">
        <span class="calc-unit">${q.unit||''}</span>
        <button class="btn primary" style="padding:10px 18px;" onclick="answerCalc()">Check ✓</button>
      </div>`;
  }
  bodyHTML += `<div class="hint-box"><button class="btn ghost" style="padding:8px 14px;" onclick="giveHint()">💡 Give me a hint</button>
    <div id="hintText"></div>
  </div>
  <div id="feedbackArea"></div>`;
  area.innerHTML = `<div class="q-card">${bodyHTML}</div>`;

  if(q.type==='match') setupMatch(q);
  if(q.type==='calc'){
    document.getElementById('calcInput').addEventListener('keydown', e=>{ if(e.key==='Enter') answerCalc(); });
  }
  hintLevel = 0;
  wrongAttempts = 0;
  answered = false;
  renderQuizProgress();
}

function giveHint(){
  const q = currentModule.quiz[quizIndex];
  if(!q.hints || hintLevel>=q.hints.length) { toast("That's all the hints Mei has — give it your best shot! ✨"); return; }
  sndTap();
  const box = document.getElementById('hintText');
  const div = document.createElement('div');
  div.className='hint-reveal show';
  div.textContent = q.hints[hintLevel];
  box.appendChild(div);
  hintLevel++;
  maybeShowRevealButton();
}

function maybeShowRevealButton(){
  const q = currentModule.quiz[quizIndex];
  if(answered) return;
  if(q.type==='match') return;
  const box = document.getElementById('hintText');
  if(hintLevel >= (q.hints?q.hints.length:0) && wrongAttempts >= 1 && !document.getElementById('revealBtn')){
    const btn = document.createElement('button');
    btn.id = 'revealBtn';
    btn.className = 'btn ghost';
    btn.style.cssText = 'padding:8px 14px;margin-top:8px;';
    btn.textContent = "✨ Mei, just show me the answer";
    btn.onclick = revealAnswer;
    box.appendChild(btn);
  }
}

function revealAnswer(){
  const q = currentModule.quiz[quizIndex];
  answered = true;
  if(q.type==='mc'){
    document.querySelectorAll('.choice').forEach((b,idx)=>{
      if(idx===q.correct) b.classList.add('reveal-correct');
      b.setAttribute('disabled','true');
    });
  } else if(q.type==='tf'){
    document.querySelectorAll('.choice').forEach(b=>{
      const isTrueBtn = b.dataset.b==='true';
      if((isTrueBtn && q.answer===true)||(!isTrueBtn && q.answer===false)) b.classList.add('reveal-correct');
      b.setAttribute('disabled','true');
    });
  } else if(q.type==='calc'){
    const input = document.getElementById('calcInput');
    input.value = q.answer;
    input.setAttribute('disabled','true');
    document.querySelector('.calc-row button').setAttribute('disabled','true');
  }
  showFeedback(false, q.explain);
}

function answerMC(i){
  if(answered) return;
  const q = currentModule.quiz[quizIndex];
  const correct = i===q.correct;
  const btn = document.querySelector('.choice[data-i="'+i+'"]');
  if(correct){
    answered = true;
    btn.classList.add('selected-correct');
    document.querySelectorAll('.choice').forEach(b=>b.setAttribute('disabled','true'));
    showFeedback(true, q.explain);
  } else {
    wrongAttempts++;
    btn.classList.add('selected-wrong');
    btn.setAttribute('disabled','true');
    sndWrong();
    showTryAgain();
  }
}
function answerTF(val){
  if(answered) return;
  const q = currentModule.quiz[quizIndex];
  const correct = val===q.answer;
  const btn = document.querySelector('.choice[data-b="'+val+'"]');
  if(correct){
    answered = true;
    btn.classList.add('selected-correct');
    document.querySelectorAll('.choice').forEach(b=>b.setAttribute('disabled','true'));
    showFeedback(true, q.explain);
  } else {
    wrongAttempts++;
    btn.classList.add('selected-wrong');
    btn.setAttribute('disabled','true');
    sndWrong();
    showTryAgain();
  }
}
function answerCalc(){
  if(answered) return;
  const q = currentModule.quiz[quizIndex];
  const input = document.getElementById('calcInput');
  const val = parseFloat(input.value);
  if(isNaN(val)){ toast('Type a number first!'); return; }
  const tol = q.tolerance!=null ? q.tolerance : Math.abs(q.answer||1)*0.05;
  const correct = Math.abs(val - q.answer) <= tol;
  if(correct){
    answered = true;
    input.setAttribute('disabled','true');
    document.querySelector('.calc-row button').setAttribute('disabled','true');
    showFeedback(true, q.explain);
  } else {
    wrongAttempts++;
    input.classList.add('calc-wrong');
    sndWrong();
    showTryAgain();
    setTimeout(()=>input.classList.remove('calc-wrong'), 500);
  }
}
function showTryAgain(){
  const area = document.getElementById('feedbackArea');
  const nudge = wrongAttempts===1
    ? "Not quite — want a hint? Or go ahead and try again ✨"
    : "Still not it — Mei's hints are right above if you want one.";
  area.innerHTML = `<div class="feedback think"><div>${meiSVGInline('thinking')}</div><div>${nudge}</div></div>`;
  maybeShowRevealButton();
}

function setupMatch(q){
  matchState = {leftSel:null, pairs:{}, done:0};
  const leftCol = document.getElementById('matchLeft');
  const rightCol = document.getElementById('matchRight');
  leftCol.innerHTML=''; rightCol.innerHTML='';
  q.left.forEach((txt,i)=>{
    const el = document.createElement('div');
    el.className='match-item'; el.textContent=txt; el.dataset.i=i;
    el.onclick=()=>selectLeft(i, el);
    leftCol.appendChild(el);
  });
  const seed = hashCode(currentModule.id+q.id);
  const order = seededShuffle(q.right.map((_,i)=>i), seed);
  order.forEach(origIdx=>{
    const el = document.createElement('div');
    el.className='match-item'; el.textContent=q.right[origIdx]; el.dataset.i=origIdx;
    el.onclick=()=>selectRight(origIdx, el);
    rightCol.appendChild(el);
  });
}
function hashCode(str){ let h=0; for(let i=0;i<str.length;i++){h=(h<<5)-h+str.charCodeAt(i); h|=0;} return Math.abs(h); }
function seededShuffle(arr, seed){
  const a = arr.slice(); let s = seed;
  for(let i=a.length-1;i>0;i--){
    s = (s*9301+49297)%233280;
    const j = Math.floor((s/233280)*(i+1));
    [a[i],a[j]]=[a[j],a[i]];
  }
  return a;
}
function selectLeft(i, el){
  if(el.classList.contains('paired-correct')) return;
  document.querySelectorAll('#matchLeft .match-item').forEach(e=>e.classList.remove('sel'));
  el.classList.add('sel'); matchState.leftSel = i;
  sndTap();
}
function selectRight(i, el){
  if(matchState.leftSel===null || el.classList.contains('paired-correct')) return;
  const q = currentModule.quiz[quizIndex];
  const leftIdx = matchState.leftSel;
  const correct = leftIdx === i;
  const leftEl = document.querySelector('#matchLeft .match-item[data-i="'+leftIdx+'"]');
  if(correct){
    const pairClass = 'pair-'+(leftIdx % 5);
    leftEl.classList.remove('sel'); leftEl.classList.add('paired-correct', pairClass);
    el.classList.add('paired-correct', pairClass);
    matchState.done++; sndCorrect();
    matchState.leftSel = null;
    if(matchState.done === q.left.length){
      answered = true;
      showFeedback(true, q.explain);
    }
  } else {
    el.classList.add('paired-wrong'); sndWrong();
    setTimeout(()=>el.classList.remove('paired-wrong'), 500);
  }
}

function showFeedback(correct, explain){
  const area = document.getElementById('feedbackArea');
  if(correct){ sndCorrect(); } else { sndWrong(); }
  const q = currentModule.quiz[quizIndex];
  if(!correct || wrongAttempts>0){
    state.notebook.push({moduleId:currentModule.id, question:q.q, correct:explain});
    if(!state.reviewQueue.includes(currentModule.id)) state.reviewQueue.push(currentModule.id);
  }
  saveState();
  let headline;
  if(correct && wrongAttempts===0) headline = "Yes! You got it. 🎉";
  else if(correct) headline = "There you go — you worked it out! 🎉";
  else headline = "Good thinking — here's the idea:";
  area.innerHTML = `<div class="feedback ${correct?'good':'think'}">
      <div>${meiSVGInline(correct?'happy':'thinking')}</div>
      <div>${headline} <br><span style="font-weight:600;">${explain}</span></div>
    </div>
    <div class="btn-row">
      <button class="btn primary" onclick="nextQuestion()">${quizIndex < currentModule.quiz.length-1 ? 'Next Question →' : 'Finish Clan Challenge →'}</button>
    </div>`;
  quizResults[quizIndex] = correct;
  renderQuizProgress();
}

function nextQuestion(){
  if(quizIndex < currentModule.quiz.length-1){
    quizIndex++;
    renderQuestion();
  } else {
    finishModule();
  }
}

  const lines = state.notebook.slice(-5).map(n=>`• ${n.question}\n  → ${n.correct}`).join('\n\n');
  alert("Mei's Lab Notebook (recent items to review):\n\n"+lines);
}

/* =====================================================
   INIT
===================================================== */
function init(){
  renderAllMeis();
  renderHome();
  if(!state.introSeen){
    setTimeout(()=>toast("Salaam! I'm Mei ✨ Let's earn your rank across the Four Clans!"), 500);
    state.introSeen = true; saveState();
  }
  document.getElementById('muteBtn').textContent = state.muted ? '🔇' : '🔊';
}
window.addEventListener('load', init);
window.addEventListener('resize', ()=>{
  const c = document.getElementById('confetti-canvas');
  c.width = window.innerWidth; c.height = window.innerHeight;
});
</script>
